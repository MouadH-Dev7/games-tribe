ARCHITECT_AFTER_SHRINE: "<hpage>يا معلمي، تواصلت مع الضريح في الأعلى. معارف سلالتك فريدة، وتقنياتها مولودة من قلوب التروس. وسيتطلب إتقانها مني بعض الالتزام.<page>يا حشرة حمراء، أنت أول صَدَفة عضوية تندمج مع ذكرياتنا. س-س-س-سلوك كهذا كانت سلالتي ستعده بعيد الاحتمال-مستحيلا. <page>لكن ترسانتك الواسعة دلت على ميل قوي إلى الحرفة الم-م-م-ميكانيكية، بما يكفي للسماح لك بدخول مخزن أفكارنا.<hpage>مهارتك مبهرة يا معلمي. وأنا ممتنة لما تعلمته."
CONFESSIONAL_START_BROKEN: "تكلم... ... اعتراف..."
ARCHITECT_WEAVER_SHOOT: "تحملين قطعة أثرية نفيسة يا حشرة حمراء. أهذه الأداة المكسورة من صنع النساجين؟ <hpage>أظن ذلك يا معلمي. إنها من بقايا مشغلهم القديم، ضاعت في كهوف نتنة خلف هذه القلعة.<hpage>تشير أجزاؤها إلى أنها سلاح من الخيوط، وكنت سأحاول إصلاحه بنفسي لو كان وقتي بلا نهاية.<page>يدين عمل المعماري بالكثير لفن الأبناء الأ-أ-الأوائل. فقد وضعوا المعيار الأعلى لأدوات فارلوم الخالدة ومهاراتها.<page>إن رغبت-طلبت، يمكنني إعادة صنع الأداة، وإن كانت توجيهات عقلي قد تنتج نتيجة ف-ف-فريدة."
ARCHITECT_SHOP_DESC_SILKSHOT: "أداة معقدة من صنع أبناء فارلوم الأوائل. يمكنني ترميم-إصلاح الس-س-سلاح، لكنه سيحمل شيئا من هويتي-أسلوبي."
ARCHITECT_SHOP_TALK_REPEAT: "يا حشرة حمراء. أتطلبين-تحتاجين خدمتنا؟ سنصنع، كما يملي علينا ت-ت-توجيهنا. سنخدم فارلوم الخالدة."
CONFESSIONAL_START: "تكلم الآن. سيصغى إلى اعترافك."
LARGE_COG_WORK_SONG: "هررر. هررررررر. هذه الأصوات التي تصدرينها مقدسة. حين أسمعها أتذكر موطني. أتذكر صغري.<page>تؤلمني هذه الذكريات وتجعل العمل شاقا. يجب أن أواصل العمل. أرجوك يا صديقتي، لا تصدري هذه الأصوات ثانية."
ARCHITECT_WILL_LEAVE: "خ-خ-خدمتي لك يا حشرة حمراء... ومع اقتراب نهايتها، يجب أن أتكلم-أعترف. أشعر منذ زمن بأن دواراتي تبطئ د-د-دورانها، وأطرافي تضعف عن الحركة. أشعر بنهاية آتية، مفاجئة-محتومة... مرحب بها.<hpage>مهما يكن ما تشعر به من أفول، فلم يظهر أثره في حرفتك يا معلمي. لقد زودتني بأدوات متقنة الصنع.<hpage>ماذا سيحدث إن رحلت؟ هل سيحل آخر محلك؟ <page>لا أحد يستطيع. فقد محا الز-ز-زمن معرفة صنع المعماريين. أنا الأخير-النهاية. سيبقى القلب ليحفظ الأغنية، لكن لن يبقى معماريون يرعونه-يعملون أو يبنون من جديد. <page>غ-غ-غريب... يقول الت-ت-توجيه-القفص: «من أجل فارلوم الخالدة». لكن كيف يدوم الخلود من دون معماري يخدمه؟ يبدو هذا خ-خ-خطأ. نهاية؟ خطأ... مرحب به؟"
LARGE_COG_WORK_MEET: "هرر. هررررر. من هناك؟ لا أستطيع... لا أستطيع الرؤية بوضوح....<hpage>اهدأ أيها الضخم. لن يصيبك مني أذى.<page>هرررر؟ هررر! أراك الآن! نظيفة جدا، ومفعمة بالحياة... لا بد أنك أتيت من الأعلى! لقد حان وقتي أخيرا! انتهى عملي. أتيت لترفعيني! إلى الأعلى، إلى الأعلى! هررر!<hpage>أنت مخطئ. لست من سكان القلعة. أنا غريبة هنا، لكنني لست عدوة لك.<page>هررر. هررررررررر. غ-غريبة؟ لقد أخطأت خطأ فادحا. يا من في الأعلى، اغفروا لي أملي الذي لا أستحقه! بالطبع لم ينته عملي! بجهد أكبر، أكبر! يجب أن أعمل بجهد أكبر!"
ARCHITECT_SHOP_TALK_REPEAT_ACT3: "يا حشرة حمراء. أتطلبين-تحتاجين خدماتنا، حتى الآن؟ واجبنا ط-ط-طويل، لكننا سنصنع لك إن احتجت..."
ARCHITECT_SHOP_DESC_KEY: "إن أثبتت الحشرة الحمراء براعتها في استخدام أدواتنا ومثيلاتها، فسأعطيها مفتاحي لتدخل مخزن المصلى في الأعلى."
ARCHITECT_MELODY: "<hpage>يا معلمي، أبحث عن لحن لدى سلالتك، وهو جزء من متتالية ومفتاح للصعود فوق القلعة. هل يمكنك أن تعلمنيه؟<page>لحننا؟ أت-ت-تذكر! نعم! كان هناك لحن ذات يوم، لكن صوته... لم يعد في حوزتي...<page>لقد عملت زمنا ط-ط-طويلا جدا. بهت أثره في خزينة عقلي. وهكذا حال أشياء كثيرة... ذكريات تخبو...<page>لكن ر-ر-ربما ما زال بوسعك سماعه. في أعلى قلبنا وسيلة-ن-ن-نظام شبه مكتمل... منشآت قديمة الصنع لتعزف أغنيتنا. ولا ينقصها إلا إعادتها إلى العمل."
ARCHITECT_MELODY_RETURN: "أما زلت تنوين ت-ت-تسلق قلبنا العظيم يا حشرة حمراء؟ في داخله يمكنك أن تتأملي أعمال المعماريين، أعمالي وأعمال كل من م-م-مضوا قبلي.<hpage>يقودني دربي في اتجاهات كثيرة يا معلمي، لكنني سأصعد القلب في الوقت المناسب وأحصل على اللحن في قمته."
LARGE_COG_WORK_CITADEL: "<hpage>هل لي أن أسألك عما تعرفه عن القلعة فوقك يا سيدي؟ إنك تبذل جهدا كبيرا لبلوغها.<page>هرررررررر! القلعة! أعجب الأماكن وأقدسها! فيها ماء عذب للجميع، بقدر ما نشاء! وهواء نقي حتى نرى السقوف العظيمة في الأعلى! <page>حين أفكر في القلعة فوقنا، أعمل بأقصى جهدي! هرررررررر!"
CONFESSIONAL_END: "لقد اعترفت بخطيئة فادحة، وعليك أن تطهر نفسك بالأعمال.<page>عد إلى مهمتك واعمل خارج دورة العمل، ولا تأكل ولا تشرب حتى تبدأ الدورة الجديدة.<page>بنعمة فارلوم الخالدة، عساك ألا تتعب أبدا. اعمل تنل الغفران."
LARGE_COG_WORK_TOGETHER: "هرر. هررررر! جيد يا صديقتي، جيد! حين نعمل معا، يكون عملنا أقدس وأكثر!<page>فلنعمل معا بكل ما أوتينا حتى يرى من في الأعلى كم نحن جديرون!"
ARCHITECT_MELODY_GAINED: "<page>ما هذا يا حشرة حمراء؟ حتى هنا في الأسفل، ر-ر-رصدت عمله... هل تسلقت ق-ق-قلبنا وأيقظت أصوات س-س-سلالتي؟<hpage>فعلت أيها الصانع. من الواضح أن ذلك الصعود لم يصمم للحشرات العادية، ولحسن الحظ أن المهارات التي منحتني إياها أراضيكم أتاحت لي بلوغه.<hpage>اللحن والأصوات... كلاهما رائع سماعا ومشهدا. وحتى في لحظة الأفول هذه، ما زال فنهما يتألق.<page>مذهل-دؤوب... خالد... لقد رأيت لمحة م-م-منا يا حشرة حمراء، ومما كنا عليه ذات يوم. كانت عقول المعماريين ملهمة. ما أعظم ما صنعناه..."
ARCHITECT_MEET_ACT3: "<hpage>يا معلمي، يبدو أنك الصانع الوحيد الباقي في هذه القلعة المدمرة. أأنت عدوي؟ لقد اعترضت الآلات الأخرى في هذا المكان على وجودي بعنف. <page>يا حشرة حمراء؟ أنا ص-ص-صانع. نعم. عدو. لا. أنا معماري. معماري فحسب. أن نبني-نؤتمت، تلك طبيعتنا-توجيهنا-ق-ق-ق-قفصنا.<page>لماذا أنت هنا يا حشرة حمراء؟ الوقت متأخر. أتطلبين-تحتاجين خدمة معماري؟ أنت من نوع النسج، نعم؟ من الأبناء الأوائل؟ نوع نادر-م-م-منقرض. أو هكذا كان يبدو.<hpage>لقد رأيت الحقيقة يا معلمي. أحمل نسب النساجين، ومعه خيوط أخرى غريبة بالقدر نفسه.<page>إذن، نزولا عند ط-ط-طلبك يا حشرة حمراء، وبما يقتضيه التوجيه، من أجل أبناء فارلوم الأوائل و-و-ومملكتنا الخالدة، سأصنع."
ARCHITECT_MEET: "<hpage>يا معلمي، يبدو أنك الصانع الوحيد الباقي في هذه القلعة. أأنت عدوي؟ تعترض الآلات الأخرى في هذا المكان على وجودي بعنف. <page>يا حشرة حمراء؟ أنا ص-ص-صانع. نعم. عدو. لا. أنا معماري. معماري فحسب. البناء-الأتمتة ليسا خيارا. إنهما طبيعتنا-توجيهنا-ق-ق-ق-قفصنا. <page>أنت من نوع النسج، نعم؟ من الأبناء الأوائل؟ نوع نادر-م-م-منقرض. أو هكذا كان يبدو.<hpage>لقد رأيت الحقيقة يا معلمي. أحمل نسب النساجين، ومعه خيوط أخرى غريبة بالقدر نفسه.<page>إذن، نزولا عند ط-ط-طلبك يا حشرة حمراء، وبما يقتضيه التوجيه، من أجل أبناء فارلوم الأوائل و-و-ومملكتنا الخالدة، سأخدم. سأصنع."
ARCHITECT_SHOP_TITLE: "المعماري الثاني عشر"
LARGE_COG_WORK_WORK: "هررررررر. كلما زدت عملا، اقترب مجيئه. إنهم يراقبوننا من الأعلى، دائما. اعمل بجد، اعمل بجد، وسنصعد. هررر.<hpage>يا سيدي، أخشى أن سادتك قد نسوك منذ زمن طويل. ألا ينبغي لك أن تستريح؟ أثر هذا العناء في صَدَفتك واضح.<page>هرررر؟ هرررررر. كلامك غريب. لا أستطيع أن أستريح. نحن نعمل، والقلعة تتنفس، ومن في الأعلى يغنون، وكل شيء على ما يرام.<page>وحين نعمل ما يكفي، سيرون ذلك... هررر... سيرونه، وسننعم بمكافأتنا المقدسة..."
ARCHITECT_SHOP_DESC_TOOL_KIT: "أدوات حرفتي. يمكن استخدامها لتحسين أدواتك، فتجعلها أصلب وأمضى."
ARCHITECT_SHOP_DESC_SCUTTLEBRACE: "طرف صناعي مرن للصَدَفة. يزيد مرونة ذوي نوع النسج، ويتيح لهم سبلا إضافية للمراوغة."
CONFESSIONAL_END_BROKEN: "اعترفت... ... بخطيئة... ... تطهر....<page>عد... ... إلى العمل... ... تبدأ....<page>... فارلوم... ... لا تتعب... ... مغفور لك."
ARCHITECT_SHOP_DESC_COGWORK_SAW: "لديك ميل إلى هذه الشفرات الدائرية؟ أستطيع أن أ-أ-أبني على الفكرة-المعرفة. أجعلها تنكمش. أجعلها تخزن القوة."
ARCHITECT_SHOP_DESC_KEY_REQUIRE: "احصلي على {0} أدوات أخرى لإثبات براعتك."
LARGE_COG_WORK_REPEAT: "هرررررر. لا أستطيع قول المزيد يا صديقتي. إنهم يراقبون. علينا مواصلة العمل."
AUTO_SHRINE_DOOR_INSPECT: "بوابة مقفلة تحمل رمز معماري."
ARCHITECT_SHOP_DESC_SHARDPOUCH: "مواد خام للصنع. احمليها معك دائما كي ت-ت-تكوني مستعدة."
ARCHITECT_SHOP_DESC_KEY_REQUIRE_SINGLE: "احصلي على أداة أخرى واحدة لإثبات براعتك."
ARCHITECT_COG_HEART: "قطع من ق-ق-قلب-نواة تحملينها، كيف حصلت-عثرت على قطعة أثرية بهذه الندرة؟<hpage>كانت متناثرة في أنحاء القلعة، ويبدو أن كل قطعة وضعت عن قصد. أراد أحدهم تفكيك القلب، لكنه احترمه بما يكفي ليحفظه بأمان.<page>ذلك القلب تصميم عبقري، ابتكره أول أفراد سلالتي لفارس من التروس والنصال.<page>أرى فيه موهبة سلفي الهائلة، وقد ضاعت-نسيت الآن. لا يمكنني أبدا صنع-نسخ عمل بهذه الد-د-الدقة.<hpage>وماذا عن الفارس الذي حمل القلب ذات يوم؟ حدثني عنه.<page>فرقة متألقة من حراس التروس، كانوا مهيبين في أدائهم حتى كلفوا-قيدوا بأقدس الواجبات.<page>قبل إنشاء القلب بزمن ط-ط-طويل، خرج الحراس حتى إلى ما وراء هذه الجدران، ليضمنوا-يفرضوا أن تكون كل الحشرات آمنة في خدمة القلعة.<page>لو أعيد الق-ق-قلب إلى صَدَفة الحارس، أيشكر إيقاظه؟ أم يرثي تلك الأراضي التي ض-ض-ضاعت؟<hpage>قد أعرف ذلك يوما أيها الصانع..."
ARCHITECT_SHOP_DESC_BROLLYSPIKE: "شريط الأسنان المعدنية هذا حاد وخفيف-دقيق. يمكن نسجه داخل طبقتك الخارجية الحمراء. سلاح خفي."
