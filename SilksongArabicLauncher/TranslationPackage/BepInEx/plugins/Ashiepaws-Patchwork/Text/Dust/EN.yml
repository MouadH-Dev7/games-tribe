TRADERS_QUEST_OFFER: "<hpage>لماذا تبقون الصراصير في الخارج داخل حظائر؟ تبدو مخلوقات خطرة يصعب حبسها أو ترويضها.<page=S>علينا نحن حشرات المستنقع أن نأكل، أليس كذلك؟ وصراصير الوحل تلك برية سريعة التكاثر. أصدافها صلبة ولحمها قاس، هذا إن استطعتِ شقها، لكن خياراتنا قليلة فلا نتدلل.<page=S>لا بأس بطعمها بعد أن تعتاديه. والأحشاء ألذ ما فيها، لكنها أنفس نصيب، ولم نذقها منذ زمن طويل.<page=L>ها ها! الحياة قاسية حقا! بنجن المسكين يذبل أمام أعيننا!<page=L>هذا يحرك مشاعرك، أليس كذلك يا آنسة؟ فلم لا تستخدمين ذلك النصل فيما ينفع؟ اصطادي لنا بعض تلك الصراصير وأحضري لنا أحشاء شهية، وستجدين عندنا مقابلا عادلا."
GRUBFARMER_DELIVERY: "<hpage>سيدي، أحضرت بيضة ملكة بناء على طلب رسل قلب الجرس. كانت الرحلة محفوفة بالمخاطر، لكن المخلوق داخلها وصل حيا.<page>سسسسس! ما أروع هذا! ومن كان يظن أن سسسيّدتي العزيزة هي من ستسلم الطرد الثمين! كنت أخشى عجز أولئك الرسل الضعفاء...<hpage>يفاجئني أنك تراسلهم. وأتساءل أين تذهب أيضا، وإلى من تتحدث بعد أن تسرع عائدا إلى الظلام...<page>سسس. همساتي تبلغ أماكن بعيدة يا سيدتي. لا تشغلي بالك بذهابي وإيابي. كل ما أفعله... هو في خدمتك.<page>والآن، أرجوك... أعطيني إياها... الملكة الصغيرة!"
TRADERS_TALK_GENERIC_2: "<hpage>وقعت الوحوش في الخارج وأسيادها جميعا في أسر بلاء هذه الأرض الحريري. أنتما محظوظان لأنكما لم تستسلما له.<page=L>المس؟ فهمنا أمره تماما. أنا وبنجن فيلسوفان بحق حين نشغل فكرنا به.<page=L>الإيمان هو الذي يوقع بك. كل هذا سببه الإفراط في التعبد!<page=S>نعم! أو ربما سببه قلة التعبد!<page=L>وربما الأسلم ألا نفكر فيه مطلقا. ها ها!"
GRUBFARMER_GROWING_ACT3: "بينما تجوبين عالما عصف به السواد، سأنمي لك لقيمات. ومن أجل الوعد بما ستصبح عليه سسسيّدتي... سأعمل دائما بلا توقف..."
TRADERS_TALK_GENERIC_1: "<page=S>يقال إن المستنقعات كانت تنتج وفرة من الطعام الطازج في الزمن القديم، قبل أن تكلفنا القلعة بالتقاط خيطها المتساقط.<page=S>يبدو ذلك جميلا، أليس كذلك يا آنسة؟ طعام لا ينفد، ولا بطون تقرقر من الجوع؟<page=L>ها ها! أنت كالفرخ يا بنجن، كثير الأحلام! <page=L>أما الآن، فتربية الصراصير هي ما يحمينا من الجوع. عمل خطر، وطعام ليس من أجود ما يكون، لكننا لا نشكو.<page=L>ولا سيما مع استسلام مزيد من المربين لذلك المرض الغريب. فهذا لا يعني إلا مزيدا من اللحم لنا. ها!"
TRADERS_TALK_REPEAT: "<page=L>نحن جميعا بخير هنا يا آنسة، وراضون عن حالنا. لعل الوقت حان كي تمضي، أليس كذلك؟<page=S>نعم، واصلي طريقك! وشكرا على مساعدتك."
TRADERS_PINS_PROMPT: "شراء الأشواك الفولاذية؟"
GRUBFARMER_POPPED: "سسسس. جوعك يفضحك يا سيدتي. لم تنضج اللقمة بعد، لكن لا تغضبي. سأنمي لك أخرى... فأنا عبدك."
GRUBFARMER_MEET_3_ACT3: "سسسس! جئتِ لتطالبيني، وأنا لك. أنا عبدك المتواضع!<hpage>لا أرغب في التسلط عليك يا سيدي. إن كان قضائي على تلك الكتل السوداء قد أفادك، فلم يكن ذلك إلا مصادفة. وداعا.<page>وداعا...؟ لا... الأقوياء يستولون على الضعفاء، وعلى الضعفاء أن يخدموا! أنا لك يا سيدتي، ويجب أن تحميني!<page>انظري إلى ما بنيته هنا! أعددته لقدوم سيدتي. سسسيّدتي القوية!<page>وأنت بعيدة تصطادين، سأنمي لك... شيئا طيبا. لكن العمل يستغرق وقتا. عودي إلي سريعا، وقد تنالين ما أنميه..."
TRADERS_TALK_REFUSE_GIVE: "<page=S>لـ... لماذا التأخير؟ أتحتفظين بالأحشاء لنفسك؟ انظر يا كرول، إنها تتراجع عن وعدها!<page=L>ها. الوعود يسهل كسرها، وكذلك أشياء أخرى كثيرة. فما رأيك أن تعيدي النظر في جشعك يا آنسة؟"
TRADERS_PINS_DECLINE: "<page=S>مهلا! أما معك المَسابح؟ أم أنك لا تريدين التخلي عنها؟ <page=L>ليس هذا وقت البخل يا آنسة. ستظلين مريضة حتى تشتري منا هذه الأشواك."
GRUBFARMER_MEET_3: "سسسس! جئتِ لتطالبيني، وأنا لك. أنا عبدك المتواضع!<hpage>لا أرغب في التسلط عليك يا سيدي. إن كان قتلي لهذه المخلوقات قد أفادك، فلم يكن ذلك إلا مصادفة. وداعا.<page>وداعا...؟ لا... الأقوياء يستولون على الضعفاء، وعلى الضعفاء أن يخدموا! أنا لك يا سيدتي، ويجب أن تحميني!<page>انظري إلى ما بنيته هنا! أعددته لقدوم سيدتي. سسسيّدتي القوية!<page>وأنت بعيدة تصطادين، سأنمي لك... شيئا طيبا. لكن العمل يستغرق وقتا. عودي إلي سريعا، وقد تنالين ما أنميه..."
PRINCE_CELL_INSPECT: "قفص بقفل بسيط."
GRUBFARMER_MEET_1: "سسسس! رأيتك. رأيت ما فعلت!"
GRUBFARM_MIMIC_REMEET_PRE: "<hpage>أود الحديث مجددا. أظهر نفسك."
TRADERS_PINS_OFFER: "<hpage>أيها السادة، جئت بناء على طلب الطبيبة يارنابي. إنها تحتاج إلى أشواك مصنوعة من الفولاذ لإجراء عملية بالغة الأهمية.<page=L>آه! انظر إليها يا بنجن. تبدو مريضة! ملتفة على نفسها وفيها شيء غريب. أظن أنها تحتاج إلى تلك العملية لنفسها!<page=S>حالها محزن حقا يا كرول، لكن العثور على خردتنا شاق، سواء كانت مريضة أم لا. إن أرادتها، فعليها أن تدفع!<page=L>آه! أخشى أن الصغير محق يا آنسة. ربما تعانين، لكننا لا نستطيع تقديمها مجانا.<page=L>لدينا الأشواك التي تحتاجين إليها. ما عليك إلا الاستعداد للتخلي عن بعض الخرز!"
GRUBFARMER_MEET_2: "ما أقواك يا سسسيدتي! صغيرة، لكنك شديدة الفتك. ورائحتك! عتيقة وناضجة!"
PRINCE_CELL_REPEAT: "دعي الأمر أيتها الحشرة. لقد تقبلت مكاني.<hpage>كما تشاء أيها السجين."
GRUBFARMER_NEEDOLIN: "سسسس! يا لها من أصوات، انتزعت من الهواء واحتجزت في حريرك! إنها أعجوبة يا سسسيدتي...<hpage>إنها مهارة يستطيع أي أحد تعلمها. ويمكنك إتقان هذا الصوت بنفسك إن شئت.<page>لا... على العبد أن ينمي اللقيمات لسيدته. لكن ذلك الصصصوت... مهدئ للغاية..."
GRUBFARMER_DELIVERY_POST_SETUP: "تم الأمر. اتسع عشنا، وبدأت الملكة الصغيرة عملها.<page>يمكنني الآن إنماء مزيد من اللقيمات لك! هل أنت راضية عني يا سسسيدتي؟<hpage>أنت مجتهد في عملك، ولم ترفع مخلبا في وجهي. إن بقي الأمر كذلك، فلن يكون لدي سبب للاستياء منك.<page>سسس! إذن سأواصل عملي! فأنا عبدك المخلص إلى الأبد!"
GRUBFARMER_OPENED1: "سسس! يا سيدتي، هل تليق بك اللقيمة التي أنميتها؟ عليك أن تأكلي... تأكلي وتصيري أقوى.<page>هكذا سأخدم سسسيدتي. بينما تصطادين، سأعد اللقيمات. سأظل أعدها دوما لسيدتي الجبارة...<hpage>واصل هذا العمل إن كان يرضيك يا سيدي، لكن لا تدعني سيدتك، فلست كذلك.<page>سسس... لكنك سيدتي... أنت قوية وأنا ضعيف... مجرد عبد. سأظل عبدك دوما..."
TRADERS_QUEST_COMPLETE: "<page=S>تلك الرائحة! إنها طاغية! لم أر قط هذا القدر من أحشاء ماكروتش دفعة واحدة!<page=L>تماسك يا صديقي القديم بنجن. ما زالت هذه الأحشاء بحاجة إلى التقطيع والتنظيف والطهو. أمامك عمل كثير.<page=S>لا بأس عندي يا كرول ما دام ينتظرنا هذا الوليم! قريبا سنأكل كما يأكلون في القلعة!<page=L>وأنت يا آنسة؟ هل ستنضمين إلينا في هذه الوجبة الفاخرة؟<hpage>أخشى أنني لن أفعل أيها السيدان. علي مواصلة طريقي، وأخشى أن مذاق طعام فاخر كهذا سيضيع علي.<page=L>كنت آمل ذلك. يمكن لاثنين أن يغنيا، أما ثلاثة فكثير، صحيح؟ ها ها!<page=L>لكن ربما تكفيك هذه الأداة لتتذكرينا؟ سلاح مدبب صنعته بنفسي حين كنت أصارع حشرات ماكروتش. أراهن أنك ستستفيدين منه كثيرا."
GRUBFARM_MIMIC_GIVE_POST: "خذي. آه، مكافأتي. أعطيهم."
GRUBFARMER_DELIVERY_POST_DELIVERY: "بهذا... الذي سلمته سيدتي بكل عناية... يمكننا توسيع عشنا!"
PRINCE_CELL_TALK_ACT3: "دعيني وشأني. حان انهيار هذه المملكة، والأفضل أن أبقى هنا وأتقبله.<page>أن أموت داخل قفص... نهاية ملائمة لهذه الصَدَفة، ومصير تستحقه هذه الأراضي الملعونة.<hpage>كما تشاء أيها السجين."
GRUBFARM_MIMIC_MEET: "أشعر بوجودك. أنت مختبئ."
TRADERS_PINS_REPEAT: "<page=L>ها قد أتممنا صفقة عادلة أخرى. تلك الأشواك حادة، ولم يبدأ الصدأ فيها إلا بالكاد. من الأفضل أن تعودي إلى طبيبتك كي تعالجك، صحيح؟"
TRADERS_QUEST_ACTIVE_REPEAT: "<page=L>ما زلنا ننتظر أحشاء ماكروتش التي وعدتنا بها يا آنسة. ننتظر بصبر، لكن ليس طويلا جدا، أفهمت؟<page=S>ستجدين حشرات ماكروتش في كل أنحاء هذه الطرق. اصرعي واحدة، ثم مدي يدك داخل صَدَفتها وانتزعي أحشاءها الشهية! مممم!"
GRUBFARM_MIMIC_GIVE_DENY: "أعطيهم. الأخذ خطأ. لينقذني أحد."
GRUBFARM_MIMIC_MEET_PRE: "<hpage>أشعر بوجودك هناك، مختبئا في الظلام. أظهر نفسك."
TRADERS_QUEST_REFUSE: "<page=L>أترفضين طلبنا يا آنسة؟ لا بأس إذن. سنعود إلى التضور جوعا ببطء، ها ها!"
TRADERS_QUEST_CANCOMPLETE: "<page=L>أوه، هناك من تحمل رائحة شهية! هل جئت لتسليم ما وعدتنا به يا آنسة؟"
GRUBFARM_MIMIC_GRUB: "اللقيمات... أعطيها. خذي."
TRADERS_PINS_REOFFER: "<page=L>هل تفكرين جديا في الأشواك يا آنسة؟ لا شك أن صحتك أغلى من بضع حبات من الخرز!"
GRUBFARM_MIMIC_GIVE: "نعم، أعطيني إياه!"
TRADERS_QUEST_REOFFER: "<page=L>لم لا تستخدمين ذلك السلاح فيما ينفع يا آنسة؟ اذهبي واصطادي بعض حشرات ماكروتش، وأحضري لنا أحشاء شهية. ستنتظرك صفقة عادلة!"
GRUBFARMER_RETURN: "يا سيدتي، هل استدعيت عبدك؟ سأطيع... فأنت الأقوى. يمكنني تأجيل ما أجمعه."
TRADERS_QUEST_ACCEPT: "<page=L>أظنك لا تعرفين مقدار العناء الذي جلبته على نفسك بهذا الوعد يا آنسة.<page=L>على أي حال، من الأفضل أن تبدئي. تنتشر حشرات ماكروتش في كل مكان على هذه الطرق القديمة. اعثري على بعضها وانتزعي أحشاءها. الأمر في غاية السهولة!"
GRUBFARM_MIMIC_NOGRUB: "هذا ليس صوابا. لا شيء. اذهبي."
PRINCE_CELL_TALK: "دعيني وشأني أيتها المسافرة. تقبل قسوة هذه المملكة خير من الغضب عليها بلا جدوى.<page>أن أذوي منسيا في زنزانة ليس أسوأ من المس الذي يقيد عقول كثير من حشرات فارلوم الهشة.<hpage>كما تشاء أيها السجين."
GRUBFARMER_TENDING: "العناية باللقيمات مهمة دقيقة تتطلب صبرا كثيرا. دعيني أعمل من أجلك يا سيدتي في ظل حمايتك الرائعة..."
GRUBFARM_MIMIC_REMEET: "أظهري نفسك مجددا. تكلمي بنفسك."
GRUBFARMER_GROWING: "على العبد أن يطعم سيدته. سأنمي اللقيمات. بينما تصطادين، سأعمل... دوما..."
TRADERS_PINS_ACCEPT: "<page=S>يسرنا التعامل معك يا سيدتي. لا نبيع إلا أجود الخردة، نعدك بذلك!<page=S>ومن أجل صَدَفتك، نرجو أن تفي كل تلك الأشواك بالغرض!"
GRUBFARMER_MEET_ACT_3: "سسسس! عادت إلي سيدتي! في ظل حمايتها، لا أخشى الخيوط السوداء الزاحفة!<page>كيف يرتجف العالم في قبضتها الرهيبة! في أوقات كهذه، لا ينجو إلا الأقوياء... ومن يخدمونهم بإخلاص...<hpage>لا أستطيع البقاء هنا لحمايتك يا سيدي، لكن اعلم أن غايتي تحرير هذه الأرض بقطع الخيوط السوداء. وإلى أن أفعل، عليك أن تهتم بسلامتك.<page>سسس. أسمع أكثر من كلماتك يا سيدتي. أسمع رغباتك الحقيقية تنبض في داخلك. ولكي تتحقق، سأواصل العمل من أجلك... دوما.<page>"
TRADERS_MEET: "<page=L>مهلا، لماذا تدخلين إلى هنا وتنشرين الوحل؟ ولماذا تحملين ذلك السلاح المخيف؟<page=S>نعم، لماذا تدخلين إلى هنا؟ لم نرتكب أي خطأ. ولسنا مشوهين مثل رعاة ماكروتش!<page=L>لقد جاءت لتقتلنا يا بنجن! حانت نهايتنا يا صديقي القديم! ها ها!<hpage>لا أريد بكما سوءا. لا أصرع إلا من يعترضون طريقي.<page><page=L>أحقا؟ الحراس في الخارج لا يسمحون للغرباء بالمرور، لذا ستجدين لسلاحك نفعا هناك يا آنسة."
