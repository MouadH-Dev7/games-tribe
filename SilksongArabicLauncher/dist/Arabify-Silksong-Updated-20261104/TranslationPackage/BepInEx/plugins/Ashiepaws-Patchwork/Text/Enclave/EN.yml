PILGRIM_LARGE_SK_SAVED_ACT3_REPEAT: "ذلك الفارس الذهبي في الخارج يا أختي، يقضي على التائهين ويحفظ لنا الأمان.<page>أظن أن المكان كان سيغص بهم لولا شجاعته ونصاله النبيلة."
CARETAKER_DELIVERY_POST: "خذي بعض الخرز جزاء جهدك يا قارعة الجرس، واعلمي أن هذه الجماعة البائسة ستعيش مدة أطول بفضلك."
CARETAKER_SNARE_COMPLETE_POST: "انتهيت! الأجزاء جاهزة. سأصعد الآن لأثبت ذلك الشيء الثقيل.<page>حتى بعد نصب الفخ، لن تسقط التي في الأعلى بسهولة. ستشعر بما ينتظرها.<page>لا بد أن يؤدي نصلك عمله قبل أن ينطبق هذا الشيء.<hpage>توقعت ذلك يا سيدي، وأنا مستعدة. انصب فخك وسألحق بك بعد قليل."
CITY_MERCHANT_SHOP_REPEAT_ACT3: "كل شيء ينهار يا عزيزتي. احرصي على مقاسمتي مَسابحك قبل فوات الأوان!"
CITY_MERCHANT_TALK1: "تغنى الحكايات بك كثيرا يا عزيزتي. تجمعين المؤن وتنقذين الحشرات التائهة وتفعلين شتى الخيرات!<page>من الذكاء أن تصنعي لنفسك هذه السمعة. إن واصلت ذلك، فسرعان ما ستصبحين أسطورة بين هؤلاء البسطاء.<hpage>لا أرغب في ذلك يا سيدتي. عرفت في حياتي الطويلة من الأساطير ما يكفيني، وشاهدتها تنهض وتسقط ثم تتلاشى مرارا.<page>أحقا يا عزيزتي؟ كم أنت متواضعة! لكن اعلمي أن هذه الحاجة العجوز تراقبك بعين حادة. لا يفوت جوبيلاانا شيء!"
CARETAKER_MEET_2: "أنت التي قرعت ذلك الجرس العظيم الصاخب قبل قليل، أليس كذلك؟ وفعلت ذلك حين كنت أحاول النوم!"
PILGRIM_LARGE_REPEAT: "أرجوك ألا تبتعدي كثيرا يا أختي. لن تجدي في هذا المكان الملعون كله أمنا إلا هنا."
CITY_MERCHANT_BRIDGE_REPEAT: "لا بد من وجود بعض الأشياء النفيسة التي لم أجمعها هنا، ولا أريدك أن تبقي حولي في أثناء ذلك. بركاتي لك، ووداعا!"
CARETAKER_LV1_MEET: "حسنا، حسنا! انظري إلى ما جلبه تصرفك المتهور يا قارعة الجرس!<page>كما توقعت تماما، صار هذا الملاذ الذي كان هادئا يعج بشتى الحشرات. لقد بدأت مستوطنة صغيرة رثة تنشأ حول هذا الضريح القديم!<hpage>كل هذه الحشرات المسكينة ضحايا للقلعة وجاذبيتها الخبيثة. تستدرجهم إلى جوفها، ثم تلتهمهم تماما.<page>نعم، إنها من داخلها وخارجها كذبة عظيمة مذهبة. لكن يمكن لهؤلاء التائهين القلائل أن ينعموا ببعض الأمان. يا لهم من مساكين حمقى..."
CITY_MERCHANT_ITEM_SEAL_CHIT: "أمر نفيس تناقله القادة المقدسون. يندر الآن العثور على هذه النصوص القديمة، ويندر أكثر العثور على حشرة تستطيع قراءتها."
CITY_MERCHANT_SAVED_1: "أوه، يا لها من مفاجأة! خشيت ألا يبقى في هذه القاعات عاقل سواي. يبدو أن حظ هذه العجوز لم ينفد بعد!<hpage>لم يكن الحظ وحده ما أوصلني إليك يا سيدتي. وعدت بتحقيق أمنية حشرات قلقة على سلامتك.<hpage>أحثك على التوجه إليهم الآن، بجوار الجرس القديم، إلى الأعلى ثم من الجهة الأخرى.<hpage>نشأت هناك مستوطنة صغيرة، ويبدو أن الجرس بعد إيقاظه يصد أسوأ أخطار القلعة الكثيرة.<page>مستوطنة؟ في هذه القاعات التي طالها المس؟ أتروين أكاذيب صغيرة ماكرة يا عزيزتي؟ حسنا، لا أظن أن في الذهاب ورؤية الحقيقة بنفسي خطرا كبيرا."
CITY_MERCHANT_SAVED_2: "انصرفي الآن يا عزيزتي، واتركيني أجمع حليي وزينتي.<page>إن كانت الحشرات آمنة حقا في مستوطنتك، فسأستطيع عقد بعض الصفقات المربحة. بركاتي لك، ووداعا!"
CARETAKER_SNARE_OFFER: "أشعر أن الموعد قد اقترب يا قارعة الجرس، موعدك مع التي تنتظر في الأعلى. لن يتأخر ذلك اللقاء المحتوم إلى الأبد... هل أنت مستعدة لاتخاذ خطوتك، وعزل حاكمة واحتلال مكانها؟<hpage>لن أنكر أن جزءا مني يرغب في تلك النتيجة... يبدو أن النزوع إلى السيادة متأصل في دمي، ولا شك أنه متأصل أيضا في التي في الأعلى.<hpage>لكن جزءا آخر يقاوم... ومع مرور الوقت، أجدني أميل إليه أكثر...<hpage>لا يريد ذلك الجزء ارتداء رداء الحكم، بل استعادة حريتي وتحرير حشرات هذه المملكة من قيودها الشاحبة.<page>...إنها فكرة مذهلة يا قارعة الجرس، عالم تحرر من قيوده. لم أجد سببا كبيرا لأرجو أمنية جادة كهذه... لكن سماعها منك لا يفاجئني كثيرا.<page>كلما رأيت عونك للآخرين، اتضحت لي حقيقتك أكثر. ما زالت فيك طبيعة الحاكمة، بالتأكيد، ووهج ناسج، لكن طموحك... مختلف تماما عن كليهما.<hpage>إن كنت قد أدركت رغبتي يا سيدي وتشاطرني بعضها، فهل ستعينني في الصراع القادم؟<page>نعم... ربما أفعل. يكاد يصعب علي قولها... لكن لدينا فكرة نادرا ما نناقشها، خوفا من أن تستشعر التي في الأعلى ما ندبره.<hpage>أفهم أنك ابتكرت وسيلة لإزاحة حاكمة... من دون أن أضطر إلى تولي مكانها؟<page>نعم، أنا ومن بقي من عائلتي. إنه فخ من نوع ما، يفوق صنعه مهارة هذه القلعة، ولا يكتفي بتقييدها. وستكونين خير صيادة تنصبه، إن كنت جريئة بما يكفي للمحاولة..."
CARETAKER_SWAMP_SOUL: "ما الذي تحملينه هناك يا قارعة الجرس؟ هل سرقت روح شخص آخر لنفسك؟<hpage>أتقصد البقية التي وجدتها في الكهوف المختنقة بالوحل بجوار القلعة؟ هذه روح استنزفت من حشرة كانت قوية يوما ما.<hpage>لم يبق منها الآن إلا مزيج خافت، لكن بعض القوة ما زالت فيها. لا بد أن مواهب صاحبها في أوجها كانت مبهرة.<page>نعم، كانت كذلك. عرفت تلك الحشرة في عز قوتها منذ زمن بعيد. كان أشجع من معظمهم، ولم يكن يحب هذه القلعة أكثر منك.<page>ذهب يطلب التحالف مع حشرات المستنقعات البدائية. ظن أن الطرفين سينتفعان من اتحادهما... كان يدبر للعصيان أو حماقة من هذا القبيل!<page>والآن مات كما عاش أحمق! لا تحاولي تكوين صداقات في فارلوم يا قارعة الجرس. لا يأتي منها خير."
CARETAKER_BEAST: "همف. ربما تظنينني أحمق يا قارعة الجرس، لكنني أعرف هذا المكان وحواسي حادة.<page>لقد أحضروك إلى هنا، أليس كذلك؟ من وراء حدود أراضينا؟<hpage>أنت محق. التي تنتظر فوق هذه القلعة... بفضل حسن ضيافتها وصلت إلى هذه المملكة، وأسعى الآن إلى رد ترحيبها بالمثل.<page>همف. كلمات وحشية، وإن صيغت ببراعة.<page>أدعو فقط ألا تجلبي مزيدا من الألم الذي لا داعي له فوق رؤوس هؤلاء الحُجّاج الصغار السذج..."
CARETAKER_SNARE_COMPLETE_PREPARE: "هل وجدت كل شيء يا قارعة الجرس؟ إذن انضمي إلي ولنبدأ الاستعداد! سأحتاج إلى حريرك ومخالبك في صنع الفخ."
PILGRIM_SMALL_02: "اختارتنا القلعة ومنحتنا وقتا إضافيا من الحياة. لكن لأي غرض؟ من يستطيع القول؟"
CARETAKER_SNARE_REPEAT: "إن أردت صنع ذلك الفخ، فعليك البدء في الجمع. سأدلك قدر استطاعتي على ما نحتاج إليه."
CARETAKER_MERCHANT: "سمعت أنك أنقذت تاجرتنا العزيزة. رأيتها تتسلل وتبحث عن الغنائم حتى قبل أن تقرعي ذلك الجرس.<page>إنها نافعة، لكن لا تدعي عمرها يخدعك، فما زال عقلها الأبرع في عقد الصفقات.<page>ولن يطول الأمر حتى تجد كل مِسبحة حول هذا الضريح طريقها إلى جيوبها."
CARETAKER_SNARE_REOFFER: "يا قارعة الجرس... هل تعيدين التفكير في ذلك الفخ؟ إنها طريقة جنونية بالتأكيد، لكنك خير صيادة تنصبه، إن كنت جريئة بما يكفي للمحاولة..."
CARETAKER_SNARE_ACCEPT: "<hpage>أعنني يا سيدي. إن كان فخك يفتح طريقا إلى الحرية، لي ولحشرات أرضك، فقد أختار حقا إطلاقه.<hpage>ما العمل الذي تطلبه مني الآن لكي تقدم عونك؟<page>عليك البحث عن قوة عائلتي يا قارعة الجرس: نحن الحشرات الثلاث العجائز التي ما زالت حية ومتفرقة في أنحاء المملكة، وابن عم مسكين مات واستنزف في مستنقعات مختنقة بالعفن.<page>يمتلك كل واحد قوة، قوة خاما متوحشة! وسيمنحونك إياها، سواء بدافع افتتانهم بما تفعلين، أو نشوة العصيان... أو لأنهم لا يملكون خيارا."
CITY_MERCHANT_ITEM_WARDKEY: "هذا مفتاح متقن حقا. لا شك أنه سيفتح الطريق إلى مكان مميز، وأراهن أنه مليء بالأشياء النفيسة. اعثري على القفل، وسيعوض المفتاح ثمنه!"
CARETAKER_DELIVERY: "<hpage>أيها المشرف، أحضرت مؤنا من بلدة الأجراس الواقعة أسفل القلعة.<page>ونحن في أمس الحاجة إليها يا قارعة الجرس. لا يجمع هذا الجمع شيئا ولا يبحث عن طعام، فيما تجوب جماعات الجوقة القاعات المجاورة."
CARETAKER_SNARE_REPEAT_BELLHERMIT: "في متاهة الأجراس المدفونة عند قلب فارلوم، ابحثي عن عمي الكئيب. لديه من القوة أكثر مما يحتاج."
PILGRIM_SMALL_01: "إذن وجدت هذا المكان أيضا يا أختي؟ خنق الخيط الملعون وعد القلعة العظيم حتى تلاشى، لكن الجرس العظيم هنا يمنحنا بعض الأمان على الأقل.<page>نحن من القلة المباركة... وقد منحنا وقتا إضافيا قصيرا من الحياة."
CITY_MERCHANT_REPEAT: "انطلقي الآن يا عزيزتي. إن كنت ترغبين في حليي، فيمكنك مقايضتي بمَسابحك عند الضريح. بركاتي لك، ووداعا!"
PILGRIM_GENERIC_ACT3_REPEAT: "أوه... إن لم نعد حُجّاجا... فمن نكون؟"
CITY_MERCHANT_ITEM_TOOLMETAL: "كان أهل الحرف يتهافتون على هذا المعدن. لا يبدو مميزا، لكنني ما زلت أذكر قيمته."
CARETAKER_MEET_1: "أنت هناك!"
CARETAKER_MEET_REPEAT: "هذا الضريح المستيقظ يناديهم، أتفهمين؟ يرن في أذن كل حاج تائه وكل بائس قذر حالفه سوء الحظ فبلغ هذه القلعة اللعينة محتفظا بعقله: «الأمان هنا. تعالوا!»<page>ما حدث قد حدث، وما قرع قد قرع. احرصي فقط على العودة قريبا أيتها الفظة! لن أتولى وحدي أمر كل الوافدين الجدد!<hpage>إن سمح الوقت يا سيدي، فسأزوركم مجددا."
CARETAKER_SNARE_DECLINE: "كان ينبغي ألا يفاجئني ذلك. محاولة أمر كهذا حماقة... وربما مجرد التفكير فيه حماقة أيضا. أبناء جنسك لم يخلقوا للموت."
CARETAKER_SNARE_ACCEPT_SNARE: "ولإتمام الجزء الأخير، سأحتاج أيضا إلى أداة تثبيت الرون التي تحملينها. إنها أداة بارعة قديمة صنعها النسّاجون، وقاعدة مثالية نبسط عليها قوتنا.<page>بعد أن تجمعي لنفسك الأجزاء المهمة الأخرى، سأطلب منك تسليمها إلي أيضا."
CARETAKER_SNARE_REPEAT_SWAMP: "اعثري على جثمان ابن عمي الذي استولت عليه حشرات المستنقعات المنبوذة. كان أحمق مهملا حين سمح لهم بأسره. ورغم موته، ما زال بالإمكان الإحساس ببصيص من روحه."
CARETAKER_SNARE_COMPLETE_PRE: "<hpage>يا سيدي، أحضرت الأشياء التي طلبتها. اصنع لي فخك لنحرر هذه الأراضي."
CITY_MERCHANT_MEET_AFTERBRIDGE: "كان ما فعلته في الأعلى عملا طيبا يا عزيزتي، حين أنقذتني من تلك الأسراب الصارخة. لم أر مثله منذ زمن طويل جدا.<page>وعدت أيضا ومعي شتى الأشياء النفيسة الجديدة. لنر إن كان بين ما جمعته ما يروق لك."
CARETAKER_WISHES_PROGRESS: "لا تظني أنني لم ألحظ يا قارعة الجرس! قدمت عونا كثيرا، هنا وفي الأسفل!<page>إنه دور غريب تتولينه، تنقذين كل تلك الحشرات وتتعهدين بتحقيق الأمنيات.<hpage>أتراه غريبا يا سيدي؟ وجدت بعض السلوى في تقديم العون، وكانت المكافآت التي نلتها نعمة في رحلتي.<page>نعم! لكن هذا ليس مقامك، أليس كذلك؟ أعرف حقيقتك جيدا، أنت من نسل النسّاجين بل أكثر! هذا دون مكانتك! لست من العامة الذين خلقوا لرعاية أمثالنا من البسطاء.<hpage>ويمكنني قول الأمر نفسه عنك، فأنت ما زلت تختار البقاء تحت قلنسوتك، وتتظاهر بأنك مجرد حاج بسيط. ألا ترى أن الوقت قد حان لإنهاء هذا التمثيل؟<page>كفي أيتها العتيقة! دعي لحشرة تنكرها الصغير! كان التظاهر بالبساطة ممتعا. ولم أطلب التغيير، حتى إن كنت مصرة على إحداثه!<hpage>كان التغيير حتميا يا سيدي، سواء وصلت أم لا. الحاكمة تستيقظ، وخيوطها تمتد بعيدا. وجودي لا يفعل سوى تعجيل ما لا مفر منه.<page>فما الذي ترجينه إذن؟ أتخططين لاغتصاب الحكم والجلوس فوقنا جميعا ملكة؟ أترفعين آمالنا لكي تقيدينا بعد ذلك في شبكتك الوحشية؟ هكذا يفعل النسّاجون والآلهة جميعا..."
CARETAKER_LV3_MEET: "واصلي مساعدة الجميع هكذا، وستلهمين الآخرين بفعل مثلها! فكري جيدا في الأثر الذي قد تتركينه يا قارعة الجرس!<page>فالإفراط في الأمل قد يكون خطيرا، ولا سيما على هذه الحشرات التي حرمت منه طويلا."
CITY_MERCHANT_SAVED_BRIDGE_2: "لم لا تسرعين بالعودة إلى المزار وتخبرينهم جميعا بما أنجزت من عمل رائع؟<page>فقد أجد في طريق عودتي مزيدا من النفائس، ولا أريدك أن تبقي هنا في هذه الأثناء. رافقتك البركات، ووداعا!"
CITY_MERCHANT_ITEM_SIMPLEKEY: "بسيط الصنع والتصميم. أعد لفتح مختلف الأقفال، ما دامت بسيطة بما يكفي."
PILGRIM_STANDARD_MEET: "يا أختاه، يا أختاه! دعيني أفضي إليك بسر! أقسم أنني سمعت ضحكة طفل بينما كنت أصعد عبر قاعات القلعة لأبلغ هذا المكان!<page>لم تكن أكثر من صدى، وأعترف بأن خوفي يخدعني خداعا مروعا... ومع ذلك، لا يزال ذلك الصوت يتردد في رأسي.<page>لكن يستحيل أن تنجو حشرة بهذا الصغر والحيوية داخل تلك القاعات عديمة الرحمة، أليس كذلك؟"
PILGRIM_LARGE_SK_SAVED_ACT3_MEET: "أيتها الأخت، هل رأيتها هناك؟ بطلتنا الجديدة، الفارسة الذهبية التي تجوب قاعات القلعة المتداعية؟<page>حشرة طويلة القامة ونبيلة. لا تحب الحديث كثيرا. ومع ذلك، لكنت في عداد الموتى لولا ظهورها.<page>ولست وحدي. فقد تحدث آخرون عن تدخلات الفارسة في الوقت المناسب وشجاعتها النادرة.<page>نحن في حاجة ماسة إلى كل حماية ممكنة، وتلك البطلة المتلألئة تقدم عونها بقدر يكاد يضاهي عونك."
CITY_MERCHANT_RUMMAGE_REPEAT: "إن كنت ستواصلين التسكع هنا وأنا أعمل، فاشتري شيئا على الأقل. ألقي نظرة يا عزيزتي، ولا تخجلي!"
CARETAKER_SNARE_ACCEPT_NO_SNARE: "وأخيرا، ابحثي للقاعدة عن سلاح من عهد النسّاجين. لا بد أن واحدا ما زال في أكبر أعشاشهم بالأسفل، وهو أداة فخ ترسم نقشا من حرير حارق. وسننسج فخنا بإحكام حوله."
CARETAKER_MEET_3: "اعترفي! أنت فعلتها! أيتها المراوغة الصغيرة قارعة الجرس!<hpage>اخترت مكانا غريبا للراحة يا سيدي. أتعرف شيئا عن هذا المزار ونظرائه في الأراضي الواقعة بالأسفل؟<page>أوه، فأنت تطرحين أسئلة غريبة إلى جانب تحرير الأجراس، أليس كذلك؟ لست حاجّة بالتأكيد، ومن الواضح أنك لست من الجوقة أيضا. لا! أعرف بالضبط ما تكونينه...<page>بلهاء تقرع الأجراس! وغريبة الأطوار! ألا تدركين ما فعلت حين أيقظت ذلك المزار؟<page>لقد دوى ذلك الجرس في كل مكان! وسمع البائسون والتائهون نداءه، وسيتوافدون إلى هنا الآن.<page>ما حدث قد حدث، وما قرع قد قرع. لكن احرصي على العودة قريبا أيتها البلهاء! يمكنك مساعدتي في التعامل مع كل الحُجّاج الصغار القذرين والنباشين اليائسين الذين سيظهرون هنا."
CARETAKER_SNARE_COMPLETE_PRE_CANCEL: "ما هذا؟ أتتراجعين فجأة؟ لا شك أن الإقدام على هذا مخيف، لكنك أنجزت كل العمل الشاق بالفعل!<page>وستكون التي في الأعلى قد شعرت بهدفك، ولو على نحو مبهم، فلا جدوى من الانسحاب الآن."
CITY_MERCHANT_ITEM_SPOOLEXTEND: "مدي بكرة الحرير طويلا باستخدام هذه الأداة المتقنة الصنع. إنها الصفقة المثالية إن كنت تنوين تخزين الكثير من الحرير لنفسك!"
CARETAKER_WISHES_PROGRESS_REPEAT: "واصلي مساعدة الجميع هكذا، وستلهمين الآخرين بفعل مثلها! فكري جيدا في الأثر الذي قد تتركينه يا قارعة الجرس!<page>فالإفراط في الأمل قد يكون خطيرا، ولا سيما على هذه الحشرات التي حرمت منه طويلا."
PILGRIM_GENERIC_ACT3_MEET: "آه... أي رعب جديد حل بنا الآن؟<page>أهذا عقاب جديد على خطايانا، أم اختبار آخر لإثبات إيماننا؟<hpage>ليس هذا ولا ذاك، أيتها الحشرة الطيبة. لا ذنب لكم في هذه الكارثة.<hpage>الزموا رفاقكم، وسأعمل سريعا على إنهاء هذا الجنون."
CARETAKER_SNARE_REPEAT_SNARE: "سنحتاج للقاعدة إلى سلاح من عهد النسّاجين. ابحثي في الأسفل، بعيدا عن دروب العظام، داخل أكبر أعشاشهم. إنها أداة فخ ترسم نقشا من حرير حارق."
PILGRIM_STANDARD_REPEAT: "أقسم أنني سمعتها يا أختاه... تلك الضحكة! كأن صاحبها كان يستمتع..."
CITY_MERCHANT_ITEM_NEEDOLIN_TOOL: "أمسكي بهذا وأنت تعزفين، وسرعان ما ستكتشفين وظيفته. إنه يضخم الأغنية ويرسلها قوية وصافية! مثالي إن كنت تنوين العزف أمام جمهور."
CITY_MERCHANT_ITEM_ROSARYSTRING: "ما رأيك أن ننظم خرزك السائب ونحفظه بأمان؟ سأقتطع بعضه ثمنا لضفره، لكن راحة البال تستحق ذلك بالتأكيد."
CITY_MERCHANT_RUMMAGE_GRAND_FORUM: "آه، يسعدني أنني شققت طريقي إلى هنا! يا لها من خيرات بسطها لنا محسنو هذه الأرض، أولئك الكوندكترز الكرماء! إنهم عمالقة بين الحشرات، يرون كل شيء ويغمرهم اللطف!<page>المكان جميل، والنفائس في كل ناحية. لكنها لا تكفي إلا واحدة يا عزيزتي، فلا تطمعي! أنت تعلمين أنني وصلت أولا. رافقتك البركات، ووداعا!"
PILGRIM_LARGE_MEET: "ابقي قريبة يا أختاه. فالقاعات المجاورة تعج بهياكل مسكونة.<page>لن يجلب التجول سوى موت حاد ومؤلم!"
CARETAKER_WARD: "هل فعلتها بعد يا قارعة الجرس؟ هل توغلت في الأعماق واكتشفت الهوس الذي هوى بهذا المكان إلى هذا الدرك؟<hpage>إن كنت تقصد هذه القلعة وحريرها أيها القيّم، فنعم، عرفت الآن أصل الأمر.<hpage>رأيته بوضوح في الجناح بالأسفل: الهياكل الجوفاء وأدوات التعذيب الكثيرة... آلات تغرس الخيط في الحشرة كي تطيل حياتها.<page>نعم! هذا جزء منه! لكن الأمر أوسع من ذلك كله. تصوريهم وهم يحشرون الحرير في أصدافهم بجشع، والجنون الذي استولى عليهم... حياة أبدية لحشرات فانية! ثم فكري في طول المدة التي استمر فيها كل هذا...<hpage>...وأبنائهم من بعدهم، وكل الحُجّاج اللاحقين... لقد تغلغل الحرير عميقا في أصداف حشرات هذه المملكة عبر أجيال كثيرة...<hpage>لا عجب أن حشرات فارلوم كانت فريسة سهلة لذلك الخيط المسكون. لم يكن عليه سوى البحث عن ذاته ليبلغهم.<page>ها قد بدأت تفهمين يا قارعة الجرس! ولد هؤلاء الحُجّاج المساكين مقيدين بنظام عالمنا القاسي، وها هم الآن عالقون في شبكته الجديدة الملعونة.<page>أما أنت فعلى الأقل حرة منه، وحرة في قلبه رأسا على عقب... إن كان ذلك اختيارك."
CITY_MERCHANT_SAVED_BRIDGE_1: "حسنا، أهذا ظلي الخاص، صاحبة العباءة الحمراء الصغيرة الذكية؟ أما زلت تتبعينني وتحاولين سرقة بعض النفائس التي أشم رائحتها؟<hpage>لقد أسأت فهم مقصدي يا سيدتي، وبقدر من سوء الظن. أقلق الحُجّاج في المستوطنة بالأسفل غيابك الطويل، ولأجلهم تعقبتك مرة أخرى.<page>أحقا؟ يا لهم من فضوليين كثيري القلق! ما زلت قادرة على الدفاع عن نفسي!<page>همم... ومع ذلك، لعل بقاء ذكري في خواطرهم على هذا النحو أمر يبعث الدفء. لم أتوقع ذلك. ولا أنكر أنك أسديت إلي معروفا مرة أخرى.<page>كدت أقع في قبضة ذلك السرب البغيض، والحق يقال، وما زلت أتساءل عن نواياك يا عزيزتي... لكن بوركت على كل حال!"
CITY_MERCHANT_RUMMAGE_LIBRARY: "أتبحثين عن نفائس تخصك يا عزيزتي؟ من الأفضل أن تتجنبي الأقبية المظلمة القريبة. يقال إن القائمين عليها كانوا محتكرين حسودين حتى قبل حلول لعنة الحرير.<hpage>أنت أعرف بالقلعة من معظم الحشرات يا سيدتي. كم أمضيت من الوقت هنا، ناجية بين هذه الممرات المسكونة؟<page>وقت طويل بما يكفي. ولم تكن حياتي هنا سيئة جدا في مجملها. تلاشت الآن كل ذكريات حَجّي، لكن قضاء حياتي في قاعات القلعة الذهبية كان كل ما تمنيت يوما.<page>وها قد تحققت أمنيتي المتواضعة! ربما تجاوز المكان أزهى أيامه، لكن الشكوى الآن ستكون نكرانا مني، أليس كذلك؟"
CITY_MERCHANT_ITEM_SHELL_FRAGMENT: "أهذا جزء من قناع قديم، أم شظية متصدعة من وجه أحدهم؟ لو اكتمل، لأمكنك حماية صَدَفتك على نحو أفضل."
CITY_MERCHANT_MEET_ACT3: "يا لها من كارثة حلت بقلعتنا المقدسة! لم أر مثلها طوال حياتي المديدة.<page>في أوقات كهذه، علينا أن نساعد بعضنا. ابذلي بسخاء يا عزيزتي، فسأحتاج إلى الكثير من المَسابح لأنجو مما سيأتي!"
CARETAKER_LV2_MEET: "بعد كل ما فعلت، انظري! ما زالوا يتوافدون. صار المكان يعج بالحشرات الآن. هم بائسون وضعفاء، لكنهم أحياء!<hpage>يبدون لي خائفين أكثر من كونهم ضعفاء. ومن المشجع أن أعرف أن هؤلاء القلة نجوا وأصبحوا في رعايتك.<page>هذا من صنعك يا قارعة الجرس، لا من صنعي! أنت من قرعت وساعدت! آمل أن يقدروا جهودك، لأنني لا أقدم لهم الكثير، ولست من هواة القتال إن جاءت الجوقة ودبابيسها في أثرنا."
CARETAKER_REPEAT: "ها هم يرقدون بضعف: المنبوذون، وفاقدو الأمل، ومن استنفدتهم الحياة.<page>لقد استدعيت مستوطنة بائسة يا آنسة قارعة الجرس، وسببت لي عناء مروعا. لا أدري إن كان لدينا ما نقدمه لهم... ولا حتى الأمل."
CITY_MERCHANT_SHOP_REPEAT: "توقفي وشاركيني بعض مَسابحك قبل أن تسرعي مبتعدة مرة أخرى يا عزيزتي. لا بد أن لدي ما يعجبك!"
CITY_MERCHANT_ITEM_SPOOLPIECE: "نصف بكرة عنكبوت، وما عليك إلا العثور على نصفها الآخر. صنع أولئك النسّاجون القدامى أشياء رائعة حقا. ماتوا جميعا منذ زمن بعيد، لكن مصنوعاتهم لا تزال تتلألأ."
CITY_MERCHANT_ITEM_WALLCLING: "غنيمة لامعة لمحبي التسلق. أمسكي بها في مخلبك، وستتمكنين من التشبث بالجدران ما شئت!"
CARETAKER_SNARE_REPEAT_CHURCHKEEPER: "في أراضي الطحلب بالأسفل، ما زالت أختي متشبثة بمعبدها الفاشل. وستمنحك قوتها إن طلبت منها بلطف كاف."
CARETAKER_SNARE_ACCEPT_SWAMP_SOUL: "<hpage>امنحني عونك يا سيدي. إن كان فخك يفتح سبيلا إلى الحرية لي ولحشرات أرضك، فقد أختار حقا تفعيله.<hpage>ما العمل الذي تطلبه مني الآن كي تكتمل خدمتك؟<page>ستحتاجين إلى البحث عن قوة عائلتي يا قارعة الجرس: نحن الحشرات الثلاث العجائز الباقية، المتفرقة في أنحاء المملكة، وتلك الروح الحزينة التي تحملينها بالفعل، وهي آخر ما بقي من ابن عمي المسكين الذي مات واستنزف في تلك المستنقعات العفنة.<page>يمتلك كل فرد من عائلتي قوة خاما ووحشية. وسيمنحونك إياها، إما بدافع افتتانهم بما تفعلين، أو نشوة التحدي... أو لأنهم لا يملكون خيارا."
CARETAKER_LACE_DEFEATED: "<hpage>يا سيدي، فتحت الطريق فوق هذه القاعات وهزمت الفارسة البيضاء التي كانت تحرسه.<hpage>زعمت في النهاية أنها ابنة الحاكمة، وكانت صَدَفتها تؤيد قولها؛ فهي كائن ولد من حرير محكم النسج وحده.<hpage>إمكان صنع شيء كهذا... رأيت من قبل حياة تنسج من حرير، لكنها كانت ضئيلة وعابرة... ولم أر شيئا كهذا أبدا...<page>نعم يا قارعة الجرس! لقد قتلت أعجوبة بحق... أعجوبة معيبة على الأقل.<page>كان من الأفضل لنا نحن الفانين أن نبتعد عنها. لها هيئة طفل وعقل طفل، لكنها جابت هذه القلعة مدة أطول من معظم الحشرات، حتى خلال صمتها الطويل، قبل مجيئك وإثارتك غضبها بزمن بعيد.<page>لعلها رأت نفسها حامية لهذا المكان، فأبقته نظيفا وهادئا. لكن الهدوء عندها كان يعني أن معظم من يعبرون طريقها يلقون نهاية مؤلمة بدبوسها.<page>كنت سأشكرك على قتلها، لكن مع استيقاظ كل الهياكل الأخرى واستشاطتها غضبا، لم تتحسن فرص نجاة أي حشرة كثيرا."
CITY_MERCHANT_MEET: "مرحبا مجددا يا عزيزتي. يبدو أننا وصلنا كلتانا إلى هنا سالمتين كما قيل. ويا لها من مفاجأة أن أجدك صادقة بشأن هذا المكان!<page>مستوطنة كهذه داخل القلعة، جميلة وآمنة، تؤوي كل هذا العدد من الحشرات التي ما زالت عقولها سليمة! لم أر مثلها قط، بل لم أتخيل وجودها.<page>وهذا يسهل علي كثيرا بيع كل قطعي وحليي الجميلة. ففي النهاية، أريد أن آخذ معي الكثير والكثير من المَسابح حين تخور قواي أخيرا!"
