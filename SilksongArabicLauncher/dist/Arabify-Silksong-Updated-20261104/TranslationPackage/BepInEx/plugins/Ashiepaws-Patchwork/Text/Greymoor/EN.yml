HH_BARTENDER_NECTAR_PROMPT: "شراء الرحيق المعتق؟"
HH_BARTENDER_GREET_ACT3: "أهلا أيتها المسافرة! بعد أن ضربت هذه الأحداث المشؤومة الأراضي في الخارج، يسرني أن أرى من لا يزال على قيد الحياة.<hpage>هذه اللعنة الجديدة تهدد حتى صدفتي المقواة. ولأجل سلامتك يا صاحب الحانة، أنصحك بشدة أن تبقى داخل جدرانك.<page>حسنا، يمكنك فعل الشيء نفسه. ابقي هنا واغسلي همومك ببضعة أجراس من الرحيق... لكن بالنظر إلى شدة تلك الزلازل، أظن أن الأمر سيتطلب أكثر من بضعة أجراس."
HH_BARTENDER_CURSED: "يا إلهي. تبدين في حال سيئة يا آنسة. أظن أن إصلاح حالك سيتطلب أكثر من رحيقي.<hpage>التوى طفيلي من أرضك داخل صدفتي، ويسبب لي بعض الألم بحركاته المتواصلة.<hpage>لولا بنيتي الفريدة، لأكلني كله على الأرجح.<page>لا تجلبي أمورا خطرة كهذه إلى هنا! توجهي إلى قمة المستنقع. هناك طبيبة عجوز تختبئ داخل جرسها.<page>يقال إن علاجاتها كثيرا ما تؤلم أكثر مما تنفع، لكن حالتك تستحق المخاطرة في رأيي."
HH_BARTENDER_NECTAR_OFFER: "<hpage>يا صاحب الحانة، كلفت بالحصول على رحيق عتيق جدا. هل تحتفظ بشراب كهذا؟<page>تريدين أجود ما لدي، أليس كذلك؟ نعم، ربما بقيت لدي بضعة أوعية، لكنني لا أستطيع بيعها بثمن زهيد.<page>الأصداف الموجودة في قبوي هي آخر ما بقي في فارلوم. وحين تنفد، لن تتذوق أي حشرة مثل هذه الحلاوة مجددا."
HH_BARTENDER_DRINK_DECLINED: "<hpage>ربما في وقت آخر. من بين هبات مولدي القليلة أنني قلما أحتاج إلى الغذاء.<page>أحقا؟ حسنا، سيبقى الرحيق متاحا إن تغير شعورك."
HH_BARTENDER_NECTAR_REOFFER: "<page>هل أعدت التفكير في الرحيق المعتق؟<page>قد يبدو سعري مرتفعا، لكنني أؤكد لك أن الحشرات الراقية القليلة التي مرت من هنا كانت تدفع أكثر بكثير."
HH_BARTENDER_OFFER_REPEAT: "ألا يمكنك إعادة النظر في حل مشكلة حشرات الكرو الملعونة؟ سأكافئك مكافأة عادلة على جهودك."
HH_BARTENDER_OFFER_QUEST: "أيتها المسافرة، لا أريد إثقالك، لكن لدي أمنية تستطيع حشرة ماهرة مثلك تحقيقها على الأرجح.<hpage>لدي مهمة تخصني يا سيدي الكريم، لكنني سأستمع إليك.<page>المشكلة هي حشرات الكرو الملعونة في الأعلى. سقفي يتحول سريعا إلى عش مريح لها! وقد ازدادت جرأة حتى بدأت تهاجم الحُجّاج المارين.<hpage>أتريد مني قتلها فحسب؟ إن كان الأمر كذلك، فتبدو صَدَفتك المتينة قادرة تماما على هذه المهمة.<page>ليت الأمر بهذه البساطة. اقتلي الموجودة في الأعلى، وستواصل المزيد منها القدوم. دفء هذا المنزل هو السبب، فهو يجذبها مباشرة.<page>أبحث عن حل دائم. فزاعة للكرو! سأبني أكبر فزاعة عرفتها فارلوم، وستكون مخيفة بما يكفي لإبعاد تلك الحشرات إلى الأبد!"
HH_PATRON_LEFT_TALK_1: "من حسن حظنا أن وجدنا هذا المكان، أليس كذلك يا أختي؟<page>كان الصعود أصعب حتى من أسوأ توقعاتي، لكن ما زال في هذه الأطراف العجوز بعض النشاط. وقد تضاعف الآن بعدما ملأت بطني بالرحيق!"
HH_BARTENDER_REPEAT: "أتودين شرابا أيتها المسافرة؟ لرحيقي قوة تدفئ صَدَفتك في هذه الأجواء المبتلة."
HH_PATRON_RIGHT_TALK_1: "مرحبا... يا أختي! أجلس هنا منحنيا رث الحال، بينما تبدين نضرة كما كنت يوم فقست!<page>كيف تحافظين على هذه الحال في تلك الأراضي الغارقة والخطرة؟ لعل لديك سرا تشاركينني به؟<hpage>ليس لدي ما يقدم عونا سهلا يا صاحب الصدفة الطيب. وأيا كان الحظ أو الذكاء الذي أوصلك إلى هنا، فليصحبك في بقية رحلتك."
HH_BARTENDER_NECTAR_DECLINE: "<hpage>لا يمكنني الآن دفع هذا العدد الكبير من المَسابح يا صاحب الحانة.<page>كما تشائين. لعل جرعة من الشراب الرخيص تناسبك أكثر؟ ستمنح صَدَفتك دفعة قبل خروجك إلى أراضينا المنكوبة."
HH_BARTENDER_BELLHARTHAUNTED: "<hpage>مررت في رحلاتي ببلدة قرب مستنقعكم، قائمة داخل عرق من الأجراس القديمة. وقد قيد سكانها خيط خبيث.<page>آه. إذن شدت لعنة فارلوم وثاقهم. يا له من أمر مفزع. فقد انقطعت أخبار ناحيتهم منذ زمن بعيد.<hpage>أنصحك بتحذير روادك يا صاحب الحانة. إن كانوا يسلكون الطرق المحاذية للأجراس، فمن الأفضل أن يبتعدوا كثيرا عن ذلك المكان.<page>نعم، سأخبرهم أيتها المسافرة، لكن هل بقي أي طريق آمن في هذه الأزمنة الملعونة؟"
HH_BARTENDER_CURSED_REPEAT: "سارعي إلى زيارة تلك الطبيبة يا آنسة! ستجدينها عند قمة المستنقع، في ناحية عرق الأجراس.<page>قد تكون أساليبها موضع شك، لكنك تبدين في أمس الحاجة إلى العلاج."
HH_PATRON_LEFT_TALK_REPEAT: "احتجت إلى بعض الوقت لأجمع شجاعتي، لكنني أشعر بها أقرب الآن... القلعة تناديني إلى الأعلى."
HH_BARTENDER_QUEST_COMPLETE: "<hpage>إليك راغبيلت يا سيدي. آمل أن تكون هذه الكمية كافية لعملك.<page>نعم، ينبغي أن تكفي. حالما أجد وقتا هادئا، سأبدأ مباشرة في بناء فزاعة الكرو العظيمة.<page>بقليل من الحظ، سيخلو سقفي من تلك الآفات حين تمرين من هنا مجددا. شكرا جزيلا أيتها المسافرة!"
HH_BARTENDER_QUEST_ACTIVE: "إن كنت تجمعين راغبيلت من حشرات الكرو، فلن تحصلي إلا على القليل من تلك الصغيرة فوقنا. عليك بالحشرات الناضجة قرب كومة الماء، فهي تسقط منه الكثير.<page>لكن ستحتاجين إلى إقناعها بحد سلاحك إن كنت تنوين فصل الجلد عن الحشرة..."
HH_BARTENDER_NECTAR_GOT: "عدت يا آنسة! سمعت بعض الضوضاء في الأسفل. أثق بأن كل شيء سار... حسنا؟<hpage><hpage>يا سيدي، يبدو أن قبوك يعاني مشكلة نمل. أفترض أن ذكرها حين أرسلتني إلى الأسفل قد سقط من ذاكرتك سهوا؟<page>آه... نعم، صحيح! حسنا، بفضل سلاحك وموهبتك وما إلى ذلك... لا شك أنها لم تسبب لك مشكلة، أليس كذلك؟ مهم.<page>وبالفعل! أرى أنك حصلت على جائزتك، وهكذا خرج كلانا رابحا من الصفقة!<page>استمتعي برحيقك يا آنسة. لن يتذوق أي حاجّ عادي قطرة بهذه الجودة."
HH_BARTENDER_DECLINE_QUEST: "آه، لا بأس أيتها المسافرة. من الواضح أن لديك مهامك الخاصة. سأتدبر أمري، لا شك."
HH_BARTENDER_QUEST_COMPLETE_2: "لدي مقابل أظن أنك ستحسنين استخدامه: عدة صياغة احتياطية.<page>كنت أحتفظ بها لشخص آخر، لكنه غاب منذ زمن طويل، وأعرف الآن أنه لن يعود."
HH_BARTENDER_QUEST_COMPLETE_3: "<hpage>شكرا لك يا سيدي. هذه صفقة تليق بعملي، وستغدو أدواتي أشد حدة."
HH_PATRON_RIGHT_TALK_REPEAT: "ستكف صَدَفتي المتألمة عن تعذيبي عندما أصل إلى القلعة. تقول الأغاني إن كل العلل تشفى بمجرد عبورنا البوابة الكبرى..."
HH_BARTENDER_NECTAR_ACCEPT: "نعم، إنها صفقة عادلة. ستجدين الرحيق العتيق في قاع القبو.<page>سأثق بأنك لن تأخذي سوى الوعاء المستحق لك. كنت سأجلبه بنفسي، لكن الصعود صار شاقا على صَدَفتي المتصلبة."
HH_BARTENDER_RUMOUR_1: "لم يعد يصل إلى منزلي إلا أولئك الحُجّاج القلائل الأقوى... أما البقية فتفتك بهم لعنة فارلوم. يا لهم من مساكين، تركوا يهيمون بلا غاية.<page>وأتساءل أحيانا... هل بقايا وعيهم هي التي تبقيهم سائرين، أم أنه شيء آخر تماما...؟"
HH_BARTENDER_RUMOUR_2: "قلب الجرس، وراء المستنقع، بلدة عظيمة كما سمعت أنها كانت يوما، وقلب الطريق كله، في وسط هذه الأراضي تماما.<page>أما الآن فقد تهدمت... وصار عرق الأجراس الهش يعج بالمخلوقات البغيضة. لم يبق في فارلوم مكان يستطيع الادعاء بأنه آمن."
HH_BARTENDER_RUMOUR_3: "هل زرت تلك الحظائر فوقنا يا آنسة؟ مكان مروع كان مخصصا لتربية اللحم أو شيء من ذلك. يقال إنها أقيمت لإبقاء حشرات المستنقع حية وقادرة على العمل...<page>استولى المس على ذلك المكان الملعون منذ زمن. والآن صار اللحم متوحشا وطليقا."
HH_BARTENDER_QUEST_CANCOMPLETE: "مرحبا بعودتك أيتها المسافرة. كيف سار جمع راغبيلت من حشرات الكرو الجرباء؟ بدأ صياحها وهديلها في الأعلى يزعجان روادي بشدة!"
HH_BARTENDER_DRINK_PROMPT: "شراء شراب؟"
HH_BARTENDER_QUEST_DECLINEPELTS: "ما زلت تحتفظين بها، إذن؟ لن أسألك عن السبب، لكنني سأكون ممتنا إن أعدت النظر."
HH_BARTENDER_NECTAR_PAID: "هل تنوين أخذ الرحيق المعتق؟ لقد دفعت كومة لا بأس بها من المَسابح ثمن الزجاجة، لذلك ظننت أنك تتوقين إلى امتلاكها.<page>ستجدين الرحيق العتيق في الأسفل، عند قاع القبو. سأبقي فتحة الأرضية مفتوحة لك، لكن أسرعي."
HH_BARTENDER_GREET: "ها! أهلا بك أيتها المسافرة. أتريدين شرابا أم راحة، أم كليهما؟<hpage>تحية طيبة يا صاحب الصدفة الكريم. دفء موقدك موضع ترحيب في هذه السهول المبتلة.<page>نعم، الصعود في هذه الأنحاء رطب. لم يكن يمر بي سابقا سوى الحُجّاج، لكن هذه أزمنة غريبة، وأنت لست حتى أغرب صَدَفة تتجول هنا.<page>مر من هنا محارب عجوز صاخب قبل مدة قصيرة وأثار ضجة كبيرة، والآن تقيم فتاة شابة في غرفتي العلوية.<page>ذكرت الفتاة أنها تبحث عن الماهرين مثلك. لعلك تزورينها إن لم تفعلي بعد؟"
HH_BARTENDER_ACCEPT_QUEST: "ممتاز، ممتاز! لنرعب حشرات الكرو الجرباء رعبا لن تنساه! ها!<page>كل ما أحتاج إليه هو بعض راغبيلت من حشرات الكرو نفسها. طارديها واجمعي جلودها، ثم أحضري إلي كومة كبيرة منها. وسأتولى الباقي!"
HH_BARTENDER_QUEST_ACTIVE_2: "كلما أسرعت في جمع راغبيلت كان ذلك أفضل. لا يمكنني السماح لتلك الآفات بقتل مزيد من النزلاء المحتملين.<page>فالعمل بطيء بما يكفي بالفعل، وإزالة الجثث ليست ممتعة إطلاقا."
HH_BARTENDER_REPEAT_ACT3: "أتريدين شرابا أيتها المسافرة؟ ربما اقتربت نهايتنا جميعا، فلا داعي للاقتصاد في الرحيق."
HH_BARTENDER_OFFER_QUEST_WISHWALL: "<hpage>يا صاحب الحانة، رأيت طلبك على جدار الأمنيات في بلدة الأجراس. ما المساعدة التي تطلبها؟<page>آه، ممتاز! أنت من أصحاب المهارة الذين سينجزون المهمة بسهولة.<page>المشكلة هي حشرات الكرو الملعونة في الأعلى. سقفي يتحول سريعا إلى عش مريح لها! وقد ازدادت جرأة حتى بدأت تهاجم الحُجّاج المارين.<hpage>أتريد مني قتلها فحسب؟ تبدو صَدَفتك المتينة قادرة تماما على هذه المهمة.<page>ليت الأمر بهذه البساطة. اقتلي الموجودة في الأعلى، وستواصل المزيد منها القدوم. دفء هذا المنزل هو السبب، فهو يجذبها مباشرة.<page>أبحث عن حل دائم. فزاعة للكرو! سأبني أكبر فزاعة عرفتها فارلوم، وستكون مخيفة بما يكفي لإبعاد تلك الحشرات إلى الأبد!<page>كل ما أحتاج إليه هو بعض راغبيلت من حشرات الكرو نفسها. طارديها واجمعي جلودها، ثم أحضري إلي كومة كبيرة منها. وسأتولى الباقي!"
