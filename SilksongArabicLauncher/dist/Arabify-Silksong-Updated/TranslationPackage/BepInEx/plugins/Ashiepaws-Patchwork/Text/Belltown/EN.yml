COURIER_SHOP_REPEAT_ACT3: "<page=S>أيتها الساعية! حشرات فارلوم تتمنى وتنتظر، وهي حزينة وخائفة. الطرود مطلوبة الآن أكثر من أي وقت مضى!"
RELIC_DEALER_RELICS_FIRST: "ولكن ما هذا؟! أشم شيئا معك الآن! لديك أثر قديم من أجلي!"
DOCTOR_CURSE_FIX_OFFER: "ها هي الأشواك! أيتها العينة، لقد أحضرتها! حان الوقت حقا! بززت! سأخلصك من عذابك المتلوي، وأظهر عبقريتي للجميع!"
SHOPKEEP_CURSED: "يا إلهي، ما أسوأ حالك! تبدين على بعد نفس واحد من السقوط ميتة!<hpage>سأظل حية، سيدتي، لكنني مصابة حقا. استقر طفيلي داخل صدفتي... ألديك ما قد يساعدني؟ دواء، ربما؟<page>همم، لا أظن أنني أبيع شيئا كهذا. اسألي بافو هناك. إرشاد الناس وما شابه عمله، ولعله يملك نصيحة مفيدة.<page>وفي هذه الأثناء... التسوق نوع من الدواء، أليس كذلك؟ ينبغي أن تشتري شيئا الآن. قد تكون هذه فرصتك الأخيرة، نظرا إلى حالتك!"
COURIER_SHOP_CURSED_TALK_1: "<page=S>آه! ما هذا؟ جسدك كله يلتوي ويصر! وحش مريع في داخلك! <hpage>استقر طفيلي في أعماق صدفتي. وقد احتجت إلى إرادة قوية لأكبح تخبطه.<page=T>بصدفة كهذه، لا يمكنك حمل أي طرود! ستنقلين العدوى إلى البضائع!<hpage>حسنا، أيها الساعيان. إن تمكنت بطريقة ما من إزالة الطفيلي، فقد أعود لأقدم المساعدة."
BELLHERMIT_MEET: "ماذا تريدين أيتها العبدة؟<hpage>عبدة؟ أنا مسافرة غريبة، ولست عبدة.<page>غرنك. هذا بالضبط ما قد تقوله عبدة. انصرفي!"
GREETER_REPEAT2_ACT3: "<hpage>سأهدئ هذه الفوضى قريبا يا بافو. أرجوك، احم هذه الحشرات حتى ذلك الحين.<page>بالطبع، يا ابنة البلدة العزيزة! بالطبع! ثقي بأن إيماننا وأمنياتنا كلها ترافقك."
SHOP_ITEM_ROSARYSTRING_M_DESC: "ستفر المسبحات المفكوكة من جيوبك في أسوأ الأوقات، ومخلبي بارع في نظمها بإحكام! يمكنني أن أنظم لك عقدا كاملا، آمنا وأنيقا."
COURIER_SHORT_QUEST_ACCEPTED: "<hpage>قبلت أمنيتك يا تيب. إن وجدت أخاك سالما، فسأحرص على إعادته إلى هنا.<page>شكرا جزيلا أيتها المنقذة! أنت شجاعة، شجاعة مثل أخي! إيماننا كله يرافقك!"
PINSMITH_QUEST_REPEAT: "في الأعلى، داخل القلعة، ينتظر الزيت الأسطوري. قدميه إلى صانع الدبابيس البارع هذا، وسيغني نصلك بصوت أعلى.<hpage>سأجد الزيت يا صانع الدبابيس. حافظ على حدة مهارتك."
DOCTOR_CURSE_OFFER: "ماذا الآن؟ هل أصابك طفيلي، بززت؟<page>ألا تعرفين من أكون؟ أنا يارنابي العظيمة، الطبيبة العبقرية المنبوذة ظلما، وها أنا أقف شامخة أمامك!<hpage>أعتذر عن مقاطعة عملك، لكن إن كنت الطبيبة الماهرة التي تزعمينها، فأطلب مساعدتك.<hpage>تسلل طفيلي إلى داخلي. تلتف جذوره وتشد داخل صدفتي، وتستنزف قوتي. إن كنت تملكين المهارة والأدوات، فأريدك أن تزيليه.<page>بززت! حسنا، حسنا! إذن أنت عينة مريضة ومميزة؟! هذا يغير الأمر، نعم. يقلبه رأسا على عقب!<page>دعيني أرى. همم. لست ممسوسة حقا، ولا تعانين داء الحرير. لكن شيئا غريبا شق طريقه إلى داخلك بالتأكيد!<page>أما هذه «الجذور» التي تعذبك... فلا أعرفها تماما، لكن لا أهمية لذلك!<page>عندما يوجد شيء بشع داخل صدفة ولا بد من إخراجه، نستخدم إكستريكاتور يارنابي العظيم! إنه أملك الوحيد، بززت!<page>...همم، لكننا سنحتاج أولا إلى قوة إضافية لكسر صدفتك الصلبة. يمكن علاجك، نعم! لكن إكستريكاتور العظيم يحتاج إلى ترقية قبل ذلك!"
SHOP_ITEM_SHARD_POUCH: "ينبغي للمسافرين أن يحتفظوا دائما ببعض الشظايا الإضافية. كنا نحن أهل قلب الجرس مشهورين ببراعة مخالبنا. فن فقده معظم الحجاج المعاصرين... إلا أنت بالطبع."
BELLHERMIT_SAVED_3: "يا لك من دودة صغيرة عنيدة. أمتعيني إذن. لماذا خلصت تلك الحشرات المسكينة من لعنتها المريحة؟<hpage>كانت في المخلوق الذي يقود الخيط قوة قديمة وموهبة من الحرير استوليت عليها الآن، وستفيدني كثيرا.<hpage>كما أن تحرير البلدة وعودة خدماتها أمر نافع. كثيرا ما أشعر أنني منفصلة عن هذه الحشرات، لكن حتى أنا أشمئز من رؤية الحرير مسخرا لخدمة مقززة كهذه.<page>غرنك. لم يكن تحريرهم معروفا أسديته إليهم. لكن جمع القوة... في هذا الهدف قد نفهم بعضنا بعضا."
RELIC_DEALER_RELICS: "آه... أشم شيئا معك. أنت مثقلة بالماضي. لديك أثر قديم من أجلي، أليس كذلك؟"
PINSMITH_QUEST_OFFER: "<hpage>مهاراتك مبهرة. إبرتي تغني بفضل عنايتك. لكن علي أن أسأل: هل يمكن زيادة حدة النصل؟<page>أتريدين شحذا أشد؟ أشد مما يقدمه بليني؟ يا لها من وقاحة! لكن... ربما؟ ولكن... لا...<hpage>أنت متردد. أهذا يعني أنه ممكن؟ أم أنك عاجز؟ هل أبحث عن غيرك في المملكة؟<page>انتظري! نعم. لا تبحثي عن غيري، بل ابحثي عن زيت أسطوري فاخر. كانت القلعة تستخدمه لتمنح دبابيسها حدا ورأسا لامعين.<page>رغم رحيل صانعي الدبابيس في القلعة منذ زمن، فقد تبقى شيء يسير من ذلك الإكسير العجيب في قاعاتها.<page>لو سرقت قطرة ضئيلة منه وقدمتها إلى بليني، لأمكن أن يزداد نصلك بريقا...<page>لكن اعلمي يا صديقتي العزيزة أن الحشرات المحجبة لن ترحم من يسرق تلك الجائزة النفيسة لنفسه."
SHOP_ITEM_TOOL_POUCH_DESC: "ألديك حقيبة أدوات؟ يمكنني إضافة بعض الجيوب لتحملي أدوات أكثر وشظايا أكثر لصنعها. مهارتي في الخياطة مشهورة جدا في هذه الأنحاء."
COURIER_SHOP_MEET: "<page=S>أيتها المنقذة! اجتمعنا أخيرا! عدت أنا وأخي كلانا إلى الأمان.<hpage>يسرني أنكما وجدتما بعضكما. إن كنتما تخططان للخروج مجددا، فأحثكما على إعادة النظر حفاظا على صدفتيكما.<page=S>نعرف ذلك! نعرفه جيدا! لن نغادر دار الأجراس هذه بعد الآن! سنبقى هنا كي تنجو صدفتانا. <page=T>لكننا وضعنا معا خطة ذكية! نعم، نعم. لعل الحجاج العابرين يساعدوننا، لقاء مكافأة صغيرة مما لدينا؟<page=T>حتى أنت أيتها المنقذة! نعم، نعم! انتهى الإنقاذ، والآن نطلب أمنياتنا. حان وقت الساعية!"
PINSMITH_QUEST_REOFFER: "الزيت الأسطوري الخاص بمهنتي مفقود في ذلك الحصن فوقنا... يا للحدة التي يمكن بلوغها...<page>لكن ما أفظع الأمر! ستواجهين في البحث عنه دبابيس طاعنة كثيرة وقاسية."
SHOPKEEP_PAINT_POST: "أحرزنا بداية جيدة في الطلاء يا ابنة البلدة! امنحينا مزيدا من الوقت، وسيلمع جرسك كأنه جديد."
BELLHERMIT_SNARE: "همف... إذن جاءت العبدة تطلب شيئا؟<page>سمعت بالأمر. تتمنين عالما تحرر من قيوده، صحيح؟ ومعك ابن أخي هناك. يبدو أنه صار ساذجا مثلك.<hpage>أما زلت ترفض تقديم العون؟ يتطلب الفخ الذي يخطط له قوة، وأظنك تدخر منها أكثر من معظم الحشرات.<page>لا، سأقدمها. ليس أملا في نجاحك... باه! ففرصتك في ذلك ضئيلة. أقدمها لمجرد رؤية تلك الطاقة المضطربة تنطلق.<page>كل هذه الأرواح التي وجدت وتشكلت عبر أجيال ستذهب سدى. من الأفضل أن تحظى بفرصة لتشتعل."
DOCTOR_DOOR_INSPECT: "دار جرسية مقفلة.<br>هل تنادين من بالداخل؟"
DOCTOR_LIFEBLOOD_STATE: "<hpage>سيدتي، استولت قوة غريبة على صدفتي. وتسمى في أرضك بلازميوم.<hpage>رغم أن هذه المادة تساعد جسدي على التجدد، أشعر بأن عقلي معرض لخطر الاستيلاء عليه.<page>بززت! لعل الاستيلاء عليه أمر جيد؟ بل أفضل؟ لماذا تظنين أن عقلك ثمين إلى هذا الحد؟<page>يارنابي العظيمة تعالج المرضى، لا من ينتفعون من عللهم. استمتعي بفائدتها ودعيني وشأني!"
RELIC_DEALER_MEET_ACT3: "ماذا؟ ماذا الآن؟ ما مصدر هذا الضجيج الهائل؟ ماذا يحدث؟<hpage>تحياتي، سيدتي. إن كان تمزق هذه الأراضي قد أزعجك، فأخشى أنني أتحمل بعض اللوم.<page>باه. لا أبالي ببؤس من في الخارج وصراعاتهم! لا أحد منهم يملك حسي الحاد أو احترامي للماضي!<page>لكنك تبدين مقتدرة، ومتسللة بارعة أيضا. إن وجدت أي شيء قديم ونفيس، أي شيء له تاريخ، فأحضريه إلي. سآخذه."
COURIER_SHOP_INPROGRESS_1: "<page=S>احذري أيتها الساعية! أنت وطرودك كلاكما عرضة للأذى!"
COURIER_SHOP_INPROGRESS_3: "<page=T>لا تنتظري أيتها الساعية! تحملين الطرود، لذا عليك الانطلاق الآن! يجب أن تصبحي حشرة سريعة جدا."
COURIER_SHORT_GOURMAND_HINT: "<hpage>يا تيب، وعدت حشرة مسنة من القلعة بتحقيق أمنيتها وجمع مكونات طبق يثير شهية أحد الذواقة.<hpage>هل تملك بين أغراضك كورييرز راشر؟ يبدو أنه مكون أساسي.<page>كورييرز راشر! ليس معي أيتها المنقذة! الطعام الدسم كريه الرائحة يناسب معظم الحشرات، لكنه لا يناسب معدتي الحساسة!<page>تريدين أخي بيل! بيل ضخم ويحب شرائح اللحم! يمكنه إعدادها طازجة لك، لكن يجب أولا العثور عليه وإنقاذه وإعادته سالما!"
DOCTOR_CLOSED_QUEST_END: "بززت! ماذا الآن؟! هل من إزعاج آخر ليارنابي العظيمة؟<hpage>سيدتي، عدت ومعي الأشواك التي طلبتها. دعيني أدخل كي تزيلي هذا الطفيلي من صدفتي."
PINSMITH_UPGRADE_PROMPT: "شحذ الإبرة؟"
PINSMITH_UPGRADED_COMPLETE: "هذا النصل! بحق المخلب! إنه أفضل أعمالي على الإطلاق. قد تكون فارلوم عليلة، لكن إبرتك ستسطع وسط ظلامها الكئيب."
SHOP_ITEM_FURNISHING_SPA_DESC: "هل تودين الانتعاش في حمام بخاري ساخن؟ أنا واثقة بأن صدفتك ستشكرك عليه بعد كل جهودك الشاقة."
SHOP_ITEM_FURNISHING_LIGHTS_DESC: "كرات مربوطة بالخيوط ومملوءة بالذباب المتوهج. ستنير حتى أحلك الأجراس."
COURIER_SHOP_BEGIN_DUSTPENSSLAVE_RETRY: "<page=S>بيضة أخرى. ملكة أخرى مقززة تأكل كثيرا. يجب إيصالها إلى المخلوق الضخم وراء الصراصير. لعل هذه تصل بأمان أكثر من سابقتها؟"
DOCTOR_SLAP_PRE: "أيتها العينة، لا بد أن نتابع! ثمة أسرار يجب كشفها، بززت! لا يمكن إيقاف التقدم!"
COURIER_SHOP_CURSED_REPEAT: "<page=T>وصدفتك تتلوى هكذا، لا يمكنك حمل أي طرود! ستنقلين العدوى إلى البضائع!<hpage>حسنا، أيها الساعيان. إن تمكنت بطريقة ما من إزالة الطفيلي، فقد أعود لأقدم المساعدة."
DOCTOR_CURSE_ACCEPT: "بززت! أحسنت! أخيرا عينة تدرك عبقريتي!<page>مهمتك بسيطة. توجهي إلى تلك المتاهة المتشابكة من الأقفاص، عند الطرق الواقعة فوق المستنقعات.<page>تختبئ هناك حشرتان، بنجين وكرول. إنهما ساذجان يجهلان الكثير... لكنهما أفاداني في جلب المواد.<page>أحتاج إلى الأشواك الفولاذية. حزمة كاملة منها، صلبة وحادة بفعل الصياغة. أقوى من أي أشواك حصلت عليها من قبل. قوية بما يكفي لكسر الحجر وثقب صدفتك السميكة، بززت!<hpage>إذن جهزي آلتك لعودتي، سيدتي. سأعود قريبا بالأشواك، فأنا متلهفة إلى تحرير نفسي."
SHOP_ITEM_FURNISHING_DESK_NAME: "مكتب"
PINSMITH_QUEST_ACCEPT: "<hpage>سأجد الزيت يا صانع الدبابيس. استعملت إبرتي كثيرا في هذه المملكة القاسية، وأظن أن معارك كثيرة أخرى تنتظرني. وسأقدر كل ما تضيفه مهارتك إلى نصلي. <page>إنها رغبة خطرة قبلتها من صانع الدبابيس المسكين هذا. أرجو بشدة ألا تكلفك رغبتي المهنية حياتك."
BELLHERMIT_CURSED_REPEAT: "إن كنت مصرة على النجاة من الطفيلي، فابحثي عن يارنابي الصغيرة المنفية من قلب الجرس. حسب آخر ما سمعته، طردوها إلى مكان مرتفع في المستنقع الرمادي."
BELLHERMIT_REPEAT: "لن أهدر مزيدا من الكلام على عبدة. انصرفي."
COURIER_SHOP_BEGIN_FIXER_RETRY: "<page=T>مزيد من الطرود لأولئك الناجين الحزانى في كهفهم بالأسفل. <page=S>أوصليها بسرعة كبيرة أيتها الساعية! ستفيدهم كثيرا."
GREETER_TWISTED_BUD_HINT: "ما هذه الصرخة التي تحملينها يا أختي؟ إنها نحيب مر لكيان رمادي مشوه.<hpage>أتقصد البرعم؟ إنه غامض حقا. سمعت عويله الحزين في المستنقعات الرطبة فوق المستنقع الرمادي، فتتبعت الصوت ووجدته ساكنا هناك... وكأنه ينتظر.<hpage>لكنك تصفين شكله من دون أن تريه معي. أتعرفينه؟... هل سمعت هذه الصرخات من قبل؟<page>نعم، نعم! ليست العينة نفسها التي معك بالتأكيد، لكن مسافرين آخرين حملوا أشياء مشابهة منذ زمن بعيد. كانوا جميعا غريبي الأطوار. أطلقوا على الأشياء الباكية اسم القرابين، وساروا بها نحو قلب غابة الأصداف.<page>لم أر أيا منهم ثانية، لا البراعم ولا الحشرات التي حملت تلك الهدايا...<page>إن كنت تنوين السير في طريقهم، فسأدعو لك بالسلامة، لكن سماع تلك الأصوات الحزينة بعد هذا الزمن الطويل نذير سوء."
RELIC_DEALER_MEET: "ماذا؟ ماذا؟ من هناك؟ ماذا معك؟ ماذا تريدين؟<hpage>أنا مجرد مسافرة، وكنت آمل ألا تكوني قد تأذيت كثيرا من الفخ الملعون الذي نصب لهذه البلدة.<page>باه! لا يعنيني ما يقيدهم في الخارج. لا أحد منهم يملك حسي الحاد أو احترامي للماضي!<page>لكنك تبدين مقتدرة، ومتسللة بارعة أيضا. إن وجدت أي شيء قديم ونفيس، أي شيء له تاريخ، فأحضريه إلي. سآخذه."
PINSMITH_QUEST_COMPLETED: "والآن، على صانع الدبابيس أن يعمل! ليبدأ الشحذ!"
BELLHERMIT_SAVED_1_ALT: "همف. عاد الضجيج من الأعلى، ذلك الصخب المثير للشفقة. قطعت الخيوط.<page>أنت... أنت من قطعها. لا تنكري ذلك!<hpage>ولماذا أنكره يا سيدي؟ هزمت المخلوق القاسي فوق البلدة، وأيقظت الجرس القديم الذي أسكته الحرير. أأنت ساخط؟<page>ساخط! ما دمت أتنفس وأعيش فأنا ساخط. الموتى وحدهم راضون.<page>أنت عبدة ومصدر إزعاج... انصرفي."
GREETER_TALK1_ACT3: "يا ابنة البلدة! يا لك من أعجوبة، تواصلين تحدي البراري والظلام ثم تعودين إلينا سالمة.<hpage>عدت بأمل يستحق أن نتشاركه يا بافو. رأيت سبيلا لتهدئة هذه الفوضى، وأعمل الآن مسرعة لتحقيقه.<hpage>لا تزال فرصة النجاح ضئيلة، لكن إن صمدت هذه البلدة ونجحت جهودي، فقد يبقى لفارلوم مستقبل."
SHOP_ITEM_FURNISHING_GRAMAPHONE_DESC: "صنعت القلعة آلات رائعة، ويبدو أن هذه من أفضلها! ويقال إن زاحفا مخيفا يختبئ في الأعلى أرسلها كي تباع لك وحدك!"
RELIC_DEALER_EMPTY: "جمع آثار الماضي هو رسالتي. إن وجدت أي شيء قديم ونفيس، أي شيء له تاريخ، فأحضريه إلي. سآخذه."
COURIER_SHOP_NOTACCEPTED: "<hpage>لا أستطيع مساعدتكما، أيها الساعيان. ليس الآن. مهامي ملحة جدا، ولا يمكنني تولي طرودكما. <hpage>لعل بعض الحجاج يمرون بعقول سليمة وشيء من القوة. وقد يختارون الوعد بتحقيق أمنياتكما.<page=T>إذن سندعو أن يأتوا أيتها المنقذة! ومع ذلك، يرافقك شكرنا الجزيل."
BELLHERMIT_SAVED_1: "همف. عاد الضجيج من الأعلى، ذلك الصخب المثير للشفقة. قطعت الخيوط.<page>أنت... أنت من قطعها. لا تنكري ذلك!<hpage>ولماذا أنكره يا سيدي؟ قطعت الخيط وهزمت المخلوق الذي كان يقود اللعنة المفروضة على البلدة. أأنت ساخط؟<page>ساخط! ما دمت أتنفس وأعيش فأنا ساخط. الموتى وحدهم راضون.<page>أنت عبدة ومصدر إزعاج... انصرفي."
COURIER_SHOP_BEGIN_FLEATOPIA: "<page=T>سمعنا الخبر! اجتمعت براغيث كثيرة واستقرت في أعالي فارلوم، وهي تنادينا طالبة ما تريد!<page=T>البراغيث حفارات ذكية، لكنها تحتاج أيضا إلى طرودنا. لبي طلبها أيتها الساعية! من الجيد دائما نيل امتنان البراغيث."
SHOPKEEP_MEET_ALT: "<hpage>تحياتي. كنت أود التجارة، لكن متجرك يبدو خاويا بعض الشيء.<page>أحم! نعم، صحيح. مرت بلدتنا الصغيرة بأوقات عصيبة، ثم خرج رسولي وضل طريقه.<page>لكن لا تقلقي! لا تزال لدي بعض الأشياء الصغيرة! وإن عاد ذلك الرسول سالما يوما، فسيكون لدينا مزيد من الكنوز للمساومة عليها."
DOCTOR_LIFEBLOOD_STATE_REPEAT: "بززت! دعيني وشأني! يارنابي العظيمة تعالج المرضى، لا من ينتفعون من عللهم. استمتعي بفائدتها ودعيني وشأني!<hpage>حسنا، سيدتي. لم أقصد إضاعة وقتك."
PINSMITH_UPGRADE_FINISHED: "بونفا! تم الأمر أيتها المحاربة الشجاعة. منح مخلبي الخبير نصلك الغريب شحذا سريعا وبريقا حادا. وسيقطع الآن بدقة أكبر من أي وقت مضى.<hpage>جهودك عون كبير يا صانع الدبابيس. لك شكري."
COURIER_SHOP_MEET_ACT3: "<page=T>أيتها الساعية! يا لهول ما يحدث هنا! الكهوف تهتز وتهتز، وتصرخ من ألم إصابة قاسية.<page=T>وانظري إلى أصدقائنا المساكين في الأسفل، وجدناهم حديثا وهم مزدحمون داخل دار الأجراس هذه، وقلوبهم تخفق خوفا.<page=S>وماذا عنك أنت؟ جئت للمساعدة، نعم؟ الحاجة إلى الطرود أشد الآن! عندما تظلم الكهوف، تصبح الطرود ضرورية أكثر من أي وقت مضى."
COURIER_SHOP_BROKEN: "<page=T>الشحنات! تحطمت كلها! ضاعت وتبعثرت!<page=T>لا تفقدي حماسك يا آنسة البريد! هذه فارلوم، والخطر فيها قاتل. في أزمنة كهذه، قلما تصل البضائع إلى وجهتها.<page=S>أتحاولين مرة أخرى؟ من أجل الحشرات التي تحتاج بشدة إلى شحناتها؟"
BELLHERMIT_SAVED_2: "تلك الحشرات القابعة بخوف داخل أجراسها البراقة. غرنك. تزعم أن لها رسالة مشتركة، وهي خدمة الحجاج في طريق صعودهم.<page>ما أعظم الدور الذي منحته لنفسها، ولا شك أنه جدير بالثناء!<page>إنها كذبة جميلة بالطبع. فهي، مثل أسلافها، أضعف وأخوف من أن تغامر بالتقدم أكثر. مستوطنة ولدت من الكسل."
SHOPKEEP_MEET_ACCEPTEDWISH: "<hpage>كان من الحكمة أن يفعل ذلك. إن صادفت في أسفاري تلك الحشرة الشاردة، فسأحرص على إرسالها إليك."
PINSMITH_BELLTOWN_MEET_OFFER: "بحق المخلب! أأنت منقذتنا ذات الصدفة؟ تقفين بكل هذا الهدوء عند مدخل منزل جرس بليني!<hpage>أي دليل يا سيدي يشير إلى دوري في تحرير بلدتكم؟<page>نصلك يا أيتها المحاربة الشرسة! يدرك كل صانع إبر بارع آثار العمل القاتل على حد تلك الإبرة.<page>لعنة خبيثة أصابت هذا المكان. ما كان لحشرة عادية ولا لدبوس بسيط أن يحررنا. لا!<page>أما ذلك النصل الذي تقبضين عليه بمثل هذه البراعة، فكان جديرا بالمهمة. أنت من حررتنا، أليس كذلك؟<hpage>أقر بحدة بصرك يا صانع الإبر، وكان إنقاذكم مصادفة موفقة. وهذا النصل الذي أعاد بلدتكم إلى الحياة يحتاج الآن إلى خدمتك.<page>نعم، بكل سرور! لدي الكثير من الإبر التي تنتظر عنايتي، لكن بطولتك الكريمة تقضي بأن يحظى سلاحك الفريد برعايتي هذه اللحظة! أتسمحين لي بإلقاء نظرة؟"
RELIC_DEALER_POSTWINDOW: "المزيد إذن! أحضروا إلي المزيد من آثار الماضي! السجلات والأختام والأصنام! لنجمع تاريخ العالم ونكدسه كله هنا، آمنا ومحفوظا!"
COURIER_SHOP_REPEAT: "<page=S>لا تزال شحنات كثيرة بحاجة إلى الإيصال يا آنسة البريد! نحن في أمس الحاجة إلى مساعدتك متى كنت مستعدة لتقديمها!"
PINSMITH_QUEST_UPGRADED: "تم الأمر! يا لها من أعجوبة من فارلوم! انظري كيف يلمع نصلك الطويل البديع. هافاست! كانت كل إبر أرضنا تحمل مثل هذا البريق يوما. كم خسرنا...<hpage>هذه خدمة متقنة يا صانع الإبر. مضى زمن طويل منذ رأيت إبرتي على هذه الحال. كنت قد نسيت دقة صنعها.<page>نعم، هذا مؤكد! نصلك أدق صنعا من معظم الأنصال، وهو من القلة التي قد تحتمل مزيدا من الشحذ.<page>إن عثرت في طريقك الطويل على مزيد من الزيت، فأسرعي إلى طلب خدمتي! من يدري أي صورة يمكن أن نكشفها في أعماق فولاذ سلاحك المصقول!"
COURIER_SHOP_NOTACCEPTED_REPEAT: "<hpage>لا أستطيع مساعدتكم الآن أيها السعاة. فمهامي الخاصة أكثر إلحاحا.<page=T>إذن سنرجو أن تنجزيها قريبا! إن لم تصل الشحنات، فستعاني حشرات فارلوم كثيرا!"
PINSMITH_BELLTOWN_POST_SAVED: "<hpage>يسرني أن أراك عدت يا صانع الإبر. تعج الطرق بين هنا والقبر في قلب تلك الغابة العميقة بأعداء عنيفين. كنت قلقة على سلامتك.<page>يا أيتها المحاربة الشجاعة، يا منقذتي! كانت رحلة العودة مخيفة حقا، لكنني الآن آمن! ويسرني كثيرا أن أراك أنت أيضا، فقد ازداد العالم ظلمة بالفعل!<page>في أزمنة كهذه، تكون مهمة صانع الإبر واضحة: التلميع والشحذ والتحسين، حتى يشق وميض نصلك الظلمة الزاحفة!"
COURIER_SHOP_BEGIN_DUSTPENSSLAVE: "<page=S>تلقينا طلبات كثيرة لهذا: بيضة ملكة من آكلات الحرير. يريدها مخلوق ضخم لزج قرب أقفاص كثيرة مليئة بالصراصير. يريدها بشدة!<hpage>لقيت ذلك المخلوق، وهو خجول ومتملق. ومع ذلك، قد تفيدني عنايته بآكلات الحرير.<hpage>إن كان تسليم ملكة إليه سيحسن محصوله، فسأستفيد أنا أيضا من الصفقة.<page=S>آنسة البريد والمخلوق الضخم اللزج؟ أتحبان كلاكما هذه الأشياء المقززة؟ نظن أنكما غريبان جدا..."
COURIER_SHOP_FIRST_MEET_ACT3: "<page=T>يا منقذتنا! ظننا أننا بأمان بعد أن اجتمع الأخوان أخيرا، لكن الرعب وصل حتى إلى هنا! ترتج الكهوف وتصرخ من ألم جرح وحشي.<page=T>وانظري إلى أصدقائنا المساكين في الأسفل، الذين وجدناهم حديثا، متزاحمين داخل منزل الأجراس هذا وقلوبهم تخفق من الخوف.<page=S>لكن ماذا عنك؟ أنت هنا لتساعدي، نعم؟ الحاجة إلى الشحنات الآن أشد من أي وقت! لكن لكي تبقى أصدافنا سالمة، لا نستطيع مغادرة منزل الأجراس هذا بعد الآن. هنا يجب أن نبقى.<page=T>لكننا وضعنا معا خطة ذكية! نعم، نعم. لعل الأقوياء مثلك يساعدوننا لقاء مكافأة صغيرة مما نملك؟<page=S>نفدت مدخراتنا، وحل الظلام في الكهوف. الحاجة إلى الشحنات الآن ماسة. لقد حان وقت آنسة البريد!"
RELIC_DEALER_MEET_ALT: "ماذا؟ ماذا، ماذا؟ من هناك؟ ماذا تحملين؟ ماذا تريدين؟<hpage>أنا مسافرة فحسب. لكن هل لي أن أسأل ما العمل الذي يشغلك هنا؟<page>تسألين ما الذي يشغلني؟ الماضي! أصوات العصور الغابرة تكلمني من خلال ما خلفته وراءها.<page>أما أولئك في الخارج، أولئك الحجاج الكئيبون والحمقى المتزينون بالأجراس... فلا يملك أي منهم حسي المرهف ولا احترامي للماضي!<page>أما أنت فتبدين مقتدرة، وماكرة أيضا. إن وجدت أي مقتنيات قديمة نفيسة، أي شيء له تاريخ، فأحضريه إلى هنا. سآخذه."
GREETER_HOUSE_MID_TALK: "لم تمر مساعدتك المتواصلة لقلب الجرس دون تقدير يا آنسة المسافرة.<page>في هذه الأزمنة العصيبة، يندر أن تتحقق أي أمنية. أما أن تأتي كل هذه العناية من غريبة، فهذا لم نسمع بمثله قط!<hpage>رأيت حجم المعاناة التي حلت بفارلوم يا بافو. وأقر بأن تلبية هذه الطلبات قد لا تؤثر كثيرا في سببها... ومع ذلك، وجدتها مهمة جديرة بالعناء.<hpage>مساعدة الآخرين... ذلك الدفء الصغير، كدت أنساه."
RELIC_DEALER_NO_RELICS: "رسالتي هي جمع آثار الماضي. انظري إلى مجموعتي إن شئت! انظري، انظري!"
COURIER_SHOP_BEGIN_BONETOWNFIXER_RETRY: "<page=T>بضائع للمخيم عند السفح، حيث تبدأ رحلة الحجاج. نرجو بشدة أن تصل هذه الشحنة بسلام!"
COURIER_SHOP_INPROGRESS_2: "<page=S>معك البضائع يا آنسة البريد! لم يبق سوى إيصالها. لا تنتظري هنا!"
DOCTOR_CURSE_REPEAT: "انطلقي! توجهي إلى تلك الفوضى المتشابكة من الأقفاص، على الطرق فوق المستنقعات.<page>يستطيع بنجين وكرول بالتأكيد تدبير ما أحتاج إليه: حزمة كاملة من الأشواك القاسية الحادة!"
PINSMITH_UPGRADE_4_POST: "ذلك النصل! بحق المخلب! تم الأمر. صار أحد مما كان صانع الإبر هذا يظن أنه ممكن، ويلمع شاحبا صافيا.<page>بونفا! أيتها الغريبة، حققت أمنيتي ومنحتني فوقها المزيد. نصلك إنجاز يضاهي إنجازات عظماء صانعي الإبر في الماضي.<page>قد تكون فارلوم مريضة، لكن إبرتك ستسطع وسط ظلامها الكئيب."
RELIC_DEALER_DECLINE: "ماذا؟ ترفضين تسليمه؟ أي نفع تظنين أنه سيعود عليك؟!"
GREETER_REPEAT_ACT3: "<hpage>ابق آمنا يا بافو. أبق هؤلاء المساكين قريبين منك، واحفظ أرواحهم من الحزن.<page>لن يغادر أحد هذه الجدران أيتها المقيمة العزيزة، وسيظل الجميع موضع ترحيب. كل من يمكن إنقاذه.<page>خير لنا نحن الحشرات أن نبقى معا هنا، عند نهاية كل شيء."
PINSMITH_SAVED_REPEAT: "<hpage>ابق متيقظا في رحلة عودتك يا صانع الإبر. إن صادفت حشرات أخرى على الطريق، فأنصحك بتجنبها قدر استطاعتك."
DOCTOR_SLAP_POST: "آآخ! بززت! العالم يهاجمني من جديد!<page>لكن الألم... لا يعني شيئا ليارنابي!<page>لا شيء يستطيع ردعي عن عملي العظيم! ليس طويلا! يجب ألا يوقفني أحد!"
SHOP_ITEM_FURNISHING_PAINT_NAME: "طلاء الجرس"
COURIER_SHOP_BEGIN_FIXER: "<page=S>هذه وجهة جديدة! وهذه المؤن مطلوبة بإلحاح.<page=T>شحنات لأولئك الذين فروا من المخيم المنهار بجوار العظم، أولئك القلة الذين ما زالوا أحياء.<page=T>لا بد أن أولئك القلة يتألمون ويتضورون جوعا."
COURIER_SHOP_BEGIN_GOURMAND: "<page=T>إنها لك يا آنسة البريد! لحوم معدة طازجة تماما، بطريقتنا الخاصة.<page=T>يجب أن تعرف آنسة البريد! شريحتنا لذيذة، وهي طعام قوي ودسم، لكنها لا تدوم طويلا. إن لم تحفظ بسرعة، سرعان ما تفسد نكهتها.<hpage>إن كانت شريحة اللحم ستفسد، فسأسرع إلى القلعة. لا أريد أن تذهب جهودكم أو مؤنكم القليلة هدرا."
FISHER_DLG_03: "ازدادت غابة الأصداف خطرا في الآونة الأخيرة، لكنني أمضيت حياتي كلها في الصيد، وهو يسري في صميم كياني. لن يغير ذلك شيء."
SHOP_ITEM_MULTIBIND: "نادرا ما أبيع شيئا مثيرا للاهتمام كهذا. يقال إنه يعزز قدرة الحشرة الطبيعية على الشفاء! لا أستطيع القول إنني شعرت بأثره بنفسي، لكن صحتي أفضل من صحة معظم الحشرات."
RELIC_DEALER_GOT: "نعم... هذا يلائم مجموعتي جيدا. فانظري! انظري إلى ما لدي!"
PINSMITH_UPGRADE_DECLINED: "آه، الخيار لك أيتها المحاربة. إن غيرت رأيك لاحقا، فسيبقى بليني هنا متحمسا لمساعدتك."
GREETER_CURSED: "يا صديقتي المريضة! يشعر بافو بأنك تعانين، لكن لا تقلقي! يستطيع الحجاج في قلب الجرس الراحة والتعافي حتى يستعيدوا قدرتهم على السفر!<hpage>أقدر حسن ضيافتك يا بافو، لكنني أخشى ألا تكفي الراحة وحدها لهذا المرض. استوطن جسدي طفيلي لا أستطيع نزعه بالقوة وحدها.<hpage>أخبرني، هل تعرف من يمكنه مساعدتي؟ معالجة أو طبيبة؟<page>طبيبة؟ كان لدينا واحدة ذات يوم... شيطانة مخيفة! قاسية وفظة في ممارستها. ومن أجل صحة قلب الجرس المجيد، صوتنا جميعا على طردها!<page>لا أعلم أين طارت تطن، وأفضل ألا أعرف! لكن إن كان لا بد من البحث عنها، فابدئي بالتحدث إلى الناسك العجوز المتواري تحت ممر الأجراس.<page>نعم... يبدو ذلك الناسك مجنونا، لكنه يجمع المعارف على نحو عجيب. قد يستطيع إخبارك بمكان اختباء تلك الطبيبة البغيضة."
GREETER_HOUSE_FULL_REPEAT: "نحن محظوظون بوجودك يا آنسة المسافرة. أنت موضع ترحيب دائما في قلب الجرس، أنت ونصلك الكبير الحاد!"
GREETER_TALK_1: "<hpage>ماذا تذكر من الفترة التي علقت فيها بالخيط يا بافو؟<page>آه... يصعب الأمر. بل إن التفكير فيه مؤلم. ذكريات غريبة وحزينة ليست لي، وأفكاري أنا مخنوقة وسط ذلك التشابك.<page>لو اختار المرء أن يتصل بشيء أعظم منه، فقد تبدو تلك اللعنة كأنها معجزة. أما لي الآن فلا تبدو إلا رعبا."
SPINNER_INTRO: "أوه! أوووه! سينضمون... اتحاد على خيطك... هدية لصحوتك. عالم معلق بالخيوط لخدمتك...<hpage>أيها المخلوق، توجه مخالبك تلك الخيوط الملعونة، لكنك لست مصدرها. ما الدور الذي تؤديه في هذا البلاء الخبيث؟"
COURIER_SHOP_FIRSTDELIVERY: "<page=T>لكن تمهلي يا آنسة البريد! قبل أن تغادري، يجب أن تعرفي أن كل الشحنات تحتاج إلى عناية فائقة!<page=S>لا ارتطام! لا هز! لا وسائل نقل غريبة! يجب استخدام الساق أو المخلب أو الجناح وحدها لإيصالها إلى وجهتها.<page=S>احملي الشحنات بأمان يا آنسة البريد! واعتني بها كما تعتنين بصدفتك."
COURIER_SHOP_BEGIN_FLEATOPIA_RETRY: "<page=T>كل البضائع الطيبة معبأة طازجة للبراغيث الذكية. خذيها إليهم من أجلنا يا آنسة البريد. ربما تكسبين أصدقاء جددا بخدمتك؟ نعم، نعم؟"
DOCTOR_CLOSED: "بززت! من يزعجني الآن؟! اتركي يارنابي العظيم بسلام! ابتعدي، ابتعدي!"
DOCTOR_CLOSED_CURSED: "<hpage>أنا مريضة يا سيدتي، وفي حاجة ماسة إلى خدمتك. استوطنتني طفيليات خبيثة، تستنزف قوتي وتحاول انتزاع السيطرة على صدفتي."
DOCTOR_CONVO_1: "حمقى، كلهم حمقى! يا له من إنجاز عظيم صنعه يارنابي! حشرة شفيت تماما بفضل آلتي الرائعة!<page>تموت بضع حشرات ضعيفة، فيرفع الجميع مخالبهم احتجاجا. أما في عقولهم الصغيرة مكان للتقدم؟!"
FISHER_DLG_02: "فقد قلب الجرس كثيرا من بريقه، لكننا لا نزال نوفر بعض الراحة للحجاج الذين بلغوا هذا الارتفاع."
GREETER_MEET_ACT3: "<page>أيتها المقيمة العزيزة! رؤيتك تعودين حية بصيص نور، حتى والظلام يهبط علينا جميعا.<hpage>كل هؤلاء الحجاج مجتمعون هنا... لم أتوقع نجاة هذا العدد. كان الدمار وراء هذه الأجراس يوحي بما هو أسوأ.<page>نعم! كان ينبغي أن يكون الوضع أسوأ، ولكان كذلك لولا صديقتك المحاربة الطويلة صاحبة الحلقات اللامعة، التي حالفنا الحظ فاختارت بلدتنا لتقيم مخيمها.<page>تتولى تلك الحشرة الشجاعة وحدها الآن حراسة بلدتنا والحجاج الفارين إليها.<page>بفضل جهودها، بقيت أصدافنا سالمة، لكن إلى متى تستطيع مواصلة هذه المهمة... لا أجرؤ على التفكير."
COURIER_SHORT_QUEST_AVAILABLE: "أخي بيل ما زال في الخارج. لا بد أنه يساعد الآخرين وينقل البضائع في كل الأنحاء. لا أملك إلا أن آمل أنه بخير، لكن بيل غاب طويلا. أطول مما ينبغي!<page>وضعت أمنيتي على جدار الأمنيات، أن يعود أخي إلي وإلى أمان هذه الأجراس.<hpage>سأراجع الجدار يا تيب. إن توافقت أمنيتك مع رحلتي، فقد أستطيع تعقبه."
SHOPKEEP_MEET_EXPANDED_ALT: "<hpage>تحية لك يا صاحب المتجر. بالنظر إلى مشقات الأراضي وراء هذه الأجراس، يبدو متجرك في حال ممتازة.<page>نعم، مررنا نحن أيضا بأوقات عصيبة! لم يبق من قلب الجرس الذي كان يعج بالحياة سوى بضعة مقيمين.<page>لكن أحوال فراي العجوز تحسنت! نعم! تنعم البلدة بسلام عابر على الأقل، وعاد ساعي بريدي ببضائع جديدة للتجارة.<page>سواء كنت حاجة أم مسافرة، فمتجري أرقى متجر سيحالفك الحظ بزيارته في أراضينا المنكوبة."
SHOP_ITEM_FURNISHING_SPA_NAME: "منتجع صحي خاص"
SHOPKEEP_SAVED_COURIER_1: "<hpage>تحية من جديد يا صاحب المتجر. تبدو رفوفك عامرة أكثر. أرى أن الساعي عاد إليك سالما.<page>نعم، مر ذلك المشاكس الصغير أخيرا وترك حمولته.<page>كان المسكين مضطربا جدا بعد ما أصابه من متاعب، حتى إنني كدت أعجز عن اقتطاع شيء من أجره.<page>لكن كل شيء بخير الآن! ألقي نظرة على البضائع الجديدة الرائعة المتاحة لدي!"
SPINNER_INTRO_2: "أوووه! إنها هنا! المولودة النادرة! الابنة النفيسة لويرم وناسج!<page>ذرية أولئك الذين تجرؤوا على الفرار. وجدت طريق العودة إلى موطنها... أخيرا.<page>ما أجمل صدفتها وحريرها ومخلبها... من أجلك يا أمي... دعيني آخذها كلها من أجلك!"
SHOPKEEP_FURNISHING: "شراء موفق! أمهلينا لحظة وسنجهزه في منزل جرسك."
RELIC_DEALER_CYLINDER: "آه! ذلك الأثر الذي تحملينه! أسطوانة من قبو القلعة المقدس! يا له من اكتشاف عظيم. ستعطينني إياها، نعم؟<hpage>لن أفعل أيها الباحث. لاستخراج المعرفة التي تحملها، تحتاج هذه الأسطوانة إلى جهاز استماع لا تملكه.<hpage>إن سلمتها لك، فستظل الأسرار التي تحتويها مخفية عنا كلينا إلى الأبد.<page>باه... إن لم تتكلم معي، فلا أريدها! لا تزعجيني حتى تحضري شيئا يستحق أن آخذه!"
COURIER_SHOP_BROKEN_SHORT: "<page=T>تحطمت كل الشحنات؟ أتحاولين مرة أخرى يا آنسة البريد؟ حشرات فارلوم في أمس الحاجة إلى مساعدتك!"
PINSMITH_QUEST_CANCOMPLETE_REOFFER: "بونفا، أيتها المسافرة! معك الزيت! أتسمحين لي بصنع معجزة في نصلك؟"
GREETER_MEET_ALT: "مرحبا، مرحبا أيتها الحاجة المتعبة! ربما تجاوز قلب الجرس المجيد أوج بريقه، لكنه لا يزال آخر محطة ودية قبل القلعة.<page>ومهمتي أنا، بافو البهي، أن أرحب أحر ترحيب بالعابرين من أهل الإيمان مثلك!<page>والآن! أصر على أن تستمتعي بما بقي من ضيافتنا ولو للحظة. لدينا سلع تشترينها وخدمات تنتفعين بها!<page>حتى في حالنا المتواضعة هذه، ستجدين محطتنا أدفأ ما يمكن أن تقدمه هذه الأراضي المريضة."
GREETER_CURSED_ACT_3: "يا صديقتي المريضة! أشعر بأنك تعانين. هل أصابت اللعنة السوداء حتى صدفتك المتينة؟<hpage>مصدر هذا المرض مختلف يا بافو. استوطن جسدي طفيلي لا أستطيع نزعه بالقوة وحدها.<hpage>أخبرني، هل تعرف من يمكنه مساعدتي؟ معالجة أو طبيبة؟<page>طبيبة؟ كان لدينا واحدة ذات يوم... شيطانة مخيفة! قاسية وفظة في ممارستها. ومن أجل صحة قلب الجرس المجيد، صوتنا جميعا على طردها!<page>لا أعلم أين طارت تطن، لكن العالم وراء الأجراس مليء بالخطر. إن كان لا بد من طلب خدمتها، فلا أظنها ابتعدت كثيرا..."
PINSMITH_QUEST_DECLINE: "حسنا، لا إذن؟ لا شك أنك اخترت الطريق الأسلم. الأفضل أن تبقي صدفتك سليمة."
COURIER_SHOP_BEGIN_PILGRIMSREST_RETRY: "<page=T>مؤن لمحطة الاستراحة في الحقول. كنا نحب إيصال هذه الشحنة حين كنا صغارا وأشد شجاعة."
COURIER_SHORT_REPEAT: "تبدو هذه البلدة آمنة، بالكاد، لكنني قلق على الآخرين. أما تزال فارلوم بحاجة إلى بضائعها؟<page>ساعدنا، أنا وأخي بيل، حشرات كثيرة بصفتنا ساعيين. ولا سيما الآن، حين يزداد الخطر."
SHOPKEEP_TAKEN_COURIER_1: "رأيت ذلك! أنت من أزلت أمنيتي من اللوح! أذاهبة للبحث عن ساعي بريدي الشارد إذن؟<hpage>تقودني مهامي بعيدا يا صاحب المتجر. إن صادفت في رحلتي الساعي الشارد، فسأحرص على إرساله إليك.<page>إذن ستنالين شكري وأكثر! نادرة هي الحشرة التي تجرؤ على مواجهة البراري لمساعدة غيرها."
SHOP_ITEM_SPOOL_SEGMENT_DESC: "لبكرة خالية من الحرير، ثقلها يثير الدهشة. أتظنين أنها ربما هدية خلفها الزاحفون القدماء؟"
GREETER_CURSED_REPEAT: "إن كان لا بد من العثور على تلك الطبيبة البغيضة، فتحدثي إلى الناسك العجوز المتواري تحت قلب الجرس. إنه يعرف عن العالم أكثر بكثير مما يعترف به..."
PINSMITH_UPGRADE_3_POST: "حسنا، تم الأمر! يا لها من معجزة أن أعمل مجددا على فولاذ بهذه الجودة. قلما بقيت في فارلوم إبر تستطيع بلوغ مثل هذا البريق!<page>يجب أن تخبريني أيتها المسافرة، أين حصلت على سلاح رائع كهذا؟<hpage>كان النصل هدية من قبيلة نبيلة في موطني. صنع أفرادها أصلب الفولاذ، مع أنه نادرا ما شوهد خارج خليتهم.<hpage>اندثرت تلك القبيلة منذ زمن بعيد، واندثرت معها أسرار حرفتها.<page>آه. إن كانوا قد رحلوا، فهذه قطعة أندر مما يظن! ويا له من حظ عظيم أن يعمل صانع الإبر المتواضع هذا على سلاح كهذا!"
SHOP_ITEM_FURNISHING_GRAMAPHONE_NAME: "غرامافون"
COURIER_SHOP_BEGIN_SONGCLAVE_RETRY: "<page=T>بضائع طيبة للحجاج في الأعالي! أولئك الشجعان المقيمون في تلك القلعة الهائلة.<page=S>سيحتاجون إلى هذه الشحنات بشدة يا آنسة البريد. احمليها بأمان من أجلنا!"
DOCTOR_CURSE_FIX_DECLINE: "بززت! أنت تترددين! لكن خوفك من إكستريكاتور نابع من الجهل وحده، ويمكنك التغلب عليه ببعض الجهد. خذي لحظة. أعيدي النظر!"
DOCTOR_CURSE_REOFFER: "يستطيع يارنابي العظيم تخليصك من تلك «الجذور» البغيضة، لكن إكستريكاتور الجبار يحتاج إلى ترقية كي يشق صدفتك الصلبة!"
SHOPKEEP_GENERIC: "مرحبا من جديد! أترغبين في شراء شيء مميز قبل أن تحملك مهامك بعيدا؟"
COURIER_SHOP_MENTION_GOURMAND: "<hpage>أيها السعاة، أحتاج إلى شريحة لحم لحشرة عجوز في القلعة. هل تستطيعون إعدادها لي؟<page=T>حشرة في الأعالي؟ تعرف أجود طعامنا؟ إن كانت تقدره، فسنعده فورا! ليس على آنسة البريد إلا أن تطلب."
SHOP_ITEM_FURNISHING_DESK_DESC: "المكتب المتين قلب كل منزل جرس! يستخدم لتقييم الوضع أو ترتيب القطع الأثرية."
DOCTOR_CURSE_FIX_REOFFER: "هذه الجذور التي تعذبك... لست على دراية تامة بها، لكن ذلك لا يهم!<page>إن كان داخل الجسد شيء يجب إخراجه، فنستخدم إكستريكاتور يارنابي العظيم! إنه أملك الوحيد، بززت!"
DOCTOR_CURSE_DECLINE: "تطلبين مساعدتي ولا تساعدين نفسك؟ فارحلي! وواصلي معاناتك، وكفي عن إزعاجي، بززت!"
SHOPKEEP_GENERIC_ACT3: "أيتها المقيمة معنا! يهتز العالم ويتداعى، لكن ما دامت صدفتي سالمة، فسيظل متجري مفتوحا."
PINSMITH_QUEST_COMPLETE_REFUSE: "حسنا، لا إذن؟ أتحتفظين بالزيت الثمين لنفسك؟ لأي غرض تحرمين صانع الإبر من عمله؟ أنا الوحيد الباقي على قيد الحياة والقادر على العمل بمادة عجيبة كهذه!"
GREETER_CURSED_REPEAT_ACT_3: "اعثري على تلك الطبيبة البغيضة بسرعة أيتها المقيمة العزيزة! لا أعلم أين طارت تطن، لكن العالم وراء الأجراس مليء بالخطر.<page>إن كان لا بد من طلب خدمتها، فلا أظنها ابتعدت كثيرا..."
RELIC_DEALER_REMEET_ACT3: "ماذا؟ ماذا الآن؟ ما مصدر كل هذا الضجيج الهائل؟<hpage>تحياتي يا سيدتي. أنا لا غير. إن كانت تمزقات هذه البلاد قد أزعجتك، فأخشى أنني أتحمل بعض اللوم.<page>اللوم؟ تفاهة. فليوزعه من يأتون بعدنا كما يشاؤون.<page>أما الآن، فلا يهم سوى مجموعتي! يجب أن أحميها!"
COURIER_SHOP_BEGIN_MASKMAKER: "<page=S>شحنة فتاكة وخطرة وشديدة البرودة، إلى الحشرة العجوز في الأعلى، فهي بحاجة ماسة ماسة إليها! إنه يخدمنا جميعا، لذا نرد له الخدمة.<page=T>وهو اختبار عظيم لك أيتها الساعية! تحد صعب للغاية. الطلاء الذي ستحملينه سائل كثير الاضطراب، ويصعب نقله حتى على أمهر السعاة.<hpage>سبق أن التقيت بهذا الصانع. خدمته طويلة وجديرة بالتقدير، ويسرني أن أساند جهوده."
COURIER_SHOP_BEGIN_PILGRIMSREST: "<page=S>شحنات إلى محطة الطريق في الحقول عند أطراف فارلوم، وهي استراحة صغيرة ما زالت تقدم خدماتها.<page=S>لعل هذه الرحلة ليست شديدة الصعوبة عليك أيتها الساعية؟ نرى أنك الأنسب لتحقيق هذه الأمنية!"
GREETER_REPEAT: "مرحبا، مرحبا بكل المسافرين! أريحوا أصدافكم المنهكة واستعيدوا نشاط أرواحكم الواهنة!<page>قلب الجرس! مجيدة ومتألقة وآمنة جدا جدا! امكثوا قليلا قبل بدء صعودكم الأخير!"
DOCTOR_MAGGOT_REPEAT: "اذهبي واستريحي! بززت! تخلصي من علتك الطفيفة ودعيني وشأني! يارنابي العظيمة لا وقت لديها للأمراض التافهة!<hpage>حسنا يا سيدتي. لم أقصد إضاعة وقتك."
SHOPKEEP_MEET_EXPANDED: "<hpage>تحياتي أيتها البائعة. يبدو أنك تعافيت جيدا من ذلك البلاء الحريري.<page>آه! أنا حشرة ذكية. حين انقض ذلك الخيط الغريب من الأعلى، أغلقت كل شيء بإحكام واحتميت في منزل جرسي.<page>ربما عانى الآخرون هنا، لكن متجري كان حافلا بالمؤن، فلم أخش الجوع.<hpage>لقد أفادك استعدادك، ويبدو أن متجرك ما زال عامرا بالبضائع.<page>نعم، حتى موردي عاد إلى العمل، ولدي بضائع كثيرة أعرضها عليك!"
PINSMITH_UPGRADE_4_PRE_REOFFER: "يا للروعة! معك الزيت أيتها المسافرة! دعيني أمنح نصلك بريقا لا مثيل له!"
RELIC_DEALER_ASK_PROMPT_PLURAL: "تقديم الآثار؟"
DOCTOR_CONVO_2: "لكن تمهلي! ثمة شيء آخر فيك... لقد شققت أصداف عدد لا يحصى من الحجاج القذرين، ولم أر سوى أحشاء عادية شاحبة! أما أحشاؤك فمختلفة تماما!<page>وما زال ذلك يحيرني! بززت! ما سر صدفتك الذي يعجز حتى إدراكي الكامل الدقيق عن كشفه؟<page>أتسمحين لي بفحصك أيتها العينة؟ هيا! دعي يارنابي العظيمة تتطلع إلى أسرارك الأعمق والأشد ظلمة!<hpage>لا أرغب في أن تعبثي بصدفتي أكثر أيتها المعالجة. نجح علاجك، لكنه سبب لي ألما شديدا. ولا أرجو إلا ألا أحتاج إلى عونك ثانية."
PINSMITH_FURTHER_REPEAT: "إن حصلت خلال رحلتك الطويلة على مزيد من الزيت، فاطلبي خدمتي مسرعة! من يدري أي هيئة كامنة قد نكشفها في فولاذ نصلك الحاد!"
DOCTOR_CLOSED_ACT3: "غاه! من يحدث كل ذلك الضجيج في الخارج؟! يا له من اهتزاز وصراخ مروعين. إنهما يفسدان عملي المهم! بززت!"
DOCTOR_CURSE_ENDED: "العملية... نجحت! لو رأى الحمقى المختبئون في عرق الأجراس المحترق مقدار ما أنجزه من دونهم، لارتجفوا حتى يصيروا غبارا!<hpage>يا سيدتي... لن أكذب، لقد كانت محنة قلما عانيت مثلها...<hpage>ومع ذلك، يبدو أن قيد الطفيلي قد انحل... إلى حد ما. وما بقي منه في صدفتي يبدو هادئا بما يكفي لأستولي على قوته.<hpage>لعل النتيجة موفقة في النهاية.<page>بالطبع، بالطبع! يارنابي العظيمة شفتك! أعلني ذلك في الكهوف، واصرخي به من الأبراج العظيمة الدوارة!<page>احرصي فقط على أن يسمعك سكان المستوطنات التي يسمونها \"متحضرة\" في هذه البلاد الجاهلة!"
RELIC_DEALER_POSTWINDOW_COMPLETE_REPEAT: "أليست هذه مجموعة عظيمة من آثار الماضي؟ ليتني أستطيع جمع التاريخ كله هنا والاحتفاظ به!"
SHOPKEEP_MEET_ACT3: "مرحبا بك في منزلك أيتها المقيمة! قد يهتز العالم ويتداعى ويقترب من نهايته، لكن ما دامت صدفتي آمنة فسيظل متجري مفتوحا."
DOCTOR_CURSE_FIX_ACCEPT: "نعم... نعم! بززت! أخيرا، عينة تليق بجهازي العظيم، الإكستريكاتور! جهازي الجميل الذي ظلمه الجميع! تعالي من هنا، بززت..."
PINSMITH_BELLTOWN_MEET_OFFER_ALT: "بحق المخلب! من هذه المحاربة الجريئة التي تقف بكل هذا الهدوء والثبات عند مدخل منزل جرس بليني؟<hpage>لست سوى مسافرة يا سيدي، لكن نصلي قد ينتفع بخدمتك.<page>نصلك! بالطبع أيتها المحاربة الشرسة! أي معلم دبابيس بارع سيدرك آثار العمل القاتل على حد تلك الإبرة.<page>إن كان شحذ سلاحك سيزيد بلادنا أمنا، فالشرف يوجب أن أعتني به هذه اللحظة! ما رأيك أن ألقي نظرة؟<hpage>"
DOCTOR_CLOSED_QUEST: "عودي ومعك تلك الأشواك، وإلا فلا تعودي! وقت يارنابي العظيمة ثمين، بززت! ولن أسمح لك بتشتيتي عن عملي!"
PINSMITH_SAVED_TALK: "آه... كم كان موتي على أيدي الحجاج التائهين إلى جوار قبرها رومانسيا، فنرقد معا إلى الأبد والعالم يتداعى من حولنا...<page>لكن الحظ قضى بغير ذلك! ولعل الأفضل أن يواصل معلم الدبابيس المتواضع هذا حرفته فترة أطول. أظن أن هذه الأيام المضطربة ستجلب كثيرا من العمل الجديد!"
BELLHERMIT_CURSED: "ما هذا الذي يرتعش في داخلك؟ مستعبدة في جوف مستعبدة! هل أسلمت صدفتك لينمو فيها كائن أعظم؟<hpage>اتخذ طفيلي من جسدي موطنا له. إنه يستنزف طاقتي، ولا أستطيع طرده بالقوة وحدها...<page>غرنك. استلقي ومت إذا، فلا أبالي. امنحي ذلك الشيء المتلوي فرصته في الحياة.<page>وإلا... هف. اذهبي وابحثي عن المنفية من قلب الجرس، يارنابي الصغيرة. آخر ما سمعته أنها طردت إلى أعالي المستنقعات."
RELIC_DEALER_POSTWINDOW_FIRST: "المزيد إذا! أحضري لي مزيدا من آثار الماضي! سجلات وأختاما وأصناما! لنجمع تاريخ العالم ونكدسه كله هنا، محفوظا وآمنا!<hpage>إن عثرت على مزيد من نوادر ماضي هذه المملكة، فقد أزورك ثانية. وحتى ذلك الحين، حافظي على سلامتك."
COURIER_SHOP_BEGIN_MASKMAKER_RETRY: "<page=T>لدينا المزيد لك أيتها الساعية! طلاء مملوء حديثا للصانع فوق الجبل. لدينا منه الكثير، فلا تقلقي على مخزوننا. <page=S>صعود القمة المتجمدة رحلة شديدة الصعوبة! يرافقك خالص شكرنا لأنك تحاولين مرة أخرى!"
COURIER_SHOP_BEGIN_GOURMAND_RETRY: "<page=T>لدينا مزيد من اللحم لك أيتها الساعية! من الأفضل أن توصليه بأقصى سرعة! إن لم يحفظ جيدا، فسرعان ما يفسد طعم لحمنا المقدد."
DOCTOR_CLOSED_REPEAT: "ابتعدي، أقول لك! إلا إن أحضرت عينة جديرة بالفحص تحمل في داخلها شيئا بشعا حقا، بززت! وإلا فاتركي يارنابي العظيمة وشأنها!"
COURIER_SHORT_MEET: "أيتها المنقذة! شكرا مجددا لك ولنصلك الكبير الكبير! عدت بسلام، ونالت اليرقة المتجهمة بضاعتها. بل بدت سعيدة أيضا!<page>لن أسافر لفترة طويلة طويلة، على ما أظن. الوحوش كثيرة جدا! إنها في كل مكان. حتى أولئك الحجاج صاروا غاضبين، مثل اليرقة العجوز بعض الشيء.<hpage>ما زالت هذه البلدة آمنة في الوقت الراهن يا تيب. ومن الحكمة أن تبقى داخل أسوارها."
SHOP_ITEM_FURNISHING_PAINT_DESC: "لديك جرس قوي ومتين هناك، لكن آثار الزمن بدأت تظهر على سطحه. لم لا نطليه من جديد؟ طبقة واقية ولمسة من الأناقة!"
FISHER_DLG_MEET: "<hpage>تبدو منهمكا في العمل أيها الصديق. أأنت صياد من نوع ما؟<page>صياد بسيط، نعم. أصطاد في البركة هنا، وأنا آخر من بقي من صياديها!<page>نحن القلة الباقية في قلب الجرس بحاجة شديدة إلى الطعام الطازج، ولذلك تحمل صدفتي وحدها مسؤولية كبيرة.<page>لحسن الحظ، ما زالت بركة غابة الأصداف مليئة باللحم الجيد، ولا سيما إن كان تصويبك بالدبوس الطويل بدقة تصويبي."
BELLHERMIT_SNARE_REPEAT: "أديت دوري أيتها المستعبدة. لم يعد بيننا ما يستحق الحديث.<page>اذهبي وانسجي شبكة عناكبك. امنحي روح مملكتنا القلقة فرصة لتتوهج."
PINSMITH_UPGRADE_3_PRE: "<hpage>لدي مزيد من الزيت يا معلم الدبابيس. لم يكن الحصول عليه سهلا، لكن إن أفاد نصلي فسيكون جزاء تلك المشاق مستحقا.<page>المزيد من الزيت؟ يا له من حظ لا يصدق! هدية خفية بكمية لم يسمع بمثلها، تعثر عليها حشرة واحدة!<page>هل تسلمينني الزيت أيتها المسافرة، ومعه بعض المسابح لمواصلة العمل؟ أتسمحين لمعلم الدبابيس هذا بأن يصنع أعجوبة أخرى بنصلك؟"
SHOP_ITEM_CRESTSOCKET_BELLHART: "قطعة بديعة تحمل ذكرى عزيزة. ذاكرتي ممتازة أيضا، لكنني واثقة بأنك ستحسنين استخدامها."
DOCTOR_SLAP_INTRO: "لا تتظاهري بالحمق أيتها العينة! بززت! اكشفي لي المزيد عن نفسك لأفهم أكثر! لأتعلم! أي أمل آخر لدينا لإنقاذ عالمنا المنكوب الجاحد؟!<hpage>لقد رفضت أيتها الحشرة. ومهما كان ما تبحثين عنه، فلن تجديه على صدفتي ولا في داخلها."
GREETER_HOUSE_FULL_TALK: "<page>أيتها المسافرة! بفضل إسهاماتك الشجاعة، بدأت بلدتنا الصغيرة تستعيد رونقها القديم. رفعت المنازل، وأصبحت الساحة تتألق!<hpage>رأيت التغييرات بنفسي يا بافو. ويسرني أن إسهاماتي لم تذهب سدى.<page>بالفعل! كرمك قدوة للآخرين! ولم يعد ينقصنا بشدة سوى شيء واحد...<page>الحشرات! فما قيمة البلدة من دون سكانها؟ الشيخوخة والندرة والخيط القاتل... تحاصر قلب الجرس مصائب لا تنتهي، ولم يبق الآن سوى القلة التي التقيت بها.<page>تقديرا لجهودك النبيلة، وكخطوة صغيرة نحو حل المشكلة، أصدرت مرسوما بمنحك هدية عظيمة! منزل جرس خاص بك!<page>مكان للتأمل، وسرير تستلقين عليه. إنه معلق في الأعلى عند القمة، إلى جوار معلم دبابيسنا الطيب.<hpage>لا أنوي الاستقرار يا بافو، لكن مهمتي في فارلوم لم تنته بعد، وقد يفيدني مسكن ما دامت مستمرة.<page>بالطبع، بالطبع! صمودك يلهمنا جميعا! وإن حلت المتاعب مجددا، فلن يضرنا وجود محاربة مقيمة على مقربة منا!"
DOCTOR_REPEAT: "إن كنت ترفضين كشف أسرارك، فلا تشتتي انتباهي أكثر أيتها العينة! بززت!<page>ما زال أمام يارنابي العظيمة كثير من العمل! كثير من التفكير والتعلم!<page>ومع أن العالم الجاحد ينبذني، فسأنقذه بمخالبي!"
PINSMITH_SAVED_THANK_1: "يا للروعة! لقد أنقذت بليني المسكين من رعب مخيف! وما أسعدني أخيرا برؤية تلك الإبرة الرائعة ترقص وتغني!"
PINSMITH_UPGRADE_4_PRE: "<hpage>أطلب خدمتك الماهرة مرة أخرى يا معلم الدبابيس. أحضرت غدة زيت أخرى.<page>كل هذا الزيت! لم تعد هذه الحشرة تعرف الدهشة! حان الوقت، على ما أظن، لإكمال العمل على نصلك ومنحه بريقا لا مثيل له!<page>يا للروعة! لماذا ننتظر؟ أتريدينني أن أبدأ أيتها المسافرة؟"
PINSMITH_SAVED_THANK_2: "<hpage>التجول في هذه الطرق مميت يا معلم الدبابيس، ولا سيما والخيوط المشبعة بالسواد تمزق البلاد.<hpage>ستكون فرصتك في النجاة أكبر في قلب الجرس بين رفاقك. يمكنكم حماية بعضكم، وربما تعيدون البناء مع الوقت.<page>نعم، بالطبع! لم يرغب بليني في هجر أصدقائه الأعزاء في قلب الجرس، لكن مع اقتراب نهاية العالم، كان علي أن آتي لأودع حبيبتي ميلاتولا للمرة الأخيرة.<page>لكن يجدر بي أن أعود. فبلدتنا ستحتاج إلى عمل معلم دبابيس بارع أكثر من أي وقت مضى!"
RELIC_DEALER_POSTWINDOW_COMPLETE: "نعم... نعم. هذه مجموعة عظيمة حقا!<page>كل هذه الآثار مكدسة هنا في أمان تام! لقد أحسنت جمعها كلها!<hpage>إن كانت مجموعتك تسعدك، فليس من المبالغة أن تعترف بشيء من فضلي في اتساعها.<page>تفاهة! أهو الامتنان ما تريدين؟<page>سأسمح لك بمواصلة مشاهدة مجموعتي. وهذا امتنان يكفي لقاء ما قدمته لي من نزر يسير!"
COURIER_SHOP_BEGIN_BONETOWNFIXER: "<page=S>كانت هذه الشحنة مألوفة فيما مضى، إلى الحشرات في مخيمها عند العظام. أما الآن، فقد صارت حتى هذه مهمة صعبة.<page=T>هناك في الأسفل عند القاع، حيث تبدأ رحلات كثير من الحجاج. ستعينهم هذه الشحنات كثيرا على الاستعداد لصعودهم."
PINSMITH_UPGRADE_3_PRE_REOFFER: "هل تسلمينني الزيت أيتها المسافرة، ومعه بعض المسابح لمواصلة العمل؟ أتسمحين لمعلم الدبابيس هذا بأن يصنع أعجوبة أخرى بنصلك؟"
SHOP_ITEM_FURNISHING_TROPHYCAB_DESC: "عثرت على جوائز فاخرة في رحلاتك؟ ستحتاجين إذا إلى هذه الرفوف لعرضها!"
FISHER_DLG_04: "أأنت عابرة بهذه البلاد فحسب يا آنسة؟ كنت سأحذرك من الابتعاد عن قلب الجرس، لكن يبدو أنك قادرة على تدبر أمرك."
FISHER_DLG_05: "إن كنت ستعبرين البركة، فاحذري الصيادين الآخرين. فقد استسلموا جميعا للعنة فارلوم.<page>كلهم ضعاف العقول، لكن دبابيسهم الطويلة ما زالت حادة بما يكفي."
SHOPKEEP_HOUSE: "مرحبا، مرحبا بأحدث مقيمة لدينا! آمل أن يكون منزلك الجديد على ذوقك.<hpage>إنه جرس محكم الصنع يا سيدتي. أنا محظوظة بامتلاك مكان آمن أستريح فيه، وإن كانت إقامتي هنا قد تقصر.<page>مهما طالت إقامتك معنا، فقد احتفظت ببضائع فاخرة ستضفي الدفء على منزلك. هذه الأشياء ليست للرعاع العابرين، لكن إحدى سكان قلب الجرس تستحق الأفضل!"
GREETER_MEET: "مرحبا، مرحبا أيتها الحاجة المنهكة! ربما ولت أبهى أيام قلب الجرس المجيدة، لكنها لا تزال آخر محطة ودية قبل القلعة.<page>ومهمتي أنا، بافو الوسيم، أن أرحب أحر ترحيب بالحجاج المخلصين العابرين مثلك!<hpage>يبدو أن بلدتكم استعادت عافيتها أيها الصديق. خشيت حين حررتك ألا أجد فيها إلا هياكل خاوية.<page>نعم، كثير من... آه... معظم سكاننا لم يحالفهم الحظ... لكن لا جدوى من الانشغال بالأمور القاتمة! سنبني وننمو ونرحب بالجميع! فهذا واجب كل حشرة جرس صالحة."
FISHER_DLG_01: "هل قابلت فراي يا آنسة؟ عادة ما تخزن أشياء مفيدة للمسافرين مثلك."
SHOPKEEP_PAINT_PRE: "اختيار مثالي! سيصبح جرسك الأجمل في البلدة. سنبدأ العمل فورا."
GREETER_FURNISHINGS: "إن بدا لك منزل جرسك خاليا بعض الشيء، فتحدثي إلى فراي. فهي معروفة بجمع شتى أنواع الأثاث الفاخر.<page>لا ينفع مخزونها الحجاج العابرين، لكنه بالضبط ما تحتاج إليه مقيمة جديدة لتحول الجرس إلى منزل."
COURIER_SHOP_BEGIN_SONGCLAVE: "<page=S>في الأعلى، في القلعة الكبيرة، سمعنا أن مكانا جديدا صار آمنا آمنا! ونحن واثقون أنهم يحتاجون إلى شحناتنا أيضا!<page=T>تلك القلعة، نحن نعرف حقيقتها! ليست لطيفة لطيفة كما يقول الحجاج! وحتى إن استقرت فيها حشرات شجاعة، فالخطر لا يزال قريبا!<page=S>سيحتاجون إلى شحنات للطعام والعلاج والحماية. أرجوك خذيها أيتها الساعية!"
PINSMITH_QUEST_COMPLETE_ACCEPT: "تارانو! سنعمل الآن كما لم نعمل من قبل. ما أعظم الفرح الذي تمنحينه لهذا الحرفي المتواضع أيتها المسافرة. فلنبحث عن ذلك البريق الذي ظنناه ضائعا في هذه البلاد..."
PINSMITH_QUEST_ALREADY_GOT: "<page>يا للروعة! ذلك الزيت! إنه معك! تلك المادة النادرة المخزنة بعناية قرب القلعة. قلما أتيح لمعلمي الدبابيس في عصرنا أن يصنعوا عجائبها.<page>أتريدين رؤية ذلك أيتها المسافرة؟ أروع أعمال معلم الدبابيس هذا، ونصلك أشد حدة! ناوليني الزيت ولنبدأ!"
SHOP_ITEM_FURNISHING_TROPHYCAB_NAME: "رف التذكارات"
RELIC_DEALER_ASK_PROMPT: "تقديم أثر؟"
PINSMITH_UPGRADE_REOFFER: "حسنا، ما رأيك؟ أعدت النظر في عرضي؟ سيبرق نصلك بفضل مهارتي البارعة!"
DOCTOR_MAGGOT: "<hpage>يا سيدتي، أنا مريضة. تتلوى على صدفتي يرقات المستنقعات النتنة الواقعة خلف البراري. أطلب عونك في إزالتها.<page>يرقات! أهذا كل ما تحملينه إلى يارنابي العظيمة؟! وقتي ثمين! ولا أعالج إلا المصابين بأمراض خطيرة، والواهنين على نحو بشع حقا. بززت!<page>ابحثي عن مقعد أو سرير أو صخرة! لا تحتاجين إلا إلى الراحة. استقري في مكان ما، وسرعان ما تزحف تلك اليرقات خارج صدفتك وحدها."
SHOPKEEP_GENERIC_HOUSE: "مرحبا أيتها المقيمة! هل أعرض عليك شيئا مميزا قبل أن تنطلقي في رحلاتك مجددا؟"
SHOPKEEP_MEET: "<hpage>تحياتي أيتها البائعة. يبدو أنك تعافيت جيدا من ذلك البلاء الحريري.<page>آه! أنا حشرة ذكية. حين انقض ذلك الخيط الغريب من الأعلى، أغلقت كل شيء بإحكام واحتميت في منزل جرسي.<page>ربما عانى الآخرون هنا، لكن متجري كان حافلا بالمؤن، فلم أخش الجوع.<hpage>لقد أفادك استعدادك. لكن... يبدو متجرك خاويا الآن.<page>أحم. نعم. أعترف بأن الانتظار طال أكثر مما توقعت، ولا بد للحشرة أن تأكل...<page>سيكون لدي المزيد لأعرضه عليك عندما يصل ساعي. لا شك أنه يتجنب قلب الجرس منذ أن استهدفتنا اللعنة."
SHOP_ITEM_FURNISHING_LIGHTS_NAME: "أضواء البريق"
BELLHERMIT_ENSLAVED_1: "أتزعجينني ثانية؟ قلت لك ابتعدي!<hpage>لا أسأل إلا إن كنت تعرف ما حل بالحشرات فوقنا. إنهم معلقون داخل شرك هائل من الخيوط.<page>هف. لا عجب في ذلك. فهذا المصير النهائي لكل من في فارلوم، لكنه أتى إلى من في الأعلى أبكر بقليل.<page>لا يعقل أنك تتصورين أن نهايتك ستختلف، أليس كذلك؟ كل ذلك الجوع والخوف والكبرياء يملأ قلبك الهش. أنت أيضا محتوم عليك أن تنتهي عالقة في الشباك!<page>غرنك! ابتعدي. لا يظن نفسه حرا في فارلوم إلا أحمق."
BELLHERMIT_ENSLAVED_2: "أتريدين قطع الخيوط وإنزالهم؟ هف. نعم، تبدين قاسية بما يكفي.<page>حين تقطع الخيوط، سيعود إليهم الألم، وسيتذكرون الخوف والحنين.<page>يا له من اختيار تفرضينه عليهم! ويا لعظم السلطة التي تمنحينها لنفسك!"
PINSMITH_QUEST_CANCOMPLETE: "<hpage>يا معلم الدبابيس، حصلت على زيت يمكن أن يزيد إبرتي حدة.<page>بونفا! يا لها من أعجوبة! ويا لها من أمنية! أن تسرقي هدية نفيسة كهذه. قلما عمل معلمو الدبابيس في عصرنا بمادة كهذه."
