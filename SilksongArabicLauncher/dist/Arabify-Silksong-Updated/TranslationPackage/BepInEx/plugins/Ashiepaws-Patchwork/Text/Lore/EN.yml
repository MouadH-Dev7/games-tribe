MARROW_START_SIGN: "حاجّ<br>بوركت إذ تسيرين على دعائم فارلوم.<br>تواضعي أمام أصداف الذين بذلوا حياتهم لحمل ثقل مملكتنا."
RED_MEMORY_ROOT2: "<hpage>أنت مخطئة، سيدتي...<hpage>عرفت الأمنية، والثمن اللازم لتحقيقها. وبعد كل هذه العصور، لم أزدد إلا معرفة بها...<hpage>قوة... في العقل، وفي الرعاية، وفي المخلب. قوة تكفيني لأشهد عالما أفضل من عالمنا، أو أصوغ عالما كما أشتهي. <hpage>تلك كانت الأمنية، أمنية أمي ومعلمي وأمنيتك أنت...<page>حقا أيتها العنكبوت... كم من الألم تحملت حتى تعبري عن أملنا بهذه البساطة...<page>من أجلها تصيرين... يا من تعرفين رغبتنا حق المعرفة، ورأيت الظلام كله تحت بيتنا، سأريك الهبة..."
CORAL_CRUST_TAB_1: "يتمايل المرجان،<br>وتنساب المياه الصافية،<br>في نهرنا المتحرر من الزمن."
SILK_HEART_MEMORY_BELLBEAST_03: "...وصلنا... أخيرا..."
SILK_HEART_MEMORY_BELLBEAST_04: "...حريرنا..."
RED_MEMORY_ROOT3: "اشهدي النور الأول، وسيلتنا الوحيدة لمقاومة ذلك الفراغ الذي ارتبطت به عائلتنا إلى الأبد.<page>مدي يدك يا طفلتي القوية. انتزعيه من هذه الذكرى. واحترقي حتى تتحرري من مصيرنا الحزين..."
SILK_HEART_MEMORY_BELLBEAST_05: "...قوتنا..."
SILK_HEART_MEMORY_BELLBEAST_06: "...طبيعتنا..."
SILK_HEART_MEMORY_LACE_4: "...واحدة تتمنى يقظتنا..."
RED_MEMORY_BEAST: "...تجاهليهم يا ابنتي... وهمساتهم...<page>...أعظم، وأسمى... ناسج، حارسة، ملكة... تلك رغباتهم... وليست رغباتك. وهي بالتأكيد ليست رغبتي...<page>...إن قاومتهم، فقد ترين أملا آخر... وراء ذلك...<page>...لكن هل ستتذكرين هذه الكلمات بعد زمن بعيد إلى هذا الحد؟ وهل ستتذكرينني أصلا يا طفلتي؟ أيمكنك ذلك؟...<page>...أما... قبل القناع... قبل أن أرقد إلى الأبد في الواجب..."
RED_MEMORY_WEAVERS: "...أرينا صنعتك يا طفلتي...<page>...أظهريها في أبهى صورة، كما لا يعلمك سوانا...<page>...أثبتي أنك أقرب إلى ناسج منك إلى ويرم..."
CORAL_CRUST_TAB_2: "عند منبع الماء،<br>وفي قلب المرجان،<br>ولد سيدنا الأخير ليحكم."
MEMORY_FIRSTWEAVER_2: "...دعتنا بناتها... ودعتنا إلهيات... كذبت..."
SILK_HEART_MEMORY_BELLBEAST_01: "...طفلة... ناسج..."
SILK_HEART_MEMORY_WARDBOSS_08: "...عقل واحد... اتحاد واحد..."
SILK_HEART_MEMORY_BELLBEAST_02: "...طفلة... عنكبوت..."
RED_MEMORY_ROOT: "...للأسف... يا ابنة العنكبوت...<page>...ستظنيننا قساة بسبب طرائقنا... ستظنين أننا لا نبالي ولا نندم...<page>...وهكذا يجب أن نبدو، فذلك ثمن أمنيتنا..."
SILK_HEART_MEMORY_WARDBOSS_02: "...ذكراهم..."
SILK_HEART_MEMORY_WARDBOSS_03: "...قيدوا أصدافهم..."
SILK_HEART_MEMORY_WARDBOSS_01: "...أصواتهم... أغنيتهم..."
SILK_HEART_MEMORY_WARDBOSS_06: "...ارفعوهم... إلى الأعلى..."
SILK_HEART_MEMORY_WARDBOSS_07: "...للتفاني... إلى الأبد..."
SILK_HEART_MEMORY_WARDBOSS_04: "...قيدوا أرواحهم..."
SILK_HEART_MEMORY_WARDBOSS_05: "...قيدوهم جميعا..."
MEMORY_FIRSTWEAVER_1: "...دعتنا بناتها... ودعتنا إلهيات..."
HEART_OUTRO_FLOWER: "...نحن الحياة... نحن النماء... أي عالم يوجد من دوننا؟..."
SILK_HEART_MEMORY_BELLBEAST_08: "...انهضي... انهضي..."
SILK_HEART_MEMORY_BELLBEAST_FINAL: "...تعالي يا طفلتي... اشهدي يقظتنا..."
RED_MEMORY_HIVE: "...جيد... أفضل...<page>...ومع ذلك، عليك أن تكوني أسرع...<page>...مع الوقت، سيأتون لأجلك... الذين يخافون طبيعتك، والذين يريدون الاستيلاء عليها...<page>...كي تبقي حية في عالمنا، يجب أن تتعلمي كيف تلسعين... بسرعة ومباغتة..."
HEART_OUTRO_CORAL: "...مخالبنا للسحق... مخالبنا للحكم... مخالبنا لإنقاذهم جميعا..."
HEART_OUTRO_GREEN_PRINCE: "...أن نرقص... ونحب... وننتهي... معا..."
WILDS_START_TAB: "حاجّ<br>لتحرق حقول اللهب هذه كل دنس.<br>ولتمنحي الارتقاء إلى الأراضي الخضراء فوقك."
SILK_HEART_MEMORY_LACE_1: "...طفل منسوج مجنون... خير من لا طفل..."
MEMORY_NEEDOLIN_1: "...أخوات... عناكب... أغنيتنا تحفظنا..."
SILK_HEART_MEMORY_LACE_2: "...طفل منسوج واهن... خير من لا طفل..."
SILK_HEART_MEMORY_LACE_3: "...طفل منسوج نقي... خير منهم..."
SILK_HEART_MEMORY_WARDBOSS_FINAL: "...هم لنا... مقيدون إلى الأبد..."
MEMORY_NEEDOLIN_2: "...من أجل نورها... الأبدي... أغنيتنا تبقيه..."
SILK_HEART_MEMORY_BELLBEAST_07: "...نشعر به..."
MR_MUSH_RIDDLE_TAB: "ننطق بأمنية سيد المنادين،<br>ذاك الذي يعلن نهاية عصر.<br><page>تحت معبد أسقطته سطوة الملك،<br>وفوق مخيم هدمته محنة الخيط الأسود،<page>وعلى طرف حقل محروق، حيث الأصداف مسودة محترقة،<br>وفوق أبراج دوارة، قرب الجراح المنبوذ،<page>وفي قفص من ثار على كذبة الحرير،<br>وقلب الصقيع الضاري المحلق في الأعالي،<page>وبعد قمة المهد، حيث آخر اختبار للجدارة،<br>ليعبر العصر، وهذا الفطر شاهد عليه."
HEART_OUTRO_ANT: "...كيف اصطدنا... كيف غنينا... يا أبنائي، رأيتكم في أبهى مجدكم..."
SILK_HEART_MEMORY_LACE_FINAL: "...من حريرنا... ولدت طفلة وفية..."
MR_MUSH_TAB_TALK: "<hpage>إذن، يزور المنادي هذه الأرض أيضا...<hpage>إن كان هنا الآن، فلا مفر من تغيير عظيم أو نهاية وحشية. فما عداه لا يعنيه..."
