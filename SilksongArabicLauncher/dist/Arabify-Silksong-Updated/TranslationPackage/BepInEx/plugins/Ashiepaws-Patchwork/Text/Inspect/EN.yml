BELLTOWN_HOUSE_LOCKED: "دار جرس مقفلة."
WISP_BOMB_PROMPT: "تصنيع الأداة؟"
CLOVER_LAKE_PLINTH: "ارفعوا أصواتكم. اعرفوا نعمتنا."
JUDGE_NURSERY: "يا من ولدت في فارلوم، وقع عليك الاختيار.<br> ليقو طلاء قلعتنا المقدس صَدَفتك اللينة.<page>قف خالدا حكما لنا، فلا تدخل حشرة تحمل خطيئة إلى قاعاتنا المقدسة."
WEAVE_DARK: "لفافة رونية تصور الفراغ وقد اتخذ شكلا."
WEAVE_WHITE_LAKE: "أيتها الأخوات العناكب، راقبن جريان هذه المياه،<br>تطهر وتربط، كما ينساب الحرير من الصدفة،<br>فتهدأ ذكريات مملكتنا."
DOCKS_NOTE_1: "عند دقة الجرس السابعة، أرسلوا:<br>30 مكيالا، و4 دقات من سموكروك،<br>و8 دقات من سويتسملت،<br>وعلامة الولاء من جميع العمال.<page>عند دقة الجرس التاسعة، أرسلوا:<br>20 مكيالا، ودقتين من سموكروك،<br>و7 دقات من سويتسملت،<br>وعلامة الولاء من جميع العمال.<page>"
HANG_MAP_GET_MSG: "خريطة القاعات العليا"
CLOVER_MAP_GET_MSG: "خريطة فيردانيا"
UNDERSTORE_MAP_GET_MSG: "خريطة الأشغال السفلية"
CLOVER_LAKE_PLAQUE: "حين تبكي الينابيع الثلاثة، ينهض مزارنا المقدس."
LIBRARY_THEATRE_LINES_ACT3: "نحن ملعونون! قلة بقيت، وما زالت مقيدة بالعذاب. لعنتنا فارلوم ثلاث مرات: أن ننتظر، ونراقب، ونصرخ من ألمنا.<page>كفى! نقولها! كفى! نصرخ بها! نحبنا وبكينا جميعا. لقد حان أخيرا سقوط فارلوم الجميلة. ونحن الآن نقبل نهايتها."
GREY_LORE: "ابتهال العامل<br>عسانا نجمع الرواسب ولا نكل،<br>وننظف الرواسب ولا نجوع،<br>ونلف الرواسب على البكرات ولا نتعثر."
WARD_OATH: "قسم الجناح الأبيض<br>ما دامت الأغنية واجبة الإنشاد، فلا يجوز لأحد أن يتعثر.<br>العجز. المرض. الموت.<br>كلها منفية من قلعتنا."
SLAB_ORDERS_2: "التائب، الرابع من الرابع.<br>مذنب بخطيئتي العجز والمرض.<br>التكفير بالابتلاع.<br>منح الغفران بعد الموت.<page>التائب، الثاني عشر من الأول.<br>مذنب بخطيئة لم تسم.<br>التكفير بالإلقاء.<br>لم يمنح الغفران."
SLAB_ORDERS_1: "التائب، الثامن من الثاني عشر.<br>مذنب بخطيئة انتهاك الحرمة.<br>التكفير بالتقييد بالسلاسل.<br>منح الغفران بعد الموت.<page>التائب، الثاني من الرابع.<br>مذنب بخطيئة النشاز.<br>التكفير بالإسكات.<br>منح الغفران بعد الموت."
DUSTROACH_GUTS_INSPECT: "بقايا صرصور وحلي سحقته صخرة ساقطة."
SHAMAN_STONE_CHAPEL: "هالة الكرب<br>ثمانية أقنعة صلبة، وروح مدومة هائجة.<br>اثنتا عشرة أكنيدة مهروسة، عصرت كل سوائلها.<page>ستة حجاج أحياء، علقوا طويلا حتى يصفوا ما فيهم."
WARD_LIFT_KEYHOLE: "قفل أبيض يحمل رمزا جراحيا."
WEAVE_HARP_MAP: "نقش يصور ويفنيست."
SLAB_MAP_GET_MSG: "خريطة اللوح الحجري"
LIBRARY_MAP_GET_MSG: "خريطة أقبية الهمس"
SWAMP_STOREROOM: "أصدافهم لنا. أرواحهم لنا.<br>وكراهيتنا أبدية."
ARBORIUM_ORDERS: "فشل الاحتواء. فقدت الذاكرة. استأصل الخارج. حافظ على الداخل.<br>استمر ركود غابة الأصداف - تذكر.<br>بلغ ركود أراضي النخاع مرحلة حرجة - تذكر.<br>تجاوزت بيئة فيردانيا حدودها - مصيرها النسيان."
ARBORIUM_PLAQUE: "هنا أنشئت، بموافقة قادة الجوقة المقدسة،<br>قاعة الذكرى في فارلوم.<br><br>ما يحفظ في الذاكرة لا يضيع أبدا."
WEAVE_WILDS: "نقش يصور دروبا تقود بعيدا عن فارلوم."
WEB_SHOT_WORKSHOP_PROMPT: "إصلاح الأداة المحطمة؟"
SONGGATE_MAP_GET_MSG: "خريطة البوابة الكبرى"
TUBE_HUB_NOTICE: "بسبب الارتفاع غير المقبول في الإصابات والوفيات غير المصرح بها، يمنع من الآن فصاعدا سفر الجميع عبر فنتريكا.<br>من أجل فارلوم الأبدية، يجب ألا تموت أي حشرة تخدمها."
WEAVE_MAP_GET_MSG: "خريطة ويفنيست أتلا"
SHELLGRAVE: "أيها الحاج<br>أنشد أغنية لمن يرقدون هنا صامتين.<br>خذلتهم قوتهم، فسقطوا قبل الصعود الأخير."
ABYSS_MAP_GET_MSG: "خريطة الهاوية"
STEEL_QUEST_SPOT_3: "<hpage>أفهم الآن... لقد تمادى خادم طفل الفولاذ...<hpage>أعرف ما يسعى هذا الهارب إلى استدعائه، وتشير نقوشه هنا بوضوح إلى مكانه. <hpage>ما يحاول فعله خطر وغبي. ولن تكون عاقبته إلا سيئة. علي الإسراع إن أردت إيقافه."
WEB_SHOT_WORKSHOP_MSG: "نقش قديم يعرض تصميما لسلاح من أسلحة النساجين."
ABYSS_HARP_MAP: "نقش يصور الهاوية."
WEAVE_WORKSHOP_SCROLL: "أيتها الأخت، أيتها العنكبوت، يا من جلست بين الملح والحجر،<br>اصنعي الأدوات التي تصورها العقل النير،<br>وأعينينا حين يخبو حريرنا."
STONE_GATE_NOKEY: "بوابة حجرية قديمة ذات ثقب مفتاح بسيط."
WEAVE_HARP_SHELLWOOD: "أيتها الأخت، أيتها العنكبوت، يا من ربط جسدك بالغصن،<br>احرسي هذه الحشرات لتعبر آمنة،<br>تحميها منك خشيتها،<br>فلم تعد طعاما لك."
CORAL_JUDGE_STORE: "أيتها الحشرة المولودة في فارلوم، لقد وقع عليك الاختيار.<br>عسى أن يقسي طلاء قلعتنا المقدس صدفتك الرخوة.<page>قفي إلى الأبد حكما لنا، فلا تطأ قاعاتنا المقدسة أي حشرة تحمل خطيئة."
PINSMITH_SIGN: "رحلت لأؤدي واجب الاحترام عند القبور في الغابة العظيمة.<br>- معلم الدبابيس بليني"
HARP_MAP_PROMPT: "أخذ الخريطة؟"
SLAB_WEAVER_GATE: "التائب، الأول من الأول.<br>مذنب بخطيئة الردة.<br>التكفير بالعصر.<br>رفض الغفران."
CRADLE_CAGE_01: "ناسج، من الفرع الثامن، وآخر سلالته، أنهكه العمر.<br>تعقب وأسر في ساندسي ويست.<br>فقد في المهمة سبعة من منشدي الجوقة وتسعة مبعوثين."
MAGNETITE_OUTCROP: "نتوء من حجر المغناطيس."
JAIL_ACT3_POCKET: "قماش ومواد يمكن صنع جيوب إضافية منها."
WEAVE_HARP_MOSSTOWN: "أيتها الأخت، أيتها العنكبوت، يا من ربط جسدك بالطحلب،<br>احرسي هذه الحشرات الوضيعة المولد،<br>وقد سما بها إيمان غذيناه،<br>فولدت ووقعت في شبكتنا من حيث لا تعلم."
WEAVE_PEAK: "أيتها الأخت، أيتها العنكبوت، إن كنت تسعين إلى التواصل مع المخلوق القابع فوق هذا الجبل، فاتخذي الصعود امتحانا، فهو تحد يفوق حتى ما أعددناه.<page>وحين تبلغين القمة وتحيين المخلوق، فاعلمي أنه سيختار هديته لك، وقد تكون الموت كما قد تكون البصيرة."
BILEHAVEN_PLAQUE: "اكرهوا نورهم. اكرهوا دبابيسهم. اكرهوا نفاياتهم التي تتدفق كثيفة بلا انقطاع.<page>املؤوا قلوبكم بالكراهية، فقد صارت القوة لنا، وبها سنعاقبهم."
SHELLWOOD_SHRINE_SIGN: "هنا نكرم البذرة التي أنبتت الغابة. <page>وبفضلها، عسى أن تعبر كل الحشرات آمنة لتنضم إلينا وإلى أغنيتنا."
AQUEDUCT_MAP_GET_MSG: "خريطة بوتريفايد دكتس"
CORAL_ZAP_CORPSE: "نتوء متصلب من فولتريديان."
WARD_MAP_GET_MSG: "خريطة الجناح الأبيض"
WEAVER_SPIRE: "يا ابنة الأرض البعيدة...<br>نحن الباقين قد طال انتظارنا...<br>اربطي قوتنا بقوتك...<br>واستعيدي مستقبل مملكتنا المسكونة..."
DOCKS_NOTE_2: "إن واصل المسكونون عملهم، فاتركوهم! لا يزال إلا من يعطل الإنتاج."
SONG_KNIGHT_TUBE: "آلة ذاتية ساكنة وصدرها فارغ."
GREY_ORDERS: "في الحصاد الثامن، أرسلوا:<br>خمسين مكيالا وتسع نبضات من خيط الرواسب ملفوفة على بكرات،<br>وأربعة عشر مكيالا من خيط الرواسب مفتولة،<br>وقسم الولاء من جميع العمال.<page>في الحصاد الثاني عشر، أرسلوا:<br>أربعين مكيالا من خيط الرواسب ملفوفة على بكرات،<br>ونبضتين من الخيط الناعم مفتولتين،<br>وقسم الولاء من جميع العمال.<page>"
CURIOUS_PILGRIM_DIARY: "في الهواء. في الماء. في كل مكان.<br>داخل أصدافهم. ملتف في الأعماق. في الأحشاء.<page>أشد التفافا حول القلب. ينبض بإيقاع.<br>مريض. حي. ميت؟<br>بل شيء أسوأ.<page>أعمق. يجب أن أنظر أعمق."
DOCKS_FLINTSTONE_BUCKET: "دلو يفيض بحجر صوان متقد."
BELLTOWN_OUTER_SIGN: "أيها الحاج<br>ترحب هذه المستوطنة بكل من يسلك الطريق المقدس.<br>عساك تريح صدفتك فيها، فتسترد قوتك وتحملك إلى مكان أعلى."
MOSSTOWN_STONE: "يا ناسج فارلوم.<br>بفضلك حميت. وبخيطك شفيت.<br>وامتنانا لعطائك الأبدي، نقدم أغنيتنا."
JAIL_ACT3_POCKET_PROMPT: "توسيع جراب الأدوات؟"
UNDERSTORE_MAP: "خريطة بدائية للأشغال السفلية."
PEAK_DJ_TUNING_FORK: "آلية ضبط نغم قديمة."
LIBRARY_THEATRE_LINES: "يا أرضا عظيمة تخبو نيرانها!<br>وقد خذلتها جوقتها وقادتها جميعا،<page>انظروا! وتشجعوا! فما زالت تلك الشرارة متقدة،<br>تلك الفراشة ذات البهاء القرمزي،<page>ستدوي الأجراس كلها، وترتفع الأصوات،<br>حين يعتلي تروبيو الشجاع المسرح أخيرا!"
ABYSS_LORE_STONE_BASE: "امح خوفنا،<br>وأزل رغبتنا،<page>كيلا نعاني بعد الآن،<br>أيتها الخواء، طهرينا."
PINSTRESS_SUMMONS: "رحلت لأتسلق جبل فارلوم المتجمد. إن وجدت حشرة تملك من الشجاعة ما يضاهي عزم دبوسي القاتل، فلتصعد وتواجهني على جانبه المطل على العواصف.<br>- سيدة الدبابيس"
SHAMAN_STORE_ROOM: "لهب مرتعش<br>خمسة أقنعة ذات روح مدومة، جمعت وشويت.<br>أربعة أحجار خبزها الغضب، سحقت إلى مسحوق خشن.<page>ثلاث أصداف طازجة من حجاج سقطوا، لاحتوائه وتعتيقه."
CRADLE_CAGE_02: "ناسج، من الفرع الثامن، وآخر سلالته، أصيب بجرح مميت.<br>تعقب وأسر في بلاك بارنز.<br>فقد في المهمة أربعة من منشدي الجوقة وريد واحد."
CITADEL_MAP_PROMPT: "آلة تعرض نموذجا للقلعة."
STEEL_QUEST_SPOT_2: "<hpage>الموقع الثاني الذي حدده طفل الفولاذ. استخدم تابعه هذا المخيم أيضا، وأجريت هنا شعيرة أخرى، لكنها لم تكتمل. <hpage>من الواضح أن الفعل تم على عجل. هل ظن أنه مطارد؟ النقوش هنا رديئة، لكن كلماتها مقلقة... ويائسة."
WISP_BOMB: "قماش ومواد حارقة يمكن صنع سلاح متفجر منها."
COG_FLIER: "صفائح أصداف وتروس يمكن صنع آلة طائرة ذاتية منها."
ABYSS_LORE_STONE_TOP: "صوتك في الصمت،<br>وهيئتك في الظلام،<page>نحن الساكنين في الأعالي نراك تبحثين،<br>وتشتاق أصدافنا إلى عناقك."
PILGRIM_REST_SIGN: "-اج<br>يا من تمسكت بالإيمان، لقد حملك بعيدا.<br>ستمنح هذه المحطة المتعبدين راحة قصيرة."
WEAVER_FIRST: "يا هجينة الأرض البعيدة...<br>انتظرت داخل هذا القفص...<br>اربطي قوتي بقوتك...<br>واستعيدي مستقبل مملكتنا الملعونة..."
BONETOWN_TOP_SIGN: "يا صغيرتي، لقد لبيت نداء الصعود. أصعد لأنضم إلى شيوخنا في ذلك المكان المقدس البعيد في الأعالي. عساك تقوين مع الوقت بما يكفي للقائنا هناك."
AQUEDUCT_MAP: "خريطة قديمة لبوتريفايد دكتس."
WEAVE_ARCHIVE_RIGHT: "إلى هذا العمق لم يبلغ بصرها.<br>تأهبن يا أخوات. انسجن الأمل من جديد.<br>لعلنا نتحرر من هذه الشبكة الملعونة التي نشأت من بدايتنا الساذجة."
BANK_DOOR_INSPECT: "باب مزخرف موصد بقفل بسيط."
SONG_KNIGHT_TUBE_PROMPT: "إدخال قلب التروس؟"
CORAL_JUDGEMENT_SIGN: "أيها الحاج<br>تقبل حكم الصعود القادم،<br>كي يثبت كل من يقف على ذروة فارلوم المقدسة نقاء إرادته ومبتغاه."
TAKE_MAP_PROMPT: "أخذ الخريطة؟"
CLOVER_OATH_PLAQUE: "طفلان ولدا متعانقين ثم افترقا،<br>طفلان موسومان بالحكم،<page>رقصا وغنيا، وأثبتا تفوق نصليهما،<br>لكن أحدا لم ينس مولدهما،<page>فالعاشقان المولودان على إيقاع واحد سيظلان ملعونين إلى الأبد."
ARBORIUM_MAP_GET_MSG: "خريطة قاعة الذكرى"
TROBBIO_SIGN: "أيتها الحشرات العظيمة! يا من تبكون فيما تتلاشى مملكتكم،<br>انضموا إلي على المسرح.<br>معا سنضرم جذوة الشغف في فارلوم!"
CRADLE_MAP_GET_MSG: "خريطة المهد"
STEEL_QUEST_SPOT_1: "<hpage>وضعت طفلة الفولاذ علامة على هذا الموقع. هذا المخيم قديم، لكن ما زالت فيه آثار واضحة لمحاولة أداء شعيرة.<hpage>يبدو أن ما أمل التابع تحقيقه هنا قد فشل. لعل المواقع الأخرى المعلمة تكشف مزيدا من الدلائل على مقصده."
CRADLE_CAGE_03: "ناسج، ربع دمها منهم، وآخر سلالتهم، مقيدة للخدمة.<br>تعقبت وأسرت تحت مدينة الفولاذ.<br>فقد 8 من منشدي الجوقة و12 من المبعوثين في المهمة."
COG_MAP_GET_MSG: "خريطة قلب التروس"
UNDERSTORE_CHURCH: "بمجد قلعتنا، لكم أيها المؤمنون المكرمون أن تنعموا قليلا بنورها المقدس."
HALLS_MAP_GET_MSG: "خريطة قاعات الجوقة"
SLAB_MAP_PROMPT: "جسد أجوف نقشت على صدفته خريطة اللوح الحجري."
