SEAMSTRESS_BROLLY_QUEST_REOFFER: "هل أنت مستعدة لإعادة النظر في عرضي؟ هذا أفضل لك! لن تصلي بعيدا من دون مساعدتي يا عزيزتي."
SEAMSTRESS_REPEAT: "سأعاملك بلطف أيتها الشاردة، بل وسأساعدك حيث أستطيع. لكن لا تمكثي هنا طويلا.<page>قد لا أحب تلك القلعة، لكنني ذكية بما يكفي لتجنب إثارة غضبها."
ANT_MERCHANT_REPEAT: "خا مواك. نوكو غري؟"
PILGRIM_REST_SHOP_REMEET: "عدت إلى هنا مجددا؟ إنه حج غريب ذاك الذي ينعطف ويعود على خطاه. ومع ذلك، يمكنك اغتنام الفرصة ومشاركتي مسابحك."
SEAMSTRESS_EXTRA_LORE_2_ALT: "أكره أن أفسد المفاجأة، لكن فضولي يدفعني إلى السؤال. هل تعرفين لماذا طاردتك حشرات القلعة؟<hpage>رأيت قلعتهم والحالة التي آلت إليها، ولدي شك قوي...<hpage>إنهم يطاردونني بسبب طبيعتي، وبسبب الحرير الذي تنتجه صدفتي. لا يريدونه لأنفسهم، بل لمن تقبع فوق المملكة كلها.<page>آها! تلك هي الحقيقة. موهبتك نادرة في فارلوم، ولا تقدر بثمن: أن توجهي روحك عبر خيط. الروح والحرير مرتبطان بلا انفصال.<page>كادت هذه المهارة تضيع من فارلوم. امتلكها النساجون القدامى، لكنهم ماتوا منذ زمن بعيد.<hpage>من تقبع على قمة هذه المملكة... تشاركني طبيعتي، أو جزءا منها. رأيت حريرها يعمل على نطاق هائل.<hpage>إنه يأسر أصداف السائرين على الطرق، ويحرك بحياة زائفة الجثث الجوفاء الكثيرة المتروكة لتتهاوى.<page>همم... لقد توغلت في البحث عن حقيقتها، بل اقتربت أكثر مما أجرؤ أنا على الحفر. لكن يبدو عليك أنك قادرة على تحمل مسائل ثقيلة كهذه...<page>والآن! آن لك أن ترحلي! أسلوبك وحريرك رائعان حقا، لكن بقاءك طويلا لن يجلب لي سوى المتاعب!"
SEAMSTRESS_BROLLY_QUEST_ACCEPT: "اختيار ذكي. انطلقي واجمعي نوى تلك الأشواك، ومن الأفضل أن تسرعي.<page>رغم سروري برفقتك، فإن بقيت طويلا فستوجه حشرات القلعة أنظارها إلي أيضا."
SEAMSTRESS_BROLLY_QUEST_OFFER: "إن كنت تنوين الصعود من هذه الحقول المنخفضة، فستحتاجين إلى بعض قوة الرفع، وأنا خير حشرة لمساعدتك.<page>توجهي إلى الكهوف الواقعة خلف منزلي. تنتج الحشرات هناك أشواكا ذات نوى عجيبة، مرنة وقوية في آن واحد.<page>اقطعي أشواكها واجمعي النوى. عودي إلي، وسأحول عباءتك القديمة بسرعة إلى عباءة أكثر قدرة على التحليق."
ANT_QUEEN_BG_MEET: "أيتها الوحشة الشاحبة... تجلبين الخراب... كنا نشعر به... وتخطين بقسوة مصيرنا الأخير...<page>إن كنت تبحثين... عن القوة... فقد تلاشت قوتي... وفني العمر...<hpage>لا أسعى إلا لإنقاذ هذه الأراضي أيتها العظيمة، وتحريرها من هذا الداء القاتل المولود من الخيط والفراغ.<page>كشا! إن استطعت... أيتها الوحشة... إن كان في وسعك..."
SEAMSTRESS_BROLLY_HANDIN_ASK: "حسنا إذن! أستطيع أن أعرف من القعقعة داخل عباءتك أن صيدك نجح! ناوليني النوى من فضلك، وسأبدأ العمل."
ANT_QUEEN_BG_REPEAT: "أنقذيهم... إن استطعت... أيتها الدابة الشاحبة..."
RESTING_PILGRIM_REPEAT: "آه... أنا متعب جدا. لكن البقاء طويلا سيكون تدنيسا للمقدسات..."
HUNTRESS_QUEST_DECLINE: "حسنا أيتها العنكبوت. احتفظي بأحشائك، في الوقت الراهن."
SEAMSTRESS_VISITED_CITADEL: "<page>أوه! أيتها الشاردة. أخبريني، كيف تسير رحلتك؟<hpage>بلغت الأعالي ورأيت القلعة وحالها. ضاع ذلك المكان منذ زمن... منذ أجيال. قبر مذهّب غارق في بقايا الحرير.<hpage>أما أتباعها الذين انقادوا إلى أسري، فقد أدركت الآن بوضوح مصدر وحدتهم وقوتهم الغريبة... إنهم قشور خاوية، أحكم من ينتظر عند قمتها وثاقها...<page>آه! انظري إلى نفسك! نفذت ببصرك إلى صميم الحقيقة، وأعمق مما أجرؤ أنا على نبشه. لكنك تبدين قادرة على تحمل أمور خطيرة كهذه...<page>والآن، يجدر بك الرحيل. من الواضح أنك تنوين إثارة متاعب خطيرة، ولا أريد أن أكون قريبا حين تبدأ!"
PILGRIM_REST_SHOP_ITEM_DESC_TOOLPOUCH: "ذلك الجراب الذي تحملينه... بما بقي هنا من قصاصات وقليل من العمل، أستطيع أن أضيف إليه بعض الجيوب، فتتمكنين من حمل أدوات وشظايا أكثر في الطريق. سيكون ذلك لطيفا، أليس كذلك؟"
HUNTRESS_REPEAT: "كل تلك الحشرات اللزجة، وكلها ترفض مشاركة أحشائها. كم تطلب الأمر من استدراج وقضم ونخس.<page>ينبغي أن تفخر! فتضحيتها الصغيرة ستصير غذاء وفيرا لصغاري الشرسين."
PILGRIM_REST_SHOP_TALK_DELIVERY_POST: "خذي هذه المسابح لقاء جهودك. وآمل ألا تثقل كثيرا على صدفتك."
HUNTRESS_QUEST_ACCEPT: "<hpage>لن أقدم لك أحشائي، أيتها الصيادة، لكن يمكنني أن آتيك بلحم آخرين قتلوا.<page>عنكبوت طيبة! مثقوبا، ممزقا، مشويا! أحضريه كله. سنحتاج إلى الكثير، ما يكفي لإشباع صغاري الآتين.<hpage>يمكن لعدة من أدواتي تجهيز اللحم كما تطلبين. وقد حالفني الحظ فوجدت في أراضيك ترسانة متنوعة.<page>لم يبق على فقس صغاري وقت طويل، أيتها العنكبوت. أدي واجبك سريعا، وسترين مكافأة على المذبحة."
SEAMSTRESS_BROLLY_QUEST_REPEAT: "<hpage>سأحضر لك أنوية الأشواك قريبا، سيدتي.<page>جيد، جيد! الكهوف بعد هذا المكان مباشرة تعج بالمخلوقات، تطفو بلا اكتراث في الهواء الدافئ.<page>أنا واثقة أن إبرتك الكبيرة تستطيع إقناعها بمنحك أشواكها. وبعدها لا يتطلب الأمر سوى شقها وانتزاع الأنوية."
PILGRIM_REST_SHOP_ITEM_DESC_WEIGHTED_ANKLET: "عبء مقدس يحفظ ثباتك. سواء وجهت ضربة أم تلقيتها، ستبقين راسخة في مكانك."
PILGRIM_REST_SHOP_CANCEL: "ألست مهتمة بالتجارة؟ أتساءل إن كانت مسابحك ستثقل عليك أثناء الصعود."
SEAMSTRESS_BROLLY_QUEST_COMPLETE: "ممتاز! هذه تكفي وزيادة. انتظري هنا لحظة، وسرعان ما ستحلقين بعيدا عن هذه الأراضي المنخفضة."
ANT_MERCHANT_MEET: "ركرها. أوهك خا!<hpage>أعتذر، سيدي. مع أنني أفهم لغات حشرات كثيرة، فإن كلماتك غريبة حتى علي.<page>خا... خا ماواك. نوكو... غري؟<hpage><hpage>هذه الأشياء التي جمعتها هي متاع محارب. هل ترغب في المقايضة؟<page>نوكو... نوكو!"
SEAMSTRESS_ACT_3_REPEAT: "أسرعي أيتها الشاردة! كلنا نعاني بسبب صراعك... لعلّك تختارين في المرة المقبلة حلا أهدأ، أليس كذلك؟"
PILGRIM_REST_SHOP_ITEM_DESC_SHARD_POUCH: "يمكن لهذه الشظايا المتواضعة أن تجتمع فتصير شيئا عظيما، إن امتلكت البصيرة اللازمة لتشكيلها."
SEAMSTRESS_BROLLY_HANDIN_REFUSE: "بعد كل ذلك الصيد، ألا تأتمنينني على غنائمك؟ إنك عجيبة. لن تنفعك وهي تملأ جيوبك فحسب!"
SEAMSTRESS_WEARING_ORDER_BADGE: "تتباهين بدبوس فاخر على عباءتك. آمل ألا تكوني قد اضطررت إلى القتل لتحصلي عليه.<hpage>منحت الشعار طوعا، أيتها الخياطة، مكافأة على فوزي النزيه في مبارزة شرسة.<page>طوعا؟! يا للعجب. إذن رحبت أختي بأخرى في الجماعة... يبدو أن السن لينت حتى طبعها الصارم.<page>لا أحن كثيرا إلى الطرق القديمة... لكن بعض الطقوس وبعض الذكريات... ما زالت جديرة بالحفظ."
ANT_MERCHANT_SHARD_POUCH_DESC: "ركرها. تنك أوكن."
PILGRIM_REST_SHOP_PURCHASED: "نعم، هذا أفضل. مشاركتك إياي تفانيك ستجلب لك الحظ بالتأكيد."
SEAMSTRESS_MEET_ALT: "يا لك من منظر! لا، لا تخبريني! لا مثيل لغرابتك.<page>وقارك! هيئتك! هل أنت مطاردة؟ هل يلاحقك أحد؟ سترى القلعة فيك غنيمة ثمينة.<hpage>الأمر كما قلت، سيدتي. حشرات ملثمة من القلعة أحضرتني إلى أرضكم. أبحث الآن عمن يجيبني عن السبب، وسأنتزع الجواب بالقوة إن لزم.<page>ها! وشرسة أيضا! هذه أزمنة قاتمة، لكن شاردة قوية مثلك تستطيع إحداث بعض التغيير.<page>حسنا إذن! لا أحب تلك الطائفة المقدسة، ويقلقني ما أصاب هذه المملكة. إن كنت تريدين تصفية حساب، فربما استطعت مساعدتك."
RESTING_PILGRIM_DAZED: "أوووه... آه..."
HUNTRESS_QUEST_REPEAT: "أنتظر اللحم، أيتها العنكبوت. أحضري لي الكثير، ما يكفي لإشباع صغاري الآتين."
HUNTRESS_MEET: "أيتها العنكبوت... رائحتك غريبة... لكنها مألوفة. أشم توترك بوضوح. هل أبدو لك خطرا؟<hpage>أبقى على حذري في هذه الأرض كلها، أيتها الطويلة، ويبدو أن مخالبك استعملت حدتها كثيرا.<page>نعم... أقتل بسرور، لكن فقط لأطعم صدفتي وصغاري الآتين.<page>لحمك... قد يمنح غذاء وفيرا... لكن انتزاعه صعب... ومخلبك الطويل الزائف سيرد سريعا.<hpage>جيد، إذن تدركين مهارتي كما أدرك مهارتك. فلنعقد هدنة، ولنعش كلتانا بعد هذا اللقاء."
SEAMSTRESS_ACT_3_MEET: "أيتها الشاردة! كانت الأمور تزداد سوءا قبل رحيلك، والآن صارت أسوأ! العالم كله يهتز ويولول، والخيوط المسودة تمتد في كل مكان!<page>ليس هذا من فعلك، أليس كذلك؟<hpage>أنا مسؤولة جزئيا، لكنني لم أقصد هذه النتيجة، وسأعمل على تهدئة الأمر.<page>كنت أعرف! لا بد أنك السبب. كنت آمل أن تجلبي تغييرا، لكنك جلبت النهاية!<page>هيا أسرعي! باشري الإصلاح. كلنا نعاني الآن بسبب ضخامة صراعك... لعلّك تختارين هذه المرة حلا أهدأ، أليس كذلك؟"
H_RUNT_QUEST_ACCEPT_LACK_TOOLS: "<hpage>قد أوفر لك اللحم مع الوقت، يا صغيري، لكن علي أولا الحصول على أدوات تناسب المهمة. ترسانتي الحالية لن تحقق رغبتك كاملة.<page>الوقت... نعم؟... عندها نكبر نحن أيضا؟... مخالب حادة... صدفة صلبة... مثل إخوتنا الراحلين..."
H_RUNT_QUEST_COMPLETE: "نعم... الآن نحن أيضا نكبر... نلتهم... نصير مثل الإخوة... رحلوا... كلهم... بعيدا جدا...<hpage>حظا موفقا، يا صغيري. إن أمكن إنقاذ هذه الأرض، فآمل أن تجد مكانك فيها."
HUNTRESS_QUEST_ACCEPT_LACK_TOOLS: "<hpage>لن أقدم لك أحشائي، أيتها الطويلة، لكن يمكنني أن آتيك بلحم آخرين قتلوا.<page>عنكبوت طيبة! مثقوبا، ممزقا، مشويا! أحضريه كله. سنحتاج إلى الكثير، ما يكفي لإشباع صغاري الآتين.<hpage>طلبك كبير. علي أولا الحصول على أدوات تناسب المهمة. ترسانتي الحالية لن تحقق رغبتك كاملة.<page>لم يبق على فقس صغاري وقت طويل، أيتها العنكبوت. ابحثي عن أدواتك، وأدي واجبك سريعا، وسترين مكافأة على المذبحة."
ANT_MERCHANT_CURVE_CLAWS_DESC: "أواخ خي. رنكا. أواخت رك."
PILGRIM_REST_SHOP_RUCKUS: "ذلك الوحش! ما هذه العقوبات القاسية التي أرسلت لتمتحننا؟ لماذا نعذب نحن الحجاج، مع أننا لم نرتكب شرا؟<page>أخبريني، أين كتب هذا؟ أين القانون الذي يقول إن علينا تحمل كل مشقة لمجرد نيل أضعف أمل في السعادة؟<hpage>أراض برية كهذه تحكمها الغريزة لا القوانين. عليك الاعتماد على قوتك ومهارتك لتنجو.<page>لا قوة لدي ولا مهارة! إن كان كلامك صحيحا، فالأفضل أن أزحف إلى الخارج وأدعها تلتهمني الآن، وأوفر على نفسي بعض القلق!<hpage>افعل ما تشاء، لكنني أظنك تقلل من شأن نفسك. فالصعود إلى هذا الحد والبقاء هنا كل هذا الوقت مهمة يعجز عنها معظم رفاقك الحجاج.<page>همف. لست أفضل من أي منهم. لم يبلغ بي إلى هنا إلا الحظ، وسأظل أعتمد عليه."
SEAMSTRESS_BROLLY_QUEST_DECLINE: "كما تشائين أيتها الشاردة. سيكون الصعود إلى ما فوق هذه الحقول شاقا من دون موهبتي."
PILGRIM_REST_SHOP_TALK_DELIVERY: "<hpage>سيدي الحاج، أحمل مؤنا من قلب الجرس لمساعدة المسافرين الذين يمرون بهذه المحطة.<page>يا لها من خدمة... يبدو أن دعواتنا لا تذهب كلها سدى. ستلبي هذه المؤن أمنيات صغيرة كثيرة."
HUNTRESS_QUEST_REOFFER: "هل تهدين صغاري أحشاء، أيتها العنكبوت؟ ما إن يستيقظ أطفالي لأول مرة حتى يستبد بهم الجوع."
H_RUNT_MEET_QUEST_ACTIVE: "<hpage>كنت قد وعدت أمك بأحشاء، يا صغيري. ومع أنها ماتت، فسأعطيك إياها إن بادلتني بها مكافأة صغيرة.<page>اللحم؟... لنا؟... نعم، أيتها الصيادة! لدينا هدايا... مخالب طويلة...<page>أحضري اللحم... أعطينا اللحم... نريد أن نقوى كثيرا... ونصير مثل إخوتنا، حادين، صلبين..."
H_RUNT_REPEAT: "حتى نحن... الآن نكبر نحن أيضا... شرسون... صلبون...<page>سنصبح صيادين نحن أيضا..."
SEAMSTRESS_EXTRA_LORE_2: "لا أحب إفساد المفاجأة، لكن فضولي يدفعني إلى السؤال: هل تعرفين لماذا يطاردونك؟ أعني حشرات القلعة.<hpage>لا يقين لدي، لكنني أشتبه بقوة في السبب...<hpage>إنهم يطاردونني بسبب طبيعتي، بسبب الحرير الذي تنتجه صدفتي.<page>آها! هذه هي الحقيقة بلا شك! في فارلوم، قدرتك مهارة نادرة لا تقدر بثمن: أن تنسجي الروح في خيط. الروح والحرير مرتبطان بلا انفصال.<page>إنها مهارة كادت تضيع من فارلوم. امتلكها النساجون القدماء، لكنهم ماتوا منذ زمن بعيد.<hpage>هناك أخرى حية في هذه المملكة تشاركني طبيعتي، أو جزءا منها. رأيت حريرا يشبه حريري، ينصب شباكه لأصداف من يسلكون الطرق.<hpage>رأيته يلتف حولهم ويستولي عليهم بالكامل. وفي ذلك الخيط إرادة، يبدو أنها تصدر من مكان فوقنا. القلعة...<page>همم... لديك عين حادة. القلعة... كل الطرق تقود إليها، وكل الأجوبة تنتظر فيها، لكن الصعود إليها طويل يا عزيزتي.<page>والآن حان وقت رحيلك! أسلوبك وحريرك رائعان حقا، لكنك إن أطلت البقاء فلن تجلبي لي إلا المتاعب!"
H_RUNT_QUEST_COMPLETE_DECLINE: "أتحتفظ بها؟... نريد اللحم، أيتها الصيادة... نحتاج إلى القوة... بقدر الآخرين... بقدر الأم..."
PILGRIM_REST_SHOP_ITEM_DESC_LOCKET: "الذكريات لا تفعل سوى إثقالنا، لكن بعض الحجاج ما زالوا يتشبثون بها بتفان لا يليق. هذه الذكرى ليست لك، لكن لعلها تنفعك."
ANT_MERCHANT_FRACTURED_MASK_DESC: "خا أوكن. كركا تيه."
H_RUNT_QUEST_REOFFER: "نحتاج إلى اللحم... أيتها الصيادة... تجدينه... تحضرينه... كي نكبر نحن الصغار مثل إخوتنا..."
H_RUNT_QUEST_COMPLETE_PRE: "اللحم... رائحته... أحضرته؟... كي نكبر مثل إخوتنا، أقوياء في أصدافنا؟"
H_RUNT_QUEST_ACCEPT: "<hpage>يمكن لعدة من أدواتي تجهيز اللحم كما طلبت، يا صغيري. ومع الوقت سأحقق رغبتك.<page>إذن... نحن أيضا سنكبر؟... مخالب حادة... صدفة صلبة... مثل إخوتنا الراحلين..."
SEAMSTRESS_EXTRA_LORE_1: "لحظة فقط يا عزيزتي، قبل أن تنطلقي مسرعة!"
HUNTRESS_QUEST_COMPLETE: "أحسنت أيتها العنكبوت. سيلتهم صغاري هذا اللحم الطيب ويكبرون.<hpage>وأحشاء الآخرين خير من أن يلتهموا أحشاءك، أليس كذلك؟<page>سسسككك... لا عجب أن تدرك العنكبوت حقيقة مطالبي.<hpage>رأيت صغار من هن مثلك على هذه الحال مرات كثيرة. سيولدون جياعا، بأسنان ومخالب حادة.<hpage>وفي هياج ولادتهم، سيلذ لهم لحمك كما يلذ لحم أي حشرة أخرى. هذه الوليمة إلهاء لهم، على أمل إنقاذ صدفتك.<page>أهذا مخز؟ أم لا تضحي بنفسها لينمو أطفالها أقوياء؟ أهو خطأ أن أرغب في مشاهدة طيرانهم الأول وصيدهم الأول، وأن أراهم يقتلون وينمون؟<hpage>الخيار لك وحدك، أيتها الأم الطويلة. لن أدينك. رأيت من التضحيات ما يكفي، ولا أحب هذا الفعل."
ANT_QUEEN_HASMELODY_FLOWER_OWNED: "أيتها الدابة الشاحبة... جالبة الخراب... شعرنا بك... تخطين بقسوة مصيرنا الأخير...<page>إن كنت جئت تطلبين القوة... فقوتي خبت... زائلة... أخذها الزمن...<hpage>أيها العظيم، لم آت لأراك كما أنت، بل لأعرفك كما كنت، قبل الملك الشاحب، حين كان قلبك نابضا مشرقا شجاعا.<page>كتشا! إذن شاهديني... أيتها الدابة... تلك الذكريات البعيدة... كانت قوتي يوما... جامحة... أبية..."
ANT_QUEEN_HASMELODY_REPEAT: "قوتي... سلطاني... أيمكنك انتزاعهما أيتها الدابة الشاحبة؟ أأنت بهذه القوة؟...<hpage>فلنكتشف ذلك معا، أيها العظيم..."
H_RUNT_QUEST_REPEAT: "أحضري اللحم... أيتها الصيادة... كثيرا...<page>لنقوى نحن أيضا... نكبر... ونصير من الإخوة..."
SEAMSTRESS_BROLLY_AFTER_GET: "<hpage>هذا عمل متقن، أيتها الخياطة. ستفيدني تعديلاتك كثيرا.<page>على الرحب يا عزيزتي. نادرا ما تتاح لي فرصة ممارسة خياطة بهذه الدقة، ومحاربة مثلك ستقدر إضافاتي حق قدرها.<page>حلقي بعيدا الآن أيتها الشاردة، وحاولي ألا تموتي. لا أريد أن يضيع عملي الشاق سدى."
HUNTRESS_TALK_CITADEL: "هل رأيتها... أيتها العنكبوت الصغيرة... تلك القلعة القاسية التي تجثم بثقلها فوق هذه الأرض؟<page>قد يبدو جوعي عظيما، لكن ذلك المكان... نهم لا ينتهي..."
PILGRIM_REST_SHOP_TALK_REPEAT: "نحن الحجاج يعيل بعضنا بعضا، سواء كنا أحياء أم أمواتا. والمشاركة علامة على التفاني، وخاصة لدى من يعطون."
HUNTRESS_QUEST_OFFER: "أتبقين أيتها العنكبوت؟ يحتاج صغاري إلى لحم كثير... إلى أحشاء الآخرين، أم تفضلين أن تقدمي أحشاءك أنت؟<page>أتمنحينهم أحشاء صدفة دافئة، وليمة شهية لأول طعام بعد ولادتهم؟"
HUNTRESS_QUEST_COMPLETE_PRE: "إنها معك أيتها العنكبوت! تفوح منك رائحة كل تلك الأحشاء الغنية المهيأة للوليمة."
PILGRIM_REST_SHOP_MEET: "أتيت لتريحي جسدك المنهك؟ الصعود عذاب، وحتى أشد الناس إيمانا عليهم ألا يتجاوزوا طاقتهم.<hpage>يدهشني أن يصل إلى هذا العلو من لا يقبض مخلبه بثبات على سلاح.<page>نعم، حالفنا الحظ حتى وصلنا إلى هنا. كنا أوفر حظا من كثيرين غيرنا. أم لعل الفارق بين المحظوظ ومن لا حظ له ليس سوى الإيمان؟<page>والآن، ما دمنا نستريح، هل نتاجر؟ إن كانت لديك مسابح فسآخذها بسرور."
H_RUNT_QUEST_OFFER: "الصيادة... باقية... المخلب اللامع... ساكن... هل يساعدها... على البحث؟<page>نحتاج نحن أيضا إلى لحم كثير... أيتها الصيادة... نريد الكثير... مشويا... مثقوبا... ممزقا...<page>نريد أن نقوى كثيرا... ونصير مثل إخوتنا، حادين، صلبين..."
SEAMSTRESS_MEET: "يا لك من منظر! لا، لا تخبريني! لا مثيل لغرابتك.<page>وقارك! هيئتك! هل أنت مطاردة؟ هل يلاحقك أحد؟ سترى القلعة فيك غنيمة ثمينة.<hpage>الأمر كما قلت، سيدتي. حشرات ملثمة أحضرتني إلى أرضكم. أبحث عنها الآن طلبا للأجوبة.<page>ها! وشرسة أيضا! هذه أزمنة قاتمة، لكن شاردة قوية مثلك تستطيع إحداث بعض التغيير.<page>حسنا إذن! لا أحب تلك الطائفة المقدسة، ويقلقني ما أصاب هذه المملكة. إن كنت تريدين تصفية حساب، فربما استطعت مساعدتك."
H_RUNT_MEET: "أيتها الصيادة... مخلبك اللامع... لا تقتليني... صدفتي رقيقة، ولحمي رديء المذاق...<page>ولدت مختلفا عن إخوتي، فقد كانوا كبارا وصلبين... أكلوا جميعا وشبعوا ثم طاروا.<hpage>أرى الأمر بوضوح، يا صغيري. أطعم لحم الأم الطويلة الصغار بعد فقسهم.<hpage>لقيت مصيرا شائعا. لعلّه أشيع مما ينبغي...<page>رحلت... الأم، لحمها... وحياتها... ليقوى إخوتنا... لا لنا نحن الصغار... أبدا لنا..."
ANT_QUEEN_HASMELODY: "أيتها الدابة الشاحبة... جالبة الخراب... شعرنا بك... تخطين بقسوة مصيرنا الأخير...<page>إن كنت جئت تطلبين القوة... فقوتي خبت... زائلة... أخذها الزمن...<hpage>أيها العظيم، لم آت لأراك كما أنت، بل جئت لأوقظ ذكراك كما كنت، قبل الملك الشاحب، حين كان قلبك نابضا مشرقا شجاعا.<hpage>أريد أن آخذ ذلك القلب النابض، لكن اعلم أن قصدي نبيل.<hpage>لا أطلبه إلا لإنقاذ هذه الأراضي وتحريرها من هذا المرض القاتل المولود من الخيط والفراغ.<page>كتشا! إن أمكنك... أيتها الدابة... إن كان في وسعك... كانت قوتي يوما... جامحة... أبية..."
H_RUNT_QUEST_DECLINE: "<hpage>صار مصير أرضك بالغ السوء، يا صغيري. لا يمكنني التأخر الآن لمساعدتك على النمو.<page>إذن الصيادون يعيشون... يقتلون... لأنفسهم وحدهم... مثل إخوتنا..."
PILGRIM_REST_SHOP_TALK2: "هذه الحقول حارة وقاسية، مكان بائس لنا نحن الحجاج، وفوقها مباشرة مستنقعات كئيبة، كانت يوما وافرة الخيرات ثم ضاعت تحت الطمي الهابط والمطر العكر.<page>تعاقبنا الأراضي في كل اتجاه، لكن هذا هو اختبارنا. وفوق كل ذلك تلمع القلعة، وجهتنا ومكافأتنا...<page>سأبلغها، سترين. استحققت مكاني في فردوس كهذا بسهولة."
PILGRIM_REST_SHOP_TALK1: "<hpage>أهذا المكان منزلك الدائم، سيدي، أم أنك تخيم هنا فحسب؟<page>ليس لنا نحن الحجاج وطن، ليس هناك سوى الطريق. نصعد ونعاني، وعلى ذلك يحكم علينا.<page>لن أمكث هنا إلا قليلا من أجل التجارة. حين أجمع ما يكفي من المسابح، سأكون مقدسا بما يكفي للصعود بلا خوف."
SEAMSTRESS_MET_PINSTRESS: "<hpage>في الطرف الآخر من فارلوم، صادفت حشرة تشبهك شبها عجيبا.<hpage>من بيتها ولباسها ومهارتها، أظن أن بينكما صلة، أليس كذلك؟<page>نعم. التقيت أختي إذن، أختي في الطائفة على الأقل. يسعدني سماع أنها ما زالت حية.<page>كانت آخر من ظل وفيا لطرق الدبوس القديمة... أما أنا فلم أعد أؤمن بكثير من تلك القيم العنيفة.<page>أحذرك أيتها الشاردة، قد تبدو أختي مرحة فاتنة، لكن تحت ذلك تختبئ روح قاتلة."
HUNTRESS_QUEST_COMPLETE_DECLINE: "أتحرمين صغاري من قوتهم، أيتها العنكبوت؟ أنت مخلوقة قاسية. لا تحتاج صدفتك الصغيرة إلى كل هذا بالتأكيد، أليس كذلك؟"
PILGRIM_REST_SHOP_ITEM_DESC_COINSET_S: "سأنظم مسابحك في خيط محكم لقاء أجر بسيط. تلك أسلم طريقة لإبقائها قريبة منك."
RESTING_PILGRIM_MEET: "أوووه... يا أختي، صدفتي المتألمة توشك أن تتحطم. صوتي يضعف... ولا أكاد أستطيع إنشاد كلمة.<hpage>أخشى ألا يكون الطريق أمامك أيسر، سيدتي. إن لم تستطيعي التخلي عن حجك، فعليك على الأقل أن تستريحي جيدا قبل المتابعة.<page>آه... لكن الشوائب تلاحق كل خطوة نخطوها، يا أختي. إن استرحنا طويلا فستدركنا. هكذا... تقول الأغنية..."
