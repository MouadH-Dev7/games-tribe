MASK_MAKER_UNMASK_TALK_04: "<hpage>راقبت حشرات أرضك وهي تصعد نحو خلاصها، من غير أن يخطر لها لحظة ما يعنيه ذلك.<page>نعم. ولكن أليس هذا دائما حال من وقعوا في الشرك لخدمة طبقتك العليا؟<page>تحدى حشدنا الفاني ذلك يوما، وربما فعل بلا وعي، لكنه نجح بعض النجاح، ودفعهم إلى ذلك ما أراده النسّاجون وسواهم.<hpage>أتتحدث عن القلعة؟ أخفقت وظيفتها القديمة، لكنني ما زلت أستشعر شيئا من غايتها. إنها كنيسة وقفص معا.<page>نعم. ذلك المسخ من صنع أسلافك وعقولهم الشريرة الماكرة. إنه نظام، أو شبكة كما كانوا سيسمونه على الأرجح؛ وسيلة لإبقاء أمهم حبيسة النوم، ولينعموا هم بحكمهم الزائف."
MASK_MAKER_UNMASK_DELIVERY: "<hpage>أيها الصانع، أحمل إليك شحنة من قلب الجرس في الأسفل: طلاء لعملك الطويل.<page>آه. اعلمي أنك تقلبين نظام الأشياء أيتها العتيقة. فمن النادر أن ترغب طبقتك في خدمتنا نحن الحشرات الفانية.<hpage>أنا لست كسائر بني جنسي، أيها الصانع. رأيت من الآلام التي ولدها سلطانهم ما يكفي. وأختار الابتعاد عنهم قدر استطاعتي.<page>إن كان دمك يسمح لك بذلك... ومع هذا، أشكرك على الطلاء. سترحب وجوه فارلوم الجديدة ببريقه."
MASK_MAKER_REPEAT1_ACT3: "حتى تنهار الكهوف، يجب صنع الأقنعة!"
MASK_MAKER_UNMASK_REPEAT_ACT3: "كفى حديثا أيتها العتيقة. ما زال عقدي قائما. سأعمل حتى تنهار الكهوف.<hpage>حسنا أيها الصانع. إن كان إنقاذ أراضيك في مقدوري، فسأفعله."
MASK_MAKER_UNMASK_MEET: "آه، أيتها العتيقة. كان ينبغي لبني جنسك أن يعرفوا أن كشف وجهي هكذا وقاحة. فمن دون قناع يغدو العمل شاقا.<hpage>أردت أن أسمعك وأنت صافي الذهن، أيها الصانع، وإن اعترضت.<page>نعم. ليس مجيئك مفاجأة كبيرة. شعرت ببوادر يقظة مليكتنا حتى من هذا المكان البعيد، وبالرجفات حين اقتربت واحدة من بني جنسها.<page>أتخططين لمواجهتها إذن؟ تلك التي في القمة؟ إلهتنا العظيمة المهترئة؟<hpage>يبدو أن لقاءنا محتوم، لكنني أبحث أولا عن القوة التي تضمن نتيجة في صالحي.<page>ها! كما توقعت! لم يعرف عن بني جنسك القدماء أنهم يتعايشون بسلام.<page>على أي حال، إن انتصرت، فلا أطلب سوى أن يستمر عملي. مهما آلت إليه هذه الأراضي، فأنت تعلمين ضرورة خدمتي."
MASK_MAKER_UNMASK_PREVIOUSLY_MET_ACT3: "عدت مجددا أيتها العتيقة؟ يمكن بوضوح استشعار آثار... نزاعك مع الأم الشاحبة. يبدو مصير هذه الكهوف قاتما.<page>أظن أن الأمور أصبحت أكثر تعقيدا؟ أم أنكم توقعتم هذه العواقب منذ البداية؟<hpage>وجهت في لقائنا ضربة قاتلة، لكن سكرات موت الملكة اليائسة تهدد الآن بأن تأخذ معها هذه المملكة كلها.<page>ها! لم أتفاجأ! هكذا تسير الأمور دائما، أليس كذلك؟ يتنازع بنو جنسك القدماء على السلطان، ونسحق نحن الحشرات الفانية تحتهم من دون أن يلحظنا أحد.<hpage>الحرية هي ما سعيت إليه، أيها الصانع. ربما كنت ساذجة، لكن هذا ليس المصير الذي تمنيت وقوعه."
MASK_MAKER_REPEAT1: "كل مخلوق يستحق وجها وفرصة للوجود! وحتى أذبل، سأمنح من لا وجوه لهم وجوها."
MASK_MAKER_REPEAT2_ACT3: "للوجود والموت، لا بد من وجه. إنه جوهر الأمر."
MASK_MAKER_DELIVERY: "<hpage>أيها الصانع، أحمل إليك شحنة من قلب الجرس في الأسفل: طلاء لعملك الطويل.<page>جيد! جيد! للإحكام والحماية. عسى أن تتألق وجوه فارلوم الجديدة."
MASK_MAKER_POST: "خذي مكافأة على خدمتك أيتها الزائرة! هدية لك، أنفقيها أو احتفظي بها كنزًا!"
MASK_MAKER_MEET: "زائرة! ما أعظمك. لكن لديك قناع بالفعل، ولديك وجه. أما الذين بلا وجوه، فلهم يجب أن أنحت."
MASK_MAKER_REPEAT3: "إلى العمل! إلى العمل! يجب نحت الأقنعة."
MASK_MAKER_UNMASK_PEAK: "هل تفاهمت مع المخلوقة عند القمة؟<page>رأى أسلافك ذوو الأرجل في صحبتها ما يجذبهم، حتى إنهم بنوا حجراتهم وجهاز استدعائها فوق تلك القمة الخطرة.<hpage>قدمت لها احترامي ومنحتني رضاها. يملأ زغبها عباءتي الآن، ويحميني كثيرا من صقيع هذه المرتفعات.<page>أن تمنحك شيئا ثمينا هكذا... إنها هدية عظيمة. يبدو أنها اختارت الوقوف إلى جانبك.<page>لم أتوقع أن تعارض مليكتنا صاحبة الخيوط إلى هذا الحد، لكن لا بد أنها استشعرت هي أيضا بؤس الأحوال والتغير الأشد القادم."
MASK_MAKER_UNMASK_MEET_ACT3: "آه، أيتها العتيقة. كان ينبغي لبني جنسك أن يعرفوا أن كشف وجهي هكذا وقاحة. فمن دون قناع يغدو العمل شاقا.<hpage>أردت أن أسمعك وأنت صافي الذهن، أيها الصانع، وإن اعترضت.<page>نعم. ليس مجيئك مفاجأة كبيرة. شعرت وسمعت آثار... نزاعك مع الأم الشاحبة. يبدو مصير هذه الكهوف قاتما.<page>أظن أن الأمور أصبحت أكثر تعقيدا؟ أم أنكم توقعتم هذه العواقب منذ البداية؟<hpage>وجهت في لقائنا ضربة قاتلة، لكن سكرات موت الملكة اليائسة تهدد الآن بأن تأخذ معها هذه المملكة كلها.<page>ها! لم أتفاجأ! هكذا تسير الأمور دائما، أليس كذلك؟ يتنازع بنو جنسك القدماء على السلطان، ونسحق نحن الحشرات الفانية تحتهم من دون أن يلحظنا أحد.<hpage>الحرية هي ما سعيت إليه، أيها الصانع، لي ولكم أيها الفانون القليلون. ربما كنت ساذجة، لكن هذا ليس المصير الذي تمنيت وقوعه."
MASK_MAKER_MEET_ACT3: "متأخرة! متأخرة أنت! ولديك قناع بالفعل، ولديك وجه. أما الذين بلا وجوه، فلهم يجب أن أنحت."
MASK_MAKER_POST_UNMASK: "خذي مكافأة صغيرة على عنائك أيتها العتيقة. فإيصال ذلك السائل المتلاطم سالما ليس بالأمر الهين، ولا سيما إلى هذا المكان المرتفع."
MASK_MAKER_RELATIONSHIP: "وجهك حسن. ليس من صنعي، ولا من حرفة هذه المملكة. ليس الآن على الأقل.<page>لكن في هيئته الأعمق قرابة بعيدة. شيء من فارلوم ومن رعاتنا القدماء ذوي الأرجل.<page>والآن إلى العمل! إلى العمل! الأقنعة مطلوبة."
MASK_MAKER_UNMASK_TALK_03: "<hpage>لديك البصيرة، أيها الصانع. أخبرني، ماذا ترى في؟<page>قناعك... أقرأه بوضوح كاف أيتها العتيقة. مراقبة، وصيادة، بل ملكة، وإن رفضت تلك المنزلة.<page>ملامحه معقدة، لكنها ما زالت تبدو غير مكتملة في نظري.<hpage>إن رأيت حالة انتقالية، فقد قبلتها. وظل قناعي محدد المعالم طوال أعمار لا تحصى.<page>نعم، إنه صلب بلا شك، لكن بني جنسك نادرا ما يتطورون على نحو متوازن، وأعمار الحشرات مقياس رديء لمن كانت مثلك.<page>قد يكون أمامك مزيد من النمو..."
MASK_MAKER_REPEAT3_ACT3: "عالمنا يصرخ مع اقتراب نهايته! لكن لا بد من نحت الأقنعة."
MASK_MAKER_UNMASK_REPEAT: "كفى حديثا أيتها العتيقة. رسالتي لا تتيح لي إلا القليل من الراحة.<hpage>حسنا أيها الصانع. سأنصرف."
MASK_MAKER_REPEAT2: "للوجود، لا بد من وجه. إنه جوهر الأمر."
