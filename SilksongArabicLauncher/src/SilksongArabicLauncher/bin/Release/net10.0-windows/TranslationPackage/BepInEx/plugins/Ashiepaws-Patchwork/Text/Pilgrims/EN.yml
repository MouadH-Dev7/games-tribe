GATE_PILGRIM_REMEET_NO_SHRINES: "تنادينا القلعة يا أختاه! نحن قريبون جدا. لا ينقصنا سوى بركة تلك الأجراس حتى تنفتح البوابة الكبرى.<hpage>سأوقظ الأجراس، يا حاجّ. ولعل انتظارك لن يطول."
GATE_PILGRIM_REPEAT_NO_SHRINES: "أجراس الطريق المقدسة وحدها تفتح السبيل!<page>نرجوك أيتها المسافرة، أيقظي الأجراس كي نعبر هذه العتبة الأخيرة."
GATE_PILGRIM_REMEET_GOT_SHRINES: "آه... البوابة! استيقظت الأجراس على امتداد الطريق كلها! والآن لا نحتاج إلا إلى موسيقى تضبط تناغمها!<hpage>تعلمت مؤخرا فن إنتاج الأغنية بعزف أوتار الحرير، غير أنني أقر بأن هذه المهارة تستحق مزيدا من التدريب.<page>آه! لا تشكي يا أختاه! اعزفي بإخلاص، فأي موسيقى ستكون عذبة بما يكفي! اعزفي لنا، وستدوي الأجراس حتما! اعزفي وسنغني!"
GATE_PILGRIM_REMEET_SHRINES: "آه... البوابة الكبرى! استيقظت الأجراس!<page>نرجوك يا أختاه. اعزفي أو غني وسنتبعك. نادي أجراس الطريق فتنفتح البوابة!"
GATE_PILGRIM_REPEAT_SHRINES: "نرجوك يا أختاه، لا تتأخري أكثر! اعزفي لنا. نادي أجراس الطريق فتنفتح البوابة الكبرى!"
GATE_PILGRIM_MEET: "البوابة... البوابة! ها هي البوابة الكبرى المؤدية إلى القلعة أمامنا!<page>نحن قريبون جدا! أيتها القوى العظيمة وراء البوابة، نرجوكم! افتحوا السبيل ودعونا نحن الحجاج الصغار الفقراء نزحف إلى النور...<hpage>لا أرى حراسا للبوابة يستجيبون لرجائك، يا حاجّ، مع أنني أسعى أيضا إلى دخول القلعة. هل سمعت بوسيلة لفتح هذه البوابة؟<page>آه... لا تؤثر فيها الأسلحة. وليس فيها ثقوب للمفاتيح. يقال إنها الأجراس! أجراس الطريق المقدسة هي التي تفتح السبيل!"
GATE_PILGRIM_MEET_NO_SHRINES: "<hpage>مررت بعدة أجراس كهذه، يا حاجّ، وأعرف كيف أوقظها. أخبرني بما تعرفه عن مواقعها، وسأبحث عن التي لا تزال صامتة.<page>يا أختاه؟ هذه خدمة عظيمة تقدمينها طوعا! ما أروع الهدية التي تمنحينها لرفاقك.<page>سأخبرك بحماس عن الأضرحة ومواقعها، كما سمعنا وصفها..."
GATE_PILGRIM_MEET_ALT: "البوابة... البوابة! ها هي البوابة الكبرى المؤدية إلى القلعة أمامنا!<page>نحن قريبون جدا! أيتها القوى العظيمة وراء البوابة، نرجوكم! افتحوا السبيل ودعونا نحن الحجاج الصغار الفقراء نزحف إلى النور...<hpage>لا أرى حراسا للبوابة يستجيبون لرجائك، يا حاجّ، مع أن فتحها سيفيدني أنا أيضا. هل سمعت بوسيلة للعبور؟<page>آه... لا تؤثر فيها الأسلحة. وليس فيها ثقوب للمفاتيح. يقال إنها الأجراس! أجراس الطريق المقدسة هي التي تفتح السبيل!"
GATE_PILGRIM_MEET_SHRINES: "<hpage>في رحلتي إلى الأعلى، مررت بأجراس كبيرة كثيرة داخل أضرحة قديمة. ضربت كلا منها فأيقظته، ومع ذلك ما زالت هذه البوابة مغلقة. ما العمل الآخر المطلوب كي نعبر؟<page>قرعت الأجراس؟ إذن يمكننا الآن عبور هذه العتبة المقدسة، فالمهمة الأخيرة بسيطة! لا نحتاج إلا إلى موسيقى تعزف بصدق وإتقان. ستضبط الموسيقى تناغم الأجراس وتجعل البوابة تهبط.<page>يجب أن تقودينا أنت يا أختاه! أنت التي جلبت هذه البركة! اعزفي أو غني وسنتبعك."
