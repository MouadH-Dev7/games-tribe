BALLOW_CONTROL_KEY: "مرحبا يا آنسة! ماذا لدينا هنا؟ هناك مؤشرات كثيرة ينبغي مراقبتها، لكن أدوات التحكم تبدو سليمة على الأقل.<page>من هنا، يمكنني توجيه جرسك إلى الأسفل ببراعة لا تضاهى.<page><hpage>إذن ليست لديك خبرة سابقة بهذا النوع من وسائل النقل؟<page>لا أحد لديه يا آنسة! فالذين اعتادوا الهبوط ماتوا جميعا منذ زمن، أو لعنوا بنصف حياة. ولم تبق حشرة حية شجاعة أو حمقاء بما يكفي للمحاولة... حتى الآن على الأقل.<page>سأشغله بأفضل ما أستطيع. وأخشى أنني لا أستطيع فعل أكثر من ذلك. لحسن الحظ، بنيت مصنوعات هذه الأرصفة لتدوم. وليس علينا الآن إلا أن ندعو أن تصمد من أجلك.<page>إليك المفتاح الذي سيدخلك إلى جوفه المعدني. ادخليه حين تشعرين بأنك مستعدة تماما. وفي هذه الأثناء، سأبدأ تجهيز الأمور هنا."
FORGE_DAUGHTER_ACT_3_WHITE_FLOWER_REPAIR_UNSEEN: "<hpage>يا ابنة المسبك، اكتسبت قوة ستمكنني من إنهاء هذا الجنون الأسود. سأتحرك قريبا لإيقاف الزلازل وإنقاذ هذه الأرض.<page>ممتاز أيتها الحشرة المدببة. لقد تجاوزت عزيمتك وحيويتك توقعاتنا كثيرا ممن هي في صغر حجمك.<page>اعلمي أننا سمعنا من بالو، وقد أخبرنا عن جهوده لإصلاح جرس الغوص في الأسفل. ويرجح أنه أنهى المهمة الآن.<page>إن كنت تأملين اختبار عمله، فسنتمنى لك النجاة مرة أخرى. وإن كانت خدماتنا ستعينك في مهمتك المصيرية، فاعلمي أننا سنواصل تقديمها بسرور."
LADY_BUG_DEPLETED_A: "أمم، ربما تلاحظين أن جائزتك هناك خفيفة بعض الشيء يا سيدتي...<page>والحقيقة المروعة أنك أفرغت خزائننا. لم تبق بيننا مِسبحة واحدة تافهة. يبدو أننا لم نكن ندا لك!<hpage>كانت لعبة نزيهة يا سيدي، لكنني لا أريد أن أراك معدما. أتود عقد رهان من نوع آخر؟"
BALLOW_DIVING_BELL_PT2: "غررر... أبلغ الأمر هذا السوء إذن؟ أظن... إن كان هذا هو الحال، فسأكون الحشرة التي تحتاجين إليها.<page>قابليني في الأسفل عند جرس الغوص. وسنرى إن كنت أستطيع إعدادك للهبوط."
DIVING_BELL_POST_INSPECT: "ناديني حين تستعدين يا آنسة. اكتملت التحسينات، وصار ذلك الجرس جاهزا قدر الإمكان."
BALLOW_SAUNA_REPEAT: "آه... هل تشعرين بها الآن؟ كل متاعبك تتلاشى قطرة قطرة..."
FORGE_DAUGHTER_CANCEL_NOMETAL: "تلك الرواسب المنتشرة هنا، الصخور التي لا يخمد احتراقها، نافعة للقلعة في أعمالها الغامضة أيا كانت، لكنها لا تنفع إن أردت أدوات منا!<page>نحتاج إلى مادة أدق، معدن نادر. وفي فارلوم وفرة منه للمستكشف القادر. أحضري لنا بعضه، وسنصنع لك أدواتك العنيفة."
LADY_BUG_CHALLENGE_FINAL_END: "أولا، أولا! أخفقت سيدتنا إصابة هدفها، وهكذا ينتهي تحدينا!"
BALLOW_DIVING_BELL_ABYSS_BLACK: "...نسة...خطا...غلب...استرجا...م...ستحيل..."
LADY_BUG_DECLINED: "سيدتي، أرجوك أن تعيدي النظر! سيكون شرفا لي حقا أن أرى أطرافك القوية وهي تعمل!"
LADY_BUG_CHALLENGE_FINAL_POOR: "محاولة محترمة حقا. لم تربحي من المَسابح ما يكفي لتحققي ربحا على حسابنا، لكن هذا حافز لك لتحاولي مجددا!"
DOCK_KEY_RECEPTICLE_INSPECT: "جرس غوص قديم. بابه موصد بإحكام بمشبك مزخرف."
BALLOW_REPAIR_REPEAT: "سيجهز جرس الغوص مجددا قريبا يا آنستي. ما إن يثبت هذا الدرع الصدفي الجديد، حتى يصمد حتما أمام السقوط!.. حتما!"
BALLOW_DIVING_BELL_ABYSS_REPEAT: "...ستخراج...لا يمكن...اب...ن...إصلاح...آسف..آنستي..."
LADY_BUG_ACCEPTED_3: "هيا، هيا، حان وقت اللعب! خذي هذه الدبابيس المستقيمة وأصيبي الهدف حين يظهر!"
BALLOW_DIVING_BELL_TO_BENCH_REPAIRED: "<hpage>يا سيدي، أحتاج إلى لحظة. أرجو أن تفتح لي الجرس.<page>نعم، أستطيع يا آنستي. ناديني مجددا حين تستعدين للسفر."
BALLOW_SAUNA_MEET: "أتيت لتبددي أحزانك بالعرق يا آنستي؟ للبخار أثر عجيب في النفس الكئيبة أو الصَدَفة المتصلبة.<hpage>وجدت هذه الأراضي المنخفضة حارة بما يكفي، وصدفتي أصلب من معظم الأصداف.<hpage>وإخضاعها لمزيد من الاختبار يبدو ضربا فريدا من الجنون.<page>نعم، لكن هذه فارلوم يا آنستي! والجنون معد. وهذا أهون أشكاله في رأيي."
LADY_BUG_DEPLETED_REPEAT: "كان اللعب معك شرفا عظيما يا سيدتي! نرجو أن تتذكرينا كلما سمعت خشخشة المَسابح في جيوبك."
DIVING_BELL_TO_BENCH_INSPECT: "إلغاء الهبوط؟"
FORGE_DAUGHTER_ACT_3_START_FIRST_MEET_2: "لا خيار لنا! ولا يمكننا الرحيل أبدا. نحن ابنة المسبك، مقيدون بهذا المسبك وخدمته. إنه واجب يلزمنا مدى الحياة."
FORGE_DAUGHTER_DIVING_BELL_REPEAT: "إن كنت تخططين للعبور إلى الأسفل، فبالو هو من يستطيع مساعدتك. أما نحن فعلينا البقاء عند المسبك دائما."
FORGE_DAUGHTER_ACT_3_START_FIRST_MEET_1: "آه! أيتها الحشرة المدببة، لماذا تزعجيننا في عملنا؟ العالم يتشقق ويرتج تحت وطأة كارثة جديدة مروعة، أفلا يجدر بك البحث عن مكان أكثر أمانا؟<hpage>مهما ابتعدت في فراري، أشك في وجود مكان كهذا. وعلى أي حال، لن أترك حشرات هذه الأرض تواجه نهايتها وحدها.<hpage>وماذا عنك؟ لماذا تصرين على أداء مهمتك بهذا الاجتهاد رغم حال أرضكم المريع؟"
FORGE_DAUGHTER_MEET_1: "آه! أيتها الحشرة الصغيرة المدببة، لماذا تزعجيننا في عملنا؟<hpage>جذبني صوت صناعتك إلى هنا لأستطلع الأمر. ما واجبك في هذا المكان؟ هل أنت حدادة من نوع ما؟"
LADY_BUG_ACCEPTED_1: "هيا، هيا، حان وقت اللعب! خذي هذه الدبابيس المستقيمة وأصيبي الهدف حين يظهر!<page>إن أصبت الهدف 15 مرة، فالجائزة لك!"
FORGE_DAUGHTER_MEET_2: "حدادة؟ هذا وصف مبتذل! نحن ابنة المسبك! كيف تعجز حشرة مدببة عن تمييز ذلك؟<page>سلالتنا عريقة ودورنا مشرف. من حسن حظ هذه الأرصفة والأراضي المحيطة بها أنها تحظى بمهارتنا.<hpage>إن كنت ماهرة كما تزعمين، فهل تقدمين لي عونك؟ لقد حرمت من أدواتي المعتادة، وأظنك قادرة على صنع بدائل ممتازة.<page>شفرات وفخاخ بلا شك؟ نعرف أمثالك!<hpage>شيء من هذا القبيل، لكنها قد تكون غريبة على هذه الأرض. ولعل بعضها يمثل تحديا جيدا لصناعتك.<page>همف! سنصنعها إذن. لكنك ستوفرين المواد، وتدفعين لنا مقابل وقتنا."
LADY_BUG_ACCEPTED_2: "هيا، هيا، حان وقت اللعب! خذي هذه الدبابيس المستقيمة وأصيبي الهدف حين يظهر!<page>إن أصبت الهدف 25 مرة، فالجائزة لك!"
LADY_BUG_REST: "حسنا، لعل هذا يكفي من اللعب الآن، أليس كذلك؟<page>علينا ابتكار تحد أصعب بكثير حتى نتغلب عليك يا سيدتي!"
FORGE_DAUGHTER_ACT_3_REPEAT: "قد لا يبقى لهذا العالم وقت طويل، لكننا سنواجه نهايته ونحن نؤدي واجبنا."
FORGE_SHARD_POUCH_DESC: "صيانة الأدوات مهمة لا تنتهي. احتفظي بهذه الشظايا قريبة منك في أسفارك، لتصلحي أدواتك وتجددي مخزونها عند الحاجة."
BALLOW_CONTROL_REPEAT: "ادخلي جرس الغوص حين تصبحين مستعدة تماما. وسأرتب الأمور هنا في هذه الأثناء."
FORGE_ITEM_STING_SHARD_DESC: "فخ طعن شرس؟ يمكننا صنعه. لكن اعلمي أن هذه الأدوات الماكرة التي تبتكرينها للقتل تثير قلقنا."
LADY_BUG_OFFER: "هيا، هيا! مرحبا بك يا سيدتي، يسعدنا أنك وجدتنا هنا! أرى أنك تنعمين بأطراف قوية ونظر حاد.<page>أتحبين اللهو؟ أتودين اختبار دقة تصويبك؟ يشرفنا أن نلعب معك لعبة صغيرة، فقد أعددنا اختبارا بسيطا للمهارة.<hpage>لا حاجة لي إلى اختبار مهاراتي يا سيدي، ولا وقت لدي للهو.<page>لكننا سنجعل الأمر مجزيا! تنتظرك جائزة إن نجحت في تحدينا!<hpage>وجود جائزة يغير الأمر. أستطيع اجتياز أي تحد إن كان المقابل كافيا. ما قواعد لعبتك؟<page>بسيطة جدا يا سيدتي! سأعطيك دبابيس للرمي، وسيقدم معاوني الهدف. أصيبي الهدف 15 مرة، وستفوزين بجائزة قيمة!"
KNIGHT_LOCK_INSPECT: "باب ثقيل مقيد بسلسلة وقفل بسيط."
DOCK_KEY_RECEPTICLE_HINT: "<hpage>يمكن لهذا الجرس أن يحملني إلى الأسفل، لكنه يحتاج أولا إلى مفتاح ومشغل يعينني على الهبوط.<hpage>لا أستطيع إتمام هذه المهمة وحدي. لا بد أن يساعدني أحد العاملين على هذه الأرصفة."
BALLOW_GENERIC_ACT3: "مهلا! ما سبب كل هذه الهزات؟ ما زال هذا المصهور بحاجة إلى الجرف، والاهتزاز لا يزيد العمل إلا صعوبة."
FORGE_DAUGHTER_DIVING_BELL_TALK_FIRST_SHOP_ACT_3: "<hpage>رغم أن واجبك يقيدك، فهل تقدمين لي خدمتك يا ابنة المسبك؟ أحتاج إلى أدوات تستطيع مهارتك توفيرها على الأرجح.<page>شفرات وفخاخ بلا شك؟ نعرف أمثالك!<hpage>شيء من هذا القبيل، لكنها قد تكون غريبة على هذه الأرض. ولعل بعضها يمثل تحديا جيدا لصناعتك.<page>همف! سنصنعها إذن. لكنك ستوفرين المواد، وتدفعين لنا مقابل وقتنا."
BALLOW_DIVING_BELL_TO_TRAVEL_UP: "<hpage>يا سيدي، أحتاج إلى العودة إلى الأعلى. أرجو أن تجهز الجرس لي.<page>نعم يا آنستي. اجلسي على المقعد، ولنرفعك إلى الأعلى."
LADY_BUG_CHALLENGE_FINAL_WIN: "أصبت أهدافا كثيرة وربحت مَسابح كثيرة! لا تكف سيدتنا عن إبهارنا!"
LADY_BUG_CHALLENGE_FAILED: "هيا، هيا! علينا إيقافك هنا. أخطأت هدفك الآن 3 مرات! يؤسفني القول إنك خسرت لعبتنا الصغيرة، مع كامل احترامنا.<page>لكن لا تقلقي، فنحن لا نمل اللعب أبدا! تعالي إلى هنا ولنبدأ لعبة أخرى."
DIVING_BELL_TO_BENCH_INSPECT_ASCEND: "إلغاء الصعود؟"
FORGE_LAVA_CHARM_DESC: "هذه الحلية من ابتكارنا. تقي من الحمم القاتلة والحرارة المحيطة بهذه الأرصفة. كان العمال يطلبونها منا، أما الآن فقد فقدوا عقولهم حتى عادوا لا يكترثون."
FORGE_DAUGHTER_CANCEL_HASMETAL: "إلى اللقاء إذن. إن احتجت إلى صناعتنا، فستجدين هذا المسبك مشتعلا دائما."
BALLOW_CONTROL_POST_REPEAT: "ثبتنا الدرع الصدفي الجديد بإحكام يا آنستي. إن كنت تخططين لهبوط آخر، فانزلي وناديني، وسأوصلك إلى وجهتك."
FORGE_DAUGHTER_TALK_2: "<hpage>رأيت بين زملائك العمال سلوكا يشبه... الاضطراب الذي شاهدته على الطرق. ليست هذه الأرصفة وحدها التي أصاب سكانها هذا الغرابة.<page>إنه سلوك غريب بلا شك، لكن علمه ليس عند بالو ولا عندنا. عملنا كثير، ونلزم شأننا.<page>لا يعنينا ما يجري في العالم الخارجي ما دامت صناعتنا مستمرة."
FORGE_DAUGHTER_TALK_3: "<hpage>كيف جئت لخدمة هذه الأرصفة يا ابنة المسبك؟<page>أرسلونا من فورجهوم بطلب من الحشرات المقدسة في الأعلى.<hpage>سكان القلعة؟ الحشرات المحجبة؟ أأمروك بالمجيء إلى هنا؟<page>نعم! كان ذلك منذ زمن بعيد. هذا هو الواجب! نحن بنات المسبك نعيش لإتقان الصنعة وخدمة السلالة.<page>وبفضل رعاية القلعة وواجبنا الطويل في هذه الأرصفة، ستزداد مكانة فورجهوم المقدسة."
FORGE_DAUGHTER_TALK_1: "<hpage>توقعت أن تضم هذه الورشة أيضا حشرات لا تجيد سوى القتال، لكنك تبدين رزينة يا ابنة المسبك.<page>هل قابلت العمال؟ كلهم في اضطراب شديد! ما زالوا يؤدون مهامهم بطريقة بسيطة، لكن الحديث معهم لا طائل منه. لم يبق عاقلا سوانا وبالو الشاب."
BALLOW_CONTROL_POST_MEET_NO_REPAIR_SEEN: "آنستي! آه... مرحبا... أراك نجوت... بطريقة ما... ظننت أن ذلك الغوص الأخير قضى عليك.<hpage>لم يفعل. نجوت من السقوط وتمكنت من العودة عبر طريق محفوف بالمخاطر.<hpage>كنت أعلم مخاطر تعطل جرس الغوص، ولا ذنب لك في ذلك.<page>نعم! كما تقولين! هذا الجرس قديم، والزمن يحطم الأشياء مهما بلغت جودة صنعها.<page>وكما ترين في الأسفل، عكفت منذ تعطله على تحسين تصميمه! واتضح أن رحلتك الأخيرة كانت اختبارا مفيدا... أهم.<hpage>جيد. لقد أغلق طريق العودة ذاك أمامي، وأحتاج الآن إلى جرسك مجددا.<page>مجددا؟ إن كنت جريئة بما يكفي للمحاولة مرة ثانية... فقد ثبتنا درعا صدفيا، وأصبح الجرس كالجديد. بل أفضل من الجديد!<page>إن كنت تخططين لهبوط آخر، فانزلي وناديني، وسأطلقك في رحلتك."
BALLOW_DIVING_BELL_TO_TRAVEL: "<hpage>يا سيدي، أنا مستعدة. أرجو أن تجهز الجرس للانطلاق.<page>حان وقت الهبوط إذن يا آنستي؟ اجلسي على المقعد، وسأحكم ربطك."
DOCK_KEY_RECEPTACLE_INSPECT_DEMO: "آلية قديمة بها ثقب مفتاح."
BALLOW_CONTROL_POST_MEET: "تم الأمر يا آنستي! ثبت الدرع الصدفي. أصبح الجرس كالجديد، بل أفضل من الجديد!<page>إن كنت تخططين لهبوط آخر، فانزلي وناديني، وسأطلقك في رحلتك.<hpage>أقدر عملك يا سيدي. واعلم أن التهديد القادم من الأسفل قد يخمد قريبا إن حالفني الحظ، وعندها تهدأ أرضكم.<page>هذا... جيد! كل ما أتمناه حقا هو العودة إلى المسبك وواجباتي المعتادة... بعض الغاية والروتين...<page>بصراحة يا آنستي، كل هذه الأحداث تفوق احتمال حشرات مثلي. سيسرني أن ينتهي كل شيء... إن نجونا بالطبع."
BALLOW_REPAIR_MEET: "آنستي! آه... مرحبا... أراك نجوت... بطريقة ما... ظننت أن ذلك السقوط قضى عليك.<hpage>لم يفعل. نجوت من السقوط وتمكنت من العودة عبر طريق محفوف بالمخاطر.<hpage>كنت أعلم مخاطر تعطل جرس الغوص، ولا ذنب لك في ذلك.<page>نعم! كما تقولين! هذا الجرس قديم، والزمن يحطم الأشياء مهما بلغت جودة صنعها.<page>وكما ترين هنا، كنت قد بدأت تحسين تصميمه بسبب تعطله! واتضح أن ما حدث كان اختبارا مفيدا... أهم.<hpage>جيد. لقد أغلق طريق العودة ذاك أمامي الآن، وقد أحتاج إلى جرسك إن اخترت الهبوط مجددا.<page>مجددا؟ إن كنت جريئة بما يكفي للمحاولة مرة ثانية... فما إن يثبت هذا الدرع الصدفي الجديد، حتى يصمد حتما أمام السقوط!.. حتما!"
FORGE_DAUGHTER_MEET_2_DEMO: "حدادة؟ هذا وصف مبتذل! نحن ابنة المسبك! كيف تعجز حشرة مدببة عن تمييز ذلك؟<page>سلالتنا عريقة ودورنا مشرف. من حسن حظ هذه الأرصفة والأراضي المحيطة بها أنها تحظى بمهارتنا.<hpage>إن كنت ماهرة كما تزعمين، فهل تقدمين لي عونك؟ لقد حرمت من أدواتي المعتادة، وأظنك قادرة على صنع بدائل ممتازة.<page>شفرات وفخاخ بلا شك؟ نعرف أمثالك!<hpage>شيء من هذا القبيل، لكنها قد تكون غريبة على هذه الأرض. ولعل بعضها يمثل تحديا جيدا لصناعتك.<page>همف! ربما نقبل قريبا، نعم! لكن ليس الآن! لدينا الآن عمل كثير، ولا يسعنا تحمل هذا الإزعاج."
FORGE_DAUGHTER_DIVING_BELL_TALK_FIRST_MEET: "آه! أيتها الحشرة الصغيرة المدببة، لماذا تزعجين ابنة المسبك هذه في عملها؟<hpage>أسعى إلى إخماد هذه الزلازل السوداء التي تعصف بأرضكم من منبعها تحت بحيرات اللهب.<page>أتريدين الهبوط إلى ذلك العمق؟... صحيح أن هذه الأرصفة تملك الوسيلة، لكننا للأسف لا نستطيع مساعدتك. سواء تعافت فارلوم أم سقطت، فواجبنا يقيدنا بهذا المسبك دائما.<page>اسألي بالو هناك. وإن كان مصيرنا مروعا كما توحي أفعالك، فنحن واثقون أن إقناعه لن يستغرق وقتا طويلا."
FORGE_DAUGHTER_REPEAT_DEMO: "عودي لاحقا أيتها الحشرة المدببة! لدينا الآن عمل كثير، ولا يسعنا تحمل هذا الإزعاج."
FORGE_DAUGHTER_ACT_3_WHITE_FLOWER: "<hpage>يا ابنة المسبك، حصلت على قوة ستمكنني من إنهاء هذا الجنون الأسود. سأتحرك قريبا لوقف الزلازل وإنقاذ هذه الأرض.<page>ممتاز أيتها الحشرة المدببة. لقد تبين أن عزيمتك وقوتك أكبر بكثير مما توقعناه من حشرة صغيرة مثلك.<page>سنظل هنا. وإن أفادتك خدمتنا في مهمتك الحاسمة، فاعلمي أننا سنواصل تقديمها بكل سرور."
FORGE_DAUGHTER_ACT_3_SHOP_ REPEAT: "<hpage>احذري يا ابنة المسبك. سأعود إن احتجت إلى مساعدتك.<page>ترافقك أمنياتنا أيتها الحشرة المدببة. أخمدي هيجان عالمنا كي يستمر عملنا."
DOCK_DIVING_BELL_CONTROLS_HINT: "<hpage>أدوات التحكم هذه معقدة. إن أردت الهبوط داخل الجرس، فسأحتاج أولا إلى مشغل.<hpage>لا بد أن يساعدني أحد العاملين على هذه الأرصفة."
BALLOW_DIVING_BELL_TO_TRAVEL_DOWN: "<hpage>يا سيدي، أريد الرحيل. أرجو أن تجهز الجرس للسفر.<page>بكل سرور يا آنستي. اجلسي على المقعد وسأرسلك إلى الأسفل."
LADY_BUG_REOFFER: "أتهمك لعبتنا الصغيرة يا سيدتي؟<page>إن أصبت الهدف 15 مرة، فستفوزين بجائزة قيمة!"
FORGE_DAUGHTER_ACT_3_START: "آه! عدت أيتها الحشرة المدببة؟ عالمنا يتشقق ويصرخ تحت وطأة كارثة جديدة مروعة.<page>ومع ذلك، علينا البقاء مقيدين بهذا المسبك وخدمته. إنه واجب يلزمنا مدى الحياة."
BALLOW_GENERIC: "إن احتجت إلى شيء، فتحدثي إلى الرئيسة. أنا مشغول."
DOCK_DIVING_BELL_CONTROLS: "لوحة تحكم تضم روافع ومقاييس متنوعة."
BALLOW_DIVING_BELL_PT1: "<hpage>يا سيدي، أحتاج إلى التوجه تحت بحيرات اللهب.<hpage>هناك جرس غوص عند قاعدة هذا البناء، ويبدو مناسبا للمهمة. أحتاج إلى فتحه وإلى مشغل يرسله إلى الأعماق.<hpage>ولأنك من الحشرات القليلة في هذه الأرصفة التي ما زالت سليمة العقل، فلا بد أن تتولى أنت هذا الدور.<page>ألا ترين أنني مشغول يا آنستي؟ لا وقت لدي لأي شيء آخر ما دام الجرف لم ينته.<hpage>اختر أن تساعدني، وإلا ضاعت جهودك كلها قريبا. هذه المملكة تنهار، وسقوطها محتوم. إن أردت استمرار عملك وحياتك، فعليك مساعدتي الآن."
BALLOW_DIVING_BELL_PT1_BELL_UNSEEN: "<hpage>يا سيدي، أحتاج إلى التوجه تحت بحيرات اللهب. هل تستطيع مساعدتي في هذه المهمة؟<hpage><page>همم... إن نزلت إلى قاعدة الأرصفة تماما، فستجدين جرس غوص قديما صنع خصيصا لما تطلبينه. <page>يمكنك ركوبه، لكنه يحتاج إلى مشغل يقف بجانب الرصيف ويرسله. ربما أستطيع فعل ذلك، لكن لا وقت لدي لأي شيء آخر ما دام الجرف لم ينته.<hpage>اختر أن تساعدني يا سيدي، وإلا ضاعت جهودك كلها قريبا. هذه المملكة تنهار. إن أردت استمرار عملك وحياتك، فعليك مساعدتي الآن."
LADY_BUG_OFFER_PROMPT: "بدء التحدي؟"
BALLOW_DIVING_BELL_TALK_PRE_POST_MEET: "مهلا! من هناك؟ أيا كنت، إن بلغ بك الجنون حد محاولة السفر، فقابليني عند أدوات التحكم لنتحدث."
FORGE_DAUGHTER_POST_ABYSS: "حسنا، حسنا. ما زلت حية! لقد أثبت أنك من أصلب معدن أيتها الحشرة المدببة.<page>اعترف بالو بخجل بما واجهه جرس غوصك من مشكلات، وبأنك لم تكوني فيه حين استعيد.<page>خشي أن تكون النيران قد التهمتك، لكننا اشتبهنا قليلا في خلاف ذلك.<hpage>كانت العودة من الأسفل من أصعب رحلات الصعود التي واجهتها، ومع ذلك سأحتاج قريبا إلى الهبوط مجددا.<page>أنت إذن مجنونة مرتين أيتها الحشرة! أو شجاعة بلا حدود. سنظل نرجو نجاتك، حتى إن بدا أنك مصممة على إنهاء حياتك."
LADY_BUG_REOFFER_2: "لم ينته اللهو يا سيدتي! إن أردت اختبار نفسك حقا، فعلينا أن نلعب مجددا!<page>أصيبي الهدف 25 مرة، وستفوزين بقلادة جميلة من المَسابح! ما رأيك؟"
FORGE_DAUGHTER_TALK_REPEAT: "<hpage>حافظي على سلامتك يا ابنة المسبك. سأعود إن احتجت إلى مساعدتك.<page>نعم! أو لا. كلاهما مقبول لدينا ما دامت الصنعة مستمرة."
LADY_BUG_IN_CHALLENGE: "لا تترددي يا سيدتي! صوبّي جيدا وارمي بدقة!"
FORGE_ITEM_TOOL_KIT_DESC_EXPAND: "إن أضفت أدوات هذه العدة إلى أدواتك، فسترتفع جودة صناعتك. وستنتجين أدوات أدق وأحد وأشد فتكا... إن كان ذلك ما تريدينه."
FORGE_ITEM_TACKS_DESC: "أتخططين لفرش بساط من الأشواك؟ ستبطئ هذه فرائسك بلا شك. لم نفكر قط في استخدام أدوات شائعة كهذه في القتال."
LADY_BUG_DISQUALIFIED: "هيا، هيا، هيا! لعلني نسيت إخبارك بألا تتجاوزي تلك العلامات؟ إنها إحدى قواعد اللعبة، وكلنا نلتزم القواعد هنا، أليس كذلك؟<page>لقد أقصتك أفعالك من المنافسة يا سيدتي، لكننا لا نحمل لك ضغينة! تعالي إلى هنا ولنبدأ جولة جديدة فورا!"
LADY_BUG_CHALLENGE_WIN_1: "هيا، هيا! انتهى الأمر إذن. أصابت سيدتنا الهدف 15 مرة! يا له من انتصار رائع!<page>نرجو أنك استمتعت! فبعض المرح يخفف عنا في هذه الأوقات العصيبة، ألا ترين؟<hpage>كنت أظن أن الأفضل ترك هذه الألعاب لأوقات السلام، لكن لعل فيما تقول صدقا.<hpage>والآن بعد أن تغلبت على تحديك، ستقدم لي الجائزة التي استحققتها، أليس كذلك؟<page>ب... بالطبع! أرى أن لديك جراب أدوات خاصا بك. ولا شك أنه يكاد ينفجر من كثرة الحلي والأغراض الصغيرة!<page>سأضيف إليه جيبا آخر كي تحملي معك مزيدا من الأدوات والشظايا. أليست جائزة منصفة؟"
LADY_BUG_REOFFER_3: "هيا، هيا! ابتكرنا لك تحديا أخيرا يا سيدتي، إن كنت مهتمة.<page>أصيبي الهدف أكبر عدد ممكن من المرات من دون أن تخطئي. كلما أصبت أهدافا أكثر، ربحت منا مَسابح أكثر! أتودين المحاولة؟"
FORGE_DAUGHTER_WEAVERSHOT: "<hpage>يا ابنة المسبك، عثرت على سلاح في عش قديم للنساجين. ورغم ما أصابه من تلف بفعل الزمن، أعتقد أن مهارتك قادرة على ترميمه.<page>آه. إنها أداة مبهرة وتحد ممتاز. يمكننا إعادة سبك السلاح إن كان الثمن مناسبا."
FORGE_DAUGHTER_PURCHASED: "أتممنا صفقة منصفة أيتها الحشرة المدببة. والآن ينادينا عملنا. عودي إن احتجت مجددا إلى تجارتنا ومهارتنا."
FORGE_DAUGHTER_ACT_3_REPEAT_BALLOW_LEFT: "نرجو أن يحسن بالو خدمتك أيتها الحشرة المدببة. طوال خدمتنا الطويلة في هذه الأرصفة، كان أفضل معاون وجدناه."
DIVING_BELL_TO_TRAVEL_INSPECT_ASCEND: "الصعود؟"
FORGE_DAUGHTER_ACT_3_WHITE_FLOWER_REPAIR_AND_FORGE_UNSEEN: "حسنا، حسنا. ما زلت موجودة أيتها الحشرة المدببة! لقد أثبت أنك من أصلب معدن.<page>اعترف بالو بخجل بما واجهه جرس غوصك من مشكلات، وبأنك لم تكوني فيه حين استعيد للمرة الأولى.<page>خشي أن تكون النيران قد التهمتك، لكننا اشتبهنا قليلا في خلاف ذلك.<hpage>كانت العودة من الأسفل من أصعب رحلات الصعود التي واجهتها، ومع ذلك أحتاج الآن إلى الهبوط مجددا.<page>أنت إذن مجنونة مرتين أيتها الحشرة! أو شجاعة بلا حدود.<page>اعلمي أننا سمعنا من بالو عن جهوده لإصلاح جرس الغوص في الأسفل. ولعله أنهى المهمة الآن.<page>إن كنت تريدين اختبار عمله، فسنرجو نجاتك مجددا. وإن أفادتك خدمتنا في مهمتك الحاسمة، فاعلمي أننا سنواصل تقديمها بكل سرور."
LADY_BUG_CHALLENGE_FINAL_FAIL: "ولم تصب هدفا واحدا... يا للخسارة! لا يمكننا مكافأتك بأي مَسابح يا سيدتي، لكننا نود أن نراك تختبرين دقة تصويبك مرة أخرى!"
FORGE_SILSHOT_DESC: "سلاح من ماض سحيق. يمكننا دمج مكونات النسّاجين مع قوالبنا لإصلاح الأداة."
FORGE_DAUGHTER_DIVING_BELL_TALK: "<hpage>يا ابنة المسبك، أسعى إلى إخماد هذه الزلازل السوداء التي تعصف بأرضكم، وذلك عند مصدرها تحت بحيرات اللهب.<page>أتريدين النزول إلى ذلك العمق، أيتها الحشرة المدببة؟... صحيح أن في هذه الأرصفة مركبة قادرة على ذلك.<page>لكننا، للأسف، لا نستطيع مساعدتك. سواء تعافت فارلوم أم سقطت، فواجبنا يلزمنا بهذا المسبك إلى الأبد.<page>اسألي بالو، فهو الحشرة المنشودة. وإن كان مصيرنا بالسوء الذي توحي به أفعالك، فنحن واثقون بأنه لا يحتاج إلا إلى قليل من الإقناع السريع."
FORGE_ITEM_TOOL_KIT_DESC: "الصياغة بالمخلب وحده لا تنتج إلا أدوات رديئة. باستخدام هذه العدة، يمكنك صنع أدوات أدق وأحد وأشد فتكا... إن كنت ترغبين في ذلك."
DIVING_BELL_TO_TRAVEL_INSPECT: "النزول؟"
LADY_BUG_LEFT_IN_CHALLENGE: "يا سيدتي، لقد غادرت لعبتنا على عجل! لا شك أن مهمة بالغة الأهمية استدعتك.<page>وهذا يعني استبعادك فورا بالطبع، وأنت تتفهمين ذلك. لكننا لا نلومك إطلاقا! أتودين اللعب مجددا؟"
BALLOW_DIVING_BELL_TO_BENCH: "<hpage>أحتاج إلى برهة يا سيدي. أرجو أن تفتح الجرس كي أخرج.<page>أعدت النظر؟ لا ألومك إن كنت تفكرين في التراجع. فمن الجنون أن نأمل حتى في نجاة ذلك الجرس العتيق من الرحلة."
BALLOW_DIVING_BELL_ABYSS: "<hpage>يا سيدي، إن كنت تسمعني، فقد وقع حادث أثناء النزول.<hpage>الجرس بحالته المحطمة هذه غير صالح للسفر. استرجعه إن استطعت، لكنني لن أدخله مجددا.<page>...آن...سة...خطأ...غمر...استرجا...مست...حيل..."
LADY_BUG_DEPLETED_B: "لا... لا، إطلاقا. لن يفيدنا ذلك، أليس كذلك؟ يبدو أن مرحنا الصغير قد انتهى حقا.<page>لكن اللعب معك كان شرفا عظيما يا سيدتي! آمل أن تتذكرينا كلما شعرت بتلك المَسابح تتقعقع في جيوبك."
LADY_BUG_CHALLENGE_WIN_2A: "رائع! لقد أصيب الهدف... خمسا وعشرين مرة!<page>يا سيدتي... ظننت أنك ستواجهين بعض الصعوبة في هذه الجولة، لكنك انتصرت مجددا.<page>سأضطر إلى التحدث مع شريكي. والحق يقال، لا أظنه قدم لك تحديا كافيا.<hpage>بل كان تحديا كافيا. أين جائزتي يا سيدي؟<page>"
LADY_BUG_CHALLENGE_WIN_2B: "آه! الجائزة، بالطبع! لا بد أن تنال سيدتي جائزة!<page>إليك إذن... عقد جميل تملؤه المَسابح. احتفظت به مدة طويلة، لكنك استحققته بجدارة.<page>آمل فقط أن تتذكريني حين ترتدينه يا سيدتي!"
