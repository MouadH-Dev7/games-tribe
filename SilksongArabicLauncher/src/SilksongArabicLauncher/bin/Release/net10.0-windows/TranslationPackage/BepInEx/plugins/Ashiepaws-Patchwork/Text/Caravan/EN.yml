TROUPE_LEADER_DECLINE_QUEST1: "آه... أفهم الآن أيتها الغريبة. لقد حملت من ليست برغوثة أكثر مما ينبغي.<page>سمعت أن المستوطنة تحتنا تقيم جدار أمنيات. ربما أرسل غريشكين إلى الأسفل ليعلق أمنيتنا...<page>"
TROUPE_HUNTER_EMPTY: "أيتها الحشرة لا البرغوثة، نقشت معارفي كلها في خرائطك. لا مزيد لدي.<page>ارحلي الآن! ابحثي عن البراغيث الضائعة وأنقذيها، حتى يكتمل شمل القافلة!"
TROUPE_LEADER_INFO_HUNTER: "هل قابلتها بعد؟ رفيقتنا الجديدة القوية فوغ! عادت لتوها بعد زمن طويل أمضته في التعقب.<hpage>لقد التقينا يا سيد البراغيث. ويسعدني وجود برغوثة بقوتها.<hpage>كانت قافلتكم تفتقر بشدة إلى الحماية، لكن مهامي الخاصة تقيدني فلا أستطيع توفيرها لكم.<page>لن نثقل عليك بهذا أبدا! ولم يعد الأمر مهما الآن! فرائحتها قوية ونهمها للشراب لا ينتهي، لكن مهارتها حادة.<page>إذا اقتربت المفترسات، ستبعث مواهبها الطمأنينة في قافلتنا."
TROUPE_HUNTER_MEET_NOMAP_ACT3: "أما زلت هنا أيتها الحشرة لا البرغوثة؟ أتطلبين خدمتي؟ لدي معرفة واسعة بأماكن الصغار الضائعين، فقد سمعتهم وشممت روائحهم في أرجاء الكهوف.<page>يمكنك العثور عليهم وإعادتهم! لنجتمع جميعا الآن وقد أظلمت الأيام...<page>لكنك لا تحملين خريطة! إن أردت المعرفة فعليك امتلاك خريطة. وحتى ذلك الحين، لا صفقة بيننا."
TROUPE_MEMBER_SHORT_REPEAT_FLEATOPIA_ACT3: "انتهت أسفارنا، وسينتهي العالم قريبا أيضا! في مثل هذه الأيام المريرة، ما أحلى الشراب مع الأصدقاء."
CARAVAN_LECH_INTRO: "<hpage>تحياتي من جديد أيها البرغوث. أرى أنك استطعت الالتحاق بهذه القافلة بسلام.<page>نعم! والفضل كله لك! يا عزيزتنا الحلوة! هيه هيه!<page>يطلب مني سيد البراغيث، ذلك الممل العجوز، أن أدعوك الآنسة هورنيت. لكن اسما شائكا كهذا لا يليق بحسناء رقيقة مثلك! هل أدعوك باسم أجمل، مثل «حلوة الرحيق» يا عزيزتي؟<hpage>لن تفعل. خاطبني باسمي، وإلا فلا تخاطبني.<page>غراداك! بالطبع، بالطبع! هيه هيه. والآن سأطلعك على سري الصغير. فعربتي تؤدي أيضا دور منتجع مريح، وهذه فكرة بارعة جدا.<page>الماء في داخلها شديد السخونة، وأنقى من مزمور! هيه هيه! ويسعدني أن أدعك تسترخين فيه مقابل رسم متواضع!"
FG_BOUNCE_INTRO_FIRST: "يا عزيزتي، ما أشد العار أن ينتهي العالم وما زال أمام كرات المسكين الكثير ليعيشه!<page>لكن كم هو لطيف منك أن تنضمي إلي هنا! هل تلعبين معي لعبة وثب البراغيث، كي أتأمل جمال حركاتك الرشيقة بينما أنتظر نهايتي؟<page>اللعبة بسيطة. اقفزي وواصلي الارتداد فوق البراغيث التي تطير من جانبك لأطول مدة تستطيعينها!"
TROUPE_MEMBER_TALL_REPEAT_GREYMOOR: "تجوب وحوش غريبة هذه الأراضي الرمادية. أسمع زئيرها وصراخها خارج المخيم. الأفضل أن نبقى في الداخل ونلزم الهدوء."
FG_DODGE_CHOICE: "المنافسة في مراوغة البراغيث؟"
TROUPE_MEMBER_SHORT_MEET_FLEATOPIA: "انتهى ترحالنا الطويل أخيرا! كان احتمال كل حبة رمل وكل يرقة نتنة لزجة يستحق العناء لنظفر بمثل هذا الموطن!<page>حان وقت الراحة والاحتفال، وليس بيننا من استحقهما أكثر منك يا آنسة هورنيت! ارفعي قارورتك واشربي معنا حتى ترتوي!"
TROUPE_LEADER_GREYMOOR_REPEAT: "سنخيم في هذه الأراضي الرمادية حتى تجد براغيث أخرى طريقها إلى القافلة. أرجو أن تساعدي أي رفيق لنا تجدينه تائها على الطرق!"
TROUPE_LEADER_ACCEPT_QUEST_OUTRO: "<hpage>إنني أجوب هذه الأراضي لأسبابي الخاصة يا سيد البراغيث. لكن إن صادفت أي براغيث في رحلاتي، فسأساعدها قدر استطاعتي.<page>آه، لا أطلب أكثر من ذلك! لا بد أنهم يختبئون أو عالقون في أماكن خطرة، لكن إن أيقظتهم فسيجدون طريقهم إلى هنا.<page>لتبارك المملكة رحلاتك وتحفظك أيتها الغريبة! ويمكنك أن تستريحي معنا كلما أعادتك الطرق إلى هنا!"
TROUPE_LEADER_GREYMOOR_MEET_TRAVELED: "كانت الرحلة إلى هنا طويلة، لكننا لم نفقد برغوثا واحدا! يقال إن اصطحاب ضيف في السفر يجلب الحظ، فلا بد أن الفضل لك!<page>آمل أن الرحلة ناسبتك، بل ربما أمتعتك، وأنت بين صغارنا الأعزاء...<hpage>إنهم رفاق سفر مفعمون بالنشاط بالفعل. ونادرا ما أتيحت لي فرصة مخالطة من يتمتعون بكل هذا الحماس.<page>رائع! والآن عليك زيارة غريشكين، الجالس هناك قرب المرجل الفوار. بعد السفر الطويل نشرب لننعش أرواحنا!"
TROUPE_MEMBER_SHORT_BREW_FULL: "يا آنسة هورنيت، قارورتك مليئة بشراب البراغيث. وتعرفين معنى ذلك! عليك أن تشربي! ها ها!<page>بعد أن تنتهي من الشرب، عودي وسنملأ القارورة مجددا! فأنا أحضر الشراب دائما!"
TROUPE_MEMBER_SHORT_REPEAT: "يقلق رفاقي كثيرا على البراغيث الأخرى، أما أنا فلا يقلقني أمرها إطلاقا. ستجد طريقها إلينا، وإن لم تفعل، فمن سيعدها أصلا؟ ها ها!"
TROUPE_LEADER_JUDGE_REWARD: "آه، وقبل أن يأخذك الطريق منا مجددا، اسمحي لي أن أقدم لك هدية متواضعة!<page>وجد أحد الصغار أثرا شاحبا بينما كان يحفر في الرمال. إنه شيء شائك وبارد.<page>لا أرى له نفعا لنا نحن البراغيث، ولذلك يسعدنا جميعا، بل نتوق، إلى إهدائه لصديقتنا العزيزة!"
TROUPE_LEADER_DELIVERY_FLEATOPIA_POST: "تقديرا لجهودك المضنية وصداقتك الأبدية، تقبلي هذه المَسابح القليلة مكافأة لك.<page>وتذكري البراغيث حين تسنح لك فرصة استخدامها في المقايضة!"
CARAVAN_LECH_TALK_ACT3: "يا عزيزتي، يا نوري الوحيد وسط الظلام! هل تستحمين في عربة استجمام كرات، وتدعين المياه الدافئة تغسل همومك؟"
CARAVAN_LECH_SPA_ACCEPT_2: "ادخلي من فضلك يا عزيزتي! سأقف هنا لحراستك بينما تستحمين... في هذه البقعة بالذات!"
TROUPE_MEMBER_TALL_MEET_GREYMOOR: "دوديشنا. أتريدين ملجأ من الهواء الرمادي الكثيف؟ إنه ثقيل ورطب. إنني قلق على صحة البراغيث الصغيرة في هذه الأرض.<page>وهم يلعبون في المياه القذرة. أطلب منهم التوقف، لكنهم يضحكون ويرشونني بالماء. إنهم لا يحترمونني!<hpage>تطيع معظم الحشرات أصحاب القوة والإرادة بالغريزة. لا بد من التحدث إليهم بسلطة، وإلا فقد لا تنفذ أوامرك.<page>آه... تعليم البراغيث من عمل سيد البراغيث في الحقيقة. سأستريح هنا حتى يحين وقت الرحيل."
FG_DODGE_DECLINE: "ارحلي إذن أيتها الحشرة. سأنتظر متحديا."
FG_BOUNCE_COMPLETED: "فيكنا! انتهت لعبتنا، لكنني واثق أنك ستلعبين معنا مجددا بعد استراحة قصيرة؟"
FESTIVAL_BOARD_TITLE_JUGGLE: "التلقيف"
TROUPE_LEADER_ACCEPT_QUEST1: "آه! أفهمتك على نحو صحيح أيتها الغريبة؟ ستساعدين البراغيث الوحيدة على الانضمام إلى قافلتنا؟ حقا؟"
TROUPE_LEADER_MEET_FLEATOPIA: "يا آنسة هورنيت، يا منقذتنا! كم تمنينا أن تزورينا.<page>وانظري! هذا المكان الجميل الذي منحتنا إياه، آمنا وبمنأى عن ظلام الأراضي المجاورة وموتها. مكان تكبر فيه البراغيث ذكية وقوية.<page>هنا ستنتهي أسفارنا، فلا مكان في فارلوم أصلح للاستقرار.<hpage>يسرني أن الموقع ناسبكم يا سيد البراغيث. فمن المطمئن معرفة أن هذه البراغيث الكثيرة قد تنجو، بينما يبدو أن معظم حشرات فارلوم تنتظرها مصائر أشد قتامة.<page>نعم! ينتظرنا مستقبل مفعم بالأمل، وما ذلك إلا بفضلك وجهودك. واحتفاء بوصولنا، يسعدني أن أقدم لك خدمة بسيطة.<page>بدأت أتعلم الخياطة، وجمع لي صغار البراغيث بعض المواد. وفكرت في إضافة جيب آخر إلى حقيبة أدواتك، لأجعل رحلاتك أيسر قليلا.<page>إنها خدمة بسيطة، وأقل بكثير مما تستحقين، لكنني آمل مع ذلك أن تنال رضاك!"
TROUPE_LEADER_GAMES_INTRO_REFUSE: "<hpage>لا أعلم ما تنوي فعله يا سيد البراغيث، ولا أستطيع المشاركة الآن.<page>آآآه. آآآآآه! تعساء، تعساء نحن جميعا! كيف نبدأ من دونك يا صديقتنا العزيزة؟"
FESTIVAL_OUTRO_SCENE: "اجتمعنا هنا لنكرم البطلة الكبرى لآخر مهرجاناتنا على الإطلاق!<page>والآن يا آنسة هورنيت، اضربي التمثال العظيم بكل قوتك!"
TROUPE_MEMBER_SHORT_REPEAT_FLEATOPIA: "يحب الصغار هذا المكان أكثر من أي مكان آخر. ولم أسمعهم بهذه السعادة من قبل!"
TROUPE_LEADER_ALLRESCUED_INTRO_FULL_EARLY: "يا صديقتنا العزيزة، يا آنسة هورنيت، انظري إلى فرقتنا الرائعة! اكتمل عددهم، وأشرقت أرواحهم، وكل ذلك بفضل جهودك البطولية!"
FG_BOUNCE_CHOICE: "المنافسة في وثب البراغيث؟"
TROUPE_LEADER_MEET_JUDGE_TRAVELED: "اكتملت رحلة أخرى! ووجدنا موضعا جديدا مرتفعا لنستريح فيه، بل وعلى عتبة تلك القلعة المهيبة نفسها!<hpage>من حسن الحظ أن جميع رفاقك نجوا من الرحلة يا سيد البراغيث. فقد أودى المرتفع العاصف المجاور والغابة المتشابكة التي سبقته بحياة حشرات لا تحصى.<page>نعم! كان صعودا محفوفا بالمخاطر! لعل صحبتك جلبت لنا الحظ يا آنسة هورنيت؟ لقد اطمأنت البراغيث حتما وأنت وسلاحك بقربنا."
TROUPE_LEADER_ALLRESCUED_INTRO_ALT: "وانظري يا آنسة هورنيت، انظري كم جاءت من البراغيث الضائعة! يبدو أن آخر المتخلفين عن الركب صاروا معنا الآن."
TROUPE_LEADER_MEET_1: "آه! أها! يقترب منا أحد أبناء هذه الأراضي المنخفضة الملتهبة! لا تخف يا صديقي، فما نحن البراغيث إلا مسافرون متواضعون!<hpage>سررت بلقائك يا سيدي، لكنني مثلك لست من هذه البلاد، وإنما أعبرها فحسب.<page>أوه. أوهو! إذن أنت من رفاق الترحال! من حسن حظ التائهين أن يلتقوا على طريق غريب."
CARAVAN_LECH_TALK: "دوديشنا يا عزيزتي، دوديشنا! هيه هيه! أعدت لاستخدام عربة استجمام كرات الفاخرة؟ أبقيتها شديدة الدفء من أجلك..."
FG_JUGGLE_COMPLETED_HIGHSCORE: "فيكنا! انتهت اللعبة الآن، وحققت بطلة تلقيف البراغيث نتيجة أعلى من قبل! ارتجفوا رهبة يا أعزائي البراغيث أمام قوة الآنسة هورنيت العزيزة!"
TROUPE_LEADER_INCOMPLETE_QUEST1: "ما زالت براغيث كثيرة ضائعة ووحيدة منتشرة في أنحاء هذه المملكة. ليت مزيدا منها ينضم إلينا حتى تواصل القافلة رحلتها.<page>ستجدين الصغار الأعزاء في شتى الأماكن الغريبة، فهم يحبون الاستكشاف والتطفل واللعب. لكن إن أيقظتهم فسيجدون طريقهم إلى هنا."
TROUPE_MEMBER_TALL_FLEATOPIA_REPEAT_ACT3: "تلك القعقعة العظيمة من الأسفل تشبه صوت وحش عملاق. لكنني أظن أن ذلك الوحش شديد الحزن.<page>للبراغيث والوحوش مشكلاتها على السواء..."
HORNET_FLEA_LAKE_FOUND: "<hpage>كان سيد البراغيث وقافلته يبحثون عن كهوف فسيحة وآمنة. ولعل هذه البحيرة الهادئة وشاطئها مناسبان."
TROUPE_LEADER_JUDGE_READYTOLEAVE: "يا آنسة هورنيت! تأملي كم كبرت قافلتنا! كم صارت جريئة وصاخبة! هذه القاعة المذهبة تكاد تضيق بنا جميعا!<page>تتوق البراغيث الكثيرة إلى السفر مجددا والعثور على مكان تبسط فيه أجنحتها. لكنني بصفتي قائدهم أتردد في أن آمرنا بالرحيل سريعا من هنا.<page>فهذه المرتفعات أخطر من أن ننطلق فيها من دون وجهة آمنة واضحة في أذهاننا.<page>وماذا عنك يا آنسة هورنيت؟ تحملك مهامك إلى أنحاء المملكة. هل صادفت مكانا مناسبا؟"
TROUPE_LEADER_REPEAT_GENERIC: "سنخيم هنا بعض الوقت قبل مواصلة الرحلة. يجب أن نقدر لحظات الأمان والسكينة هذه، فما أندرها."
TROUPE_LEADER_ALLRESCUED_INTRO: "يا صديقتي العزيزة، يا آنسة هورنيت، انظري كم جاءت من البراغيث الضائعة! يبدو أن آخر المتخلفين عن الركب صاروا معنا الآن."
TROUPE_LEADER_MEET_2: "والآن بعد أن التقينا، اعلمي أنني سيد البراغيث موشكا، قائد هذه القافلة!<page>لم تكد رحلتنا تبدأ، لكنك موضع ترحيب إن أردت المكوث هنا قليلا أيتها الغريبة. حين تكون الدروب مظلمة ومتعرجة، يجب أن تبقى الحشرات الطيبة متقاربة!"
TROUPE_MEMBER_SHORT_MEET_JUDGE: "كانت الأرض الرملية الهادرة مليئة بالمخاطر. كدنا نفقد فارغا المسكين لديدان جائعة في أثناء صعودنا!<page>وللأسف، وجد طريقه إلى هنا في النهاية. ها! إنها مزحة فحسب. غريشكين وفارغا صديقان عزيزان، كما هي حال البراغيث جميعا."
BREW_REFILL_PROMPT: "إعادة ملء شراب البراغيث؟"
TROUPE_HUNTER_ALL_FLEAS_FOUND: "جمعتهم جميعا أيتها الحشرة لا البرغوثة. انتهى عملي! لم تعد هناك حاجة إلى البحث. اكتمل عدد قافلتنا!<page>والآن يجب أن يتغير واجبي: المراقبة والحماية. وهذه مهمة جديدة تعجبني كثيرا."
TROUPE_MEMBER_TALL_RETURN: "الجو دافئ هنا، ألا توافقين؟ إنه شديد... ما الكلمة، مريح؟<page>أما سيد البراغيث فيريد دائما مواصلة الرحلة. أظن أننا سنجر قريبا إلى مكان أسوأ بكثير."
CARAVAN_LECH_SPA_DECLINE: "آه... يا للخسارة. هيه هيه! أظنك ستجدين المياه في الداخل مريحة على نحو رائع، لو أعدت التفكير فحسب!"
TROUPE_LEADER_DELIVERY_FLEATOPIA: "<hpage>يا سيد البراغيث، أحمل إليك شحنة من المؤن أرسلها رسل قلب الجرس لمساعدة مستوطنتك.<page>ما زلت تظهرين لنا كل هذا الإخلاص يا آنسة هورنيت!<page>قد نبدو آمنين هنا وبعيدين عن الخطر، لكننا لا نستطيع الابتعاد بحثا عن الطعام، وهذه البراغيث الكثيرة تحتاج إلى عناية كبيرة.<page>سيعيننا هذا الغذاء وهذه المؤن كثيرا، وسيحفظان قوتنا وصحتنا!"
FG_DODGE_INTRO_REPEAT: "هذا الاختبار هو مراوغة البراغيث. ابقي فوق المنصات وتجنبي الهجمات. كلما طال بقاؤك زادت نتيجتك."
TROUPE_MEMBER_SHORT_MEET: "دوديشنا! أعني أهلا بك في لغة البراغيث! أنت برغوثة غريبة ومضحكة جدا، أليس كذلك؟<page>لا فرو لك إطلاقا، وأجنحتك تتساقط! ها ها!<page>إنها مزحة فحسب بالطبع! فنحن البراغيث مشهورون بإلقاء النكات!"
TROUPE_MEMBER_SHORT_RETURN: "رأيت بعض الوحوش هنا تقضم الأرض العظمية وتحفر فيها. هذا ذكي جدا! فالعظام وافرة في كل مكان! لو كانت لي معدة كهذه، ها ها!"
TROUPE_MEMBER_SHORT_REPEAT_FESTIVAL: "اشربي حتى ترتوي، يا آنسة هورنيت! لماذا نهدره؟ امرحي معنا نحن البراغيث قبل أن ينتهي كل شيء!"
FG_DODGE_COMPLETED_HIGHSCORE: "فيكنا. انتهى الاختبار، وحطمت رقمك السابق. ريشكيز، يا بطلة!"
TROUPE_LEADER_OFFER_QUEST1_REPEAT: "لا أثقل عادة على زائر بهموم القافلة. لكن أليس من عادات هذه المملكة أن يبوح المرء بأعمق أمنياته للغرباء؟<page>أمنيتي أن تجد البراغيث الضائعة المسكينة في هذه البلاد طريقها إلى قافلتنا! أيتها الغريبة، أفلا تساعديننا؟"
TROUPE_LEADER_JUDGE_CANLEAVE: "<hpage>يا سيد البراغيث، إن كانت جماعتك لا تزال مستعدة للرحيل، فقد اكتشفت كهفا وراء القلعة، عند أطراف قنوات مائية عتيقة. وقد يوفر لكم ذلك المكان الأمان الذي تحتاجون إليه.<hpage>ستكون الرحلة طويلة، لكنكم ستجدون عند بلوغه شاطئا رمليا خاليا من المفترسات، بجوار بحيرة صافية واسعة. إنه من أكثر الأماكن سلاما مما رأيت في هذه البلاد المضطربة.<page>هذا هو! لا بد أنه المكان! لقد تحددت وجهتنا أخيرا، ويمكن لرحلتنا أن تستمر!<page>أنت صديقة حقيقية للبراغيث، يا آنسة هورنيت. لا شك أن ذلك المكان سيرحب بنا. فهل ستنضمين إلينا في هذه الرحلة الجديدة؟"
CARAVAN_LECH_SPA_INTIMIDATED_ACT3: "يا ضيفتي العزيزة... ما حاجتي إلى المَسابح الآن وقد أوشك كل شيء على النهاية؟ استخدمي عربة الاستجمام مجانا! سيسر كرات العزيز أن يخدمك!"
TROUPE_LEADER_REPEAT_FLEATOPIA: "بلغ هذا المكان كثير من البراغيث الضائعة... لم أجرؤ قط على الأمل في أن نجمع مثل هذه الجماعة العظيمة!<page>لكن ربما لا يزال غيرهم في هذا العالم الواسع... يا لها من أعجوبة لو وجدوا هم أيضا طريقهم إلى جنتنا الجديدة!"
CARAVAN_LECH_WOUNDED_TALK: "آآآه... ما أشد الألم! كل هذا الغضب بسبب خطأ! لم يقصد كرات المسكين اختلاس النظر!<page>هذه العربة القديمة تحتاج إلى عناية دائمة، ولم أكن سوى أصلحها! لم أقصد التطفل، ولم أر إلا لمحة عابرة!<hpage>كف عن الكذب علي أيها البرغوث، واحمد نجاتك. واعلم أنك إن اختلست النظر ثانية فستموت.<page>بالطبع! لن يفعل كرات ذلك أبدا! لنعتبر الأمر منسيا، وستبقين ضيفتي العزيزة إلى الأبد!"
TROUPE_MEMBER_SHORT_MEET_BREW: "دوديشنا! أنت الآنسة هورنيت، صحيح؟ مرحبا بك في مخيمنا الجديد! انتهى الترحال، وحان الشراب!<page>لا شيء ينعش الروح مثل شراب البراغيث الشهير! لقد فرغت للتو من دفعة جديدة، دافئة تفور بالفقاعات!<page>أنت صديقتنا التي تعثر على البراغيث الصغيرة الضائعة، صحيح؟ خذي معك زجاجة من شراب البراغيث، فستبقيك دافئة في أسفارك.<page>أنا أصنع الشراب هنا دائما، فلا تخشي الإكثار منه، وعودي متى أردت المزيد!"
TROUPLE_HUNTER_MEET_COMPLETE_ACT3: "أما زلت هنا، أيتها الحشرة التي ليست برغوثا؟ إن كنت تبحثين عن خدمة، فلم يبق لدي ما أقدمه. كل البراغيث هنا، مجتمعة بالقرب منا.<page>حال البراغيث أفضل بكثير الآن وهي معا، مستعدة لمواجهة أي نهاية آتية."
TROUPE_HUNTER_MEET_NOMAP: "<hpage>تحية طيبة من جديد، أيها البرغوث الضخم. من بين رفاقك الكثيرين، كنت واثقة من أنك ستنجو وتبلغ هذه القافلة.<hpage>فهل تخبرني الآن بالمهمة التي أبعدتك عن رفاقك وجعلت هيئتك مخيفة هكذا؟<page>غررر... مهمتي التعقب، بالأثر والرائحة والحواس الحادة. أعثر على أصدقائنا البراغيث، ولا سيما أصغر صغارنا، لأجمعهم وأقويهم.<hpage>إن كنت قد استشعرت مواقع براغيث ضائعة أخرى، فهل تشاركني بها؟ قد أستطيع إيصالهم سالمين إلى القافلة.<page>المواقع! يمكنني مشاركتها مقابل ثمن، لكنك لا تحملين خريطة أضع عليها العلامات! إن أردت المعرفة، فعليك امتلاك خريطة. وحتى ذلك الحين، لا تجارة بيننا."
FG_DODGE_INTRO_FIRST: "أيتها الحشرة. العالم ينتهي، ولم يبق سوى أن نختبر أنفسنا.<page>هذا اختبار تفادي البراغيث. ابقي فوق المنصات وتجنبي الهجمات. كلما طال بقاؤك زادت نقاطك.<page>من تحرز أعلى النقاط تصبح البطلة. هذا هو الشيء الوحيد الذي بقي لنا لنسعى إليه."
FG_DODGE_INTRO_CHAMP: "أيتها الحشرة، أنت بطلة تفادي البراغيث، لكن الاختبار ما زال متاحا لك. هل تستطيعين تحطيم رقمك؟"
TROUPE_HUNTER_ACT3_MEET: "ها أنت تعودين، أيتها الحشرة التي ليست برغوثا. العالم مدمر، ويقول سيد البراغيث إن النهاية الأخيرة وشيكة.<hpage>هذه البلاد جريحة بشدة، لكن الموت ليس محتوما. ومهمتي الآن أن أحرر هذه المملكة من سقوطها المظلم.<page>غررر... هذه مجرد كلمات منمقة. لم يبق الآن إلا أن نحمي القليل الذي لدينا."
FG_JUGGLE_INTRO_REPEAT: "هيا أيها المحتفلون! جربوا لعبة بهلوان البراغيث! واصلوا ضرب البراغيث إلى أعلى، وأبقوها في الهواء لأطول مدة ممكنة!"
TROUPE_LEADER_JUDGE_CANLEAVE_FIRST: "<hpage>رأيت مكانا يا سيد البراغيث، كهفا وراء القلعة عند أطراف قنوات عتيقة. وقد يوفر لكم ذلك المكان الأمان الذي تحتاجون إليه.<hpage>ستكون الرحلة طويلة، لكنكم ستجدون عند بلوغه شاطئا رمليا خاليا من المفترسات، بجوار بحيرة صافية واسعة. إنه من أكثر الأماكن سلاما مما رأيت في هذه البلاد المضطربة.<page>هذا هو! لا بد أنه المكان! لقد تحددت وجهتنا، ويمكن لرحلتنا أن تستمر!<page>أنت صديقة حقيقية للبراغيث، يا آنسة هورنيت. لا شك أن ذلك المكان سيرحب بنا. فهل ستنضمين إلى القافلة في هذه الرحلة؟"
TROUPE_HUNTER_ALL_FLEAS_FOUND_ACT3: "الجميع هنا الآن، أيتها الحشرة التي ليست برغوثا. انتهى بحثك، فقافلتنا مكتملة.<page>حال البراغيث أفضل بكثير الآن وهي معا، مستعدة لمواجهة أي نهاية آتية."
CARAVAN_LECH_SAVED: "أوه، هيه هيه هيه! يا لها من حال، أن يجد كرات العزيز نفسه معلقا في كهف صغير رطب كهذا!<hpage>تمتد خيوط ملعونة في أنحاء هذه البلاد لتوقع الغافلين. ويبدو أنك لم تعد متضررا منها الآن على الأقل.<hpage>تلك العربة المعدنية... إنها لك، كما أفترض؟<page>أوه، نعم، نعم! أنا في طريقي للانضمام إلى أقرب قافلة للبراغيث. ففي الكثرة أمان، صحيح؟ لقد نلت أكثر من كفايتي من الترحال وحيدا.<page>وأنت... أثق بأنني سأراك هناك؟ تخفي عربتي سرا مميزا سيسرني أن أشاركك إياه حين نلتقي ثانية! هيه هيه!"
TROUPE_LEADER_COMPLETE_WISHWALL_QUEST1_FULL: "والآن، وقد امتلأت قافلتنا حتى كادت تفيض، استرحنا هنا بما يكفي. علينا نحن البراغيث أن نصعد أكثر!<page>لكن أيتها الغريبة، كيف غفلت عن هذا؟ أخبرينا أولا، ماذا ندعوك؟<hpage>يمكنك أن تدعوني هورنيت، يا سيد البراغيث. واعلم أنني مثلك سعيدة برؤية رفاقك البراغيث آمنين مع قافلتك. فهذه بلاد خطرة على من يسافر وحده.<page>أوه، فافيندا! أي إنه أمر مذهل! ما أجمل اجتماعنا كلنا معا.<page>يا صديقتنا العزيزة... يا آنسة هورنيت. تستعد قافلتنا للرحيل نحو المستنقع الفسيح في الأعالي. فهل تسافرين معنا ضيفتنا المكرمة؟"
TROUPE_HUNTER_PURCHASED: "وضعت العلامات على خريطتك، أيتها الحشرة. انظري إلى ما عرفته عن البراغيث الضائعة في أنحاء البلاد.<page>إن كنت بالشجاعة التي وصفك بها رفاقنا البراغيث، فابحثي عنهم وأنقذيهم، حتى تكتمل القافلة."
TROUPE_LEADER_REPEAT_FLEATOPIA_ALLRESCUED: "مرحبا بك هنا دائما، يا آنسة هورنيت، يا صديقة البراغيث الحقيقية!<page>ابقي ما شئت. استريحي واستعيدي قوتك، فنحن البراغيث الكثيرة نستمتع كثيرا بصحبتك."
TROUPE_LEADER_JUDGE_READYTOLEAVE_NO_LAKE_REPEAT: "أرجوك يا صديقة البراغيث العزيزة! إن صادفت يوما كهفا واسعا وخاليا، فعودي مسرعة وأخبرينا.<page>فالبراغيث تتوق إلى الرحيل، وأنا أتوق إلى إيصالهم إلى وجهة آمنة!"
TROUPE_LEADER_ALLRESCUED_ACT3: "<hpage>هذا حسن، يا سيد البراغيث. طالت أسفاري في هذه البلاد وتوغلت في أعماقها، ومع ذلك لقيت في كل ناحية تقريبا أفراد قومك الودودين المحبين للاستطلاع.<hpage>لديكم أنتم البراغيث رغبة نادرة في المغامرة أراها جديرة بالإعجاب، حتى وإن كانت قدراتكم قلما تضاهيها.<hpage>ورغم أنني اعتدت منذ زمن طويل السفر وحدي، فقد كان في متابعة رحلتكم والمشاركة في بعض مراحلها دفء كبير.<page>وكم أسعدتنا نحن البراغيث! حتى فيما يأتي الظلام ليأخذنا، يشرفنا أن نهديك هدية أخيرة، كنزا من ماضي البراغيث المجيد.<page>ولتكن في لحظة فارلوم الأخيرة علامة على أنك صديقة لنا جميعا."
TROUPE_MEMBER_SHORT_REPEAT_JUDGE: "أنت محظوظة يا آنسة هورنيت لأنك بلا فراء مثلنا نحن البراغيث. فكل الرمال التي تعصف في ذلك المكان تعلق داخله!"
TROUPE_MEMBER_TALL_REPEAT: "الوحوش هنا... مخيفة جدا، صحيح؟ مرعبة؟<page>لكن إن تركت لها مجالا تركتك وشأنك. احترمي الوحش يحترمك."
FG_DODGE_INTRO_GAMESCOMPLETE: "أيتها البطلة الكبرى... يا حشرة اسمها هورنيت. هل تخوضين اختبار تفادي البراغيث مرة أخرى؟"
FG_BOUNCE_INTRO_GAMESCOMPLETE: "يا عزيزتي الشرسة، يا بطلتنا الكبرى! هل ترقصين وتحلقين معنا فوق الماء؟"
TROUPE_LEADER_DELIVERY_FESTIVAL: "<hpage>يا سيد البراغيث، أحمل إليك مؤنا أرسلها سعاة قلب الجرس لمساعدة مستوطنتكم.<page>آه، ما أدفأ احتفالنا بهذه اللفتة الكريمة!<page>لن تكبر هذه البراغيث الصغيرة المسكينة لتجوب العالم كما فعلنا، فلنمنحها ما نستطيع من السعادة قبل النهاية."
CARAVAN_LECH_INTRO_MARROW: "<hpage>تحية طيبة من جديد، أيها البرغوث. أرى أنك استطعت الانضمام إلى هذه القافلة بأمان.<page>أوه، نعم! هيه هيه. والفضل كله لك! لك أنت العزيزة الرقيقة! أخبريني، ما اسم صاحبة هذا الجمال الرقيق؟ لا بد أن اسمك عذب ومريح. أأنت فيرغريس؟ أم نكتارسويت؟<hpage>أنا هورنيت، يا سيدي. خاطبني بهذا الاسم، وإلا فلا تخاطبني.<page>غراداك! بالطبع، بالطبع. عزيزتي هورنيت! سأطلعك على سري الصغير. عربتي تتحول إلى مكان مريح للاستجمام، وهي حيلة بارعة جدا.<page>الماء في داخلها شديد السخونة وأنقى من مزمور! هيه هيه! سيسرني أن أدعك تسترخين فيه مقابل أجر متواضع!"
FG_DODGE_ACCEPT: "ماماشكا. يبدأ الاختبار. تفادي البراغيث!"
TROUPE_LEADER_GAMES_INTRO_ALREADYACCEPTED: "<hpage>رأيت طلبك المعلق في قلب الجرس، أيها البرغوث، وأنا أوافق عليه."
TROUPE_LEADER_GAMES_INTRO_TALK_1: "المرثية التي أغنيها هي لنهاية حياتنا القديمة...<page>هنا، في نهاية الأزمنة، تنهار جنتنا تحت أقدامنا. وسيلتهمنا جميعا قريبا، براغيث وأصدقاء..."
TROUPE_LEADER_FOUND_FLEAS: "آه، انظري! بدأت البراغيث المسكينة تجد طريقها إلينا! ما أجمل هذا!<page>لدينا الكثير لنشكرك عليه بالفعل، وآمل أن يكون لدينا قريبا ما يستحق شكرا أكبر! أرجوك، واصلي البحث عن رفاقنا الضائعين!"
TROUPE_HUNTER_WILD_MEET_NOCARAVAN: "غررر... أيتها الحشرة التي ليست برغوثا. لماذا تزعجينني؟ هذا مكاني، نلته بقتال نزيه واستحققته.<hpage>لن أمكث طويلا، سيدتي، ولن أنازعك حقك في هذا الكهف. أسأل فقط عن المهمة التي تجعلك تجثمين وحدك فوق هذه القنوات الرطبة.<page>مهمة؟ عملي بالغ الأهمية، لكن لا حديث عنه هنا والخطر قريب. سأرحل قريبا لأبحث عن البراغيث رفاقي وأنضم إليهم.<page>والآن... غررر. دعيني وشأني! سأخرج قريبا للبحث عن البراغيث الأخرى. البرغوث وحده بخير، لكن البراغيث معا أفضل! وحتى ذلك الحين أحتاج إلى الراحة! ابتعدي أيتها الحشرة!"
TROUPE_LEADER_GAMES_INTRO_REOFFER: "يا صديقتنا العزيزة... يا آنسة هورنيت! سامحينا، لكننا نرجوك في معروف أخير. هل ترافقيننا في عملنا الختامي...؟"
TROUPE_LEADER_GAMES_INTRO_ACCEPT_2: "حان وقت مهرجان البراغيث! احتفال أخير عظيم قبل أن تسحبنا الزلازل السوداء جميعا إلى الظلام!<page>انهضوا يا براغيث للمرة الأخيرة! فلتبدأ الألعاب!"
TROUPE_LEADER_JUDGE_LEAVE: "آه! يا للأسف. سنصلي إذن كي يبقى دربك آمنا.<page>وها هو موطننا الجديد ينادينا. سنعاود الترحال!<hpage>رحلة موفقة، يا سيد البراغيث. أتمنى أن يكون ما ينتظرك من سفر آمنا ويسيرا."
TROUPE_LEADER_COMPLETE_QUEST_SKIP_FULL: "لكن أيتها الغريبة! ما دمت بيننا، فعليك أن تسمعي بالمعجزة التي حدثت!<page>أترين كل هذه البراغيث المجتمعة مع جماعتنا؟ يبدو عددهم هائلا! عدد يستحيل تصديقه، ومع ذلك ها هم مجتمعون معا بأمان. لقد تحققت أعز أمنياتنا!<hpage>إن كنت تبحث عن براغيث تنضم إلى قافلتك، فقد وجدت وحررت الكثير منهم خلال أسفاري.<page>أوه! أيمكن أن يكون ذلك؟ أنت إذن منقذتنا، يا صديقتنا العزيزة! لقد وجدوا جميعا طريقهم الصحيح ووصلوا إلينا مباشرة!<page>والآن، وقد امتلأت قافلتنا حتى كادت تفيض، استرحنا هنا بما يكفي. علينا نحن البراغيث أن نصعد أكثر!<page>لكن أيتها المنقذة، كيف غفلت عن هذا؟ أخبرينا أولا، ماذا ندعوك؟<hpage>يمكنك أن تدعوني هورنيت، يا سيد البراغيث. واعلم أنني مثلك سعيدة برؤية رفاقك البراغيث آمنين مع قافلتك. فهذه بلاد خطرة على من يسافر وحده.<page>أوه، فافيندا! أي إنه أمر مذهل! ما أجمل اجتماعنا كلنا معا.<page>يا صديقتنا العزيزة... يا آنسة هورنيت. تستعد قافلتنا للرحيل نحو المستنقع الفسيح في الأعالي. فهل تسافرين معنا ضيفتنا المكرمة؟"
CARAVAN_LECH_SPA_INTIMIDATED: "مرحبا بعودتك يا عزيزتي الشرسة. دوديشنا! هيه هيه! لا شك أن أسفارك أنهكتك.<page>لا، لن أجرؤ على أخذ مَسابح من ضيفة عزيزة مثلك! استخدمي عربة الاستجمام مجانا! سيسر كرات العزيز أن يخدمك!"
FESTIVAL_OUTRO_PRE: "يا آنسة هورنيت! أثبت أنك البطلة في كل لعبة من ألعاب البراغيث!<page>وأنا واثق الآن بأن البطلة الكبرى لمهرجاننا قد ظهرت. وليست سوى أنت بالطبع!<page>لذا حان بدء مراسمنا الختامية. استعدوا يا براغيث!"
TROUPE_MEMBER_SHORT_MEET_FESTIVAL: "أنت صديقة طيبة للبراغيث، يا آنسة هورنيت. والآن عليك أن تنضمي إلينا وتشربي الكثير. امرحي قبل أن ينتهي كل شيء. لقد صنعنا من الشراب ما يكفي للجميع!<page>لن تدفعي شيئا إن أردت المزيد. فلماذا ندخره وما أمامنا إلا النهاية؟"
TROUPE_LEADER_INFO_LECH: "انضم برغوث غريب إلى جماعتنا. الجميع مرحب بهم، لكن شيئا فيه يجعل فرائي ينتصب.<page>تقدم عربته حماما بخاريا، لكن السعر المطلوب من المَسابح باهظ، ولا سيما علينا نحن البراغيث الذين لا نحمل منها إلا القليل.<page>نحن نوفر له الصحبة والأمان بكثرتنا، أفلا نستحق بعض التخفيض؟"
FG_BOUNCE_COMPLETED_HIGHSCORE: "فيكنا! يا عزيزتي، لقد تفوقت على نفسك! إن تحطيم رقمك السابق لأمر مذهل حقا!"
TROUPE_HUNTER_WILD_REPEAT: "أما زلت هنا، أيتها الحشرة التي ليست برغوثا؟ أحتاج إلى الراحة قبل أن أرحل إلى القافلة، لا إلى الحديث. تبدين من مثيرات المتاعب، ووجودك يوتر صَدَفتي.<hpage>سأنصرف، سيدتي. ابقي قوية في رحلتك، ولعلنا نلتقي ثانية عند القافلة بين رفاقك."
FG_JUGGLE_DECLINE: "آه، بالطبع. ربما تجربين إحدى الألعاب الأخرى؟"
TROUPE_HUNTER_REPEAT_NOMAP: "غررر... أيتها الحشرة التي ليست برغوثا. أما زلت تريدين معرفة عملي؟ لكنك لا تحملين خريطة أضع عليها العلامات! وحتى تمتلكي خريطة، لا تجارة بيننا."
CARAVAN_LECH_SPA_ACCEPT: "شكرا لك. شكرا! سأعتز كثيرا بهذه المَسابح العطرة! والآن لا تخجلي. ادخلي!"
FG_BOUNCE_COMPLETED_CHAMP: "فيكنا! يا عزيزتي، يا راقصتي، انتهت اللعبة وأثبت أنك البطلة!<page>لا أحد يستطيع التفوق على نقاطك. لقد أخزيتنا جميعا برشاقتك المهيبة! لكنك ستواصلين اللعب من أجلي، أليس كذلك؟<page>ليس من الضروري أن تكون نهاية العالم موحشة... هيه هيه..."
TROUPE_LEADER_QUEST1_TRAVEL_ACCEPT: "ممتاز، ممتاز! فلنستعد وننطلق بلا تأخير! انهضوا يا براغيث، فالقافلة تجوب الطرق من جديد!"
FG_BOUNCE_INTRO_REPEAT: "يا عزيزتي، هل تلعبين وثب البراغيث من أجلي مرة أخرى؟ اقفزي عاليا وارتدي فوق البراغيث التي تمر طائرة لأطول مدة تستطيعينها!"
TROUPE_MEMBER_SHORT_SETH: "هل قلت دوديشنا للبرغوث الجديد الجالس هناك؟ إنه هادئ، لكنه بارع جدا في الألعاب!<page>لا تقلقي عليه، فغريشكين سيعتني به. سيسقيه من الشراب ويقدمه إلى جميع البراغيث الأخرى."
TROUPE_LEADER_REPEAT_JUDGE: "سنبقى هنا مدة يا آنسة هورنيت، ونصلي كي تجد براغيث ضائعة أخرى طريقها إلينا.<hpage>سأرسل إليك كل من ألقاه منهم، يا سيد البراغيث."
FESTIVAL_POT_TAKE_BREW: "هل تأخذين شراب البراغيث؟"
FESTIVAL_BOARD_TITLE_BOUNCE: "وثب"
TROUPE_LEADER_ALLRESCUED: "<hpage>هذا حسن، يا سيد البراغيث. طالت أسفاري في هذه البلاد وتوغلت في أعماقها، ومع ذلك لقيت في كل ناحية تقريبا أفراد قومك الودودين المحبين للاستطلاع.<hpage>لديكم أنتم البراغيث رغبة نادرة في المغامرة أراها جديرة بالإعجاب، حتى وإن كانت قدراتكم قلما تضاهيها.<hpage>ورغم أنني اعتدت منذ زمن طويل السفر وحدي، فقد كان في متابعة رحلتكم والمشاركة في بعض مراحلها دفء كبير.<page>آه، وكم أسعدتنا نحن البراغيث أيضا!<page>يشرفني أن أهديك هدية أخيرة، يا آنسة هورنيت، كنزا من ماضي البراغيث المجيد. ولتكن إلى الأبد علامة على أنك صديقة لنا جميعا."
CARAVAN_LECH_SPA_ACCEPT_INTIMIDATED: "عربة الاستجمام لك يا ضيفتي العزيزة! وستظل مفتوحة دائما لمن كانت في مثل لطفك وكرمك... هيه هيه..."
CARAVAN_LECH_SAVED_REPEAT: "إن حالفنا الحظ يا عزيزتي، فسنلتقي ثانية بعد انضمامي إلى قافلة البراغيث.<page>تخفي عربتي سرا مميزا سيسرني أن أشاركك إياه حين نلتقي ثانية!"
TROUPE_LEADER_GAMES_INTRO_ACCEPT_1: "تم الاتفاق إذن. يا رفاق، استعدوا! حان الوقت، حان الوقت!"
TROUPE_MEMBER_TALL_FLEATOPIA_REPEAT: "هذه البحيرة الطويلة... المكان هنا أوسع بكثير. وأخيرا وجدت بعض الهدوء بعيدا عن البراغيث الصغيرة."
TROUPE_LEADER_QUEST1_TRAVEL_DECLINE: "آه، هذا مؤسف، لكنني أفهم. واثق بأن طرقنا ستتقاطع قريبا.<page>والآن علينا الانطلاق! انهضوا يا براغيث، فالقافلة تجوب الطرق من جديد!"
FG_JUGGLE_INTRO_GAMESCOMPLETE: "انتهت المراسم الكبرى، لكننا ما زلنا نلعب! هل تشرفيننا باستعراض في بهلوان البراغيث، يا آنسة هورنيت، أيتها البطلة الكبرى؟"
TROUPE_LEADER_GREYMOOR_TRAVEL: "رائع! رائع! ستغمر الفرحة البراغيث حين تشاركهم رفيقتنا المفضلة هذه الرحلة الجديدة! هيا ننطلق!"
FG_BOUNCE_ACCEPT: "ماماشكا! فلتبدأ لعبتنا الجميلة! وثب البراغيث!"
TROUPE_LEADER_JUDGE_READYTOLEAVE_NO_LAKE: "<hpage>للأسف لا، يا سيد البراغيث. زرت كثيرا من كهوف هذه المملكة، ولم يكن في أي منها الأمان والمساحة اللذان تحتاجون إليهما.<hpage>إن صادفت يوما مكانا كهذا فسأخبرك."
FESTIVAL_BOARD_SPIRIT_NAME: "فلياليا"
FG_JUGGLE_INTRO_FIRST: "ما رأيك في مهرجاننا، يا آنسة هورنيت؟ بينما ينهار العالم من حولنا، سنضحك ونرقص ونمرح!<page>امرحي معنا والعبي بعض ألعاب القدماء!<hpage>وقتي ضيق يا سيد البراغيث. إن شاركت في ألعابكم، فليس ذلك إلا لأصقل مهاراتي استعدادا للاختبار الأكبر الذي سأواجهه قريبا في الأسفل.<page>بالطبع! بالطبع! للمتعة أو التعلم، كل الأسباب ترضينا يا آنسة هورنيت!<page>وانظري هنا، لدينا بهلوان البراغيث، حيث يكمن التحدي في ضرب البراغيث إلى أعلى وإبقائها في الهواء لأطول مدة ممكنة.<page>سيكون خوض ضيفتنا العزيزة لهذه اللعبة المتواضعة شرفا حقيقيا لنا!"
CARAVAN_LECH_WOUNDED_REPEAT: "كان خطأ يا ضيفتي العزيزة! لن يتكرر أبدا! أوه، لن يتكرر أبدا!"
TROUPE_HUNTER_MEET: "<hpage>تحية طيبة من جديد، أيها البرغوث الضخم. من بين أفراد جماعتك جميعا، كنت واثقة من أنك ستنجو وتبلغ هذه القافلة.<hpage>فهل تخبرني الآن بالمهمة التي أبعدتك عن رفاقك وجعلت هيئتك مخيفة هكذا؟<page>غررر... أنا حشرة ولست برغوثا! مهمتي التعقب، بالأثر والرائحة والحواس الحادة. أعثر على أصدقائنا البراغيث، ولا سيما أصغر صغارنا، لأجمعهم وأقويهم.<hpage>إن كنت قد استشعرت مواقع براغيث ضائعة أخرى، فشاركني بها. قد أستطيع إيصالهم سالمين إلى القافلة.<page>معارفي؟ لن أمنحك إياها مجانا، أيتها الحشرة التي ليست برغوثا. المَسابح! أعطيني منها، وسأخبرك بما استشعرته. عملي هذا طويل جدا وشاق، ولذلك أستحق بعض الثروة التي تحملينها."
TROUPE_LEADER_REPEAT_FLEATOPIA_ACT3: "بلغ هذا المكان كثير من البراغيث الضائعة... لم أجرؤ قط على الأمل في أن نجمع مثل هذه الجماعة العظيمة.<page>لكن العالم أصبح شديد الخطورة، وقد تكون هناك براغيث ضائعة أخرى. آمل حقا أن تجد طريقها إلينا!"
TROUPE_LEADER_REPEAT_FLEATOPIA_ALLRESCUED_ACT3: "اجتمعنا نحن البراغيث جميعا، لكن العالم أعلن نهايته الآن بصخب! ومهما عظم عددنا، يبدو أن قافلتنا ستكون الأخيرة.<page>لم يبق سوى أمر واحد نفعله... لكن الاستعدادات تحتاج إلى وقت. إن عادت بك أسفارك إلينا يا صديقتنا العزيزة، فسيكون لك مكان بين المشاركين..."
TROUPE_LEADER_FLEATOPIA_HUNTER_HINT: "آنسة هورنيت، يجب أن أخبرك أننا وجدنا قريبا آثار صياد من قبيلتنا، برغوث يبحث عن البراغيث!<page>ومع أن أمثاله غالبا ما يكونون حادي الرائحة فظاظا، فإن وجودهم مفيد في القافلة.<page>فبرغوث بمثل مهارته النادرة، إن استقر بيننا، قد يوفر لنا الحماية وأكثر.<page>إن كنت لا تزالين راغبة في مساعدتنا على تنمية بلدتنا، فابحثي عنه فوق القنوات المسدودة بالوحل."
FESTIVAL_POT_INSPECT: "مرجل مملوء بشراب البراغيث."
TROUPLE_HUNTER_MEET_COMPLETE: "<hpage>يسرني لقاؤك مجددا، أيها البرغوث الضخم. من بين رفاقك الكثيرين، كنت أقلهم إثارة لقلقي، فقد وثقت بأنك ستنجو وتجد هذه القافلة.<hpage>فهل تخبرني الآن عن المهمة التي أبعدتك عن رفاقك وجعلت هيئتك مخيفة هكذا؟<page>غررر... كانت مهمتي التعقب، بالأثر والرائحة والحواس الحادة. العثور على أصدقائنا البراغيث، ولا سيما الصغار، وجمعهم كي ينموا أقوياء.<page>كانت مهمتي مهمة يوما! أما الآن فلا. كل البراغيث هنا آمنة. وعددهم كبير ونادر! حان وقت الأنخاب والشراب الذي يملأ بطوننا!"
TROUPE_LEADER_GREYMOOR_CANLEAVE: "انظري هنا! كل هذه البراغيث النشيطة وفدت إلى قافلتنا. بفضلك وبفضل صيدك، ازداد عددنا كثيرا. ولعلنا نبلغ يوما عدد قوافل ماضينا الأسطوري!<hpage>يسرني أن أرى هذا العدد الكبير سالما، يا سيد البراغيث. ومرحهم يدل على أنك راع صالح لهذه الجماعة المتنامية.<page>ما أطيب كلماتك، آنسة هورنيت! كم نحن محظوظون إذ وجدنا صديقة كريمة مثلك!<page>لكن علينا الرحيل الآن! استضافتنا هذه المستنقعات بما يكفي. حان وقت الصعود والانتقال إلى كهوف أكثر جفافا!<page>يا صديقة البراغيث الوفية، هل تنضمين إلينا في رحلتنا المقبلة؟"
FG_DODGE_COMPLETED_CHAMP: "فيكنا. انتهى الاختبار.<page>أيتها الحشرة التي ليست برغوثا... كان أداؤك رائعا. تجاوزت نتيجتك حتى نتيجتي.<page>إن رؤية كل هذه المهارة قبل النهاية بلحظات تمنحني فرحا لم أتوقعه.<page>ريشكيز... أهنئك أيتها البطلة."
FESTIVAL_BOARD_TITLE_DODGE: "مراوغة"
TROUPE_LEADER_GREYMOOR_MEET: "آه، آنسة هورنيت! مرحبا بك، ويسعدني لقاؤك من جديد!<page>كانت الرحلة إلى هنا طويلة، لكننا لم نفقد برغوثا واحدا! وها هو القدر يجمعنا ثانية... يا لها من أعجوبة!<hpage>يسرني أن أراك سالما، يا سيد البراغيث. فالرحلة إلى هذا المستنقع من الكهوف السفلى طويلة وخطيرة.<page>خطيرة بلا شك، لكننا نحن البراغيث ولدنا للترحال!<page>والآن، عليك أن تذهبي لرؤية غريشكين، الجالس هناك بجانب المرجل الفوار. بعد السفر الطويل، نشرب لننعش أرواحنا!"
TROUPE_HUNTER_WILD_MEET: "غررر... حشرة لا برغوث. لماذا تزعجينني؟ هذا مكاني، نلته بقتال عادل.<hpage>لن أمكث طويلا، سيدتي. ولن أنازعك حقك في هذا الكهف.<hpage>صادفت عددا من رفاقك البراغيث، وقد اجتمعوا في قافلة. لعلّك تفكر في الانضمام إليهم؟<hpage>يبدو جلدك صلبا، وأخشى أنهم لا يملكون وحدهم القوة الكافية للبقاء طويلا في هذه الأرض.<page>قافلة؟ غررر. شعرت بها في فرائي... حان وقت التغيير. إن كانت القافلة قريبة، فقد أوشكت مهمتي في هذه الأراضي أن تكتمل.<page>والآن... غررر. أكثرت الكلام. اتركيني! سنلتقي في القافلة بين الرفاق الطيبين. هناك أشارك ما تعلمته عن البراغيث وفارلوم. وحتى ذلك الحين، أحتاج إلى الراحة! ارحلي أيتها الحشرة!"
TROUPE_LEADER_GAMES_INTRO_TALK_2: "أوه! أي خيار بقي لنا نحن البائسين؟! لم يترك لنا القدر القاسي سوى مهمة أخيرة...<page>يا صديقتنا العزيزة... آنسة هورنيت! سامحينا، لكننا نرجوك أن تقدمي لنا معروفا آخر. هل ترافقيننا في عملنا الأخير...؟"
FG_JUGGLE_COMPLETED_CHAMP: "فيكنا! انتهت اللعبة، ولدينا بطلة جديدة في ملاعبة البراغيث! مذهل!<page>آنسة هورنيت، بمهارتك هذه، أنا واثق بأنك تستطيعين التفوق في ألعابنا الثلاث جميعا، فتصبحين أعظم بطلة على الإطلاق!"
CARAVAN_LECH_SAVED_ACT3: "يا لها من ملامح رقيقة تظهر الآن من الظلام! ظل كرات المسكين مختبئا هنا من تلك الوحوش المسودة زمنا طويلا، وحيدا تماما!<hpage>الوحوش والحشرات التي أسرها الخيط الأسود خطيرة حقا. أحسنت بالاختباء منها يا سيدي.<hpage>تلك العربة المعدنية... أفترض أنها لك؟<page>أوه، نعم، نعم! أنا في طريقي للانضمام إلى أقرب قافلة براغيث، أليس كذلك؟ ففي الكثرة أمان، صحيح؟ لقد اكتفيت من المغامرة وحيدا.<page>وأنت... أثق بأنني سأراك هناك؟ تخفي عربتي سرا مميزا يسرني أن أطلعك عليه حين نلتقي ثانية! هيه هيه!"
TROUPE_LEADER_COMPLETE_QUEST1: "لكن لا يزال هناك كثير من البراغيث لنجتمع بهم، وقد استرحنا بما يكفي. على القافلة أن تصعد أكثر!<page>لكن أيتها الغريبة، كم كنت مقصرا! عرّفتك بنفسي من قبل ولم أسألك عن اسمك. سامحيني! أخبريني، بماذا نناديك؟<hpage>يمكنك مناداتي هورنيت، يا سيد البراغيث. واعلم أنني مثلك سعيدة برؤية رفاقك البراغيث آمنين مع قافلتك. فهذه الأراضي خطيرة على من يسافر وحيدا.<hpage>لا يزال أمامي سفر طويل. وإذا صادفت مزيدا من البراغيث، فسأساعدهم قدر استطاعتي.<page>أوه، فافيندا! أعني، هذا مذهل! ما أجمل ما سمعته منك!<page>يا صديقتنا العزيزة... آنسة هورنيت. علينا الآن أن نرحل بقافلتنا نحو المستنقع الواسع في الأعالي. فهل تسافرين معنا ضيفة مكرمة؟"
TROUPE_MEMBER_TALL_FLEATOPIA: "سافرنا نحن البراغيث عبر أماكن فظيعة كثيرة. كدت أموت مرات عديدة. لكن المكان هنا يبدو آمنا بما يكفي.<page>هل ستستريحين أنت أيضا؟ بات المكان يتسع لنا جميعا الآن... يا صديقتي."
TROUPE_LEADER_MEET_JUDGE: "مرحبا بك من جديد، آنسة هورنيت! انظري كم ارتفعت قافلتنا، فهي تستريح عند عتبة تلك القلعة العظيمة!<hpage>من حسن الحظ أن جميع رفاقك نجوا من الرحلة، يا سيد البراغيث. فالمرتقى العاصف بجوارنا والغابة المتشابكة قبله أوديا بحياة حشرات لا تحصى.<page>صحيح! كان صعودا محفوفا بالمخاطر! رأينا الهياكل الكثيرة في طريقنا. لا بد أن حظا عظيما يرعانا لننجح في رحلتنا هكذا."
TROUPE_LEADER_COMPLETE_QUEST1_INTRO: "انظري، انظري! انضم إلى القافلة كثير من البراغيث! يا لها من معجزة! لن نوفيك حق الشكر على تلبيتك أمنيتنا المتواضعة!"
TROUPE_HUNTER_MEET_ACT3: "ما زلت هنا أيتها الحشرة التي ليست برغوثا؟ أتريدين مني خدمة؟ لدي معرفة واسعة بأماكن الصغار الضائعين، سمعتهم وشممت أثرهم في أنحاء الكهوف.<page>ساعدي في العثور عليهم! وإحضارهم! الأفضل أن نجتمع كلنا، نحن البراغيث... بعد أن أظلمت الأيام..."
FG_BOUNCE_DECLINE: "كما تشائين، يا حلوتي. أم نكتفي بالراحة معا هنا على شاطئ الأبدية؟"
CARAVAN_LECH_SPA_PROMPT: "دخول المنتجع؟"
FG_JUGGLE_ACCEPT: "ماماشكا! أقول: لتبدأ اللعبة! ملاعبة البراغيث!"
TROUPE_LEADER_MEET_FLEATOPIA_TRAVELED: "ما أجمل هذا المكان الذي وهبتنا إياه، آنسة هورنيت! إنه آمن وبعيد عن ظلام الأراضي المجاورة وموتها. مكان تنمو فيه البراغيث ذكية وقوية.<page>هنا ستنتهي أسفارنا، فلا مكان في فارلوم أفضل منه للاستقرار.<hpage>يسرني أن المكان يناسبكم، يا سيد البراغيث. وتطمئنني معرفة أن هذه البراغيث الكثيرة قد تنجو. فمعظم حشرات فارلوم ينتظرها مصير أشد قتامة.<page>صحيح! ينتظرنا مستقبل مفعم بالأمل! وما كان ذلك ليكون لولاك وجهودك. واحتفالا بوصولنا، يسرني أن أقدم لك خدمة صغيرة.<page>كنت أتعلم الخياطة، وكان صغار البراغيث يجمعون لي المواد. وفكرت في إضافة جيب آخر إلى حقيبة أدواتك لأيسر أسفارك قليلا.<page>إنه معروف بسيط، أقل كثيرا مما تستحقين، لكنني آمل أن يرضيك!"
FG_BOUNCE_INTRO_CHAMP: "يا بطلة وثب البراغيث العزيزة، هل تلعبين معنا ثانية؟ لنتراقص ونطير فوق المياه حتى يتلاشى العالم نفسه!"
CARAVAN_LECH_ACT3_MEET: "يا حلوتي! كم يسعدني أن أراك تخرجين من الظلام الرهيب الذي يبتلع العالم الآن!<page>خشي كرات المسكين ألا يؤنسه عند نهاية كل شيء سوى رفاقه البراغيث كريهي الفراء. ما أكرمك إذ تقضين لحظاتك الأخيرة هنا معي!"
FESTIVAL_BOARD_HORNET_NAME: "هورنيت"
TROUPE_LEADER_ACCEPTED_WISHWALL_QUEST1_FULL: "<hpage>يا سيد البراغيث، أخذت طلبك من جدار الأمنيات في مخيم الحجاج. أكنت تبحث عن براغيث ينضمون إلى قافلتك؟ لقد وجدت كثيرين وحررتهم خلال أسفاري.<page>نعم، بالتأكيد! وانظري، لقد وصلوا جميعا إلينا! اجتمع هنا عدد هائل، وكأنها معجزة. تحققت أمنيتنا حتى قبل أن نعرف بوعدك!"
FG_JUGGLE_COMPLETED: "فيكنا! انتهت اللعبة الآن، لكن يمكنك اللعب ثانية قدر ما تشائين... إلى أن تحل نهاية العالم بنا جميعا!"
TROUPE_LEADER_OFFER_QUEST1: "أيتها الغريبة، هل تصغين إلى ما يقلقني؟ حان الوقت لنتلاقى نحن البراغيث ونسافر معا، كما فعلت الأجيال من قبلنا.<page>كان يفترض ببراغيث هذه المملكة الكثيرة أن تتوافد إلى قافلتنا، لكن الأيام غدت خطيرة. تشعرين بذلك أيضا، أليس كذلك؟ أقرباؤنا المساكين مختبئون في الخارج!<page>فهل تساعديننا، إن استطعت، على العثور على هذه البراغيث المسكينة الضائعة؟ لا نجرؤ على مواصلة رحلتنا حتى يجد بعض أولئك الأعزاء طريقهم إلينا!"
TROUPE_TRAVEL_PROMPT: "السفر مع قافلة البراغيث؟"
TROUPE_LEADER_GREYMOOR_LEAVE: "واحسرتاه، آنسة هورنيت! حتى تتقاطع دروبنا ثانية، سترافقك أخلص أمنياتنا.<hpage>أتمنى لك ولجماعتك سفرا آمنا، يا سيد البراغيث."
FESTIVAL_OUTRO_POST: "وها هو الاحتفال العظيم يبلغ ذروته، ويظهر بطله الأكبر!<page>شكرا لك على قضاء لحظاتك الأخيرة هنا معنا، آنسة هورنيت.<page>مع أن العالم سينتهي قريبا وستنهار جنتنا، ستظل ذكريات الصداقة التي جمعتنا تتردد حتما في الفراغ المقبل إلى الأبد!<hpage>مشاعرك طيبة يا سيد البراغيث، لكن هذا العالم لن ينتهي.<page>حقا؟ ما أكرمك إذ تمنحيننا كلمات الأمل، لكننا تقبلنا مصيرنا. هيا، لننس الماضي ونبتهج معا!<hpage>ما أمنحكم إياه ليس مجرد أمل يا سيدي، بل وعد. لمعاناة هذه المملكة سبب واحد، وسأطهرها منه بمخلبي.<hpage>قد لا ينجو كل برغوث مما سيأتي... لكن العالم لن يموت، وربما تبقى لمستوطنتكم فرصة للازدهار.<page>آه؟ تتحدثين... بيقين شديد. لكنني لا أستطيع حمل نفسي على مثل هذا الأمل، سامحيني.<page>مهما يحدث، سنبقى نحن البراغيث هنا حتى النهاية. وستستمر الألعاب بالطبع! احتفلي معنا ما شئت، يا صديقتنا العزيزة."
FG_JUGGLE_COMPLETED_CHAMP_TO_OUTRO: "فيكنا! انتهت اللعبة، ولدينا بطلة جديدة في ملاعبة البراغيث! مذهل!<page>أثبت أنك البطلة في كل لعبة من ألعاب البراغيث!<page>وأنا واثق الآن بأن البطلة الكبرى لمهرجاننا قد ظهرت. إنها أنت دون سواك بالطبع!<page>وهكذا يجب أن يبدأ احتفالنا الأخير. أيتها البراغيث، استعدوا!"
TROUPE_HUNTER_CANCELED: "ألا تريدين معرفتي، أيتها الحشرة التي ليست برغوثا؟ نادرا ما نشارك مثل هذه الأمور مع من ليسوا منا."
FG_JUGGLE_CHOICE: "المنافسة في ملاعبة البراغيث؟"
FG_JUGGLE_INTRO_CHAMP: "آنسة هورنيت، أنت أعظمنا جميعا في ملاعبة البراغيث! لكن هل ستتحدين نفسك لتحققي إنجازات أعلى؟"
TROUPE_MEMBER_TALL_MEET: "دوديشنا، أيتها الغريبة. تبدين... متعبة قليلا، أليس كذلك؟ هل أنت مريضة؟<page>يمكنك الاستراحة معنا هنا إن شئت. المكان مظلم ودافئ من الأسفل، وهذا مفيد للصحة.<page>لكن احذري ألا تمكثي طويلا. فأنت لست برغوثا في النهاية."
TROUPE_HUNTER_WILD_REPEAT_NOCARAVAN: "أما زلت هنا أيتها الحشرة؟ أحتاج إلى الراحة قبل السفر، لا إلى الحديث. أنت من النوع المثير للمتاعب. تجعلين صَدَفتي متوترة.<hpage>سأنصرف، سيدتي. ابقي قوية في رحلتك. لعلنا نلتقي ثانية في مكان أكثر ترحيبا."
TROUPE_LEADER_GREYMOOR_CANLEAVE_FULL: "انظري، آنسة هورنيت! تأملي البراغيث النشيطة الكثيرة التي تؤلف قافلتنا. بفضلك وبفضل صيدك، اجتمع هنا كثيرون! وكلهم متشوقون للسفر ثانية!<page>كنا نتمنى يوما أن نضاهي أعداد ماضينا الأسطوري، أما الآن فلعلنا تجاوزناها!<hpage>يسرني هذا المنظر، يا سيد البراغيث، والمرح المنتشر حول القافلة يدل على أنك راع صالح للجماعة.<page>ما أطيب كلماتك، آنسة هورنيت! كم نحن محظوظون إذ وجدنا صديقة كريمة مثلك!<page>لكن علينا الرحيل الآن! استضافتنا هذه المستنقعات بما يكفي. حان وقت الصعود والانتقال إلى كهوف أكثر جفافا!<page>يا صديقة البراغيث الوفية، هل تنضمين إلينا في رحلتنا المقبلة؟"
TROUPE_LEADER_JUDGE_TRAVEL: "رائع! سنغمر نحن البراغيث فرحا بصحبتك لنا في الطريق.<page>والآن! موطننا الجديد ينادينا. علينا الرحيل!"
TROUPE_MEMBER_SHORT_REPEAT_GREYMOOR: "يثير عجبي أمر هذه الأرض... شيء ثقيل يخيم فوقها كالظل. آمل ألا تواجه البراغيث الصغيرة خطرا كبيرا هنا..."
TROUPE_LEADER_ACCEPTED_WISHWALL_QUEST1: "<hpage>يا سيد البراغيث، أخذت طلبك من جدار الأمنيات في مخيم الحجاج. أكنت تبحث عن براغيث ينضمون إلى قافلتك؟<page>نعم! حان الوقت لنتلاقى نحن البراغيث ونسافر معا، كما فعلت الأجيال من قبلنا.<page>كان يفترض ببراغيث هذه المملكة الكثيرة أن تتوافد إلى قافلتنا، لكن الأيام غدت خطيرة. تشعرين بذلك أيضا، أليس كذلك؟ أقرباؤنا المساكين مختبئون في الخارج!<page>لكن... هل فهمتك على وجه صحيح أيتها الغريبة؟ ستساعدين في العثور على البراغيث المساكين الضائعين؟ حقا؟"
TROUPE_LEADER_GREYMOOR_HAUNTEDBELLHART: "ذلك العرق العظيم من الأجراس هناك... أراد بعض البراغيث الاحتماء بداخله، لكنني لم أطمئن إليه. تبدو تلك الكتلة الصارخة بأكملها غير مستقرة! إنها تجعلني أرتجف!<hpage>أحسنت بعدم الدخول، يا سيد البراغيث. فقد استولت لعنة حريرية على المستوطنة في الداخل. انصح رفاقك بالابتعاد عن ذلك المكان.<page>لعنة؟! حـ... حسنا إذن! نحن مدينون لك بالشكر مرة أخرى. سأخبر البراغيث جميعا بألا يقتربوا أكثر."
FG_DODGE_COMPLETED: "فيكنا. انتهى الاختبار. يمكنك رؤية نتيجتك على اللوح المجاور لي."
