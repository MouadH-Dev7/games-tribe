SNAILS_ACT3_MEET_PT2: "<page=S>تبدو مستاء يا عجوز. لم نفعل إلا ما طلبت، أليس كذلك؟ انطبق الفخ والتهم الكائن.<hpage>لقد قيدتموه بذلك الفراغ!<page=S>لا تتظاهر بالجهل. ينبغي أن تعرف ولع عائلتنا جيدا. لا بد أنك توقعت ذلك؟<page=B>وإلا فكيف كنا سنأمل في أسر واحدة من أقربائك الشاحبين؟ أو رؤيتها تلتهم بتلك الكفاءة التي لا تشبع؟<hpage>إذن فقد أخطأتم الحساب خطأ جسيما. سقطت الفارسة البيضاء مع الأم...<page=M>أوه... الزلازل، صحيح؟ شعرنا بقوتها حتى هنا. إذن فالأم تقاوم الظلام... لتنقذ ابنتها؟<hpage>ذلك ظني. يجب أن أهبط إلى الفراغ تحتنا وأتبين الحقيقة بنفسي.<page=M>أوووه. يا للأسف... ستسقط فارلوم كلها بسبب تخبطها.<hpage>ربما، لكنني لن أشاهدها تنهار من دون تدخل."
GRINDLE_ITEM_TOOL_METAL: "هذه الكتلة ثقيلة حقا، ولامعة أيضا، فلا بد أنها تساوي شيئا!"
GRINDLE_SHOP_REPEAT_ACT3: "الأوقات العصيبة تجلب زبائن يائسين، هيه هيه! فلنبدأ التجارة، ما رأيك؟"
SPRINTMASTER_HERO_WIN_PRE_2: "مرة أخرى... هوو... هوو. مذهل حقا!<page>أكان السبب هو المسار؟ هل فقدت تركيزي؟ أم أنك ببساطة الحشرة التي انتظرتها طويلا؟ صاحبة المهارة التي يمكنها أخيرا تحقيق أمنيتي؟<page>لا بد أن أمنحك مكافأة أخرى على سرعتك، أيتها الحشرة الرشيقة. مكافأة تستحقينها كاملة!"
HUNTER_FAN_HINT_ZANGO: "هل سمعت يا آنسة بالغة؟ خلف الطحلب، في الكهوف المتداعية المليئة بالديدان، تحدث تغيرات كثيرة تختلف عن الظلام البشع المتمدد في الخارج.<page>ما الذي يحدث هذا التحول المشرق والجريء؟ أهو وحش؟ أم حشرة لم يرها أحد؟ ما أروع اكتشافه مختبئا في ركن عميق!<page>يجب أن تذهبي للبحث يا آنسة بالغة! أنت وذلك النصل الحاد جدا. تخيلي الصَدَفة الغريبة الشهية التي تنتظر أن تضاف إلى سجلك!"
SHERMA_BELLHART_MEET: "ما أروع هذا المكان! أجراس ذهبية للأصداف المنهكة! ها ها ها!<hpage>هذه البلدة آمنة الآن أيها الحاج الصغير. لعل عليك أن تتخذها وطنا؟<hpage>لقد قطعت شوطا كبيرا حتى هنا، ولن تكون الطرق أمامك إلا أشد خطرا.<page>نعم، إنها خطرة بالتأكيد! لكنني سأمضي بسرور في أي طريق يحمل عجائب بمثل هذه الروعة، أيتها الفتاة الحمراء!"
MAPPER_MEET_BONE_1C: "<hpage>نظرتك ثاقبة إلى مهارتي أيتها الحشرة، لكن طفولتي مضت منذ زمن بعيد. ما الذي حدث هنا؟ أرى آثار قتال في كل مكان."
HORNET_SILENCE: "<hpage>..."
MAPPER_WHITE_FLOWER_ACT3: "<hpage>اقتربت الساعة يا شاكرا. كان الثمن فادحا والتحدي شاقا، لكنني ظفرت بقوة تستطيع إنهاء هذه الكارثة. <page>جيندا... هذا خبر جيد وضروري يا هورنيت حاملة الإبرة. بلغت قوتي حدودها تقريبا، وما زالت الهياكل المظلمة تهاجم بلا توقف.<page>اتخذي خطوتك الأخيرة، ودعينا جميعا نشهد النهاية."
SETH_FESTIVAL_REPEAT_POST_MEMENTO: "إنجازاتك في الألعاب ملهمة! وقد أضطر مع الوقت إلى منافسة تلك النتائج المذهلة..."
GARMOND_REPEAT: "<hpage>حظا موفقا في مسعاك يا غارموند. إن كنت تريد الاقتصاص لرفاقك الراحلين، فأظن أن أمامك تحديات أخرى.<page>نعم! سنقاتل أنا وزازا حتى نهاية الكهوف إن لزم، من أجل الحشرات التي نحملها في قلوبنا، ومن أجل شرفنا كفارسين!"
GARMOND_AID_MEET_FORUM: "آه، أتشعرين بذلك أيضا؟ أتباع القلعة مجتمعون بالقرب بأعداد طاغية!<page>لكن اجتماعنا نحن الثلاثة سيكون أشد طغيانا! أتسمحين لنا بالقتال إلى جانبك يا أختنا الشجاعة؟"
GRINDLE_CITADEL_MEET: "حسنا، حسنا! انظري ماذا يحدث للحشرات المتنمرة الشريرة حين تتعرض لغريندل المسكين العجوز! نرى أنها نهاية مستحقة.<page>سمعنا أن هذه القلعة القديمة لطيفة وهادئة ومكتظة بالغنائم. فماذا حدث؟ لماذا تعج بالمتنمرين والمتطفلين؟<hpage>بدأ الكائن الذي يطارد هذا المكان يتحرك أيها اللص الصغير. وتجوب طوائف القلعة القاعات الآن. خير لك أن ترحل قريبا إن أردت النجاة.<page>ماذا؟ ماذا؟ أتمزحين؟ سنبقى هنا حتى نفرغ من السرقة! أنت التي ينبغي أن ترحلي إن كنت خائفة هكذا!"
HUNTER_FAN_HINT_VOLTNEST: "عاليا، فوق كهوف القشرة كلها، بلغ نو خبر حفرة مليئة بأشياء متلوية تنطلق وتطلق الشرر.<page>لكن يا للحزن! لا تستطيع نو أن تراها بنفسها. فالأراضي تهتز وترتج، والخيوط المتوحشة تتمدد، والأخطار أكثر مما تحتمل.<page>لا بد أن تكوني أنت يا آنسة بالغة، فأنت أكبر سنا وأصلب، وصَدَفتك أقل قيمة. ابحثي عن الكهف وما فيه. وإلا فكيف يكتمل السجل؟"
HUNTER_FAN_ZAPNEST_MEET: "آه يا آنسة بالغة، كانت نو تأمل أن تعودي إلى هنا. فنو الذكية تجيد تتبع الأماكن التي مررت بها؛ ترى آثار ضرباتك وتشم رائحتك العطرة!<page>وانظري إلى حيث قاد الأثر نو اللطيفة! كانت تعيش في هذا العش دودة غليظة، تقرقر وتطقطق في الظلام.<page>لا تزال عصارتها الحامضة تغطي جوف الصخور، وستجمعها نو الصبورة كلها!<hpage>ثمة الكثير لتتعلميه في هذه المرتفعات المتقشرة يا نو، لكن فيها أخطارا كثيرة أيضا. أشبعي فضولك إن كان لا بد، لكن أبقي حواسك يقظة تجاه الظلام."
SPRINTMASTER_HERO_LOSE: "لا تدعي الهزيمة تثقل كاهلك أيتها الحشرة الرشيقة! ما دامت فيك قوة، فعودي ببساطة إلى التحدي. فلنحلق معا بسرعة!"
COURIER_SHORT_THANK_PT1: "أوه! اختفت تلك الوحوش البشعة! لك جزيل الشكر أيتها المحاربة العظيمة!<hpage>كان أمرا بسيطا أيتها الحشرة الصغيرة. أفترض أنك تيب، الرسول؟<hpage>بدت فري، تاجرة قلب الجرس، قلقة على سلامتك... وعلى الحمولة التي تحملها.<page>هي أرسلتك؟ باه! عليها أن تتعلم قليلا من الصبر! لم أغب إلا قليلا! لكن... من حسن حظي أنك جئت."
MAPPER_ITEM_MAP_CORALCAVERNS_NAME: "خريطة رمال كاراك"
COURIER_SHORT_THANK_PT2: "حسنا، سأنطلق الآن. ستأتي تلك الدودة العجوز في الجرس خلفي بنفسها إن لم تصلها بضاعتها!"
SPRINTMASTER_HERO_WIN_AFTER_WISH_REPEAT: "الآن يجب أن أزيد تدريبي وسعيي، فأمضي أبعد وأسرع على خطاك. لقد أيقظت مهارتك على هذه المسارات عزيمتي أيتها الحشرة الرشيقة. ولك امتناني إلى الأبد."
MAPPER_ITEM_MAP_BELLHART_DESC: "بلدة شيدت داخل عرق كثيف من الأجراس يمتد عبر قلب فارلوم. من يا ترى صنع كل هذه الأجراس، ولماذا؟"
MAPPER_SPAR_INTRO: "يا هورنيت حاملة الإبرة! بعد وفاة معلمتي، عزمت على صقل مهاراتي لعلني أبلغ مع الوقت مستواها في أوجها.<page>يلزمني كثير من العمل لتحقيق ذلك الهدف. وقد وجدت هذه الصخرة العريضة المكشوفة ساحة جيدة للتدريب.<page>هل تنازلينني الآن؟ ارفعي ذلك النصل واختبري حلقاتي! قد تكونين أعظم تحد واجهته حتى الآن."
MAPPER_MAPPING: "<hpage>تظهر خرائطك وأدواتك مهارة رفيعة يا شاكرا. لم أقابل إلا قليلين يضاهون موهبتك.<page>رسم الخرائط! تف. باكالو! إنها حرفة شائعة بين أفراد قبيلتي. والأهم في الرحلة أن يبقى الذهن متيقظا.<page>رسم الكهوف، وحفظ الطريق، ومعرفة موقع المرء داخل المملكة، كلها مهمة تشغل ذهن المحارب.<page>من المؤسف أن معلمتي العظيمة لم تتعلم هذه المهارة أبدا. أما موهبتها في الضياع... فتكاد تثير إعجابي..."
GRINDLE_SLAB_REPEAT: "أشياء ثمينة كثيرة مخبأة في هذا السجن القديم... يا له من مكان رائع ليجلبوا إليه حشرة واشية صغيرة ومحظوظة مثل غريندل! يا للخدمة التي أسداها لنا أولئك البلهاء! أوهوهو!"
HUNTER_FAN_JOURNAL_DECLINED_ACT3: "أوووه، مااا. يا آنسة بالغة، أترفضين طلب نو المسكينة؟ كم أنت لاذعة!<hpage>أنا آسفة يا نو. مع أنني أدرك قيمة أمنيتك، فإن مهمتي أكثر إلحاحا."
HUNTER_FAN_GREET: "أتيت لتستريحي هنا يا آنسة بالغة؟ إذن دعي نو تطلع على سجلنا، فهي متلهفة لرؤية ما قطعته!"
SETH_CITADEL_MEET: "هذا الصرح العظيم... لا بد أن بناءه استغرق أعمار حشرات لا تحصى. جراحه غائرة الآن، وأسمع أنين أنفاسه الأخيرة.<page>كل ما ينمو لا بد أن يزول، فيما أظن. ومع ذلك، فرؤية حاله الراهنة امتياز لن أضيعه.<page>وأنت يا صديقتي هورنيت؟ إلى أين تقودك رحلاتك؟<hpage>قادني سفري إلى الأعماق، وسيقودني إلى ما هو أعمق. تقع على عاتقي مسؤولية تحرير هذه الأرض من مصيرها المظلم.<hpage>لكن هذا لا يعنيك يا سيدي. واصل رحلتك، لكن لا تترك سلاحك بعيدا عن مخلبك لحظة."
SHERMA_CARETAKER_MEET_B: "إلى ملاذنا الآمن؟ بيتنا... هذا ما بقي منه بعدما بدأ الانهيار العظيم.<page>جاء ذلك الصوت المرعب من الأعلى. اهتز كل شيء وتداعى، وانبثقت الخيوط السوداء من الأسفل. وقد فقد كثير من الحجاج المساكين في الدمار.<page>وربما كنت أنت أيضا منهم، لولا بعض الحجاج الفارين الذين وجدوك ساقطة وحملوك إلينا.<hpage>الخيوط السوداء... قد أعرف مصدرها.<hpage>يجب أن أتحدث إلى الحارس العجوز. أتعرف ما حل به؟ أرى أنه ترك لك رداءه.<page>نعم. عهد إلي برعاية من بقوا هنا، وقال إن عليه التشاور مع عائلته في الأسفل.<hpage>في الأسفل... إذن فقد تسللوا للاختباء في مصلاهم المدمر.<hpage>يجب أن أزورهم. شكرا يا شيرما. الزم الحذر واعتن بسائر الحجاج."
SHAKRA_GRAND_FORUM: "باكانا! انتصار رائع! هزمت الحشرات المسكونة، وبات الطريق أمامك. فلنلتق قريبا بعيدا عن هذه القلعة المروعة."
MAPPER_ITEM_MAP_JUDGESTEPS_DESC: "كهوف هائلة تصعد نحو قلعة فارلوم. تبتلع الرمال والريح العاوية طرقها ببطء."
G_PRINCE_SONG_REPEAT: "<hpage>وداعا أيتها الحشرة الطويلة، إلى أن تتقاطع طرقنا من جديد.<page>أو إلى أن يأخذنا الموت كلينا في هدوء..."
SPRINTMASTER_EXTRA_WIN_PRE: "مرة بعد مرة تثبتين براعتك أيتها الحشرة الرشيقة، ومع ذلك لا أمل التحدي أبدا!<page>ولمكافأتك على هذا الإنجاز المذهل في التحمل، لا أملك سوى هذه الجائزة الصغيرة، تذكار أهداني إياه من علمني السرعة، وقد آل إليك بحق."
SNAILS_ACT3_DEEP_MEMORY_REPEAT: "<page=S>هات لنا القلوب يا عجوز. اجعلها تنبض، ضارية وأخيرة. وشاهد بنفسك القوة المنسية لأرض الحشرات هذه قبل أن نحرق تلك الذكريات في سبيل إنقاذها."
LACE_CITADEL_MEET2: "تسك... هاهاهاا. رائع! إذن فالعنكبوت تعرف شيئا عن الكائنات التي لا يسبر غورها، ومع ذلك تأمل أن تصمد أمام واحد منها، أمام إله... <page>أين تخفين هذه القوة التي تزعمين أنها بلا حدود، أيتها العنكبوت؟ راقبت كفاحك في طريقك إلينا. كانت رحلتك أليمة محطمة. لا بد من الرشاقة للوقوف أمام الألوهية.<hpage>إذن فالأفضل أن تواصلي المشاهدة يا صغيرة. وجدت أن من يدعون الألوهية نادرا ما يكونون أهلا للقب.<hpage>وعلمتني التجربة أن الآلهة نفسها قد تسقط."
MAPPER_GENERIC_WILDS: "<hpage>يا شاكرا، تبدين في موطنك تماما بين هذه البراري.<page>بوشانكا! تتيح هذه الحقول المحترقة مسالك كثيرة ومعارك وفيرة. هل أقفز من موقع عال على ذوي الأصداف الحمراء، أم أواجههم وجها لوجه وحلقاتي جاهزة؟ قرارات كهذه تستحق أن يعيش المرء من أجلها!<page>يدهشني كثيرا أن أولئك الحجاج الضعفاء تمكنوا يوما من صعود هذا المكان المحترق المتوحش بسلام."
GREEN_PRINCE_VERDANIA_STAG_REPEAT: "هنا دليل عظمتنا... علامة حقنا الإلهي..."
SPRINTMASTER_OFFER_1: "هوي هوي! ها قد ظهر خصم رشيق. أخيرا! أخيرا!<hpage>إن كنت تبحث عن منافسين يا سيدي، فعليك اختيار مكان أقل نأيا. فمن النادر أن أصادف أنا، أو أي حشرة أخرى، هذا الكهف البعيد.<page>صحيح! لكن هل يوجد مكان أفضل منه بعد اكتشافه؟ هذا الجسد العظمي الهائل بعيد كل البعد عن آلام فارلوم.<page>هنا نستطيع أن نختبر سرعتنا وأصدافنا الملساء بحرية. هنا يمكننا أن نتسابق!<page>لا بد أنك متلهفة لبدء التحدي، أيتها المنافسة؟ حققي أمنيتي! ولنكتشف حدودنا معا!"
GREEN_PRINCE_VERDANIA_UNFINISHED_MEET: "عاصمتنا التي شيدناها شامخة... مقر سيادتنا... غابت عن ذاكرتي...<page>لماذا تتلاشى؟ لماذا أعجز عن تذكر ذلك المكان المقدس؟"
GARMOND_ENCLAVE_REPEAT: "سأبقى أنا وزازا هنا فترة أطول... هؤلاء الحجاج بحاجة إلى من يرعاهم، ونحن ملتزمان بهذه المهمة."
LACE_MEET_4_BRIDGE: "رائع! لقد أعجبتني من الآن!<page>لكن كم سيكون مملا أن أقضي عليك الآن، وأنت قريبة إلى هذا الحد المؤلم من قلعتنا العظيمة...<page>اصعدي أكثر أيتها العنكبوتة الصغيرة. أريد أن أتذوق معاناتك فترة أطول قليلا!"
HUNTER_FAN_ZAPNEST_SLAP3: "لكن نو عاقلة وتفهم. للآنسة الكبيرة غاية، وعليها أن ترحل.<page>يمكن أن ينتظر التنظيف إلى وقت آخر. نو صبورة... صبورة دائما."
GRINDLE_SLAB_2: "<hpage>يبدو أن لديكم بعض المعرفة بهذا السجن وحراسه. هل تعرفون طريقا للهرب؟<page>الهرب! حشرة سجن صغيرة مثلك لن تهرب من شيء أبدا! ارحلي من هنا، أتفعلين؟ كفي عن إزعاجنا! ليس لديك ما تسرقينه، فلا حديث بيننا!"
GARMOND_DEFEATED_REPEAT: "رغم أن غبار معركتنا هنا لم يهدأ بعد، فلا بد أن أرحل أنا وزازا قريبا. ذكرى قريتنا تدعونا إلى مواصلة المسير. وداعا أيتها الأخت الشجاعة!"
SPRINTMASTER_OFFER_4: "<page>أتودين خوض التحدي مجددا أيتها الحشرة الرشيقة؟ لقد أثبت جدارتك مرارا.<hpage>لا يزال مسارك يعلمني يا سيدي. فعليه أرى حدودي بوضوح أكبر، وأتعلم كيف أتجاوزها.<page>بالطبع! بالطبع! ويمكنني أن أتعلم الكثير وأنا أتبع هيئتك الرشيقة.<page>لا أحتاج إلا إلى لحظة، وسيصبح المضمار جاهزا من جديد."
LACE_MEET_3: "<hpage>تهديداتك بلا قيمة أيتها الصغيرة. إن كنت عدوتي، فأمسكي لسانك وارفعي نصلك."
LACE_MEET_2: "يمكنني إنقاذك أيتها العنكبوتة الصغيرة، من كل المتاعب التي تنتظرك في الأعلى، ومن كل المعاناة. الأمر في غاية البساطة.<page>سأطعن جسدك هنا والآن، وأنتزع منه تلك الحياة المرتعشة."
LACE_MEET_1: "يا للحزن. عنكبوتة صغيرة سقطت من قفصها. تائهة وضعيفة. يا لها من لقمة صغيرة مسكينة."
HUNTER_FAN_RESULT_1: "أوووه، رائع، إنها بداية موفقة. سجلنا مخلوقات كثيرة، لكن ما زال هناك كثير وكثير لنتعلم عنه!<page>على الآنسة الكبيرة أن تستريح سريعا، ثم تخرج للصيد مجددا بعد قليل، هذا ما تظنه نو!"
GARMOND_DEFEATED_GNAT: "أحسنت القتال أيتها الأخت، أحسنت! كان الوحش رهيبا وعنيدا، لكنه لم يكن ندا لنا.<page>فلتفخري! ستغني حشرات هذه الأرض بانتصارنا لأبنائها، ثم لأبناء أبنائها، إلى الأبد!"
LACE_TOWER_DEFEAT_1: "ها... ها ها ها ها ها!<page>تهانينا أيتها العنكبوتة. شعرت أخيرا بلسعتك، وكشفت أنت حقيقة صدفتي الفارغة المثيرة للشفقة.<hpage>لطالما عرفت حقيقتك من رائحتك أيتها الصغيرة. لست حشرة. حياتك مولودة بأكملها من الخيط.<page>حياة؟ أنت كريمة أكثر مما ينبغي! هذا الوجود الواهن المتداعي لم يكن حياة، بل قشرة صنعت لتؤدي دور ابنة.<hpage>أما حياتك فحقيقية أيتها الشاحبة. لا تخلطي بين فرادة خلقك وغياب الحياة. رأيت آخرين يقعون في الخطأ نفسه.<page>أتلقين علي كلاما مبتذلا أيتها العنكبوتة؟ لا تكوني مقززة.<page>تابعي طريقك. اصعدي بعيدا إلى الأعلى. لقد استحققت المثول أمام الإلهة.<page>واجهي الأم المقدسة التي صنعت ابنة قاسية وفجة مثلي."
GILLY_REPEAT: "الحديث معك ممتع، لكن علي العودة إلى مراقبتي. حاولي ألا تتركي وراءك أثرا واضحا حين ترحلين، من فضلك."
SNAILS_ACT3_DESCEND_REPEAT: "<page=M>كفى حديثا أيتها العتيقة. الأفضل أن تتجهي إلى الأسفل. أيا كان ما تخططين له، فالوقت ليس في صالحك."
MAPPER_MASTER_ITEM: "لمشاركتك هذه اللحظة معي، أريد منك قبول هدية ظننت أنني لن أورثها لأحد.<page>خذي هذه الحلقات، ومعها المعرفة اللازمة لصنع المزيد.<page>صنعت بطريقة بارعة ابتكرتها معلمتي، وستسحق حتى أصلب أصداف هذه المملكة. استخدميها، وبذلك يبقى ذكرها حيا!<hpage>شكرا لك يا شاكرا. أنا ممتنة جدا لنيل أداة تحمل بصمة صاحبتها بهذا الوضوح. وستكون عونا كبيرا في رحلتي."
HUNTER_FAN_SKULLKING_REPEAT: "دفء هذه الكهوف يبقي روائح كثيرة حية! وهذا مفيد لنو، فهي تبحث دائما بعناية عن معارف جديدة!"
SHERMA_CITADEL_SPA_NOENCLAVE: "<hpage>أيها الحاج الصغير، تمنحك هذه الحمامات بعض الراحة من الأخطار في الخارج، لكن ينبغي ألا تغفل عن حذرك حتى هنا.<hpage>لا بد أنك رأيت الآن أن حشرات القلعة وقعت منذ زمن تحت وطأة المس.<page>آه... بدا بعض إخوتي وأخواتي... تائهين بطريقة ما، نعم. لكن كل تائه قد يهتدي يوما، أليس هذا ما تقوله الأغنية؟<page>نعم... ستتكفل بهم القلعة. إنها مكان مقدس حقا، وفيها عجائب مثل هذا الحمام الدافئ الجميل!"
SPRINTMASTER_ACCEPT_SHORT: "هوي! فلتبدأ من جديد منافستنا العظيمة بين الأصداف!"
GRINDLE_SLAB_MEET: "هوي! ظننا أن أحد أولئك المتنمرين الطنانين يتسلل نحونا، فإذا بها حشرة سجن مهلهلة فحسب!<page>لماذا أنت هنا إذن؟ هل أمسكوا بك تسرقين؟ يا لك من جشعة!<hpage>لم أسرق شيئا. بل أظن أن السجانين خدم للقلعة. كان القفص الذي أسروني فيه يحمل نقوشا تشبه نقوش القفص الذي جاء بي إلى هذه الأرض أول مرة.<hpage>ولو بقيت مقيدة في ذلك القفص، لكنت هدية ثمينة لو سلموني إلى أسيادهم.<page>باه، لا شيء ثمين فيك أيتها السجينة. عرفنا أنك لصة مثلنا منذ أن رأيناك!<page>لا تتسكعي هنا الآن. سيرغب أولئك الحراس في إعادتك إلى قفصك بسرعة!<hpage>لن تسنح لهم الفرصة. سأستعيد متعلقاتي وأغادر هذا المكان الكئيب مسرعة."
MAPPER_SPAR_DEFEAT: "تتعافين بسرعة. لقد تلاشت آثار حلقاتي من صدفتك بالفعل. إن كنت مستعدة، فلنتبارز من جديد."
MRMUSH_LOC4: "...نعم، التواصل هو جوهر الأمر. لأعظم المفاخر وأخف الهمسات معان تخصها...<page>...رأيك وجيه. حتى الزهور لها حكايات ترويها. ويمكن للنور أن يسطع في كل مكان...<hpage>لا أريد قطع تأملاتك أيها المبشر، لكنني متلهفة للحديث معك، إن كنت مستعدا للاستماع...<page>...سجل كل شيء وارسمه في خطوط، وستسعد لأنك فعلت. يمكنك أن تحمل الرحلة معك إلى موطنك..."
HUNTER_FAN_COMPLETION_RESULT_2: "أوووه، لكن اللفافة مثقلة بكل هذه الوحوش الجميلة! أيعقل أن العمل أوشك على الاكتمال؟ واصلي صيدك أيتها الآنسة الكبيرة. لا وقت للراحة!"
GREEN_PRINCE_VERDANIA_ENTRY_MEET: "الأسطورة التي صنعناها... بالنعمة... بالنصل...<page>انحنى الجميع أمامنا، نحن الأمراء الخضر..."
GREEN_PRINCE_VERDANIA_LAKE_REPEAT: "لحظات كثيرة عشناها ببساطة... وفرح... وحرية..."
MAPPER_DUSTPENS_BROKENBENCH: "هل ترين؟ ما أفظ وأوهن آلات تلك القلعة! هذه الآلة تئن ألما من مجرد وجودها.<hpage>لعل آليتها عالقة. لو حررت التروس لتوقفت شكاواها الصاخبة سريعا، ولأصبح هذا مكانا مفيدا للراحة.<page>سواء كان مكانا للراحة أم لا، كل ما أريده هو أن يتوقف الضجيج!"
MAPPER_GENERIC_SHELLWOOD: "تحمل هذه الطرق المنسوجة بالجذور آثار مرور معلمتي. حشرة سحقت ثلاث مرات، وخشب مخدوش، وآثار مخالب حادة عبرت من هنا. دلائل صغيرة لا يستطيع قراءتها سواي.<page>رغم أن الأثر قديم، يطمئنني أن أعرف أنها لا تزال في هذه الأرض."
GILLY_INTRODUCE: "<hpage>هذه الحقول خطرة أيها الصغير، وليست مكانا للتجول بلا هدف. ما المهمة التي دفعتك إلى خوض غمارها؟<page>مهمة محفوفة بالمخاطر، لكنها بالغة الأهمية! تلبية لأمنية أبي الأخيرة، شرعت في دراسة هذه الكهوف البرية.<page>ما زالت هذه الحقول تزخر بالحياة والنماء، مع أن الأراضي المحيطة بها تتحول إلى غبار.<page>يسري هنا تناغم حار لا وجود له في القفار الرمادية فوقنا ولا في النُّخاع الجاف المجاور. ومع الوقت والدراسة، سأكشف السبب."
MAPPER_ITEM_TOOL_COMPASS_DESC: "تتبعي موقعك في هذه الأراضي المتعرجة ببوصلة من العظام. يستطيع كل فرد من قبيلتنا صنع واحدة، ويمكنني أن أعطيك بوصلتي مقابل ثمن بسيط."
HUNTER_FAN_COMPLETION_RESULT_1: "أوووه، يا للعجب! حتى نو الصغيرة لم تتخيل أن فارلوم تضم كل هذه المخلوقات المدهشة! منها الناعم والصلب، والصغير والكبير! وتتوق نو بشراهة لرؤية ما بقي منها!"
SHERMA_CORAL_NOBENCH: "أترين هذا الصنم أمامنا أيتها الفتاة الحمراء؟ مررت من قبل بأصنام تشبهه. إنها ترشدنا جيدا في حَجّنا.<page>إن غنينا له، فسيخرج ضريح عجيب من الأرض، ويصبح لدينا مكان للراحة! يا لها من أعجوبة!<hpage>ليست الأغنية ما يوقظ هذا الضريح، بل دفع مَسابح.<hpage>من دون مَسابح، يظل الضريح مخفيا. صادفت منشآت مماثلة على طرق فارلوم. هذه المملكة لا تمنح الراحة بسهولة."
MAPPER_ITEM_MARKER_E_DESC: "يمكنك استخدام هذه العلامات لتحديد الأماكن المهمة أو التذكيرات على خريطتك.<br><br>صنعتها من أغلفة أجراس قديمة. وصنعها شاق، لذلك يعكس ثمنها الجهد الإضافي."
SHAKRA_AID_MEET_FORUM: "بوشانكا! ها نحن نلتقي فوق قمة هذا الهيكل الفولاذي الملتوي. أشعر بأعداء شرسين أمامنا.<page>يبدو أنك أيضا تقتربين من نهاية دربك. والآن بعد أن أنجزت مهمتي، تناديني حلقاتي إلى القتال.<page>يا هورنيت حاملة الإبرة، هل نقاتل ونتقدم معا؟"
SHERMA_HEALER_REPEAT: "كل هذه المؤن العلاجية الرائعة... لا بد أنها، على الأقل، دليل على قدسية القلعة؟"
SHERMA_RESCUE_MEET1: "ه-هوي أيتها الف-فتاة الحمراء! لا ت-تخافي، أنا شيرما فحسب!<page>وجدت مؤنا علاجية، ل-لكن طريق العودة انهار... وسمعت أنينا من الظلام... كم أنا ممتن لرؤيتك!"
MAPPER_ITEM_MAP_CRAWL_NAME: "خريطة دروب الديدان"
SHAKRA_AID_REPEAT: "هل نقاتل ونتقدم معا؟"
SHERMA_CORAL_REPEAT: "القلعة العظيمة قريبة جدا، حتى إنني أسمع أصوات إخوتنا وأخواتنا الحجاج تنادينا!"
GILLY_MEET_HUNTERCAMP: "يا لها من معركة أيها المحارب الشجاع! أنت أول من رأيته يضاهي ذوي الأصداف الحمراء ويخرج منتصرا.<hpage>إنهم أعداء فتاكون حقا، ويبدو أنهم صيادون بارعون. أحسنت بإخفاء نفسك عنهم أيها الصغير.<page>أحسنت، أليس كذلك؟ التنكر والتخفي مهارتان صقلتهما بإتقان، وكل ذلك لخدمة أهم أعمالي!"
GARMOND_MOORWING_INFORM: "توخي الحذر وأنت تعبرين هذه الأرض الكئيبة. وحش مجنح عظيم يترصد في الأعالي، وينقض بلا إنذار لينتزع الحياة من المسافرين الغافلين!<hpage>أظن أنني رأيت المخلوق الذي تتحدث عنه. ربما اتخذني فريسة، وتبعني إلى الطرق المنخفضة في المستنقع.<page>ماذا، ماذا! غورروو! لقد ظهر الوحش! ما إن تنال زازا قسطها الكامل من الراحة حتى ننطلق لتعقبه!"
SHERMA_HEALER_MEET: "مرحبا بعودتك أيتها الفتاة الحمراء، وشكرا لك مجددا على نجدتي.<page>لست معالجا، لكن المؤن التي وجدناها في الجناح أدناه تتيح حتى لمخالبي غير المدربة أن تخفف معاناة إخوتنا وأخواتنا.<page>كيف أمكن لمثل هذا الظلام أن يتسلل إلى أقدس الأماكن، رغم أننا نحن الحجاج أوفينا بوعدنا بالصعود...<page>أعترف بأنني أتساءل عن معنى كل هذا. لكن الاستنارة لا تأتي بسهولة ولا دفعة واحدة... وعلي مواصلة مهمتي في هذه الأثناء."
SHERMA_ENCLAVE_MEET1: "همم...؟ أوه، هوي! كنت آمل أن نلتقي هنا أيتها الفتاة الحمراء.<page>أن أبلغ أخيرا أعالي القلعة وأكون بين كل هؤلاء من إخوتي وأخواتي... إنها نعمة حقا. نعم، نعمة.<hpage>يكشف صوتك عن بعض التردد في هذا الإيمان أيها الحاج الصغير. لقد رأيت الآن حقيقة هذا المكان المحطم. فما رأيك فيه بصدق؟"
COURIER_TALL_THANK_PT1: "نجا بيل وصار آمنا! لكن من هذه النادرة التي ترعى صدفة غيرها؟ عرفي بنفسك أيتها الحشرة الطيبة!<hpage>أنا هورنيت يا بيل. أراد أخوك أن تعود إلى قلب الجرس، حيث ينتظرك الآن. وأنا واثقة من أنه سيسعد برؤيتك حيا.<page>تيب الصغير! إنه يقلق دائما. مبارك أنا بهذه الرعاية، منه ومنك يا آنسة هورنيت! أنا حشرة محظوظة!"
DICE_PILGRIM_DEPLETED_REPEAT: "أدعو أن تجلب لك أحجار نردي الحظ في صعودك الأخير أيتها الأخت. وأدعو أن يصبح صعودي أخف حين أفارقها."
GILLY_HUNTERQUEEN_STATUE: "انظري إلى هذا التمثال القديم. فكرت فيه طويلا، وفي الدلائل التي قد يحملها.<page>يبدو صنعه أدق من سائر المنشآت في هذه الكهوف. أتساءل من كانت، حتى تستحق أن تخلد بهذه البراعة؟<hpage>هيئتها هيئة راقصة، والصنعة متقنة حقا. لا بد أن هؤلاء النمل كانوا أعظم شأنا ذات يوم، قبل أن يأسر المس أصدافهم وعقولهم."
HUNTER_FAN_JOURNAL_COMPLETE_2: "واههههه... المذاق المحرم..."
SHERMA_CITADEL_SPA_REPEAT: "ماء مقدس، دافئ لطيف،<br>للسباحة مكان ظريف،<br>يمحو همك في لمح البصر،<br>فاقفزي فيه... رش، رش، رش! ها ها ها!"
GRINDLE_ITEM_ROSARY_MAGNET: "لدينا هنا حلية صغيرة شديدة الحظ! تجذب تلك القطع الصغيرة المجلجلة مباشرة إلى مخالبك المنتظرة!"
GARMOND_MEET_CITADEL_FIRST: "غورروو! محاربة أخرى تتحدى هذا المكان المنكوب! اعلمي أنك تقفين أمام الفارس المبجل غارموند، ورفيقته الشجاعة زازا.<page>أنا وزازا مقيدان بعهد يقضي بأن نصعد هذه القلعة، ونهزم الأهوال الكامنة في قلبها!<hpage>إذن حظا موفقا لك أيها السيد. يبعث في النفس الأمل أن ألتقي شخصا آخر سليم العقل، يملك من الثبات ما يكفي لمقاومة الأصداف الممسوسة الكثيرة.<page>نعم! لا نهاية لهؤلاء الخصوم غير الطبيعيين! تبدو هذه القلعة مصدر فسادهم، ويملي علينا الشرف أن نواصل القتال حتى نمزق قلب هذا التعفن!"
SNAILS_ACT3_SHAMAN_CREST: "<hpage>وجدت البئر في الحجرات الخفية خلفنا، وأخذت لنفسي القوة التي بقيت في قاعها.<page=S>ربطت لنفسك طبيعة جديدة إذن؟ ومن أصداف أسلافنا أيضا، أولئك الكثيرين الذين اتخذوا هذه الأراضي موطنا.<page=S>تجعلين الأمر يبدو بسيطا جدا. كل تلك المعرفة وكل تلك القوة... ابتلعها دوار من الحرير.<page=M>كنا سنصفك باللصة، وبالقاسية لما أخذته، لكن كل شيء سينهار قريبا إن عجزت عن إيقافه.<page=M>إن كانت في فعلتك منفعة قد تنقذ هذه الكهوف، فمن الأفضل أن تطالبي بحقك فيها."
MAPPER_BELLHART_REPEAT_ACT3: "اجعلي زياراتك قصيرة يا هورنيت حاملة الإبرة. إن لم نتخذ إجراء سريعا، فهلاك عالمنا حتمي.<page>إن عجزت عن تهدئة آلام فارلوم المعذبة، فلن تقدر أي حشرة أخرى على هذه المهمة.<hpage>كما تقولين يا شاكرا. سأفعل ما يجب علي فعله."
HUNTER_FAN_HINT_GREYWARRIOR: "قرب حافة تلك الأراضي التي تعصف بها الرياح والرمال، رأت نو حشرة وحيدة تراقب وتنتظر.<page>خافت نو كثيرا من الاقتراب زحفا، خشية أن تستيقظ وتشوه صدفتها المثالية بنصلها الكبير.<page>من أجل السجل، عليك البحث عن تلك الحشرة فوق الحافة، عبر نفق طويل تخفيه القشرة.<page>العثور عليها صعب، لكن نو ليست قلقة! فهي تعرف أن دهاءك الناضج سيوصلك إليها سريعا!"
MAPPER_NOSTOCK_ACT3: "فيما يخص مخزون الخرائط، فقد تبادلنا كل المخططات والأدوات التي أستطيع توفيرها. ولن أصنع المزيد ما دام هذا الخطر الجديد قائما.<page>قد يكون رسم خرائطي بسيطا، لكنني آمل أن مشاركة صناعتي معك قد سهلت رحلاتك."
GARMOND_AID_READY: "تقدمي أيتها الأخت! سأكون أنا وزازا خلفك مباشرة!"
SHERMA_BONEGATE_OPENED: "هوي! هل رأيت أيتها الفتاة الحمراء؟ سمعت البوابة الكبرى أغنيتي، وبكرمها الأبدي العريق فتحت لنا الطريق إلى الأمام!"
GARMOND_CITADEL_DEFEATED_REPEAT: "<hpage>ألا ينبغي لكما مواصلة المسير أيها السيدان؟<page>بلى! سننطلق في الحال. قريبا جدا. لكنني أخشى أن زازا بحاجة إلى الراحة فترة أطول قليلا..."
MAPPER_MEET_BONE_1A: "بوشانكا! نصل حاد وحواس يقظة!"
SNAILS_ACT3_TALK2: "<page=M>حتى مع معرفتنا بدافعها، من المذهل أن تصمد الملكة كل هذا الوقت. ظننا أن لا أحد يستطيع النجاة من ذلك الفراغ.<hpage>لا بد أنها انكفأت داخل هيئتها الواقية، شرنقة الخيوط تلك. وبينما يلتهم الظلام ظاهرها، ستغزل حريرها من جديد.<hpage>سيتطلب ذلك جهدا هائلا وسيرهق روحها حتى تضعف، لكن أي خيار آخر بقي لها؟<hpage>إنه فعل يائس يصدر عن إلهة تحتضر. تحد سيقود مملكتكم إلى الهلاك إن لم يوقفه أحد."
SNAILS_ACT3_TALK1: "<page=M>الزلازل... سيبتلع هذا الانهيار فارلوم كلها.<hpage>هذا إن لم يبتلعها الفراغ أولا. لا بد أنك رأيت الخيوط السوداء التي تعصف بأراضيكم؟ الظلام يتسرب إلى الأعلى وقد استحوذ على حرير الملكة الساقطة.<hpage>لم تكن طرق فارلوم آمنة من قبل، أما الآن فستصبح مستحيلة العبور. وعلى الحجاج الذين ما زالوا أحياء في أراضيكم أن يتجمعوا ويحتموا بالأمل.<hpage>إن كانت هناك نهاية أخرى لهذا، فعلينا نحن أن نكتشفها."
SHERMA_BONEGATE_MEET_2: "<hpage>لماذا تغني أيها الصغير؟ لا تبدو هذه البوابة العظمية جمهورا مناسبا."
SHERMA_RESCUE_END2: "<hpage>هل تستطيع العودة إلى المستوطنة بأمان أيها الصغير؟ يمكنني مرافقتك إن لزم الأمر.<page>لا، لن أحملك مزيدا من متاعبي أيتها الفتاة الحمراء. بعد أن انفتح الطريق، أستطيع العودة معتمدا على نفسي.<page>ما حَجّ آخر في نهاية الأمر، أليس كذلك؟ ها ها!<page>أوه! ولدي شيء لك أيضا. وجدته مدفونا بين الآثار المحطمة هنا في الظلام، وكان يشع نورا شاحبا.<page>شكله غريب... ولا يبدو مقدسا تماما... لكنني سأتشرف إن قبلته رغم ذلك!"
SPRINTMASTER_HERO_WIN_POST: "التحدي! المضمار! سأحسنه. نعم! نعم! الاختبار الأصدق لم يأت بعد. سنطير معا بسرعة من جديد!"
SETH_SHELLWOOD_REPEAT: "تعلمت أيضا أن السفر لا يخلو من الأخطار... لكنني وجدت أنني أجيد استخدام سلاحي.<page>من العجيب كيف تستطيع غرائزنا إرشادنا بهذه الدقة."
MAPPER_ITEM_MAP_BELLHART_NAME: "خريطة قلب الجرس"
MAPPER_SPAR_VICTORY: "أون داك... ضربة موفقة. ستكون مواجهة قوة سلاحك في معركة حقيقية تجربة عظيمة بحق. سيسرني أن نتبارز مجددا إن كان لديك وقت."
GARMOND_GRAND_FORUM: "هوهو أيتها الأخت، ما زالت شواربي ترتجف! هكذا تعرفين أنك خضت معركة مثيرة!<page>تقدمي أنت. سأبقى أنا وزازا هنا للحراسة والإمساك بكل من يتخلف."
SHERMA_CARETAKER_MEET_A: "هوي أيتها الفتاة الحمراء. رؤيتك تستيقظين سالمة استجابة لدعاء.<hpage>شيرما الصغير؟ ماذا حدث هنا؟"
MAPPER_CALLED: "بوشانكا! إذن وجدت حلقة ندائي يا حاملة الإبرة الصغيرة. عرفت صوت معدن سلاحك الغريب حين ارتطم بها.<page>كثيرا ما أغيب بحثا عن معلمتي، لكنني ما زلت أتخذ هذا المكان مخيما. استخدمي الحلقة لاستدعائي متى شئت المتاجرة."
MAPPER_ITEM_MAP_WILDS_NAME: "خريطة الحقول النائية"
SHAKRA_AID_ACCEPT: "<hpage>يسرني قبول عونك يا شاكرا. فلنشق طريقنا إلى قلب هذه القلعة المسكون.<page>جاروك! يا هورنيت حاملة الإبرة، سأرفع حلقاتي إلى جانبك بكل سرور!"
G_PRINCE_SONG_MEET: "تمنيت ألا تطأ قدماي هذه القاعات البغيضة، لكنني أقف هنا الآن، مثل كل تلك الحشرات البائسة من قبلي.<hpage>قطعت شوطا بعيدا منذ خرجت من تلك الزنزانة الرطبة، أيتها الحشرة الطويلة. إن كنت ستقاومين أتباع هذه القلعة، فلك احترامي.<page>همم. إذن نتشارك موقفا نادرا، أيتها المحاربة. قليلون غيرنا يملكون من الإرادة ما يكفي للمقاومة.<page>كم من عقول ضعيفة انجذبت إلى الأعلى وعلقت بالخيوط، مفتونة بالعلقة الذهبية العظيمة القابعة فوق أرضها."
GARMOND_CITADEL_MEET: "مرحبا بك يا أختاه الشجاعة! أي شعر خطه القدر حتى نلتقي هنا، عند قمة هذه القلعة المروعة!<page>وحوش وشياطين، كل من هنا ضاعوا تحت سطوة ذلك المس الرهيب! ومن هذه الجثة الذهبية يتسرب ليبتلي حشرات الأرض الطيبة في الأسفل. لكننا نقول: كفى!<hpage>احذروا أيها السادة الشجعان. فالمخلوق الذي يقود هذه اللعنة عدو يفوق أي حشرة قوة. لا أريد أن تذهب حياتكم سدى.<page>هاه! لا نخشى شيئا! سنضحي بحياتنا مئة مرة إن كان ذلك سيقتلع أخيرا الشر القابض على مملكتنا!"
GILLY_MEET_HIDDEN: "يا للحرج! اكتشفت أمري رغم تنكري المثالي! ما العلامة؟ وما الخطأ؟ لا بد أن شيئا ما فضحني!<hpage>لم يكن شيئا بعينه، أيتها الصغيرة. تنكرك يكاد يخلو من العيوب. لكنني قضيت عمرا طويلا في الحذر.<page>آه! ليس أمامي إذن إلا أن آمل ألا تتمتع الوحوش القريبة بمثل قوة ملاحظتك. سيصعب إنجاز عملي كثيرا إن اكتشفوني، أو التهموني!"
GARMOND_AID_ACCEPT: "<hpage>قد تكون المعركة المقبلة شاقة بالفعل. أقبل عرضكما بالمساعدة، أيها السيدان.<page>جارررو! نعم! لا قوة في المملكة تستطيع الصمود أمام بأسنا! تقدمي يا أختاه! سنكون أنا وزازا خلفك مباشرة!"
SHERMA_PILGRIMSREST_REPEAT: "أختاه، أختاه، متعبة وحزينة،<br>سنغني نحن، ويمكنك أن تدندني،<br>ومعا سوف ننتصر!"
SNAILS_ACT3_DEEP_MEMORY1: "<page=M>أوه هو! عدت من الأعماق بلا خدش واحد! هل وجدت ما كنت تخشينه؟<hpage>نعم، بل ما هو أسوأ. أغرق فخكم الملكة إلى عمق لا أستطيع الهبوط إليه بأمان.<hpage>لتحرير فارلوم، لا بد أن أغوص تحت سطح بحيرة العدم السائل تلك.<page=B> لا صَدَفة تنجو من الغمر في ذلك الفراغ، أيتها العتيقة، ولا حتى صدفتك.<hpage>ليس من دون عون، بالتأكيد. لكن ذلك العون قد يكون موجودا. الزهرة التي تقاوم الظلام. هل تعرفونها؟<page=M>إيفربلوم؟... سمعنا قصتها، لكننا ظنناها أسطورة. لو نبتت يوما في أراضينا لكنا علمنا بها بالتأكيد، أليس كذلك؟<hpage>لن أبحث عنها في هذه الأراضي. أحتاج إلى كامل قوتها، وهي أرق من أن تبقى هنا طويلا. سأبحث عنها في ذاكرتي.<page=S> أوه هو هو! أتريدين منا إذن أن نشق روحك ونستخرج منها الزهرة الأسطورية؟ أيمكن فعل ذلك؟<hpage>لا يمكن مع حشرة أخرى، لكن إرث النساجين في داخلي يكفي للمحاولة.<hpage>عرفت الزهرة في الماضي البعيد. وما زال خيطي يحتفظ بذكرى خافتة لها. إن تشبث حريري بإيفربلوم بقوة كافية، أمكن تجسيدها.<page=M>آه! إذن تطلبين منا تعويذة أخرى؟ أن نظهر الزهرة بوضوح؟... لكن إضاءة ذكرى قديمة لأحد بني جنسك بهذه الدقة... ليست مهمة سهلة، حتى لنا...<page=M>أيتها العتيقة، أمهلينا لحظة لنتشاور..."
MAPPER_ITEM_MAP_HUNTERSNEST_NAME: "خريطة مسيرة الصياد"
G_PRINCE_DANCERS_REPEAT: "تحققت أمنيتي... والآن ضاع كل ما أحب..."
MAPPER_CURSED: "جارا تاكانا! ماذا أصابك يا طفلة حاملة الإبرة حتى أوهنك بهذه الوحشية؟<hpage>ما ترينه آثار طفيلي يا شاكرا، كيان متلو زرع في داخلي بالقوة. لن يقتلني، أو لن يفعل ذلك سريعا على الأقل، لكن وجوده يرهق صدفتي بشدة.<page>إنها حال مروعة تعانينها. قاومي حتى تتحرري منه، أو اطلبي العون بسرعة. لا أريد أن أراك مهزومة بهذه القوة الخادعة."
SPRINTMASTER_ACCEPT_RETRY: "هوي! فلتبدأ من جديد منافستنا العظيمة بين الأصداف!"
GRINDLE_ITEM_TOOL_KIT: "اعتدت صنع شتى الأدوات والفخاخ البغيضة، أليس كذلك؟ ستتيح لك هذه العدة أن تجعليها أشد فتكا، هيه هيه..."
MAPPER_GENERIC_BELLHART: "بوشانكا، يا طفلة حاملة الإبرة. تحرر موطن القلب هذا من لعنته.<page>أخبريني، أكان نصلك هو الذي أنقذه؟ سأصاب بصدمة كبيرة إن استطاع أحد غيرك هنا إنجاز ذلك.<hpage>قتلت مخلوقا طويلا فوق البلدة. أظنه من النساجين، وإن انحرفت غايته.<hpage>ساعد بصوته ومخلبه الخيط الذي علق البلدة، بل ربما كان هو من يوجهه.<page>ناسج؟ تلك المخلوقات القديمة الوحشية! نقص حكاياتها على صغارنا، لكننا ظنناها ماتت منذ زمن، ولم يبق منها إلا جثث موثقة في الأبراج.<hpage>كان هذا لا يزال حيا، لكن إن كان ناسجا حقا، فقد حطم بطريقة وحشية.<hpage>كان حريره نفسه مقيدا ومثبتا في أعماق صدفته. عقاب قاس لم أشهد مثله من قبل.<page>حتى وهو محطم، لا يزال يثير حسدي. مهارات ناسج الأسطورية... لقاؤه في القتال يعني تحديا عظيما، وفخرا عظيما عند الانتصار."
MAPPER_GENERIC_GREYMOOR: "<hpage>سعدت بلقائك يا شاكرا. رؤيتك مريحة وسط ظلمة هذه الكهوف الغارقة.<page>يا طفلة حاملة الإبرة، ما زالت حدتك ظاهرة. ولا يزال احترامي لك قائما. لكن احذري، فكثير من الحشرات الشرسة تعشش بالقرب منا.<page>على البحيرة خلف هذا الكهف يعشش حشد رث فوق تل مائي قديم. وإتقانهم الطيران يجعلهم خطرين. ستحمل صدفتي إلى الأبد ندوب دبابيسهم.<page>إن كنت تبحثين عن طريق أكثر أمانا، فعودي نحو قلب هذه الأرض."
HUNTER_FAN_ZAPNEST_REPEAT: "ابتعدت نوو كثيرا عن مأواها الآمن... ربما تمكث مدة أطول قليلا في هذا المكان الصغير اللطيف والمظلم والضيق."
SHERMA_CARETAKER_DELIVERY: "<hpage>شيرما، أحضرت مؤنا من بلدة الأجراس في الأسفل. وبما أنك أصبحت القائم على هذا المكان، فإنني أعهد بها إليك.<page>يا لها من نعمة! لا شك أنها سترفع آمال إخوتنا وأخواتنا المساكين."
SHERMA_CARETAKER_FINAL: "أيتها العذراء الحمراء، تنتظرك مهمة عظيمة، أليس كذلك؟ إن كان الأمر كذلك، فأخشى أن موعد فراقنا الأخير يقترب.<hpage>صدق حدسك يا شيرما. سأهبط قريبا إلى الظلام تحت المملكة، وأخمد مصدر تمزق فارلوم.<hpage>إن نجحت في مهمتي، فقد يحملني مستقبلي بعيدا عن فارلوم. لكن ثقي لدي بأنك ستبقي هذه الحشرات متماسكة، وتقودها إلى الازدهار.<page>آه! ما زلت في الحقيقة مجرد أحمق، لكنني سأتمسك بثقتك بي. وسيعينني دفؤها على احتمال كل التحديات المقبلة!<page>والآن دعيني أصلي من أجلك يا صديقتي العزيزة. ليصحبك رجائي إلى أعمق الظلمات وما وراءها!"
MAPPER_ITEM_PIN_SHOP_NAME: "دبابيس الباعة"
SHAKRA_GRAND_FORUM_REPEAT: "الطريق أمامك. فلنلتق مجددا قريبا."
MAPPER_MEET_GUARD_ACT3: "<hpage>شاكرا، أتواجهين الحشرات ذات الخيوط السوداء؟ إنها أعداء خطرون، حتى على محاربة متمرسة.<page>أستمتع بمثل هذا الخطر، وليس لدي خيار آخر. هذه المخلوقات تحاصر البلدة في الداخل. لا تعرف التوقف، وقد زادت قوتها.<hpage>...إنه الفراغ، امتد إلى هذا العالم وهياكله. أعرف هذه القوة وطبيعتها جيدا. إذا استشعرت روحا في الداخل، اندفعت نحوها بشراهة.<page>كما تقولين! تحتمي حشرات كثيرة الآن داخل الأجراس. ولا مكان آخر آمن مع تصاعد هذا التهديد الأسود.<page>ومن حسن الحظ على الأقل أنني اخترت البقاء، وأستطيع الدفاع عنهم بحلقاتي.<hpage>شاكرا، أسعى إلى إنهاء هذه الكارثة الجديدة، فأنا أتحمل قدرا كبيرا من اللوم عليها. لكن مهمتي ستحتاج إلى وقت.<hpage>أطلب منك الصمود حتى ذلك الحين. تحتاج هذه البلدة وحشراتها إلى حارسة، ولا أعرف من هي أصلح منك.<page>حسنا يا هورنيت حاملة الإبرة. ميثاق قوي بيننا. إن كنت تعملين على إنهاء هذا السم، فسأقاتل بإيمان متجدد."
SHAKRA_AID_READY: "فلنمض في هجومنا. ستدوي حلقاتي على أصداف أعدائنا."
HUNTER_FAN_FINAL_2: "والآن، أيتها الآنسة الناضجة، انتهت المهمة! على نوو أن ترحل.<page>لكن لا تتجهمي! فكري في الأمر! فارلوم ليست سوى أرض واحدة. ولا بد أن أراضي كثيرة أخرى تختبئ في الخارج، مليئة بالوحوش والروائح والمذاقات، تنتظر من يكتشفها.<page>أما نوو، فرحلتها لا تزال في بدايتها. ولك أنت أيضا، أيتها الآنسة الناضجة، تتمنى نوو صيدا سعيدا ووافرا!"
MAPPER_MEET_BELLHART_ACT3: "<hpage>شاكرا، ماذا حدث هنا حتى تجمعت هذه الجموع وسط كل هذا الدمار؟<page>الحشرات المنسوجة من الظلام تحاصر البلدة بلا توقف. تصديت لكل موجة جديدة، لكنها اكتسبت قوة بوسائل كريهة، وقد أنهكني التعب.<hpage>...إنه الفراغ، امتد إلى هذا العالم وهياكله. أعرف تلك القوة وطبيعتها جيدا. إذا استشعرت روحا، اندفعت نحوها بشراهة.<page>كما تقولين! كل هذه الحشرات متجمعة داخل الأجراس... ولا مكان آخر آمن مع تصاعد هذا التهديد الأسود.<hpage>شاكرا، أسعى إلى إنهاء هذه الكارثة الجديدة، فأنا أتحمل قدرا كبيرا من اللوم عليها. لكن مهمتي ستحتاج إلى وقت. وأطلب منك الصمود حتى ذلك الحين.<hpage>تحتاج هذه البلدة وحشراتها إلى حارسة، ولا أعرف من هي أصلح منك.<page>حسنا يا هورنيت حاملة الإبرة. ميثاق قوي بيننا. إن كنت تعملين على إنهاء هذا السم، فسأقاتل بإيمان متجدد."
GRINDLE_BONEFOREST_FINAL: "أف. هل يزداد الحر هنا في الأسفل؟ وهل تشتد الرائحة عفونة؟ مكث جريندل هنا طويلا. أظن أن الوقت قد حان ليصعد قريبا إلى حيث الكنوز الحقيقية!"
MAPPER_ITEM_MARKER_D_NAME: "علامة داكنة"
SPRINTMASTER_HERO_WIN_PRE_1: "أهكذا تبدو... الهزيمة؟ أيمكن ذلك؟ هوو... يا لها من صَدَفة سريعة! يا لأعجوبة فارلوم! حشرة تضاهي سرعتي.<page>مع أنني وضعت مسارا بسيطا، فقد ضاهيته وتفوقت عليه. خذي هذه المكافأة الصغيرة أيتها الحشرة الرشيقة، وتذكري منافستنا العظيمة جيدا!"
SHERMA_BELLHART_WAKE: "أوه، مرحبا بك! لا بد أنني غفوت فور وصولي!<page>لا شك أن طريق الحاج مرهق، لكن الراحة الجيدة مكافأة بحد ذاتها!"
MAPPER_GENERIC_HUNTERSNEST: "كانت معركة رائعة يا طفلة حاملة الإبرة. ستفخر بك معلمتك.<hpage>التي دربتني منذ زمن بعيد... لم أسمها معلمتي يوما. ولا أعرف إن كانت ستفخر بما صرت إليه.<page>نو هاكاتا! سواء كانت حية أم ميتة، ثقي بها! لا يغيب عن عين المعلمة شيء تفعله تلميذتها!"
MAPPER_ITEM_MAP_GREYMOOR_DESC: "تجاويف واسعة ومعتمة، تختنق بالخِرَق والغبار. من الواضح أن الحشرات التي كانت ترعى هذه الأراضي ضلت سبيلها."
SHERMA_CITADEL_ENTRANCE_MEET: "أيتها العذراء الحمراء! يا أختي العزيزة! انتهى أخيرا حجنا العظيم!<page>لم يتزعزع إيماننا قط، وها هي مكافأتنا المجيدة تنتظرنا: القلعة المشرقة، حيث يغني الجميع بصوت واحد!<hpage>لن أطلب منك العودة، فأنا أعلم أنك لن تفعل، لكنني أحثك على الحذر على الأقل. أشياء مروعة تكمن داخل هذه القلعة، أيها الحاج الصغير.<page>يا أختاه! لا داعي للحذر ولا للخوف. فلنتقدم مسترشدين بإيماننا!"
MAPPER_GENERIC_BELLHART_TALK2: "يشكل هذا العرق من الأجراس المذهبة مستوطنة محصنة بفاعلية. وأرى أنه منح حشراتها زمنا طويلا من السلام.<page>ومع ذلك، انظري إلى عددهم الآن. أصابهم الخيط الملعون. ولم ينج منهم إلا القليل.<page>علينا أن نتعلم منهم يا طفلة حاملة الإبرة. السلام سم بطيء يذبل حتى أصلب الحشرات."
MAPPER_GENERIC_BELLHART_TALK1: "<hpage>يبدو مخيمك هنا مريحا يا شاكرا. هل تنوين البقاء بعض الوقت؟<page>ربما، نعم. يصلح موطن القلب هذا قاعدة جيدة الآن، ولاحقا إن لزم الأمر.<page>ومع ذلك، يجب أن أحذر من الراحة طويلا. فقد تلين صدفتي وتفتر حواسي.<page>"
SETH_SHELLWOOD_MEET: "أوه، مرحبا مجددا! هذه المرة أعرفك بكل تأكيد! يسعدني أن ألتقي بك هنا، في أعماق هذه الغابة الهادئة.<page>هل لديك اسم مثلي؟ أيمكنك أن تخبريني به؟<hpage>نعم يا سيدي. أنا هورنيت.<hpage>لاحظت أنك تحدق في البراعم فوقنا... ألعلها مألوفة لديك؟<page>همم؟ لا، إطلاقا. لكنها جميلة جدا! ربما ينبغي أن أجمع بعضها قبل أن أتابع طريقي..."
MAPPER_ITEM_MARKER_A_DESC: "يمكنك استخدام هذه العلامات لتحديد الأماكن المهمة أو وضع تذكيرات على خريطتك.<br><br>استوحيت هذه العلامات من بريق صدفتي. لعلها تذكرك بي حين تستخدمينها."
MAPPER_GENERIC_CRAWL_REPEAT: "ثمة دلائل على أن حُجّاجا سلكوا حتى هذه الطرق المتداعية منذ زمن بعيد. أما الآن، فلا يعشش هنا سوى الديدان النهمة."
SPRINTMASTER_REOFFER: "هوي! أيتها الحشرة الرشيقة! لا بد أنك أعدت النظر؟ فلنكتشف حدودنا معا!"
MAPPER_STOCKDEPLETED: "اشتريت آخر ما لدي من الخرائط حاليا. حافظي على حياتك في رحلتك، وحين تتقاطع دروبنا مجددا قد نتاجر مرة أخرى."
GRINDLE_RUMMAGE_REPEAT: "لا تمكثي هنا طويلا! أمامنا سرقات، ولا نرغب في رفقة!"
MAPPER_GENERIC_DUSTPENS_REPEAT: "إن واصلت الصعود والتوغل في هذه الكهوف، فاحذري. فالهواء الفاسد يزداد كثافة."
SHERMA_BELLHART_REPEAT: "سأغادر قريبا بعد أن أستريح جيدا. خلف الغابة يقع الصعود الأخير، ثم سنصل أخيرا إلى القلعة!<page>ترى من منا سيبلغ البوابة الكبرى أولا؟ إن كنت أنا، فسأنتظرك كي ندخل معا!"
SHAKRA_AID_REFUSE: "إن كنت تفضلين القتال وحدك، فلن أقول المزيد."
GARMOND_ENCLAVE: "<hpage>سعدت بلقائك مجددا أيها الفارس. أرى أن هذا الجرس جذبك أنت أيضا إلى أمانه.<page>من كان يتوقع ذلك يا أختاه! زاوية آمنة مخفية في هذا العلو، فوق تاج فارلوم الملعون!<page>ربما سقطت قريتنا الجميلة، لكن شرفنا يلزمنا بحماية هؤلاء الرفاق... هؤلاء القلة الخائفين. سنرفع رمح القرن دفاعا عنهم! بعد بعض الراحة، بالطبع.<hpage>تمسك بمهمتك الجديدة يا جارموند. احرص على نجاة هذه الحشرات، واعلم أنني أنوي قريبا قطع هذه اللعنة من جذورها."
MAPPER_ITEM_MAP_DUSTPENS_NAME: "خريطة طريق الخُطاة"
GRINDLE_BONEFOREST_S1: "أوه هوهو! إلى جيوب جريندل تذهب! ولك سر تتذكريننا به...<page>تحت هذا المكان، وعلى مسافة أبعد، يملك أصحاب الرؤوس الجرسية الضخام خلية كبيرة حارة لامعة! مليئة بشتى الأشياء الشهية التي يمكن سرقتها!<page>لكن لديهم بوابة كبيرة في جوفها... مغلقة بإحكام وموصدة. إن استطعت التسلل عبرها، فستضعين مخالبك على شتى النفائس!"
SHERMA_CORAL_NOBENCH_ALT: "أترين هذا التمثال أمامنا أيتها العذراء الحمراء؟ مررت بأمثاله من قبل، وهي تحدد مراحل حجنا بوضوح.<page>إن غنينا له، فسيرتفع ضريح عجيب من الأرض، وسيكون لدينا مكان نستريح فيه! يا لها من معجزة!<hpage>أظن أن ما يوقظ هذا الضريح ليس الأغنية، بل دفع مَسابح.<hpage>صادفت منشآت مشابهة على طرق فارلوم. ويبدو أن هذه المملكة لا تمنح الراحة بسهولة."
GRINDLE_BONEFOREST_S3: "أوه هوهو! إلى جيوب جريندل تذهب! ولك سر تتذكريننا به...<page>الغنائم كثيرة حولنا، أليس كذلك؟ لكنها لا تساوي شيئا أمام ما يخفونه في الأعلى، فوقنا بكثير. يسمونها سيتيدل الكبيرة!<page>مكان ذهبي يئن من كثرة النفائس! يقولون إن ألف حياة من حيوات اللصوص لا تكفي لسرقتها كلها!<page>نعم، هذا هو المكان الذي يتجه إليه جريندل العجوز. لكن لا تجرئي على اتباعنا! نريدها كلها لنا وحدنا!"
GRINDLE_BONEFOREST_S2: "أوه هوهو! إلى جيوب جريندل تذهب! ولك سر تتذكريننا به...<page>أتعرفين أين يخيم أولئك البؤساء رثو الثياب؟ بالقرب من المصلى القديم؟ خلف ذلك المصلى قبر هائل قذر!<page>ليس فيه الكثير سوى الهياكل، صحيح؟ لكن، لكن! يخبرني أنفي أن شيئا يستحق العناء مدفون في القاع!"
SNAILS_ACT3_MEET_END_VISITED: "<hpage>الأرصفة التي تئن خلف كهوف العظام. رأيت هناك مركبة تستطيع العبور إلى الأسفل، جرسا ثقيلا صمم للهبوط.<hpage>لا أحتاج إلا إلى دخولها والعثور على مشغل يساعدني. سأبحث في الأرصفة وأكتشف الوسيلة.<page=M>ستكونين أول من يغوص إلى ذلك العمق منذ زمن طويل، أيتها العتيقة. ما زالت المساحة في الأسفل مجهولة منذ أمد بعيد، حتى لعائلتنا.<hpage>أنا أقدر من معظم الحشرات على مواجهة تلك الأعماق. سأصل إلى قاعدة هذه الأرض، وأعرف حقيقة الكارثة الجديدة التي تسببنا فيها معا."
GREEN_PRINCE_VERDANIA_UNFINISHED_REPEAT: "لماذا يخبو؟ لماذا أعجز عن تذكر ذلك المكان المقدس؟"
LACE_ABYSS_LAKE_1: "<hpage>ها أنت راقدة هنا أيتها الملكة. غرقت إلى هذا العمق، ومع ذلك ما زلت تتشبثين بالحياة.<hpage>أكنت تسمحين للسواد بخنق أراضيك... لتحميها وحدها؟"
GARMOND_EXPLORING_ACT1_REPEAT: "<hpage>احذر يا جارموند. مهما تكن أخطار هذه الأراضي، فأنا واثقة بأن ما ينتظر في تلك القلعة سيكون أسوأ.<page>نعم يا أختاه! لن نسقط، أنا وزازا، حتى نبلغ تلك القلعة وتتحقق العدالة."
LACE_ABYSS_LAKE_3: "تمردي هو أنني أبقيتك حية، أيتها العنكبوت. حرمت أمي من قوتك الحريرية. لقد انتصرت.<page>يمكنها أن تتخبط وتذبل، وهي تعلم أن طفلتها البائسة المحطمة هي من وجهت إليها الضربة القاتلة.<page>ابتهجي! ودعي كل شيء ينهار.<hpage>لن أفعل. حرست من قبل أرضا تحتضر. ذلك الدور... لن أؤديه مرة أخرى أبدا.<hpage>ما دمت حية وأملك قوة المقاومة، فلن تسقط هذه المملكة ولا الحشرات التي فيها."
LACE_ABYSS_LAKE_4: "هاهاهاها! عنكبوت. عنكبوت. يا لك من مخلوق رائع! تقاتلين وتقاتلين، غير عابئة بالعالم وهو ينهار من حولك.<page>ستسحق فارلوم وحشراتها حتى تصير غبارا، وستظلين رغم ذلك تلوحين بنصلك عبثا.<hpage>...ربما ما زالت هناك وسيلة لمنع ذلك المصير. سأحصل على القوة الخفية، الزهرة التي تطرد الظلام.<hpage>تتحمل تلك القواقع بعض مسؤولية الفخ واستعمالها القاسي للفراغ. وستساعدني الآن في البحث عن نقيضه.<hpage>سأعود يا طفلة حين أحمل القوة التي تمكنني من الغوص إلى الأسفل، وتحرير هذه الأرض نهائيا من قبضة أمك."
GRINDLE_SHOP_REPEAT: "أتبحثين عن بعض الغنائم الشهية؟ لا نرفض صفقة عادلة أبدا، هيه هيه! انظري إلى ما لدينا..."
GRINDLE_ITEM_TOOL_POCKET: "يمكننا أن نضيف لك جيبا صغيرا إلى حقيبة أدواتك. وستحملين فيه المزيد من النفائس! كل شظاياك وأشيائك الحادة!"
MAPPER_TUBE: "<hpage>شاكرا، لو سمحت، أود أن أطلب مهمة صغيرة من مهارتك في النقش.<hpage>صادفت داخل قاعات القلعة وسيلة سفر جديدة علي، شبكة من الأنابيب تعبرها مركبات تدفعها قوة البخار والهواء.<hpage>تلك القلعة متاهة، وستفيدني دبابيس تحدد كل محطة.<page>ما تصفينه يبدو بشعا ومنافيا للطبيعة مثل كل شيء في ذلك المكان. ومع ذلك، إن كان سيساعدك فسأنحت الدبابيس.<page>ابحثي عني بعد وقت قصير. ستكون الدبابيس جاهزة، ويمكننا أن نتاجر."
MAPPER_ITEM_MAP_MOSSGROTTO_DESC: "لا تشكل هذه الكهوف التي اجتاحها النبات تحديا يذكر لمحاربة ماهرة. ربما تكون مكانا للتأمل."
SHERMA_CORAL_NOBENCH_REPEAT: "لا تخافي أيتها العذراء الحمراء! سيرتفع هذا الضريح لنا بالتأكيد، وما علينا إلا أن نتمنى ذلك بصبر!"
SNAILS_ACT3_HEART_HINT_SHELLWOOD: "<page=M>في أعالي الغابة العظيمة، بين جذورها وكرومها وأغصانها، ابحثي عمن بذر البذرة الأولى.<page=S>إنه جوهر المكان نفسه، ولبه كله. إذا أردنا الدقة، فهو ليس حشرة حقا، لكنه كيان شديد القوة رغم ذلك.<page=M>سمعنا أن القلعة عقدت ذات يوم اتفاقا على مضض مع ذلك المخلوق، وأرسلت خدمها لتوقيره، بل بنت ضريحا في مكان ما هناك. ربما يجدر بك البحث عنه؟"
MAPPER_ITEM_MAP_DUSTPENS_DESC: "طرق وممرات قديمة اجتاحتها الصراصير والقائمون عليها. تغطي القذارة المسالك بطبقات كثيفة."
MAPPER_NOSTOCK: "لا أملك الآن مزيدا من السلع لأتاجر بها. ربما أصنع بضاعة جديدة أبيعها إن التقينا مجددا على الطرق المقبلة."
GRINDLE_ITEM_PSALM_CYLINDER: "أتعجبك هذه الدوارة اللامعة التي سرقتها من سيتيدل الكبيرة؟ يقولون إن هناك وسيلة لجعلها تغني لك!"
MAPPER_ITEM_MAP_BONEFOREST_NAME: "خريطة النُّخاع"
MAPPER_ITEM_MARKER_D_DESC: "يمكنك استخدام هذه العلامات لتحديد الأماكن المهمة أو وضع تذكيرات على خريطتك.<br><br>مادة الصدفة الداكنة هذه باردة الملمس، وأقوى مما تبدو."
MAPPER_ITEM_MAP_BONEFOREST_DESC: "طرق متداعية بنيت فوق أصداف حشرات قديمة. تستند فارلوم كلها إلى هذه الأسس الهشة."
MAPPER_ITEM_MAP_CORALCAVERNS_DESC: "مرتفعات متقشرة فوق تلك الدرجات العاوية. تشير الدلائل إلى أن محاربين عظاما حكموا هذا المكان المتعرج ذات يوم، لكن الرمال محت كثيرا من آثارهم."
MAPPER_MENTOR_MEET: "<hpage>تفتشين هذه الأراضي بدقة شديدة يا شاكرا... ترى من تأملين العثور عليه؟<page>أوكلو دين... سؤال ينم عن فطنة. أسافر بحثا عن مرشدتي، أعظم فرد في قبيلتي. تتبعت أثرها في أنحاء هذه المملكة، لكنني لم ألحق بها بعد.<page>لا بد أنها ابتعدت كثيرا الآن، لكننا سنجتمع من جديد إن واصلت التحرك وبقيت متيقظة."
MAPPER_GENERIC_SHADOW_REPEAT: "توحي المنشآت الحجرية في هذا المكان بأن مياها صافية كانت تجري في أرجائه.<page>ويا له من خيال الآن! حتى سكان هذا المستنقع يبدون كأن طبيعته السامة ولدتهم."
SHERMA_BONEGATE_MEET_3: "لكن انظري! ما إن بدأ حجنا المقدس حتى تعرضنا للاختبار. تقف هذه البوابة الهائلة بيننا وبين طريق التقدم.<page>لن تفتح الطريق إلا الصلاة المقدسة والأغنية! ففي هذه المملكة، حتى أقوى العظام تستجيب للموسيقى!"
DICE_PILGRIM_DEPLETED: "فزت مجددا! لم أقابل في حياتي حاجا أوفر حظا منك...<hpage>أنت مخطئ يا سيدي. مهارتي هي التي أكسبتني هذه اللعبة. وينبغي ألا يعتمد المرء على الحظ وحده.<page>همم. قول منصف يا أختاه.<page>لكن لا بد أن أعترف بشيء. الحقيقة أنني خسرت آخر ما كان لدي من مَسابح. ولا أستطيع دفع رهاننا الأخير.<page>لكن لدي على الأقل شيء صغير أعطيك إياه. هذه النردات. يبدو أنها أحبتك حقا. خذيها ذكرى للقائنا."
LACE_ABYSS_LAKE_DIVE_2: "<page>من تأملين أن تجدي في الأسفل أيتها العنكبوت؟ طفلة عليلة ووحشا يتضور حرمانا من الحرير؟ <page>إن كان ذلك أملك، فأخشى أن نخيب ظنك بشدة. فالذي ينتظر في الأسفل لم يعد أنا."
GRINDLE_BONEFOREST_INTRO: "مرحى، أما زلت هنا؟ المكان هادئ، ومناسب للاختباء.<page>إذن معك حبات المسابح الصغيرة التي تطقطق، صحيح؟ تلك المدحرجات التي تقايض عليها المتاجر؟"
MAPPER_ITEM_MARKER_A_NAME: "علامة الصدفة"
G_PRINCE_DANCERS_MEET: "أنت... إذن فقد تم الأمر... تحققت أمنيتي قبل أن أصل حتى...<hpage>ذلك الثنائي البرونزي الذي رقص في هذه القاعة، من الواضح أيها الطويل أنهما حاكيا صدفتك بدقة. أكنت مصدر إلهامهما؟<page>لست أنا أيتها المحاربة. لا يحمل قلبي لهذا المكان سوى الكراهية...<page>الراقصان... كانا آخر عمل حر أقدم عليه رفيقي... دائم الأمل، دائم السذاجة.<page>قدم نفسه كله في صفقة يائسة ليضمن سلامة كهوفنا. فصارت صدفته وروحه قالبا لهما.<page>لم أجرؤ على الزيارة طوال تلك الأعوام... حتى حين سقطت أرضنا فريسة للخيوط والخراب... بل بقيت حبيس جبني، أضعف من أن أشهد جماله مقيدا في محاكاة بهذه القسوة.<hpage>جد بعض العزاء أيها الطويل. فقد تحررت روحه الآن من تلك الصدفة الحديدية، والمصير الذي حل بأرضكم قد استولى على هذه القلعة بأكملها أيضا.<page>نعم... عزاء ضئيل أيتها المحاربة، بعدما فقدت كل ما أحببت..."
SNAILS_ACT3_CLOVER_HEART: "<page=M>ما هذا؟ تحملين قلبا لم نتوقعه أيتها العتيقة...<page=M>نستطيع تخمين مصدره، مع أننا ظنناه قد اختفى من هذه الأرض منذ زمن بعيد. <hpage>قلب سيد رشيق. وحين أخذته، تسنى لي أن أشهد كهوفه ومملكته كما كانتا في أوج ازدهارهما.<hpage>مشهد مذهل وفريد. زال كله... ضاع بسبب الحاكمة الشاحبة... والنظام الذي أبقاها سجينة."
DICE_PILGRIM_NOTENOUGH: "رهاننا حفنة من المسابح. متى جمعت ما يكفي منها، فسيسرني أن ألعب معك."
SPRINTMASTER_EXTRA_MEET: "أيتها الرشيقة، عدت مفعمة بالنشاط! وجئت في الوقت المثالي، فقد أعددت تحديا جديدا.<page>سيبقى المسار كما كان، لكن طوله وعدد دوراته سيزدادان كثيرا.<hpage>أتقترح اختبارا للتحمل؟ خضت كثيرا من أمثاله في حياتي.<page>رائع! رائع! لكن اعلمي أنني لا أستطيع تقديم سوى مكافأة متواضعة على الفوز في هذا السباق.<page>ما رأيك أيتها الرشيقة؟ فلننطلق مسرعين!"
MAPPER_SPAR_DECLINE: "<hpage>في وقت آخر يا شاكرا. أتوق دائما إلى التعلم، لكن مهامي تستدعيني الآن. <page>باكيلو! اذهبي إلى مهامك إذن. ستنتظر حلقاتي عودتك."
GARMOND_MEET_ACT1: "غروو! أيتها المحاربة، إن أردت مقارعة السلاح، فاعلمي أنك تقفين أمام الفارس المبجل جارموند ورفيقه الشجاع زازا. سنواجه معا كل تحد بشجاعة!<hpage>لا أرغب في قتالك يا سيدي. يبعث على الطمأنينة أن ألتقي في هذه الطرق بمن لا يزال سليم العقل وقادرا على مقاومة الأجساد الخاوية الممسوسة.<page>نعم! ما أكثر هؤلاء الخصوم غير الطبيعيين! كنا نأمل أن تضم أرجاء فارلوم الواسعة مكانا لم يلوثه ذلك الخيط. <page>لكننا لم نصادف حتى الآن سوى العنف والانحلال. ونخشى كثيرا أن يكون المس قد أصاب المملكة كلها."
MAPPER_MEET_BRIEF: "بوشانكا! حواف حادة وحواس يقظة!<page>هكذا يحيي المحاربون بعضهم في موطني. فرغم أنك طفلة لم يمض على فقسها وقت طويل، فأنت محاربة أيضا. وقفتك وسلاحك وحركاتك كلها تشهد بذلك.<page>أنا ملاحة قبيلتي، وقد كنت أرسم خرائط هذه البلاد. يمكنني مقايضتك عليها وعلى بعض المؤن إن شئت."
MAPPER_GENERIC_BELLHART_REPEAT: "استريحي في الأسفل ما استطعت. ففي الأراضي الواقعة خلف هذه الأجراس، يندر أن تجدي مثل هذا الأمان."
MAPPER_ITEM_MAP_GREYMOOR_NAME: "خريطة المستنقع الرمادي"
HUNTER_FAN_JOURNAL_REPEAT: "<hpage>يا صغيرة، إن كنت ترغبين في التعرف إلى مخلوقات هذه الأرض، فلم لا تصطادينها بنفسك؟<page>ما؟ لااا، تصطاد نو بنفسها؟ لا، لا! ليس الصيد من طبع نو، بل تأتي لاحقا وتتعلم. هكذا تسير الأمور!<page>أما أنت... فمفترسة! تعرف نو الذكية ذلك من روائحك! لذا تطلب منك نو أن تقطعي وتسجلي، كي نتعلم كلتانا!"
SHERMA_CITADEL_SPA_ENCLAVE: "<hpage>أيها الحاج الصغير، توفر هذه الحمامات بعض الراحة من أخطار الخارج، لكن ثمة مكانا أكثر أمنا في موضع مرتفع على الجانب الآخر من القلعة.<hpage>نشأت مستوطنة حول الضريح القديم هناك. ويبدو أن الجرس القائم فيه يوفر ملاذا من أخطار المس.<hpage>ولا شك أن إخوتك وأخواتك من الحجاج المحتشدين حوله سيسعدون برفقتك.<page>ما أروع هذا! نعم، سأتوجه إلى هناك مسرعا... بعدما أستحم قليلا بعد. أريد أن أصل إلى مكان مقدس كهذا نظيفا ومنتعشا!"
MAPPER_QUILL: "تحملين خرائط كثيرة يا صغيرة حاملة الإبرة. يجدر بك مقايضة إحداها بريشة.<page>وبريشة في مخلبك، يمكنك توسيع خرائطك بما تكتشفينه في رحلاتك. سجلي ما يكفي، وقد تعرفين مع الوقت هذه المملكة بأكملها."
MAPPER_GENERIC_BELLHART_ALT: "بوشانكا! يا صغيرة حاملة الإبرة، لقد اكتشفت أنت أيضا ملاذ الأجراس هذا.<page>تجنبت هذا المكان طويلا لشعوري بأمر غريب. أما وقد وصلت، فوجدته محررا، وسكانه القليلون الباقون يعرضون التجارة والترحيب.<hpage>قتلت مخلوقا طويلا فوق البلدة، وأظنها من النساجين، وإن كانت غايتها قد انحرفت.<hpage>لعلها كانت ما شعرت به. ظلت قوة هائلة رغم تقدمها في السن. وبصوتها ومخلبها أعانت الخيط الممسوس الذي يقبض على هذه الأرض، وربما وجهته. <page>ناسجة؟ ما أشرس تلك المخلوقات. نقص حكاياتها على صغارنا، لكننا ظنناها ماتت منذ زمن ولم يبق منها سوى جثث مقيدة في الأبراج. <hpage>كانت هذه لا تزال حية، لكنها إن كانت ناسجة حقا، فقد حطمت بطريقة وحشية.<hpage>قيد حريرها نفسه وثبت عميقا داخل صدفتها. عقاب قاس لم أشهد مثله من قبل. <page>رغم تحطمها، ما زلت أحسدها. مهارات النساجين الأسطورية... لقاء إحداهم في القتال تحد عظيم، والانتصار عليها فخر عظيم."
MAPPER_GENERIC_BONEBOTTOM: "هذه البؤرة التي أقامتها حشرات الحجاج المترنحة لنفسها... دونداكو!<page>أين الأسلحة؟ أين أبراج الحراسة؟ لم أر في حياتي معسكرا بهذا السوء في الدفاع!<hpage>لا يبدو أن الحجاج هنا يفكرون في الحرب يا شاكرا. وأظن أن معظمهم يغادرون إلى القلعة بعد وصولهم بوقت قصير.<page>همف. إن استمروا في هذا الإهمال، فلن يجدوا في هذه الأرض القاسية سوى الموت."
LACE_CITADEL_MEET: "ما هذا؟ وصلت العنكبوت الصغيرة إلى هذا الارتفاع، لتقف مرتجفة أمام قلعتنا المذهلة.<hpage>أيتها الطفلة الشاحبة، أعدت للسخرية فحسب؟ لم تكوني أنت ولا أرضك ندا لي. ولن تختلف هذه القلعة النائمة.<page>عزيزتي العنكبوت، لماذا تبقين متفائلة على هذا النحو المزعج؟ لا يمكنك تصور القوة التي تنتظر في الأعلى، تلك التي تطفئ أملك بنظرة عابرة.<hpage>أيتها الطفلة الحمقاء، أما زلت تظنينني غافلة عن حقيقة سيدتك، بعدما بلغت هذا المدى؟<hpage>عظمة هذه الأرض، وإخلاص حشراتها، واللعنة التي تحل بها. العلامات واضحة.<hpage>مملكتك خاضعة لمخلوق يسمو على الحشرات، من تلك الطبقة العليا.<hpage>ومهما كان مراده من حريري وصدفتي، فسيجد أنني متمسكة بكليهما."
SHERMA_CORAL_JUDGE: "أليست حشرات القضاة الوقورة لطيفة؟ لا تتكلم ولا تغني، لكنني أشعر بحكمة عظيمة خلف نظراتها اللامعة!<hpage>احذرها أيها الصغير. فمهما بلغت حكمتها، كثيرا ما يعقب أحكامها عنف. وقد سقط كثير من رفاقك الحجاج على هذه الدرجات العظيمة.<page>حقا...؟ لكن حتى الساقطون قد ينهضون من جديد، وكل رحلات الحج ستكتمل، صحيح؟ هذا ما سمعته!"
MAPPER_GENERIC_HUNTERSNEST_REPEAT: "تخفي هذه الأنفاق الملتوية كثيرا من الخصوم الجديرين، وكثيرا من الفخاخ أيضا. راقبي موضع قدميك جيدا."
MAPPER_ITEM_TUBE_PIN_DESC: "كما طلبت، ستحدد هذه الدبابيس محطات السفر داخل ذلك البناء البشع المصنوع من الفولاذ والبخار."
COURIER_TALL_THANK_PT2: "<hpage>ليكن مقصدك قلب الجرس سريعا يا بيل. فهذه الأرض لا تصلح للسفر من دون نصل حاد في المخلب.<page>نعم! إلى قلب الجرس وأخي، سأطير بأقصى سرعة. إن مررت من هناك مجددا، فتوقفي وألقي التحية!"
MAPPER_MENTOR: "<hpage>لمن تنادين يا شاكرا؟ يتردد صوتك في الكهوف.<page>توغلت في فارلوم بحثا عن معلمتي، أعظم محاربات قبيلتي. لكنني لم أستطع مجاراتها، ثم انقطع أثرها.<page>لا بد أنها قطعت مسافة أبعد بكثير الآن، لكن إن واصلت التقدم وبقيت يقظة، فسألتقي بها من جديد."
MAPPER_SPAR_REOFFER: "يجب ألا ندع أصدافنا تلين أبدا، وإلا غرست فارلوم أنيابها الحادة فيها بسرعة.<page>هل تبارزينني يا هورنيت حاملة الإبرة؟ سنصقل معا مهارة كل منا."
GILLY_CARMELITA_CORPSE_REPEAT: "سأدعو لك بالنجاح في مهمتك العظيمة يا آنستي، لكن سامحيني على حزني لمعرفتي ثمنها القاسي..."
GRINDLE_TRAPPED2: "أسرعي، وأخرجينا من هنا! لدينا أماكن نقصدها، وحشرات نلتقي بها، وحلي صغيرة نختلسها!"
GREEN_PRINCE_CLOVER_MEET_1: "أيتها المحاربة... سمعت وقع اقترابك. لماذا جئت؟ لا أظنك ترغبين في رؤية هذه الكهوف المنهارة منذ زمن طويل.<hpage>كان الطريق مفتوحا يا سيدي، ولم أفعل سوى اتباعه. هل أصبت في ظني أنك كنت من سكان هذه الأراضي الحدودية؟<page>نعم... وكم كانت مجيدة في زمنها. تقترب نهاية فارلوم، لكن كهوفي، هذه الكهوف، استسلمت لمصيرها قبل ذلك بزمن طويل. <page>أنا آخر من بقي من تلك الأرض الجميلة... وسأظل هنا حتى النهاية، أتذكر ما كان فيها من بهاء..."
HUNTER_FAN_ZAPNEST_SLAP1: "تظن نو أنك اصطدت طويلا ولم تنالي إلا قليلا من الراحة أيتها الآنسة الكبيرة.<page>لعل العصارات تغطيك، وأوساخ الوحوش تثقل كاهلك؟ دعي نو اللطيفة تنظفك وتعيد إليك انتعاشك!"
LACE_MEET_4: "لذيذ! لقد بدأت تعجبينني!"
SNAILS_ACT3_DEEP_MEMORY2: "<page=M>يمكننا فعلها. يمكن إلقاء التعويذة إن توفرت قوة كافية، قوة هائلة قد تعادل قوة تلك الحاكمة...<hpage>لا أستطيع منحك قوتي، حتى لو كانت كافية. فما زلت أحتاجها لمواجهتها في الأسفل. فأين تقترحين أن نبحث عن مصدر آخر؟<page=M>في فارلوم! هو هو هو! تذكري، مملكتنا مملكة تتحقق فيها الأمنيات.<page=B>لم تولد فارلوم من تلك الحاكمة أيتها العتيقة. كانت القوة موجودة في هذه الأرض حتى قبل أن تقيدها تحت سلطانها.<page=B>غرنك. ابحثي عن قلوب مملكتنا القديمة، وعن آخر الخلفاء الذين يحملون قوتها.<page=M>ما زالت هناك، مختبئة وقد أضعفها حكم الشاحبة الطويل. عليك أن توقظيها.<page=M>سنعلمك كيف تفعلين ذلك بما يليق بناسجة: أغنية حزينة تنفذ إلى ذكرياتها وتبعث فيها الحياة للمرة الأخيرة."
GRINDLE_CITADEL_SLAP_2: "أووه، يا له من حظ عفن! احتفظي بخردتك الكريهة لنفسك إذن!"
GRINDLE_BONEFOREST_OFFER: "أوهوهو! شاركينا بعض حباتك الصغيرة الطقطاقة، وساعدينا على ملء جيوبنا. إن فعلت، فسنشاركك سرا خفيا!"
HUNTER_FAN_HINT_WISP: "أيتها الآنسة الكبيرة، لمواصلة صيدك عليك أن تصعدي عاليا فوق هذا المكان، فوق أطول الأبراج الدوارة!<page>في الأدغال الداكنة تختبئ حشرات غريبة تستدعي نيرانا راقصة. جميلة جدا! ودافئة جدا!<page>لكن حين حاولت نو الزحف نحوها، غضبت النيران وانقضت من كل جانب! كادت نو المسكينة تحترق نصفها!<page>تترك نو لك صعود ذلك المكان وتقطيع تلك النيران أيتها الآنسة الكبيرة. لا بد من فعل ذلك من أجل سجلنا."
MAPPER_GENERIC_JUDGESTEPS: "بوشانكا! يا صغيرة حاملة الإبرة، هل رأيت أثرا لمعلمتي قريبا؟ أشعر بأنها كانت هنا منذ وقت قريب جدا!<hpage>لا أستطيع الجزم يا شاكرا، لكن إن كانت تسافر بحثا عن خصوم مهرة، فستناسبها هذه الدرجات. فالمحاربون الذين يحرسونها أشداء.<page>صحيح! إنهم حراس مهيبون، يقاتلون دفاعا عن مواقعهم ويكرهون مغادرتها. يلوحون بأسلحتهم بوحشية باردة لا ينبغي الاستهانة بها."
MAPPER_MASTER_MEET: "بوشانكا، يا هورنيت حاملة الإبرة. فهذا اسمك، أليس كذلك؟ سمعته يتردد في هذه الأرض بإجلال.<page>كنت آمل أن تلبي ندائي. ففي مثل هذه اللحظات، الواحد جيد والاثنان أفضل.<hpage>لن أرفض طلبك يا شاكرا. توقعت مراسم حزينة في نهاية هذا الأثر، وللأسف صدق توقعي. أهذه معلمتك إذن؟<page>أشرس محاربات قبيلتي، وهنا ترقد. كنت أدعوها معلمتي، نعم، لكنها كانت لي أما كذلك، وأكثر بكثير ممن ولدتني.<hpage>من بين عجائب هذه المملكة الكثيرة، وجدت مكانا جميلا تلقى فيه نهايتها.<page>أنهى العمر حياتها... تعد قبيلتي ذلك عارا، لكنني لا أرى سوى قوة لم تهزم.<page>حتى حين خذلتها صدفتها، سارت في أرجاء هذه المملكة. وباتباع أثرها تمكنت من مشاركة العالم شهادة كرامتها.<page>يا هورنيت حاملة الإبرة، سلكت أنت أيضا هذه الدروب الكثيرة كما فعلت معلمتي قبلنا. انضمي إلي الآن في أغنية رحيلها.<page>حان لروحها أن تتجاوز صدفتها..."
MAPPER_GENERIC_BONEBOTTOM_REPEAT: "من هذا الموقع الآمن، يمكنني مراقبة الأخطار أثناء عملي. هذه الأراضي المنخفضة هشة وخطرة. أبقي سلاحك قريبا."
SETH_FESTIVAL_REPEAT: "هل جربت مهارتك في الألعاب؟ إنها ممتعة جدا، ألا ترين؟<page>أتساءل إن كنت سأحرز نتيجة أعلى قليلا لو حاولت مجددا..."
LACE_TOWER_DEFEAT_2: "ففي النهاية... أنت من تريدها... أليس كذلك؟"
SPRINTMASTER_ACCEPT: "هوي! رائع! فلتبدأ منافستنا العظيمة بين الأصداف.<page>لكن ملاحظة أخيرة أيتها الرشيقة! إن خرجت من المسار أو أردت العودة سريعا، فاعزفي أي لحن تستطيعين، وسيحملك رفيقي إلى خط انطلاقنا.<page>والآن! المسار ينادينا. أمهليني لحظة لأعد ميدانا جديرا باختبار مهارتنا.<page>"
SHERMA_RESCUE_MEET2: "<hpage>أجل شكرك أيها الصغير. فالموتى ينهضون."
SNAILS_ACT3_HORNET_MEMORY1: "<hpage>حان الوقت أيها الشامانان. معي القلوب، وهي بالعدد الذي طلبتماه. تكفي لصنع تعويذتكما، أليس كذلك؟<page=B>نعم. نحن مستعدان. ومع ذلك، ما تحملينه محزن، قوة قلما عرف مثلها أحد... وكلها على وشك الاحتراق لإنقاذ فارلوم.<page=S>أحذرك أيتها العتيقة، قد لا يكون هذا الجزء الأول مريحا، لكننا سندخلك إلى العمق المطلوب.<page=M>ليس عليك الآن سوى الاستعداد لما سيأتي بعده. استلقي على المنصة ولنبدأ."
MAPPER_GENERIC_PEAK_REPEAT: "سيكون رسم خريطة لمرتفعات هذا الجبل العظيم تحديا هائلا. لم أر حتى الآن سوى قاعدته.<page>بعد أن أكمل البحث عن معلمتي، أود العودة ومحاولة تسلقه كاملا."
MAPPER_ITEM_MAP_CRAWL_DESC: "كهوف موبوءة بالديدان، تهتز ولا تعرف الاستقرار. ما زالت فيها آثار خافتة تدل على أن الحجاج سلكوا هذه الدروب الضيقة يوما."
GARMOND_CITADEL_DEFEATED: "هووف... لننه المبارزة هنا.<page>أنا... هووف... آمل ألا أكون قد... هووف... أسقطت رمحي عليك بقوة مفرطة من شدة حماسي يا أختي.<hpage>كان قتالا شريفا أيها السيدان. لكن علينا الآن مواصلة السير. لن يبقى المكان هادئا طويلا.<page>نعم، بالطبع. أعمالنا الصالحة لا تنتهي، وعلينا المضي دائما. لا وقت نضيعه!"
SPRINTMASTER_RETRY: "لا تدعي الهزيمة تثقل قلبك أيتها الرشيقة! عودي إلى التحدي فحسب. فلنحلق معا بسرعة من جديد!"
GARMOND_TALK1_CITADEL: "<hpage>ما الذي دفعك أول مرة للصعود إلى هذه القلعة يا جارموند؟<page>مهمتي هي أقدس المهام يا أختي! ويشاركني فيها أوثق رفاقي، عزيزي زازا.<page>قصدنا هذه القلعة لنقف أمام حكامها ونطالبهم بالإجابة! بالقوة إن لزم الأمر! كل ذلك من أجل قريتنا العزيزة التي نكرس لها أصدافنا. <page>لقد اجتاح مس الخيوط المخيف أهلنا الطيبين... ونحن كل من بقي، نحمل ذكراهم ونرجو أن تتحقق لهم بعض العدالة."
DICE_PILGRIM_MEET: "آه، حاج مثلي. ظللت أصلي هنا وحيدا زمنا طويلا، ولا يرافق صوتي سوى صوت الريح.<page>لقد اقتربنا كثيرا. يكاد حجنا ينتهي. لم يبق سوى صعود أخير وقاس، أليس كذلك؟<hpage>القلعة قريبة أيها الحاج. لا بد أنك تملك بعض القوة، فقليل من رفاقك يبلغون هذه المرتفعات.<page>نعم، تزداد الطرق وحدة كلما طال السير فيها وارتفعنا.<page>يحتاج بلوغ هذا المكان إلى كثير من الحظ وكثير من الإيمان، مع أنني واثق أنني لست مضطرا إلى إخبارك بذلك."
SPRINTMASTER_HERO_WIN_POST_LAST: "هوو... فعلتها... هوو. هوو... هووف.<page>ما كنت لأصدق أن في فارلوم كلها صدفة بهذه السرعة! يا لها من أعجوبة!<page>لقد أثبت جدارتك أيتها الرشيقة، وحققت أمنيتي، وجاريت سرعتي ثم سبقتها، وحطمت حدودي تماما."
GARMOND_CITADEL_OFFER: "غرو! لدي فكرة لك يا أختي. ما رأيك أن نتبارز هنا قبل أن نتابع السير؟ نخوض معا قتالا ممتعا؟ لا تخافي، لن أسدد ضربة قاتلة!"
GARMOND_FINAL: "<hpage>أيها الفارس، أنا آسفة... كانت هذه الوسيلة الوحيدة لتحريرك من الخيوط الملعونة.<page>هوووه... لا تقلقي... يا صغيرة...<page>افتخري بنفسك... فقد صرت قوية جدا!<page>يا زازا... لنسترح قليلا فحسب... ثم سنرحل..."
HUNTER_FAN_JOURNAL_COMPLETE_4: "تحققت أمنية نو. لكنك ستواصلين تقطيع المخلوقات وإضافتها إلى سجلنا بالطبع أيتها الآنسة الكبيرة؟<hpage>سأفعل. فمعرفة هيئة المخلوق وعاداته ميزة قد تحسم نتيجة المعركة. وتسجيل هذه التفاصيل يستحق الجهد.<page>نعم! يستحقه كثيرا! تأمل نو أن تشاركيها ما تتعلمينه كثيرا!<page>وخذي هدية تعينك في صيدك أيتها الآنسة الكبيرة! ستضيف نو جيبا إلى حقيبة أدواتك، كي تحملي أدوات كثيرة في رحلات الصيد!<page>"
GRINDLE_ITEM_MASK_SHARD: "إنها مجرد قطعة من قناع، صحيح؟ لا تسألينا أين بقية القطع... سيكون عليك تعقبها بنفسك!"
MAPPER_ITEM_MAP_PEAK_NAME: "خريطة جبل فاي"
HUNTER_FAN_JOURNAL_COMPLETE_1: "<hpage>يا نو، أكملت طلبك وسجلت كثيرا من مخلوقات فارلوم في السجل.<page>أوووه، أووه! ما ما ما! انظري إلى هذه الوحوش والحشرات الرائعة، كلها مدرجة بهذا الجمال!<page>أيتها الآنسة الكبيرة، كم من المخلوقات قطعت وضربت وحطمت! ما زالت آثارها عالقة بك، وروائحها تختلط برائحتك!<page>أوووه، ما... لا بد أن تتذوق نو ذلك بنفسها!"
GARMOND_GRAND_FORUM_REPEAT: "تقدمي أنت. سيبقى زازا وأنا هنا للحراسة والإمساك بكل من يتخلف عن الركب."
HUNTER_FAN_JOURNAL_COMPLETE_3: "تفهم نو، ما. سيكون ارتشاف عصارات مفترسة شرسة كهذه رائعا... لكنه ليس صوابا. فهذا تصرف غير ودي.<page>أما أمنية نو في رؤية كثير من الوحوش الجميلة... فقد حققتها بالتأكيد أيتها الآنسة الكبيرة! تقدم نو لك كل شكرها!"
MAPPER_GENERIC_BONE: "سأغادر هذه الطرق المتداعية قريبا، لكننا قد نلتقي مجددا إن مررت بالمستوطنة في الأسفل. فأنا أتردد عليها كثيرا لأتاجر مع الحجاج."
GREEN_PRINCE_VERDANIA_STAG_MEET: "هنا شحب أثر الأيلة... طاردناها وأسقطناها، ولم يقدر على ذلك أحد قبلنا...<page>فصارت دليلا على عظمتنا... وعلامة على حقنا الإلهي..."
GRINDLE_ITEM_SPOOL_PIECE: "هذه جميلة! قطعة صغيرة متوهجة من شيء ما. تفوح منها قليلا رائحة أولئك الهامسين الزاحفين البغيضين، لذا قد تكون خطرة. خذيها! أعطينا مسابحك وأريحي مخالبنا منها!"
GARMOND_CITADEL_ENEMYFIGHT: "مرحى يا أختي! حققنا نصرا عظيما من جديد. لا تصمد قوة المس في هذا المكان أمام قلوبنا النقية!"
SNAILS_ACT3_DEEP_MEMORY4: "<page=M>هذه المهمة التي أمامك... ستطالبين بقوة الفانين، بقلوب الحشرات. وسيكلف إنقاذ هذه الأرض آخر ما لديها من قوة.<page=M>حتى نحن نتردد في هذا. فرغم رغبتنا في لمس قوتها، لم نرغب قط في رؤيتها تستنفد بالكامل.<hpage>خير أن تتركي عجائب أرضك ضعيفة، إن كان ذلك سيبقي صدفتك وأصداف رفاقك سليمة."
GARMOND_CITADEL_ACCEPT: "غرووووو! أحسنت الرد يا أختي! استعدي بسلاحك!"
HUNTER_FAN_FINAL_1: "واااه! أيتها الآنسة الكبيرة... يكاد سجلك ينفجر من كثرة المخلوقات بكل أنواعها! إنه يفيض! لا بد أننا نستطيع اعتباره مكتملا!<page>من كان يظن أن مهمة كهذه يمكن إنجازها! ما أذكى نو حين كلفت مفترسة شرسة بهذا العمل!<hpage>تضم هذه الأراضي الواسعة قدرا هائلا من الحياة، وقد علمني توثيقها كلها الكثير. وهذا جهد يستحق أن أواصله حتى بعد مغادرة المملكة.<page>أوه ما، يا له من جوع جدير! أنت وأنا متفقتان أيتها الآنسة الكبيرة، فكلتانا صيادة. تختلف أساليبنا، لكن شهيتينا أصبحتا متشابهتين جدا!<page>لدى نو هذا الوسام لك، رمزا لكل جهودك وعلامة على طبيعتك الحقيقية. وهو يحمل رائحتها الحلوة جدا!"
GREEN_PRINCE_VERDANIA_ENTRY_REPEAT: "انحنى الجميع أمامنا، نحن الأمراء الخضر..."
GARMOND_TALK1: "<hpage>ما الذي يدفعك إلى السفر في هذه الأرض المنكوبة يا جارموند؟ أأنت أيضا تسعى إلى القلعة في الأعلى؟<page>نعم! لكن لا تخلطي بين مغامر باسل وحاج عادي. مهمتي مقدسة، ويشاركني فيها أوثق رفاقي، عزيزي زازا.<page>لا نقصد تلك القلعة طلبا لعطاياها. لا يا أختي! بل نقصد حكامها لنطالبهم بالإجابة! بالقوة إن لزم الأمر! من أجل قريتنا العزيزة التي نكرس لها أصدافنا. <page>لقد اجتاح مس الخيوط المخيف أهلنا الطيبين... ونحن كل من بقي، نحمل ذكراهم ونرجو أن تتحقق لهم بعض العدالة."
MAPPER_GENERIC_CRAWL: "<hpage>تحياتي يا شاكرا. كانت مفاجأة سارة أن أسمع نداءك يتردد في هذه الأنفاق المتداعية. كيف يسير بحثك عن معلمتك؟<page>بوشانكا! يصعب تعقب أي شيء في هذه الكهوف والديدان تقلب الصخر بلا توقف.<page>ومع ذلك، أستطيع رؤية دلائل على مرور معلمتي من هنا. يتلوى مسارها في هذه الأرض بغرابة... ويحيرني مقصدها.<page>لكن لا بأس. يمكنها أن تنير بصيرتي حين نلتقي مجددا. وحتى ذلك الحين، سأواصل السير في إثرها."
GRINDLE_SAVED2: "حبسنا في مكان كهذا... يا له من فعل مشين!"
SHERMA_BELLBEAST_REPEAT: "هيا أيتها الوحش، أسمعينا صوتك! غني معي، غني معي، غني غني غني! اجعلي الكهوف تردد الصدى والطرق العظيمة تجلجل!"
GARMOND_CITADEL_REFUSE_2: "حسنا يا أختي. ربما كان الأفضل أن نستريح جميعا هنا قليلا بعد."
SPRINTMASTER_EXITED_BY_BUG: "أيتها الرشيقة! هل انسحبت من السباق؟ صحيح أن المرء يحتاج أحيانا إلى بداية جديدة حفاظا على سلامة العقل والصدفة.<page>لكن ما رأيك الآن؟ لا شك أنك متلهفة للعودة إلى المسار. فلنحلق معا بسرعة من جديد!"
SETH_CITADEL_REPEAT: "هذه الخيوط السوداء... تمتد إلى الأعلى بشوق جارف. لا عجب أنها تشق طريقها حتى عبر الصخور الصلدة!"
GRINDLE_ITEM_SIMPLE_KEY: "نحن حشرات النشل نستطيع التسلل إلى أي مكان نريده، لكن بهذا المفتاح تستطيع حتى حشرة ضخمة بلهاء مثلك عبور باب مقفل!"
SNAILS_ACT3_HEART_HINT_ANT: "<page=M>اتبعي مسيرتهم إلى الحدود البعيدة لهذه الأراضي المنخفضة، وابحثي عن آخر ملكة لصيادي النمل. ما زلنا نشعر بها... بالكاد.<page=B>في شبابها، وحد صوتها القبائل البرية ومنحها القوة لمقاومة إرادة الملك الشاحب... مدة أطول من معظمهم، على الأقل."
SHERMA_CITADEL_ENTRANCE_REPEAT: "لنتابع طريقنا يا أختي! معا سنمضي قدما بهدي إيماننا!"
MAPPER_GENERIC_SHELLWOOD_RAPTURED: "يا طفلة الإبرة. هاك! صادفت مستوطنة قريبة من هنا، في قلب عرق من الأجراس القديمة. كانت الحشرات هناك عالقة في صمت على شبكة من الحرير.<page>بدا لي أنها مصيدة خبيثة نصبها مفترس خفي. غادرت مسرعا، وحرصت على تجنب الخيوط المتلألئة.<hpage>مررت بالبلدة بنفسي. رأيت داء الخيط على الطرق من قبل، لكنه هناك لا يميز بين أحد.<hpage>اللعنة التي تضرب البلدة موجهة ومركزة. إنه استخدام بارد للحرير على نطاق مقلق.<hpage>إن سمح الطريق، فسأبحث عن مصدرها."
SPRINTMASTER_REOFFER_FINAL: "ما رأيك أيتها الحشرة الرشيقة؟ رغم أنه لم يبق لدي جزاء أقدمه، سيسرني أن أحلق معك من جديد!"
GARMOND_GRAND_FORUM_ASLEEP: "خررر... زازا... خرررر... انتبه يا بني..."
MAPPER_ROSARIES: "ليس لديك ما يكفي من المسابح للتجارة؟ الحجاج المجانين في القرية التي غطاها النبات قرب هنا يحملون بعضها دائما.<page>هل ستأخذين منهم ما تحتاجين إليه؟ إن تركتهم يهيمون في طريقهم بلا نهاية رحمة زائفة."
GILLY_HUNTERTRAP_CAUGHT: "عجبا، ما أمكر المصائد التي ينصبها ذوو الأصداف الحمراء دفاعا عن أرضهم!<page>من المثير للإعجاب أنك نجوت من ضربة وحشية كهذه. لا بد أن صدفتك شديدة السماكة!<hpage>سميكة بما يكفي، لكنني كنت أفضل تجنب المصيدة تماما.<hpage>سأجعلها تذكرة لي كي أبقى حذرة، حتى حين لا يكون الأعداء قريبين."
MRMUSH_END: "...آه. عذرا."
DICE_PILGRIM_REMEET: "يا لها من سعادة. أعادك الطريق إلي.<page>هل ترغبين في لعب بضع جولات من النرد ما دمنا هنا؟ بالرهان نفسه، مقدار من المسابح؟ اجلسي إلى جانبي ولنبدأ."
MAPPER_ITEM_MAP_DOCKS_DESC: "ظننت هذه الأرصفة صغيرة حين مررت بها أول مرة. أما الآن فأشعر بأن معظم هذا البناء مختبئ تحت بحيرة الحمم."
MAPPER_ITEM_PIN_BELLWAY_DESC: "ممرات الأجراس، عروق مذهبة تمتد في أنحاء البلاد. يقال إنها كانت تستخدم للسفر في الماضي؟<br><br>ستحدد هذه الدبابيس المحطات على خريطتك."
GREEN_PRINCE_VERDANIA_BOSS_1: "من جديد... أرى هذه الأرض مهجورة... مخذولة...<page>...وعرشا لم أستطع الجلوس عليه وحدي...<hpage>كنتم حشرات فانية، عالقين تحت كائن شاحب... التفاني أو الدمار... هذان المصيران الوحيدان اللذان يتيحهما قومي."
HUNTER_FAN_REPEAT_ACT3: "صار العالم أخطر بكثير، لكن علينا أن نتعلم! اقطعي الخيوط السوداء يا آنسة كبيرة، واصطادي كل وحش في فارلوم!"
MAPPER_GENERIC_SHADOW: "<hpage>شاكرا، أتجازفين أنت أيضا في هذه المستنقعات؟ إن مرتفعات فارلوم لا تحسن الترحيب.<page>هكذا يلتوي درب معلمتي، وهكذا أتبعه. لكن كلامك صحيح! هذا ليس مكاني.<page>يلقي ظل القلعة بثقله هنا. وأشعر بكتلتها البشعة أيضا.<page>لا عجب أنها تخنق هذه الكهوف الرطبة الراكدة. ذلك المسخ من المعدن والحجر لا يبالي بالأراضي التي يلتهمها."
MAPPER_ITEM_QUILL_NAME: "ريشة"
MAPPER_GENERIC_WILDS_REPEAT: "لا شك أن معلمتي وجدت طريقها إلى هذه البراري. فحسها القتالي لا يضاهى. لا بد أنني أقترب منها!"
GARMOND_CITADEL_ENEMYFIGHT_REPEAT: "اتركينا لصيدنا النبيل يا أختي! ما زالت حشرات القلعة المشوهة تملأ هذه القاعات المذهبة. أعدادها كثيرة، لكننا سنقطع خيط حياتها."
MAPPER_ITEM_MARKER_C_DESC: "يمكنك استخدام هذه لتحديد الأماكن المهمة أو وضع التذكيرات على خريطتك.<br><br>أما صدفة الصيادين الحمر فتجعل العلامة واضحة جدا."
GARMOND_DUSTPENS: "ما أشد رطوبة هذه الطرق القديمة ونتنها يا أختي! تكاد الرائحة الشريرة في الهواء تقهر شواربي الرقيقة.<page>بؤسا لأصحاب الحواس المرهفة، مثل زازا المسكين. يلقي ظل تلك القلعة البشعة بثقله على هذا المكان!<hpage>رأيت كثيرا من الأبنية العظيمة يفتك بها الخراب في زماني. وغالبا ما تصبح هذه الأماكن أوكارا للمفترسات. راقبوا ما يتربص في الضباب، يا سادة."
GRINDLE_CITADEL_SLAP_1: "مرحبا، يبدو أنك تتسللين في هذا المكان القديم المغبر منذ مدة، أليس كذلك؟ لا بد أنك تحملين كثيرا من النفائس! دعي ذبابة نشل عجوزا مسكينة تلقي نظرة سريعة!"
SHERMA_MEET_OPENED2: "أنا شيرما، بالمناسبة. مجرد حاج متواضع مثلك. إن احتجت إلى مساعدة في الطريق أمامك، فنادي باسمي وسآتي إليك حتما. أنا وجرسي المحظوظ في خدمتك!"
GRINDLE_CITADEL_MEET_REPEAT: "لن نرحل حتى نفرغ من النهب! اذهبي أنت إن كنت خائفة!"
SHERMA_CARETAKER_DELIVERY_POST: "خذي بعض المسابح في المقابل، أيتها العذراء الحمراء!<page>قد لا يتحقق وعدها بالثواب المقدس في هذه الأيام المظلمة، لكنها لا تزال تحمل أطيب أمنياتنا."
SHERMA_BONEGATE_OPENED_2: "بوابة، بوابة، بوابة! ألطف بوابة قابلتها!<br>بوابة، بوابة، بوابة! أعظم معجزة رأيتها! ها ها ها!"
SNAILS_ACT3_MEET_END_NOTVISITED: "<page=M>لا تزال تلك الأرصفة فوق بحيرة اللهب تملك وسيلة للعبور إلى الأسفل، وإن كنت ستكونين أول من يجرؤ على النزول منذ زمن طويل.<hpage>إذن طريقي واضح. الزمي ملاذك وانتظري عودتي. إن أمكن إنقاذ هذه الأرض، فقد يبقى لك دور تؤدينه."
SPRINTMASTER_YESNO: "هل تسابقين سيد العدو سويفت؟"
GILLY_HUNTERTRAP: "عجبا، ما أمكر المصائد التي ينصبها ذوو الأصداف الحمراء دفاعا عن أرضهم!<page>كدت ألقى نهايات بشعة بنفسي أكثر من مرة. إنها تضفي إثارة حقيقية على تحقيقاتي..."
SETH_FESTIVAL_MEMENTO: "حسنا إذن! ما أروع هذا! في كل هذه الألعاب الممتعة عادلت نتائجي بل وتجاوزتها!<page>يا لها من روعة أن أكون هنا وأشهد عرضا لهذه الموهبة الفذة.<hpage>كان تجاوز نتائجك تحديا هائلا يا سيث، ومع ذلك يبدو أنك حققتها بنفسك بسهولة نسبية.<page>إنك تجاملينني! لكن نعم، ما زالت قدراتي تفاجئني. لدي مهارات كثيرة لا أذكر أنني تعلمتها... <page>لكن لا تقللي من شأن إنجازاتك، فهي عظيمة أيضا، بل وملهمة!<page>وفي الحقيقة، احتراما عميقا لك، أصر على أن تأخذي هذه الميدالية الصغيرة. وجدتها بين أمتعتي، ولا أعرف أين حصلت عليها، لكنها تبعث في النفس شعورا طيبا.<page>فلتكن علامة على صداقة أشعر بأنها بدأت للتو.<hpage>شكرا لك يا سيث. سأبقيها قريبة مني."
DICE_PILGRIM_MEET2: "بينما نستريح استعدادا للرحلة المقبلة، هل ترغبين في اختبار حظك في لعبة نرد؟ أظنك تعرفين كيف تلعبين؟<hpage>أنا واثقة بأنني سأفهم القواعد بسرعة يا سيدي. ما الرهان؟<page>مقدار من المسابح في كل رمية. ما رأيك؟ أهو عادل؟ لندع النرد يبدد همومنا!"
SHERMA_ENCLAVE_MEET1_ALT: "همم؟ آه، مرحبا! يسرني أن ألقاك هنا في نهاية رحلتنا الطويلة يا أختي.<page>أنا شيرما، حاج بسيط مثلك. ما أعجب أن نجد أنفسنا هنا أخيرا، أليس كذلك؟<page>لقد صعدنا أخيرا إلى أعالي القلعة، وصرنا بين كثير من إخوتنا وأخواتنا... إنها نعمة حقا. نعم، نعمة.<hpage>توحي نبرتك بشيء من التردد في هذا الإيمان، أيها الحاج الصغير. فمن قطع كل هذا الطريق لا بد أنه رأى حقيقة هذا المكان المحطم. فما رأيك فيه حقا؟"
GRINDLE_RUMMAGE_SONG8: "مرحبا! أنت من جديد؟ كان هذا المكان هادئا ومريحا، أما الآن فلا ننال لحظة سلام!"
GARMOND_CITADEL_DEFEATEDHORNET: "آه يا أختي! لقد استيقظت. آمل ألا تكون ضرباتنا القوية قد تركتك في حال شديدة الضعف.<page>بل نحن مستعدون لمبارزتك مجددا إن بقيت لديك القوة!"
SETH_GREYMOOR_MEET: "<hpage>سيدي الحارس... لم أتوقع أن نلتقي مجددا بعد لقائنا السابق.<page>همم؟ عذرا يا صديقتي، أخشى أنني لا أعرفك. وأنا واثق بأنني كنت سأتذكر هيئة لافتة كهذه!<hpage>...لا تلق بالا يا سيدي. يبدو أنني خلطت بينك وبين شخص آخر.<hpage>أنت... مسافر عبر هذه الأراضي المرتجفة، كما أظن؟<page>أظن أنني كذلك فعلا! ولدت في هذا العالم منذ وقت قصير، واستيقظت قرب بحيرة وليس بجانبي سوى هذا السلاح.<page>اسمي سيث، لكنني لا أعرف من أعطاني إياه.<page>أليس من عادة حديثي الولادة أن يستكشفوا العالم؟ لهذا خرجت أفعل ذلك! سأستريح هنا قليلا، ثم أتابع رحلتي."
HUNTER_FAN_MEET_ACT3: "يا آنسة كبيرة! يا لها من مفاجأة جميلة لنو! العالم يهتز والخيوط السوداء تمتد. التجول الآن غير آمن.<page>لكن أنت! أنت بالغة، نعم؟ مكتملة النمو؟ مستعدة للصيد مهما اشتد الظلام؟<hpage>لا شك أنني لست طفلة، يا صغيرة.<page>رائع! إذن لدى نو طلب! هل تبحثين من أجلها عن حشرات فارلوم الكثيرة الرائعة وتقطعينها؟<page>اقطعيها بنصلك! اقطعيها بروحك الناضجة! اقطعيها بقلبك البالغ الوحشي!<page>هل تساعدين نو؟ قبل أن ينتهي كل شيء؟ هل تأخذين لفافتها وتملئين صفحاتها بما نتعلمه من قطوعك؟"
MRMUSH_LOC2: "...خطوات واسعة تحرك العالم، لكن لا ينبغي تجاهل الخطوات الصغيرة...<page>...لغز يقود إلى آخر. سيثبت فحص بطن ذلك الشيء نفعه...<hpage>المعنى وراء تأملاتك غامض كعادتك. هل تحدثني مباشرة يا سيدي؟<page>...ثقي بنفسك. وليثق كل منكما بالآخر. الحل دوما في متناول اليد..."
MAPPER_GENERIC_SHELLWOOD_REPEAT: "تستطيع مخلوقات هذه الغابة التنكر بين أغصانها الكثيرة. راقبي أي حركة غير متوقعة وكوني مستعدة للضرب."
LACE_ABYSS_LAKE_2: "يا عنكبوتتي العزيزة، ما أسعدني بزيارتك! الوحدة شديدة هنا في قاع العالم.<hpage>لا أستطيع مشاركتك مرحك يا طفلتي. فتمردك الصغير في الأعلى يتسبب الآن في انهيار هذه المملكة."
MAPPER_GENERIC_HUNTERSNEST_DEEP: "<hpage>تحياتي يا شاكرا. شعرت بأنني سأجدك في هذه الأنفاق الملتوية، فهي مليئة بآثار القتال.<page>بوشانكا! أحسنت الثقة بحدسك. إن المحاربين ذوي الأصداف الحمراء الذين شقوا هذه الطرق خصوم ممتازون حقا.<page>يسرني أن أقضي هنا وقتا طويلا أختبر نفسي أمام نصالهم ومصائدهم الماكرة، لكن علي الالتزام بمهمتي. وأنت كذلك!"
GARMOND_BLACK_THREAD_EXHAUSTED: "آه... آه... يا أختي. ما أفدح الثمن الذي ينتزعه منا هذا القتال الذي لا ينتهي! وحين يحل السلام أخيرا، سنعرف حقا كيف نقدره...<hpage>تحمل نفسك عبئا أكبر من اللازم يا سيدي.<hpage>ومع أنني أشاركك طموح تحرير هذه الأرض من لعنتها، أنصحك بأن تستريح، ولو مدة قصيرة.<page>نستريح نحن؟ وأنت يا أختي العزيزة تواصلين القتال بكل بسالة؟ آه... لا نستطيع.<page>ماذا ستظن بنا قريتنا القديمة إن تركنا واجبنا؟ لا، مهما كان ظنك، ما زالت في هذه الأصداف القديمة قوة تكفينا!"
LACE_ABYSS_LAKE_DIVE_1: "<hpage>يا طفلتي، أملك وسيلة النزول. فلنلتق مرة أخيرة، ولنخمد هذا الخراب الأسود الذي صنعناه."
HUNTER_FAN_JOURNAL_GIVEN: "<hpage>معرفة سكان أرض ما مسعى جدير بالعناء. ربما كنت أنضج مما تظنين يا نو.<page>ما! هذا المديح الشهي سيجعل نو تذبل! اذهبي الآن! اصطادي وافترسي، وابدئي تعلمنا!"
MAPPER_GENERIC_DOCKS: "يا طفلة حاملة الإبرة، ما رأيك في هذا البناء الضخم الذي يئن؟<hpage>يدهشني حجمه كله. إن لم يكن هذا سوى موقع تابع للقلعة في الأعلى، فلا بد أن عاصمتهم تفوق الوصف عظمة.<page>يوكالا... ربما. لا بد أنهم قدروا العمل المنجز هنا كثيرا، حتى بنوا صرحا بهذا الحجم في مكان شديد الخطورة."
MAPPER_ITEM_MARKER_C_NAME: "علامة الصيد"
MAPPER_GUARD_REPEAT_ACT3: "أسرعي لتهدئة أرضنا الباكية، يا هورنيت حاملة الإبرة. واعلمي أنني سأبقى هنا لأقف في وجه هذه الهياكل التي غشاها الظلام."
SHERMA_RESCUE_END_REPEAT: "سأحمل المؤن العلاجية إلى المستوطنة بأقصى سرعة، أيتها العذراء الحمراء.<page>لا تخافي علي. جميع رفاقي الحجاج يصلون من أجلي، ولذلك لن يصيبني أذى!"
SHERMA_CARETAKER_REPEAT: "مهمتي الآن أن أرعى من يبقون هنا، وأنت منهم. إن استطعت مساعدتك بأي طريقة، فأخبريني!"
GILLY_REMEET: "يا لها من صدمة! انكشف أمري مجددا بهذه السهولة! كفرخ صغير سيئ الحظ!<page>إن كنت ستجعلين تعقبي لعبة، فعلي أن أضاعف جهدي في التخفي!"
MAPPER_ITEM_MAP_PEAK_DESC: "القمة المسننة التي تشرف على فارلوم كلها. رياحها العاتية وبردها القارس يخترقان حتى أصلب صدفة."
SHERMA_CORAL_BENCH: "آه، ارتفع لنا المقعد المضيء! إن عطف فارلوم علينا نحن الحجاج لا ينفد!<page>استريحي أيتها العذراء الحمراء، ولا تخافي. مملكتنا ترعانا جميعا!"
SHERMA_BONEGATE_MEET_4: "ضمي صوتك إلى صوتي، أيتها العذراء الحمراء! سنغني، أنت وأنا وجرسي المحظوظ، حتى تفتح البوابة الكبرى!"
SHERMA_CORAL_WAKE_2: "همم؟ مرحبا! كنت أبحث عن مكان أريح فيه صدفتي المتعبة، فوجدت هذه المحطة المريحة!<hpage>هذه الأراضي خطرة. ظننت أن مكروها ربما أصابك.<page>مكروه؟ أيتها العذراء الحمراء، ثقي! لا يمكن أن يصيبنا مكروه في هذا الصعود المقدس! يكفينا أن نبقي أنظارنا مرفوعة.<page>أليس كل هذا مهيبا بحق؟ الدرجات الحجرية العظيمة، والرياح التي ترفعنا كأصوات جوقة، ووراء ذلك كله نهاية حجنا. القلعة العظيمة أخيرا!"
SHERMA_CORAL_WAKE_1: "<hpage>أيها الحاج الصغير، هل أنت نائم؟"
HUNTER_FAN_CORALDRILLERS_REPEAT: "لها ولأمثالها أصداف صخرية حمراء تحمي أجزاءها اللينة. وداخلها حلو جدا! لكن كسرها وفتحها صعب جدا، لذا من الأفضل الانتظار. الانتظار هو الأفضل دائما!"
MAPPER_SPAR_ACCEPT: "<hpage>بكل سرور يا شاكرا. على هذه الصخرة، فلنختبر أصدافنا."
GARMOND_BLACK_THREAD_FIRST: "سعدت بلقائك يا أختي. مع أن القلعة الوحشية قد سقطت أخيرا، لا تزال الأراضي التي رزحت تحتها تعاني!<page>تغلغلت الشرور التي ارتكبها ذلك المكان الملعون منذ زمن في أسس المملكة نفسها، وها هي تنهض الآن كداء أسود.<hpage>هذا الظلام لعنة أشد فتكا من الهوس... قوة من أعماق سحيقة ستلتهم الجميع إن أتيحت لها الفرصة.<page>همم... صدقت! وما دام الشر يجوب هذه الأراضي، فلن يستريح رمحنا القرني!"
SHERMA_BONEGATE_REPEAT: "يا بواااابة متيييينة، لا أطلب أن تنكسري أو تنحنييييين،<br>فقط افتحي قليلا لي، ولصديقتي الفارعة الطوووويلة!"
GREEN_PRINCE_VERDANIA_LAKE_MEET: "هذه المياه، عند حافة اليابسة... والمزار في الأعلى... فرارنا الخفي... ابتعادنا الوجيز عن الحكم...<page>لحظات كثيرة عشناها ببساطة... وفرح... وحرية..."
GARMOND_AID_REPEAT: "ما رأيك يا أختي؟ هل نتحد في قتال باسل؟"
SHERMA_RESCUE_END1: "آه أيتها العذراء الحمراء، آسف لأنني استدرجتك إلى خطر كهذا!<page>وتلك الحشرات المسكينة التي سحرها الخيط. لا يمكن لأي خطيئة أن تستحق مصيرا كهذا...<hpage>شفقتك في محلها، لكن لها وقت آخر أنسب. أما الآن فعليك أن تعتني بنفسك.<page>آه... نعم. علي أن أعيد هذه المؤن العلاجية إلى مستوطنة الحجاج في الأعلى. لقد انتظر إخوتي وأخواتي بما يكفي."
LACE_ABYSS_LAKE_DIVE_CURSED: "<hpage>الطفيلي المتلوي داخل صدفتي ينفر من الفراغ نفورا عنيفا. <hpage>رغم الحماية التي يمنحها إيفربلوم، ما زلت أشعر بتلك الجذور البائسة تمنعني من النزول.<hpage>إن كنت سأغوص وأقطع صلة هذه الأرض بلعنة الخيط الأسود، فعلي أولا أن أجد وسيلة لانتزاع الدخيل من داخلي."
GARMOND_CITADEL_REOFFER: "ينتظرنا أعداء كثيرون. هل نتبارز قبل أن نتابع؟"
HUNTER_FAN_SKULLKING_MEET: "<hpage>تحياتي يا نو. ابتعدت كثيرا عن مسكنك، ولم أتوقع لقاءك في هذه الأراضي المنخفضة.<page>أوه، مرحبا مجددا يا آنسة كبيرة! نعم، نو ليست الأسرع، لكنها تقطع مسافات بعيدة لتتبع رائحة المعارف.<page>وانظري ماذا وجدت نو! وحشا ضخما مشقوقا وممزقا! هناك الكثير لنتعلمه منه، لذا ستتذوق نو كل ما فيه على مهل."
MAPPER_ITEM_QUILL_DESC: "بهذه الريشة يمكنك إضافة أي مناطق جديدة تكتشفينها إلى الخرائط التي تملكينها. ننتزع هذا الريش من كائنات غولبيني التي تصطادها قبيلتي. وسيقانها المجوفة أداة مثالية لرسم الخرائط."
MAPPER_GENERIC_PEAK: "يا طفلة حاملة الإبرة، ما أبعد ما حملتنا إليه أسفارنا! يعض البرد هنا أصدافنا كأي نصل. تدفئي قرب فانوسي بينما أنادي. <hpage>فارلوم أرض ذات تقلبات قاسية. ولعل هذا، جزئيا، ما جعل الحجاج يولعون باختبار أنفسهم في مواجهتها بهذا الحماس.<page>ربما. حين لقيتهم أول مرة، لم أحترم كثيرا تلك الحشرات الضعيفة الملفوفة بالخرق. كانت أجبن من أن تحمل سلاحا!<page>لكن... دونداكو. أحيانا نتسرع في الحكم. فيهم قوة خفية، مع أن فهمها حقا يصعب علي."
SHERMA_CITADEL_SPA_GREET: "آه، ما أطيب ملامسة هذا الماء الدافئ لأطرافي المتعبة. إنه مريح كترنيمة، ها ها!<page>هل نتراشق بالماء في الحمام المقدس، أيتها العذراء الحمراء؟ يمكننا أن نغني معا كي نستعيد نشاطنا!"
GRINDLE_ITEM_ROSARY_STRING: "أتريدين مسابحك منظومة بإحكام وجمال؟ يسعد غريندل العجوز أن يفعل ذلك، إن سمحت له بأن ينشل لنفسه بضع حبات..."
SHERMA_ENCLAVE_MEET2: "ل-لا تحكمي علي بأنني شاك! إن القلعة مكان مقدس حقا، متألق وشاسع بما يفوق أعظم آمالي!<page>لكن... يثقل الصمت قاعاتها العظيمة، وأرى المعاناة في الظلال كلما أمعنت النظر.<page>الخوف والألم... لماذا سمح لهما بدخول فردوسنا؟ ألم يستحق إخوتي وأخواتي ثوابهم المقدس بعد؟"
MRMUSH_LOC1: "...سلاحان متقاطعان، نائمان طبعا، لكنهما على هيئة لم تري مثلها من قبل...<page>...المرور من الأسفل أمر، لكن السفر فوقه قد يتطلب بصرا من نوع آخر...<hpage>سيدي البشير... يصعب أن يكون لقاؤنا في هذه الأرض النائية مجرد مصادفة. إلا إن كنت قد تبعتني إلى هنا؟<page>...طريق يلتقي بنفسه نذير سوء حقا. ومن ينظرون جانبا يعرفون ذلك حق المعرفة...<page>"
GRINDLE_ITEM_LUCKY_DICE: "لدينا هنا كرتان دحروجتان صغيرتان لطيفتان. لا بد أن تجلبا الحظ في أي حملة نشل..."
MRMUSH_LOC3: "...العناصر لا تتآمر عليك. فلها رغباتها الخاصة...<page>...حين يرى المرء قمة شامخة، يميل بطبيعته إلى بدء التسلق...<page>...تلك الصغيرة التي تركت خلفك... حسمت قرارك إذن؟ رفيقة للرحلة..."
GREEN_PRINCE_VERDANIA_BOSS_2: "<hpage>أشعر بالذنب لغيابك يا سيدي، لكن اعلم أن النهاية كانت محتومة، وأن المصير كان ثابتا، سواء بقيت أم رحلت.<page>لا تحاولي مواساتي أيتها المحاربة... هذه الذكرى لي وحدي... ولن أقبل تدخلك الفظ فيها...<page>يا من تجرؤين على انتهاك حرمة هذه القاعة المقدسة، استعدي... لترينا وتعرفينا، نحن حكام فيردانيا، مجتمعين في أبهى صورنا..."
MAPPER_GENERIC_GREYMOOR_REPEAT: "إن اخترت الراحة هنا، فسأحرسك يا طفلة حاملة الإبرة. تتطلب هذه الخرائط عناية طويلة، ولا يزال نومي بعيدا."
SHERMA_BELLBEAST: "وحش، وحش، يا له من وحش ضخم بدين! قوي كصخرة عظيمة، أو كحجر على الأقل! فلنغن معا حتى تتحرر!<page>أوه! انظري أيتها الفتاة الحمراء، هذا المخلوق المسكين عالق تماما في قيود بيضاء! لا بد أنك تعرفين أغنية تفك هذا الالتصاق اللزج؟<hpage>يتطلب كسر هذه القيود قوة أعظم من الأغنية أيها الصغير. وفي حالتي الضعيفة هذه، لا أستطيع حتى أنا قطعها.<page>لا تقلقي إذن! إن احتجنا إلى شيء، فسيأتي به الطريق إلينا!"
MAPPER_ITEM_PIN_BELLWAY_NAME: "دبابيس ممر الأجراس"
SPRINTMASTER_EXITED_RETURN: "أيتها الحشرة الرشيقة! أهجرت السباق؟ لا بد أنه مجرد خطأ؟<page>في السعي وراء السرعة، قد يضيع كل صواب وتذروه الريح.<page>يبدو على الأقل أنك تداركت زلتك. ولا شك أنك متحمسة الآن؟<page>علينا مواصلة العدو! فلننطلق معا كالسهم!"
MAPPER_ITEM_PIN_BENCH_NAME: "دبابيس المقاعد"
MAPPER_GENERIC_DUSTPENS: "يا طفلة حاملة الإبرة، هذه دروب بائدة لا تليق بمحاربتين مثلنا.<page>فيها قتال ممتع ضد وحوش الصراصير وحراسها، لكن الهواء مريض والماء يعج بالطفيليات.<hpage>هذه البيئة قاسية حقا، ومع ذلك يبدو أن الحياة تتكيف مع مصاعب كثيرة. أتظنين أن معلمتك سلكت هذه الدروب؟<page>لم أظن ذلك في البداية، لكنني بعد بحث أدق وجدت شذرات أثر يلتوي عبر هذه الأنقاض النتنة.<page>لعلها رأت هنا ما لم أره؟ فكثيرا ما تكون حواسها نافذة حيث تعجز حواسي."
GARMOND_AID_MEET_BEAST: "تمهلي يا أختاه! يجوب هذه الأرض وحش عظيم، ينقض ويصرخ كطاغية سيئ الطباع!<page>كان زازا يتتبع رائحة المخلوق، وأنا واثق الآن أننا أوشكنا على بلوغه! اقتربنا حتى انتصبت شواربي!<page>وحش كهذا طريدة تليق بالشجعان، أليس كذلك؟ فما رأيك، أنصطاده معا؟"
MAPPER_ITEM_PIN_SHOP_DESC: "لدى كثير من حشرات فارلوم معدات وأغراض مفيدة للمقايضة. ومن الحكمة أن تتبعي مواقعها بهذا الدبوس.<br><br>ستحدد هذه الدبابيس مواقع التجار على خريطتك."
GRINDLE_ITEM_THIEF_CLAW: "هذه أداة العمل الأساسية. اقذفي إبرتك الكبيرة وانتزعي اللامعات مباشرة من صدفة هدفك!"
MAPPER_ITEM_MAP_MOSSGROTTO_NAME: "خريطة أراضي الطحلب"
MRMUSH_LOC7_B: "...أوه. يا ابنة الدودة. لا عجب أنك من تلقاني هنا.<page>هل تتبعينني؟ أم تستدعينني؟ صحيح أنني ما كنت لأقصد الأراضي السفلى لولا أفعالك العظيمة فيها.<page>لكن بعدما جبت أرجاءها، رأيت مناظر لا مثيل لها... بحيرات ملتهبة، وغابات متشابكة، وكهوفا ابتلعتها الرمال والصقيع...<page>كلها عجائب مذهلة، لكن بعدما استولى عليها الفراغ، يبدو أننا قد نكون آخر من يحمل ذكرياتها.<hpage>لا يمكنني السماح بذلك يا بشيرة. سأعمل الآن لإنقاذ ذلك المكان، من أجلي ومن أجل الحشرات التي لا تزال حية فيه.<hpage>بصفتك من شهدت الكثير، أخبريني ببساطة: أتظنين أن جهودي عبث؟<page>أنا؟ يمكنك أن تسألي بالطبع، لكنني لا أملك جوابا نافعا. لا يشغلني ما ستؤول إليه الأمور، فرؤيتي دائما يحجبها الحاضر.<page>لا شيء سوى الرحلة... والآن. تلك غايتي، وهي أبعد ما يستطيع بصري بلوغه.<page>إن كان بوسع أحد غيري فهم تلك الحال يا ابنة الدودة، فأظن أنك أنت... <page>لكن ربما ليس بعد، وليس في هذا الحاضر، أليس كذلك؟ ربما في مستقبل بعيد، حين تستدعيني أفعالك من جديد؟<page>لكن حان منذ زمن أن أغادر هذه الكهوف المرتجفة مسرعا. قد تكون دروبنا طويلة ومتعرجة، لكنني آمل أن تعرفي أنت أيضا أفراح الطريق الكثيرة..."
GARMOND_AID_REFUSE: "أتقاتلين وحدك يا أختاه؟ ستكونين عصية على الهزيمة وأنا إلى جانبك! وزازا أيضا! ما عليك إلا أن تطلبي، وسيكون رمحنا القرني رهن إشارتك."
MRMUSH_LOC7_A: "...هل يدركون أن ذلك لن يكون سوى البداية؟ إن شقوا طريقهم إلى الحرية، فسيكون عليهم أن يجدوا سبيلا جديدا..."
SHERMA_CARETAKER_REPEAT_FINAL: "ترافقك آمالي أيتها الفتاة الحمراء. ستتبعك إلى أعمق الظلمات، وما بعدها!"
MAPPER_ITEM_MAP_WILDS_DESC: "تعشش ذوات الأصداف الحمراء الشرسة في أنحاء هذه الكهوف الواسعة. والقتال ضدها عنيف جدا. ما أروع محاربي فارلوم."
MAPPER_ITEM_MAP_DOCKS_NAME: "خريطة الأرصفة العميقة"
LACE_ABYSS_LAKE_DIVE_3: "<hpage>حتى لو لم يبق منك سوى ظلك، فسيفي سيقتله لتحريرك من قبضة أمك.<page>فلماذا تترددين حتى الآن؟ هل استولى الرعب فجأة على قلبك القاسي؟<page>اخوضي الغمرة الأخيرة أيتها العنكبوت. انضمي إلينا في قصري الغارق، ودعي العدم يبتلعنا جميعا.<hpage>قد يبتلعك العدم أيتها الطفلة. أما حياتي فلن أضحي بها.<hpage>نجوت من غضب أرضك، وتحملت أشواكها ونصالها، ورأيت العجائب الكامنة خلف أخطارها.<hpage>لكنني سأبقى دائما ابنة هالونيست. أما الفراغ الكامن تحت كل شيء، فلن أخشى ظلمته بعد الآن..."
GRINDLE_BONEFOREST_REFUSE: "أووه! أطماعة أنت؟ وقاسية على حشرات النشل الصغيرة المسكينة مثلنا؟ لن تنجي في الخارج دون أسرارنا، لا، لا!"
SPRINTMASTER_OFFER_3: "كان سباقنا الأخير رائعا، أليس كذلك؟ لكنني أدرك الآن أن التحدي الذي وضعته كان سهلا جدا على حشرة مفعمة بالنشاط مثلك!<page>استعددت للسباق وحده، لكنك وصلت تحملين القدر! وقد تتحقق أمنيتي أخيرا على يديك، وتتحطم حواجز السرعة تماما!<page>هل أنت مستعدة أيتها الحشرة الرشيقة؟ لقد حان الوقت. هذا هو الاختبار الأخير للسريعين والخفاف!"
HUNTER_FAN_JOURNAL_COMPLETE_REPEAT: "اصطادت الآنسة الكبيرة كثيرا، ولذلك ترى نو أن موعد خروجها قد اقترب. أبقي عينيك يقظتين، فسيكون لقاؤنا في البراري ممتعا!"
GRINDLE_SLAB_EARLY_NOTMET: "أوهوهو! يبدو أنك عالقة قليلا! يا للأسف!<hpage>أأنت أيضا سجين هنا أيها الصغير؟ إن وحدنا جهودنا، فقد يصبح الهرب أسهل بكثير.<page>هوهو، أتمزحين؟ لا حلفاء في السجن! ارتطمي بالجدران هناك كما تشائين، بينما أذهب أنا لأتشمم الأشياء الثمينة!"
HUNTER_FAN_SCROLL_INSPECT: "مخطوطة تفصل روائح حشرات فارلوم ووحوشها المختلفة ومذاقاتها."
HUNTER_FAN_INTRO_ACT3: "آنستي الكبيرة! خشيت نو أن تكون ارتجاجات العالم المروعة أو الخيوط السوداء اللزجة قد خطفتك منها!<hpage>نجوت يا نو، وسأواصل القتال ما بقيت لي قوة.<hpage>صارت المملكة شديدة الخطورة، لكن هذا البيت الدافئ لا يزال آمنا بعض الشيء. أقترح أن تبقي هنا الآن.<page>بالطبع! ستبقى نو في الداخل. فقد أفسد الإحساس المقزز بتلك الخيوط الملتوية متعة رحلاتها.<page>لكن أنت يا آنستي الكبيرة... أليس الآن أنسب وقت لإكمال سجلنا تماما؟<page>لا بد أن ارتجاجات العالم أخرجت مخلوقات كثيرة من مخابئها! فانطلقي واصطاديها، وأري نو الحلوة ما تتعلمينه!"
GARMOND_CITADEL_REFUSE: "لماذا ترفضين منازلة صغيرة يا أختاه؟ لا شك أنها ستعدنا جيدا للمحن المقبلة!<hpage>لا ريب أن منازلتنا ستكون مفيدة، لكنني للأسف لا أملك وقتا لهذا العبث. وداعا أيها السيدان."
SNAILS_ACT3_MEET_PT1: "<hpage>يا لكم من جبناء. تختبئون هنا، فيما تتسببون في هلاك أرضكم."
MAPPER_MAGGOTTED: "كا، فا! تعج صدفتك بتلك اليرقات المقززة. كان سباحتك في بركها المريضة قرارا أحمق.<hpage>لم أرغب في هذا قط يا شاكرا. وأرى الآن أن من الأفضل أن تبقي على مسافة ذراع مني.<hpage>لن أتحمل هذه العدوى طويلا. وسرعان ما سأتطهر منها، بالحرير أو بالراحة."
SPRINTMASTER_WRONG_GATE: "أيتها الحشرة الرشيقة! يبدو أنك ضللت الطريق في المضمار. لا بد أنه مجرد خطأ؟ ويبدو أنك تداركت زلتك بالفعل.<page>أنت متحمسة للعدو مجددا، نعم؟ فلننطلق معا كالسهم!"
MRMUSH_LOC6_C: ""
MRMUSH_LOC6_B: ""
MRMUSH_LOC6_A: "...يمكن للمرء زيارة الماضي، لكن الذكريات تصبح عندئذ متناقضة...<page>...حين يدوي النداء من جديد، هل ستدعين أفعالك السابقة تحجب رؤيتك؟<page>...بالمخلب، وبالصوت... ينهض التاريخ دائما للقائنا..."
HUNTER_FAN_JOURNAL_DECLINED: "أووه، يا للقسوة! أترفضين نو المسكينة أيتها الآنسة الكبيرة؟ كم أنت لاذعة!<page>فكري في كل المعارف الشهية التي يمكننا استخراجها من المخلوقات التي تعيش هنا!"
MAPPER_ITEM_MAP_JUDGESTEPS_NAME: "خريطة الدرجات المحترقة"
SPRINTMASTER_HERO_WIN_AFTER_WISH: "لكن انتظري! قبل أن ترحلي، تستحق مهارتك الاستثنائية مكافأة تضاهيها!<page>هذه الشظية اللامعة من قناع قديم لك! خذيها واعتزي بها، واعلمي أن شكري سيبقى لك إلى الأبد."
GRINDLE_ITEM_CRESTSOCKET: "هذه لامعة لامعة جميلة، أليست كذلك؟ يحب أولئك العجائز القذرون الرثون حملها معهم، ونحن نحب نشلها منهم كلما استطعنا! أوهوهو!"
HUNTER_FAN_JOURNAL_GIVE: "أوووه، كم تسعدين نو! اصطادي مخلوقات هذه الأرض وسجليها في هذه المخطوطة!"
MAPPER_GENERIC_CORALCAVERNS: "<hpage>تحية طيبة يا شاكرا، بين هذه الأكوام التي ابتلعتها القشرة والرمال.<hpage>عادت هذه الكهوف إلى الطبيعة، لكنني أرى آثار مبان جريئة مدفونة في أرجائها.<page>ترقد أصداف بناتها في برج بالأعلى. ويبدو أنهم كانوا قبيلة عظيمة، ومقاتلين أشداء بلا شك. لكنهم الآن مجرد قشور متصلبة.<page>تحسري يا طفلة حاملة الإبرة! جئنا إلى العالم بعد فوات زمن منازلة مخالبهم."
SHERMA_PILGRIMSREST_MEET: "لا تيأسي يا صديييييييقتي الحاجة،<br>ارفعي بصرك وعلي صوتك!<br>لا تخافي أيتها الحاجة الصاااااادقة،<br>فالإيمان اختيار سعيد!<page>مرحبا! أليست هذه الحقول رائعة؟ وفوقنا المستنقعات الوفيرة، حيث يستطيع كل حاج أن يملأ بطنه!<hpage>هذه الحقول الحارة عجيبة حقا، لكن الصيادين يجوبون العشب الطويل. ولن يؤدي عزفك على آلتك إلا إلى تنبيههم إلى وجودك.<page>إذن سأنبههم! فحيث يجتمع كثيرون، تغنى أغان عظيمة!"
GRINDLE_CITADEL_ENCLAVE: "<hpage>أقام بعض الحجاج مخيما في مكان أكثر أمنا من هنا، عاليا على الجانب الآخر من القلعة.<hpage>وسيسمحون لك حتما بالبقاء هناك، إن استطعت الامتناع عن إزعاجهم.<page>م-خي-م، إذن؟ يبدو مكانا مبهجا لغريندل العجوز! ربما نتشمم ما حوله لاحقا.<page>هذه نصيحة جيدة، وقد قدمتها لنا مجانا! أوهوهو، رأسك مليء بالوحل!"
DICE_PILGRIM_HORNETDEPLETED: "حسنا، حسنا! يبدو أنني ربحت آخر ما لديك من مسابح. يقال إن الحظ من نصيب المؤمنين، فلا بد أنني مؤمن جدا.<page>لكن إن وجدت مزيدا من المسابح، فسيسرني كثيرا أن ألاعبك مجددا."
MAPPER_ITEM_MARKER_E_NAME: "علامة برونزية"
HUNTER_FAN_JOURNAL_GIVEN_ACT3: "<hpage>قتلت بالفعل كثيرا من سكان هذه الأرض، لكنني أوافقك على أن توثيق هذه المخلوقات عمل جدير بالاهتمام.<hpage>إن بقي لدي وقت، فسأفعل ما تريدين.<page>يا للروعة! كم يسعد هذا نو! انطلقي الآن! اصطادي وافترسي، ولنبدأ التعلم!"
GRINDLE_SAVED1: "هوهو، تحررنا أخيرا! حبسونا هنا أطول مما ينبغي. إنه مكان بغيض لحبس حشرة نشل صغيرة مسكينة مثل غريندل.<page>مهلا، تفوح منك رائحة نفيسة! هل لديك جيوب تحت عباءتك؟ هل تخفين فيها أشياء ثمينة كي أسرقها؟<hpage>احذر جشعك أيها اللص. ستموت قبل أن يبلغ مخلبك عباءتي.<page>أوهوهو! لا بأس إذن أيتها المتسلطة. توجد أشياء شهية كثيرة متناثرة لنا هنا في الأسفل. نشم رائحتها!"
MAPPER_ITEM_MAP_SHELLWOOD_NAME: "خريطة غابة الأصداف"
MAPPER_MASTER_AFTER: "<hpage>وجدنا معلمتك يا شاكرا، وانتهت مهمتك في هذه الأراضي. فهل ستعودين الآن إلى قبيلتك؟<page>لن أعود يا هورنيت حاملة الإبرة... لا أستطيع. حين يغادر أحدنا سهول أعشاش قبيلتي، لا تسلك رحلته إلا في اتجاه واحد.<page>هذه طريقتنا دائما، رحيلنا الطويل، لمن يبقون حتى يسعى العمر إلى انتزاع أصدافهم، ولمن يختارون إرسالهم في ذلك الرحيل، وهم أقل عددا.<page>لكن هذه الأراضي، فارلوم... كانت سهول أعشاشي تبدو لي شاسعة يوما، أما الآن فصارت صغيرة. مكانا للولادة والنمو، لكنه أضيق من أن تعيش فيه حشرة حياة كاملة."
GILLY_CARMELITA_CORPSE: "هذه النملة العملاقة العجوز... يبدو أن موتها حديث، لكن وجودها هنا... <page>أكانت هي؟ أيعقل ذلك؟ أكانت القوة التي أبقت هذه الكهوف حية؟ إن صح ذلك، فماذا سيحدث الآن؟<hpage>ستذبل وتتلاشى... وقد يحزنك أن تعرف أن إبرتي هي التي أنهت حياتها.<page>أنت يا آنستي؟ لكن لماذا؟ لماذا تدمرين شيئا بهذه الأهمية؟<hpage>يصعب شرح الأمر ببساطة... كنا بحاجة إلى ما تبقى من قوتها لتحرير فارلوم من خطر خيوطها السوداء. كان فعلا وحشيا بلا شك، لكن سببه كان عادلا.<hpage>واعلم أن هذه الكهوف قد تجد مع الوقت فرصة للنمو والازدهار من جديد، لكن ذلك الميلاد نفسه مهمة هائلة... أطول من حياة واحدة، بل من حيوات كثيرة.<hpage>ولكي تنجح تلك المهمة، سيكون على حشرات مثلك أن تزرع البذور الأولى."
SNAILS_ACT3_HORNET_RITUAL_CURSED: "<page=M>تمهل أيها العجوز! ذلك الدخيل الذي يتلوى داخل صدفتك... <page=S>لن تنجح شعيرتنا ما دام ذلك المخلوق القاسي موجودا. فسنعبث بذكرياته بقدر ما نعبث بذكرياتك.<hpage>إذن خلصوني من هذه العلة. لا بد أنكم تملكون المهارة اللازمة؟<page=S>ليس لهذا! قوتنا كلها روحية، أما ذلك الشيء فمادي بحت. ستحتاج إلى أدوات علاج أكثر تقليدية.<page=B>ابحث عن المنفية من قلب الجرس يا يارنابي الصغير. آخر ما سمعته أنهم طردوها إلى تلك المستنقعات الغارقة.<page=B>ستملك الأدوات اللازمة للمهمة، والدهاء الذي أبقاها حية حتى الآن."
MAPPER_ITEM_PIN_BENCH_DESC: "عند السفر في أراض معادية، من المهم تذكر الأماكن الآمنة للتخييم.<br><br>ستحدد هذه الدبابيس المقاعد وغيرها من مواضع الراحة على خريطتك."
HUNTER_FAN_SPLINTERQUEEN_REPEAT: "تتمهل نو مع مخلوقاتها، فلا بد أن تفحصها عن كثب. أذرع غليظة، وشعر متقشر، وعيون رقيقة... ستفحص نو كل شيء!"
SHERMA_CARETAKER_FINAL_SONG: "أيتها الفتاة القوية المتشحة بالأحمر،<br>احم صدفتها وبارك خيطها!<br>إنها تقاتل من أجلنا حتى النهاية،<br>فاحم صديييقتي الأعز!"
MAPPER_GENERIC_CORALCAVERNS_REPEAT: "إن سنحت لك الفرصة، فزوري البرج في الأعلى. إنه مشهد مذهل، فلم تغطه القشرة المنتشرة في هذه الكهوف، بل تشكل بالكامل من مادتها. <page>إن استطاعت قبيلة هذا المكان القديمة توجيه نموها إلى هذا الحد العظيم... فقد امتلكت قوة تضاهي حتى قوة القلعة."
MAPPER_MEET_BONE_1D: "هؤلاء الحجاج الغرباء المتثاقلون... كانوا وادعين بما يكفي في المخيم بالأسفل، لكنهم هنا في الأعلى فقدوا صوابهم فيما يبدو. يصرخون في وجه الظلام ويهاجمون رفاق سفرهم.<page>ياكانيش! أبقي سلاحك مسلولا ووجهتك ثابتة! الطريق أمامك متعرج، والضياع فيه لا يجلب سوى الموت.<page>أنا ملاحة في قبيلتي، وقد كنت أرسم خرائط لهذه الأراضي. يمكنني مقايضتك بها وببعض المؤن إن شئت."
HUNTER_FAN_RESULT_2: "يا للروعة! اصطدت كثيرا، وأصبح في سجلاتنا عدد هائل من المخلوقات الصغيرة الشهية!<page>يسيل لعاب نو من فرط هذه المعارف! واصلي العمل من فضلك أيتها الآنسة الكبيرة!"
MAPPER_MEET_BONE_1B: "هكذا يحيي المحاربون بعضهم بعضا في أرضي. فرغم أنك طفلة لم تخرجي من بيضتك إلا منذ قليل، فأنت محاربة أيضا. وقفتك وسلاحك وحركاتك، كلها تعلن ذلك."
GRINDLE_SLAB_EARLY: "أوهوهو! يبدو أنك عالقة قليلا! يا للأسف!<hpage>نلتقي مجددا أيها اللص الصغير. هل تعرف هذا المكان؟<hpage>إن وحدنا جهودنا، فقد يصبح هربنا أسهل بكثير.<page>هوهو، أتمزحين؟ لا حلفاء في السجن! ارتطمي بالجدران هناك كما تشائين، بينما أذهب أنا لأتشمم الأشياء الثمينة!"
GREENPRINCE_SIT_REPEAT: "<hpage>رحلة آمنة أيتها الحشرة الطويلة.<page>هذه فارلوم أيتها المحاربة. الأمان فيها خرافة."
MAPPER_ITEM_TUBE_PIN_NAME: "دبابيس فنتريكا"
SETH_FESTIVAL_MEET: "<hpage>تحياتي يا سيث. رؤيتك هنا بين هذه الاحتفالات مفاجأة سارة.<page>مرحبا، مرحبا! نعم، طال تجوالي، وبدأت أخشى أن ألقى نهايتي في تلك المستنقعات اللزجة بالأسفل.<page>كم حالفني الحظ حين عثرت مصادفة على موطن هؤلاء المحتفلين الودودين!<page>قالوا إن بوسعي أن أكون برغوثا هنا معهم، فوافقت بالطبع. يبدو مكانا مناسبا لاتخاذه وطنا، لبعض الوقت على الأقل.<page>والآن لا ينقصني سوى أن ينبت لي بعض الفرو وتخرج لي أجنحة، أليس كذلك؟ ها ها!"
MAPPER_ITEM_MAP_SHADOW_DESC: "مستنقعات ولدت في ظل القلعة. وتشير الدلائل إلى أن مياهها كانت صافية يوما."
MAPPER_ITEM_MAP_SHELLWOOD_DESC: "طرق متشابكة تخنقها العليق والجذور. وكثيرا ما تكون النباتات بفتك المخلوقات التي تتخذ هذا المكان موطنا."
SPRINTMASTER_EXTRA_REPEAT: "ما رأيك أيتها الحشرة الرشيقة؟ لا يزال اختبار التحمل ينتظرك حين تكونين مستعدة! فلنمض سريعا!"
GARMOND_BLACK_THREAD_REPEAT: "سيقاتل زازا وأنا عبر هذه الأراضي الملعونة حتى نقضي على آخر وحش لوت السواد جسده!"
SNAILS_ACT3_HORNET_RITUAL_CURSED_REPEAT: "<page=M>أسرع أيها العجوز. لا يمكن أن تبدأ الشعيرة ما دام ذلك الجذر المتلوي يعيش في جسدك.<page=B>ابحث عن المنفية من قلب الجرس يا يارنابي الصغير. آخر ما سمعته أنهم طردوها إلى تلك المستنقعات الغارقة.<page=B>ستملك الأدوات اللازمة للمهمة، والدهاء الذي أبقاها حية حتى الآن."
GILLY_HUNTERCAMP: "ذوات الأصداف الحمراء تختبئ في الحقول وتترصد الوحوش العظمية. إنها، على نحو ما، جزء من الحياة المزدهرة هنا.<page>حتى وهي مسكونة، يبدو أنها تفقد من ذواتها أقل مما يفقد غيرها... أي مرساة تمنحها القدرة على الاحتفاظ بهذه القوة؟"
SHERMA_BONEGATE_MEET_2a: "أوه، بالطبع أغني! أنا شيرما، حاج مثلك تماما. أسمع نداء القلعة العظيمة مثل كل نفس مؤمنة."
GRINDLE_TRAPPED1: "مهلا! مهللللا! أنت هناك! أخرجنا من هنا! منذ متى تستحق سرقة بسيطة حكما بالسجن المؤبد؟"
SHERMA_CARETAKER_TALK1: "فقدت قلعتنا العظيمة صوتها، وها هي الخيوط السوداء تنهض لتمزق صدفتها. أخشى أن فارلوم المقدسة تحتضر حقا...<page>لكنني لا أزال مفعما بالأمل أيتها الفتاة الحمراء! قد تسقط الممالك، لكن الحياة تبقى، وبوسعنا نحن الحشرات بناء أراضينا من جديد!<hpage>أشاركك أملك يا شيرما. لكن تذكر أن كل ما يبنى بعد ذلك لن يكون ملكا للماضي، بل لك أنت.<hpage>غرائزك قوية، فدعها ترشدك بدلا من أي تقديس لجثة مملكة.<page>أوه، كم تغدقين علي من المديح! لكن رفاقي هم من سيرشدونني، أولئك الذين لا تزال أصواتهم تغني حتى في زمن الخراب هذا..."
GARMOND_BLACK_THREAD: "هاااه... سعدت بلقائك يا أختاه. ليست مطاردة هذه الوحوش التي لواها السواد مهمة هينة، أليس كذلك؟ ومع ذلك، يجب ألا نرتاح! ليس ما دامت صرخات الأبرياء تتردد في كل أرجاء المملكة!"
GRINDLE_ITEM_THIEF_CHARM: "توسم بعلامة النشال! واجمع مزيدا من المسابح من أعدائك المهزومين. لكن انتبه أثناء النشل، كيلا تفقد بعض مسابحك..."
LACE_CITADEL_MEET_BATTLE_SKIPPED: "ما هذا؟ وصلت العنكبوت أخيرا، لتقف مرتجفة أمام قلعتنا المذهلة.<hpage>أيتها الطفلة الشاحبة، أعدت للسخرية وحدها؟ لم تثبت أراضيك بعد أنها ند لي، ولن تختلف هذه القلعة النائمة عنها.<page>عزيزتي العنكبوت، لماذا تصرين على هذا... التفاؤل المزعج؟ لا يمكنك تصور القوة التي تنتظر في الأعلى، تلك التي ستطفئ أملك بنظرة عابرة.<hpage>أيتها الطفلة الحمقاء. أما زلت تظنين أنني لا أرى حقيقة مولاتك، بعدما بلغت هذا الحد؟<hpage>عظمة هذه الأرض، وتفاني حشراتها، واللعنة التي تحل بها. العلامات واضحة.<hpage>مملكتك واقعة تحت سيطرة مخلوقة تتجاوز الحشرات، واحدة من تلك الطبقة العليا.<hpage>أيا كانت غايتها من حريري وصدفتي، فستجد أنني شديدة التعلق بهما."
HUNTER_FAN_REPEAT: "التعلم من هذا العدد الكبير من المخلوقات عمل شاق، لكنه يبعث في نو رضا عميقا. والآن انطلقي للصيد والافتراس، أيتها الآنسة البالغة!"
GRINDLE_SHOP_INTRO_ACT3: "مرحبا أيتها الحشرة الأنيقة! كيف حالك والعالم كله يئن ويتشقق من حولنا؟ لا بد أنك في أمس الحاجة إلى بعض المؤن! هيه هيه!<hpage>تبدو مبتهجا أيها اللص. ألا يقلقك هذا التمزق العظيم الذي يصيب المملكة؟<page>هيه، نهاية العالم لا تزعج غريندل العجوز. سنجد عالما آخر ننهبه، أليس كذلك؟"
SNAILS_ACT3_HORNET_MEMORY_REOFFER: "<page=M>نسجنا تعاويذنا وأعددنا أجزاءنا. متى ما كنت مستعدة، استلقي على المنصة ولنبدأ.<page=M>من الأفضل ألا تتأخري. لم يبق لفارلوم وقت طويل، ولن تظل تلك القلوب نابضة إلى الأبد."
GREEN_PRINCE_CLOVER_MEET_2: "لا مزيد من الكلام أيتها المحاربة. دعيني أقضي هذه اللحظة الأخيرة في إحياء الذكرى.<hpage>كما تشاء يا سيدي. لن أزعجك بعد الآن."
SPRINTMASTER_DECLINE: "<hpage>ربما في وقت آخر يا سيدي. لا يمكنني تجاهل مهامي بسهولة.<page>إذن سأواصل التدريب استعدادا لذلك اللقاء القادم!<page>ما دمنا قد التقينا، فالمنافسة بيننا حتمية. القدر يدعونا إليها!"
HUNTER_FAN_CORALDRILLERS_MEET: "مرحبا أيتها الآنسة البالغة! هل جئت لتتفقدي مخلوقات الصخور الحمراء مثل نو؟ وجدنا واحدا ضخما جدا. طازج، لكن ليس أكثر مما ينبغي!<hpage>هاجمني وحشان هنا، وشقا طريقهما في الصخر بصدفتيهما الحلزونيتين. قضيت على هذا، وفر الآخر.<page>أوه، حقا؟ تتمنى نو لو ظفرت بالاثنين! كان بوسعها أن تتعلم الكثير. يا لسوء الحظ، فاتتها وليمة كبيرة من المعرفة!"
GARMOND_BLACK_THREAD_EXHAUSTED_REPEAT: "يجب أن نواصل... فما زال أمامنا الكثير... لنفعله..."
MAPPER_GENERIC_DOCKS_REPEAT: "أرى جهدا كثيرا يضيع في هذه الأرصفة. كل شيء فيها مفرط في الزخرفة. حقا إن أساليب الآخرين غريبة..."
SPRINTMASTER_OFFER_2: "أيتها الحشرة الرشيقة! كلانا يعلم أن سباقنا السابق لم يكن سوى إحماء، صحيح؟ مجرد اختبار صغير استعدادا للمنافسة الحقيقية! هوي هوي!<page>وها قد حان موعدها! مسار جديد يليق بمهارتك ومهارتي، ولم يعد مجرد اختبار!<page>واجهي التحدي وسرعتي الكاملة. لنتجاوز حدودنا ونر ما ينتظرنا وراءها!"
MAPPER_ITEM_MARKER_B_DESC: "يمكنك استخدام هذه لتحديد الأماكن المهمة أو وضع تذكيرات على خريطتك.<br><br>وأنا غالبا ما أحدد بها مواقع الخصوم الجديرين."
SPRINTMASTER_ALREADY_ACCEPTED: "هوي هوي! ها قد ظهرت منافسة رشيقة. أخيرا! أخيرا!<hpage>أثار اهتمامي التحدي الذي نشرته على لوحة الأمنيات في مستوطنة الأجراس يا سيدي، لكنني بعد وصولي أتساءل عن سبب اختيارك لهذا المكان.<hpage>إن كنت تبحث عن منافسين، فاختر مكانا أقل بعدا. من النادر أن تسافر أي حشرة إلى كهف بهذه العزلة.<page>ربما كنت محقة. لكن بعد اكتشافه، هل يوجد مكان أكمل منه؟ هذا الجسد العظمي العملاق بعيد عن آلام فارلوم.<page>هنا يمكننا أن نختبر سرعتنا وأصدافنا الانسيابية بحرية. هنا نستطيع أن نتسابق!<page>لا بد أنك متلهفة لبدء المهمة أيتها المنافسة. حققي أمنيتي! ولنكتشف حدودنا معا!"
HUNTER_FAN_ZAPNEST_SLAP2: "آآآه... كادت نو تبلغها... كادت تتذوقها."
GILLY_ACT3: "ها! أترقبينها أنت أيضا أيتها الصيادة؟ ذوات الأصداف الحمراء كثيرة هنا، تجوب هذه السهول العشبية الشاسعة وتطارد آخر وحوشها العظمية.<page>يبدو هذا النمو الكثيف أعظم مما في الكهوف السفلى. هل زحفنا حتى اقتربنا من مصدر غذائها؟<page>يجب أن أكتشف سرها! وسأفعل! تحقيقا لأمنية أبي، وأملا في أن تجد أراضينا المحتضرة وسيلة للبقاء.<hpage>توخ الحذر يا صغيري، أرجوك. فقد بلغت هنا صميم موطن النمل.<hpage>قد تجد اكتشافات تستحق العناء، لكن خطأ واحدا سيضع نهاية حادة لصدفتك."
SHERMA_MEET_OPENED: "مرحبا! هل رأيت أيتها العذراء الحمراء؟ سمعت البوابة الكبرى أغنيتي، ومن فرط كرمها الأزلي العريق فتحت لنا الطريق إلى الأمام!<page>ما أوفر حظنا إذ التقينا في هذه اللحظة! يمكننا الانطلاق معا على الطريق العظيم!<page>أو ربما أبقى هنا قليلا. أريد أن أنشد أغنية شكر لهذه البوابة النبيلة!"
MAPPER_MEET_BONE_2: "توهب الأسماء في هذه الأراضي بلا تحفظ، أليس كذلك؟ أنا شاكرا، حاملة الحلقات. إن تداخلت رحلات صيدنا مجددا، فستكون لدي خرائط جديدة لأقايضك بها.<page>حتى ذلك الحين، وداعا يا طفلة حاملة الإبرة."
SHERMA_ENCLAVE_HEALING: "هذا المكان مقدس، نعم... لكنني قلق على الحجاج أمثالنا وما يقاسونه. كم منهم مصاب أو منهك!<hpage>لن تشفيهم شكوكك ومخاوفك يا صغيري.<hpage>إن أردت مساعدة رفاقك، فابدأ بتضميد جراحهم. تكفي الخرق البسيطة المنتشرة حول المستوطنة لتكون ضمادات.<page>إنها فكرة ممتازة أيتها العذراء الحمراء! كنت أظن عادة أن أغنية ستكفي، لكن... نعم، لا بد من عمل مباشر.<page>وستوفر القلعة نفسها المواد! الحمد لهذا المكان الأقدس بين الأماكن المقدسة!"
SHERMA_ENCLAVE_REPEAT: "لا تخافوا يا إخوتي وأخواتي! إن عملنا بجد وتمسكنا بإيماننا، فستوفر لنا القلعة ما نحتاج إليه... لا شك لدي!"
SNAILS_ACT3_DEEP_MEMORY3: "<page=M>يمكننا أن نطلعك على مواقع القلوب التي تبحثين عنها، قدر ما نعلم.<page=M>سنحتاج إلى ثلاثة منها لنصنع تعويذتنا ونستخرج من حريرك ذكرى واضحة للزهرة.<page=S>أحضري لنا القلوب أيتها العتيقة. اجعليها تنبض بشدة للمرة الأخيرة. شاهدي بنفسك قوة أرض الحشرات هذه التي طواها النسيان، قبل أن نحرق تلك الذكريات في سبيل إنقاذها."
MAPPER_ITEM_MARKER_B_NAME: "علامة الحلقات"
GILLY_CARMELITA_CORPSE_LAST_HEART: "هذه النملة العجوز العملاقة... يبدو موتها حديثا، لكن وجودها هنا... <page>أكانت هي؟ أيعقل ذلك؟ أهي القوة التي أبقت هذه الكهوف حية؟ إن صح ذلك، فماذا سيحدث الآن؟<hpage>ستذبل وتتلاشى... ويؤسفني أن تعلمي أن إبرتي هي التي أنهت حياتها.<page>أنت أيتها الآنسة؟ لكن لماذا؟ لماذا تدمرين شيئا بهذه الأهمية؟<hpage>يصعب شرح الأمر ببساطة... كان لا بد من اختبار يثبت قوتي قبل تحد أعظم سيأتي قريبا.<hpage>اعلمي أن هذه الكهوف قد تحظى يوما بفرصة للنمو من جديد، بل والازدهار، لكن ذلك الميلاد الجديد مهمة هائلة في حد ذاته... تتطلب عمرا، بل أعمارا كثيرة.<hpage>ولكي تنجح تلك المهمة، سيكون على حشرات مثلك أن تزرع البذور الأولى."
MAPPER_ITEM_MAP_HUNTERSNEST_DESC: "هذه دروب حفرتها ذوات الأصداف الحمراء، وتكثر فيها مخازنها ومزاراتها. لا بد أن هذه الأنفاق تتيح لها التنقل سريعا عبر الحقول في الأسفل."
LACE_ABYSS_LAKE_DIVE_CURSED_REPEAT: "<hpage>إن كنت سأغوص وأخلص هذه الأرض من لعنة الخيط الأسود، فعلي أولا أن أجد وسيلة لانتزاع الدخيل الكامن في داخلي."
GREENPRINCE_SIT_MEET: "ها أنا أتحرر، رغم أنني لم أطلب عونا.<hpage>ولا أطلب منك امتنانا. كل ما في الأمر أن المفتاح وافق القفل. وإن شئت، فابق هنا حتى تقسو صدفتك وتتحول إلى قشرة.<page>لا. سأغادر بعد قليل. بعد أن انفتح طريقي، عادت أمنيتي تدفعني، رغم أنني حاولت تفاديها.<hpage>رحلة آمنة أيتها الحشرة الطويلة. لن أتطفل أكثر، فمن الواضح أنك تحملين عبئك الخاص."
SHERMA_CORAL_REWAKE: "مم، مرم؟ أوه، مرحبا مجددا!<page>لم أقصد أن أغفو هكذا. يصعب البقاء مستيقظا في مكان مريح كهذا، أليس كذلك؟"
SHERMA_BONEGATE_MEET: "أرجوك اسمع دعائي وغنائي،<br>دربي أمامي، لكن تلك معاناتي، <br>لا أستطيع العبور يا بوابة العظام،<br>فاستيقظي وساعديني... ماذا؟"
SNAILS_ACT3_HEART_HINT_CORAL: "<page=M>في أعالي تلك الكهوف التي ابتلعتها الرياح والرمال يرقد حاكم عجوز غلفته القشرة، وكان يوما ملكا محاربا عظيما.<page=M>في أوج قوته، أخضع هو وجماعته نصف فارلوم تحت مخلب قاس. استمتعت بعض الحشرات بتلك القوة، لكن معظمها عاش خائفا منها."
HUNTER_FAN_MEET: "أوه! يا لها من مفاجأة جميلة لنو! أنت بالغة، صحيح؟ مكتملة النمو؟ مستعدة للصيد؟<hpage>أنا بالتأكيد لست طفلة يا صغيرة.<page>رائع! إذن لا بد أن تطلب نو أمنية! تريد منك أن تبحثي لها عن حشرات فارلوم العجيبة الكثيرة وتقطعيها.<page>قطعيها بنصلك! قطعيها بروحك الناضجة! قطعيها بقلبك البالغ المتوحش!<page>هل تساعدين نو؟ هل تأخذين مخطوطتها وتملئين صفحاتها بما تتعلمينه من ضرباتك؟"
GARMOND_MEET: "غرررر! أيتها الوضيعة! أيتها الشيطانة! من يجرؤ على إيقاظ غارموند الشجاع من غفوته الضرورية؟<hpage>لا أنوي إزعاجك يا سيدي. إنما أعبر هذه الأبراج، وأردت أن أفهم معالم المكان على نحو أفضل.<page>همف! دراسة ساحة المعركة؟ ذلك تفكير محاربة! انظري إلى نفسك! وقفتك ونصلك يكادان وحدهما يعلنان القتال.<page>وبصفتي أشجع الفرسان، لو عرض علي تحد مباشر لألزم الشرف غارموند النبيل بقبوله!<page>لحسن حظك أن هذا لا يبدو مقصدك. والحق أنني ما زلت أستريح بعد مشادة وقعت لي. لو استدعى لقاؤنا مبارزة بين فارس ومحاربة، لما حالفك الحظ برؤية أفضل حالاتي."
GRINDLE_SHOP_INTRO: "مرحبا إذن، ما الذي جاء بحشرة متأنقة مثلك تتسلل إلى ركن غريندل الصغير الدافئ؟<page>سمعت أن لدينا أشياء جميلة، أليس كذلك؟ أوهوهو! كل أنواع النفائس الشهية تجد طريقها إلى هنا، هذا مؤكد.<hpage>لا يهمني كيف حصلت على بضاعتك أيها اللص. إن كان لديك ما يستحق المقايضة، فقد أدفع بعض مسابحي.<page>نحن لا نرفض أبدا مقايضة عادلة، هيه هيه! انظري الآن إلى ما لدينا..."
SPRINTMASTER_EXTRA_WIN_POST: "والآن سأبقى وأتدرب. واعلمي أنه رغم نفاد مكافآتي، فأنت موضع ترحيب على مساري متى شئت، مهما كررت المحاولة."
SETH_GREYMOOR_REPEAT: "تحب الحشرات حادة الوجوه في هذه الكهوف المبتلة بالرذاذ الانقضاض واللعب، أليس كذلك؟ ليتني أفهم لغتها الجميلة..."
MRMUSH_LOC5: "...في قاع البئر، لا يمكنك إلا النظر إلى الأعلى. الماضي محجوب عمن يتطلع إلى الأمام...<page>...قد تظل تلك الأصداء دليلك. نعم، هذا صحيح. وفي يد طيبة القلب، يمكن للسلاح أن يكون صديقا أيضا...<page>...أنت متلهفة جدا لاقتفاء أثرها. لكن ماذا تتركين لمن يأتون بعدك؟"
MAPPER_ITEM_MAP_SHADOW_NAME: "خريطة مياه المرارة"
SPRINTMASTER_HERO_WIN_REPEAT: "أوف... لا تكفين عن إبهاري... أيتها الحشرة الرشيقة...<page>فلننطلق مسرعين كلما شئت! وسأسعى بسرور إلى مجاراة خفتك المرحة."
SHERMA_PILGRIMSREST_TALK1: "بدأت عزيمة هذه المسافرة المسكينة تخبو. حين حييتها أول مرة، كان صوتها أجش حتى إنني بالكاد سمعته!<page>لكن لا داعي للقلق. ستنتشلها أغنيتي من سباتها! ضمي صوتك إلى صوتي أيتها العذراء الحمراء، ولنوقظ معا رفيقتنا في الحج!"
MAPPER_GENERIC_JUDGESTEPS_REPEAT: "ستجرف الرمال حتى هذه الدرجات العظيمة مع مرور الزمن. لا شيء ثابت في مكانه إلى الأبد."
HUNTER_FAN_SPLINTERQUEEN_MEET: "أوه! انظري هنا أيتها الآنسة البالغة! مخلوقة مثيرة جدا للاهتمام، ماتت وتقطعت الآن، لكنها ما زالت صالحة!<page>اتخذت الغابة جسدا لها، وشعرها يشبه الأوراق المرة! ترى نو أن هذا ذكي!<hpage>فرضت هذه المخلوقة سيطرتها على المنطقة وهاجمتني حين مررت بها.<hpage>لا تمكثي طويلا. فما زالت قبيلتها مختبئة بين الأغصان، متنكرة وتنتظر الهجوم.<page>أوه! إذن أنت من قطعتها؟ تقدم لك نو شكرها الحار! الآن يمكنها فحص هذه المخلوقة جيدا، بكل أحشائها اللزجة وصدفتها المقرمشة!"
