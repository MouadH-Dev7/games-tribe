WOOD_WITCH_CURSE_ACCEPTED: "<hpage>حسنا. هذا الطقس الأخير... ماذا تريد مني أن أفعل؟<page>وقت... الميلاد قريب. والآن امنحيه... صَدَفته. أقيمي... الطقس الأخير.<page>وقت الميلاد... قريب."
SETH_GUARDIAN_TALK_REPEAT: "يمكنك الاستراحة هنا في هذا المكان المقدس، لكن اعلمي أنك إن اخترت التقدم فسوف ترين سلاحي مرفوعا."
WOOD_WITCH_CURSE_OFFER: "الوقت... يقترب وقت الميلاد. البرعم يصرخ. يتوق. يمكن أن يبدأ الطقس الأخير.<page>صَدَفة بيضاء. رداء أحمر. حشرة قوية وعتيقة. وقت الميلاد قريب. ساعدي الآن في الطقس الأخير."
WOOD_WITCH_FLOWER_QUEST_COMPLETE_1: "ق... قلوب بوليب. جمعت. جمعت كلها. كل ما يلزم قد قدم."
WOOD_WITCH_FLOWER_QUEST_DECLINE: "<hpage>أسمع طلبك، لكن علي رفضه. ستحملني رحلتي بعيدا عن هذه الغابة.<page>ترفضين. لا. لا ترفضي. يقترب وقت الميلاد. يجب أن يبدأ الطقس الأول."
WOOD_WITCH_FLOWER_QUEST_ACCEPT: "<hpage>إن كان لديك معرفة أو قوة تمنحني إياها، فسأساعدك. أما قلوب بوليب التي تطلبها... أيمكن العثور عليها في أرجاء الغابة؟<page>ق... قلوب بوليب. توجد في الغابة. نعم، أيتها الحشرة.<page>ابحثي عن الأزهار البنفسجية. في داخلها... القلوب.<page>يقترب وقت الميلاد. نحتاج إلى قلوب بوليب. أحضريها أيتها الحشرة، وستمنحين نصيبا من القوة."
WOOD_WITCH_FLOWER_QUEST_COMPLETE_3: "أيتها الحشرة ذات الرداء الأحمر. يقترب وقت الميلاد من جديد.<page>اكتمل الطقس الأول. الاستعداد تام. لوقت الميلاد.<page>خذي... خذي. مخلفات الطقس."
WOOD_WITCH_FLOWER_QUEST_KEEPITEMS: "ررر... الطقس. يجب أن يبدأ الطقس الأول. نحتاج إلى قلوب بوليب."
WOOD_WITCH_CURSE_DECLINED: "<hpage>لا أستطيع مساعدتك. ليس الآن. لعل مسافرا آخر يقدم لك العون.<page>لا أحد... لا أحد يأتي الآن. فيما مضى، حشرات كثيرة. كثيرة. الآن لا أحد. الطقس الأخير... يقترب وقت الميلاد..."
WOOD_WITCH_MANDRAKE_ASK: "أيتها الحشرة. ذات الرداء الأحمر. كثيرة الترحال. أحضريه إلى هنا... البرعم.<page>إنه ينادي. يصرخ طلبا للطقس. قدميه قربانا."
SETH_GUARDIAN_DECLINE: "إذن لا تتقدمي أكثر، ليظل السلام بيننا."
WOOD_WITCH_MANDRAKE_ACCEPT: "البرعم... ضعيف. جديد. يجب تغذيته.<page>س... سيغذى. سيغذى."
WOOD_WITCH_FLOWER_QUEST_ACCEPTED: "ابحثي عن الأزهار البنفسجية. في داخلها... القلوب الثمينة.<page>يقترب وقت الميلاد. نحتاج إلى قلوب بوليب. أحضريها أيتها الحشرة، وستمنحين نصيبا من القوة."
WOOD_WITCH_FLOWER_QUEST_REOFFER: "أيتها الحشرة. لم يبق سواك. لم يعد أحد يطأ هذا المكان. لا أحد.<page>من أجل الطقس. قلوب بوليب. نحتاج إليها. أحضريها إلى هنا، من أجل الطقس."
SETH_GUARDIAN_OFFER: "تحدي الحارس؟"
WOOD_WITCH_FLOWER_QUEST_COMPLETE_2: "الطقس الأول. طقس بوليب. يمكن أن يبدأ الطقس الأول."
WOOD_WITCH_FLOWER_QUEST_CANCOMPLETE: "القلوب الثمينة... أعطيني إياها. من أجل وقت الميلاد، من أجل الطقس، يجب أن تنزف..."
WOOD_WITCH_FLOWER_QUEST_OFFER: "ال... يقترب وقت الميلاد. والآن، طقس بوليب.<page>أيتها الحشرة. لم يبق سواك. لم يعد أحد يطأ هذا المكان. لا أحد.<page>من أجل الطقس. قلوب بوليب. نحتاج إليها. أحضريها إلى هنا، من أجل الطقس."
WOOD_WITCH_MEET: "ششش... صَدَفة. قناع أبيض، رداء أحمر.<page>حشرة. حشرة حية.<hpage>أنا حشرة، جزئيا على الأقل، لكنك كائن مختلف تماما. أعتذر إن كنت قد أيقظتك من سبات عميق.<page>سبات. نوم طويل. لكن الآن حان الاستيقاظ.<page>نمو. وقت الميلاد. يقترب وقت الميلاد.<page>أنصتي، أيتها الحشرة. يقترب وقت الميلاد."
WOOD_WITCH_MANDRAKE_DECLINE: "ال... البرعم. يجب تقديمه قربانا. إنه ينادي طلبا له... طلبا للطقس."
WOOD_WITCH_REPEAT: "سيحين الوقت... قريبا. يقترب وقت الميلاد."
SETH_GUARDIAN_MEET: "توقفي أيتها الغريبة. كلفت إلى الأبد بحراسة الضريح المقدس القابع خلفي.<page>على كل من يريد العبور أن يبارزني بسلاحه."
SETH_GUARDIAN_TALK1: "يمكنك البقاء هنا والاستراحة إن شئت. لست عدوا لك. لن أرفع سلاحي في وجهك إلا إن حاولت التقدم.<hpage>إذن أخبرني، أيها المحارب، عن الضريح الذي تحرسه. تبدو هذه الكهوف عند طرف الغابة منسية منذ زمن بعيد.<page>قد تخفى بعض الأشياء، لكنها لا تنسى أبدا. يبقى الضريح تخليدا لذكرى بذرة الغابة الأولى، تلك التي كانت يوما وستبقى دائما.<page>أنا آخر من بقي ملزما بحمايته. وللأسف، سقط كثيرون بنصلي في أثناء خدمتي له."
