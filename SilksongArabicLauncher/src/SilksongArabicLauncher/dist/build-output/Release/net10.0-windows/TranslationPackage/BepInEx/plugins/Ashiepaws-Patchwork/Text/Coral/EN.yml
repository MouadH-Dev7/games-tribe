PINSTRESS_INTERIOR_GROUND_POST: "يا للروعة! أن أواجه خصما فيه بعض الحيوية.<page>مهارتك واضحة. آمل أن يكون تدريبي قد أفادك ببعض البصيرة."
PINSTRESS_INTERIOR_GROUND_MEET: "يا للوقاحة! أن توقظي معلمة دبابيس من تأملها العميق!<page>استمري في هذا التصرف الطائش، وستجدين دبوسا قد اخترقك في لمح البصر!<hpage>يفاجئني العثور على حشرة سليمة العقل وحية في مكان قاس كهذا. أأنت محاربة متمرسة في نصال هذه الأرض؟<page>نعم! أنا معلمة دبابيس! قد تلائمك إبرتك تلك، على غرابتها، لكن الدبوس هو سلاح فارلوم المجيد.<page>وبما أنني مستيقظة الآن، فلعلك ترغبين في بعض التدريب؟ أتودين اختبار قوة معلمة الدبابيس؟ لعل هذه المعلمة العجوز تعلمك شيئا أو شيئين."
PINSTRESS_INTERIOR_GROUND_TALK_ACT_3: "مضى زمن طويل منذ شعرت بكل هذه الحيوية. أولئك الحجاج الخاملون لم ينفعوا في اختبار قدراتي.<hpage>قدم سلاحك تحديا مبهرا، يا معلمة الدبابيس. جبت هذه المملكة بطولها، ومع ذلك لا تكف القوة والمهارات المخبأة في أرجائها عن إدهاشي.<page>ولديك قواك الغريبة أيضا، يا حشرة الإبرة. لو التقينا في أيام أقل اضطرابا، فتخيلي كم كان يمكن أن نتعلم إحدانا من الأخرى!"
PINSTRESS_INTERIOR_GROUND_ACCEPTED: "اختيار جريء يا حشرة الإبرة. هيا نهز أصدافنا!"
PINSTRESS_INTERIOR_GROUND_PROMPT: "التدرب مع معلمة الدبابيس؟"
WORLD_EDGE: "<hpage>ترسم هذه الرمال حدود أراضي فارلوم. جلبت إلى هذه الأرض عبر الكهوف الواقعة خلفها.<hpage>لا يزال شيء في أعالي هذه المملكة يتوق إلي. لو هربت الآن، فسيطاردني ثانية.<hpage>إلى أن أجد مصدر ذلك الجوع وأقتله، لن أكون حرة."
PINSTRESS_NPC_TALK_01: "معلمة_الدبابيس_حوار_الشخصية_غير_اللاعبة_01"
PINSTRESS_INTERIOR_STAND_MEET: "عدت ثانية يا حشرة الإبرة؟ لا بد أن أماكن أهم تناديك من هذه الدرجات الرملية؟<hpage>لن أبقى طويلا، يا معلمة الدبابيس. يمنحني موطنك ومهاراتك شعورا بالأمان يندر في هذه الأراضي."
STEEL_SENTINEL_QUEST_REPEAT: "اعثري على التابع... ذلك الشاحب. أعيديه إلينا... وأنقذي كلينا من غضب السادة."
PINSTRESS_FINAL_MEET_RETURN: "يا حشرة الإبرة! مع هذه الزلازل السوداء، تقترب نهاية فارلوم سريعا.<page>ارفعي سلاحكِ! لنر إن كانت إحدانا على الأقل ستلقى نهايتها وفية لطبيعتها!"
PINSTRESS_FINAL_MEET: "ها أنتِ ذي يا حشرة الإبرة! من سواكِ يجرؤ على إيقاظ بينستريس بهذه القوة؟!<page>رأيتِ أمنيتي، كما أخمن؟ وجئتِ أملا في تحقيقها؟<hpage>أعرف ما تسعين إليه يا بينستريس... نزال حتى الموت، ونهاية في القتال، لا تحت أنقاض الكهف.<hpage>يمكنني أن ألبي طلبكِ... إلى حد ما... لكن تحديا أعظم ما زال ينتظرني في الأسفل.<page>أيا كان مسعاكِ، فقد تجدينه بلا جدوى الآن يا حشرة الإبرة. الزلازل السوداء... نهاية فارلوم تقترب.<page>فلنكف عن الثرثرة ونبدأ! لنر إن كانت إحدانا على الأقل ستلقى نهايتها وفية لطبيعتها!"
STEEL_SENTINEL_REOFFER: "مخلوقة... أسمى... أرسلها السادة الذين تخدمهم... لاستعادة تابعة زي الضائعة؟"
STEEL_SERVANT_END_1_ACT3: "لا. لا. لا... قتل مخلصي!<page>لماذا تفعلين هذا أيتها السفاحة القاسية؟ لماذا يجب أن أبقى وأخدم كل هذا الزمن الطويل، الطويل، الطويل؟<hpage>يجب ألا تستدعي ذلك الفراغ أيتها الحشرة. إنه يهاجم هذه الأراضي بقوة تكفي للقضاء عليها، واستدعاؤه بقوة أكبر لن يفعل سوى التعجيل بسقوطها.<hpage>صدفتكِ سالمة في هذه اللحظة على الأقل. لم أصل في الوقت المناسب إلا استجابة لرغبة رفيقتكِ الفولاذية وخوفا من عقاب سادتها."
PINSTRESS_FINAL_DEFEATED_PRE: "آه! غلبتني بإنصاف، ومع ذلك امتنعتِ عن توجيه الضربة القاتلة؟<hpage>يمكنني أن أختبركِ يا بينستريس، وأن أختبر نفسي استعدادا لما سيأتي، لكنني لن أقضي عليكِ.<hpage>رغم زلازل فارلوم، فإن هلاكها ليس محتوما كما يبدو. سأعمل على تغيير ذلك المصير.<hpage>إن نجحت في مهمتي، فستحتاج الأرض الباقية إلى حراسة حشرات قوية مثلكِ.<page>ما أشد إلهامكِ! جعلتني أبدو حمقاء، إذ كنت أفكر في النهاية وحدها بينما تتطلعين أنتِ إلى مستقبل مشرق...<page>يبدو أنكِ هزمتني مرتين يا حشرة الإبرة، مرة أمام حد دبوسي، ومرة أمام عزيمة قلبي..."
STEEL_SENTINEL_ACCEPT: "<hpage>لن أساعدكِ من أجل سادتكِ، لكنني قد أعينكِ يا زي بإرادتي ما دام الطريق يسمح بذلك.<hpage>سبق أن قابلت واحدة من أتباعكِ، وكانت دنيئة وماكرة وبارعة في الاختباء.<hpage>إن كانت خادمتكِ الأخرى تشبهها في الطبع، فقد يصعب العثور عليها. فأين تنصحينني أن أبدأ البحث؟<page>استشعرت زي حركتها... وتعرف مواضع راحتها. من أجل الشاحبة... ستضع زي العلامات على خريطتها.<page>ابحثي عن التابعة... أعيديها، أو أعيدي جثتها... كلاهما مناسب... وكلاهما سيساعد... على تفادي غضب السادة."
PINSTRESS_INTERIOR_GROUND_MEET_ACT_3: "يا للفظاظة! توقظين بينستريس من تأملها العميق!<page>إن واصلتِ هذا السلوك المتهور، فسرعان ما سيخترقكِ دبوس!<hpage>يفاجئني أن أجد أي حشرة حية في مكان قاس كهذا. أأنتِ محاربة متمرسة بأسلحة هذه الأرض؟<page>نعم! أنا بينستريس! قد تناسبكِ إبرتكِ، لكن الدبوس هو سلاح فارلوم المجيد، أو كان كذلك على الأقل... وبدأ يبدو أن الوقت المتبقي لفارلوم قصير.<page>ما دمت مستيقظة الآن والوقت يضيق فجأة، فهل ترغبين في بعض التدريب؟ أتختبرين قوة بينستريس؟ لعل هذه المعلمة العجوز تعلمكِ أمرا أو اثنين."
PINSTRESS_NPC_REPEAT: "تكرار حديث بينستريس"
PINSTRESS_INTERIOR_SIT_TALK_REPEAT: "انصرفي الآن يا حشرة الإبرة. أحترمكِ وأحترم نصلكِ الحاد، لكن لا ينبغي استغلال حسن ضيافتي."
PINSTRESS_FINAL_ICECORE_VISITED: "لا أعرف إن كنتِ قد سمعتِ بهذا يا حشرة الإبرة، لكن يقال إن سرا متلألئا مخبأ في قلب هذا الجبل.<page>يقال إنه أعجوبة، أو هكذا أخبرتني أخواتي الراحلات يوما: كهف هائل كله من البلور.<hpage>زرت قلب الجبل يا بينستريس. كان مشهدا مذهلا حقا، وآمل ألا يضيع قريبا.<page>بالطبع رأيتِه! أنتِ بارعة في السلاح والبحث، وأثبتِ أن موهبتكِ مهيبة.<page>ما دمتِ قد فرغتِ من شأنكِ هنا، فلعل الوقت حان لتعودي إلى عملكِ البالغ الأهمية؟"
STEEL_SERVANT_END_2: "<page>لكن الرائية لا تعرف شيئا! لا تعرف شيئا عن الألم. كل ما على سولا الصغيرة أن تتحمله... أن تراقب هذه الأراضي وهي تموت ببطء، والحشرات تتعذب وتسقط، بينما تبقى صدفتنا سليمة...<page>ذوو القلوب الفولاذية لا يشعرون إلا بالقليل... أما نحن المجبرين على الخدمة فنتحمل كل شيء. وحدنا. لماذا؟<hpage>...قد يعرف آخرون ذلك الألم أيتها الحشرة الصغيرة... أو يعرفون شيئا يشبهه على الأقل.<page>فهل ستقيدينني من جديد؟ هل ستسوقينني بحد نصلكِ وتعيدينني إلى ذلك الألم وأنتِ تعرفين؟<hpage>...لن أفعل. سأخبر طفلة الفولاذ بما جرى هنا، لكنني لا أستطيع إجبار أي حشرة على العودة إلى مهمة بهذه القسوة.<page>إذن... إذن سولا حرة؟ حرة في الفرار على الأقل؟ بفضل رحمتكِ أيتها الحشرة، يجب أن تعدو هذه السيقان سريعا، سريعا، وإلى مكان بعيد، بعيد!"
STEEL_SENTINEL_REPEAT: "يجب أن تراقب زي وتسجل... وتنتظر... إنها مخلصة دائما لوظيفتها... مقيدة بالخام... وبالواجب."
PINSTRESS_FINAL_DEFEATED_REPEAT: "خضنا معركة عظيمة يا صديقتي... حان وقت عودتكِ إلى عملكِ البالغ الأهمية. سأتمنى لكِ النجاح."
STEEL_SENTINEL_OFFER: "...مخلوقة... أسمى... لقاؤها بزي، وإيقاظها لها... ليس مصادفة... أرسلها السادة الذين تخدمهم، أليس كذلك؟... لاستعادة تابعتها الضائعة؟"
PINSTRESS_INTERIOR_SIT_TALK_01: "<hpage>لماذا تختارين يا بينستريس العيش وسط هذه الكهوف التي تعصف بها العواصف؟ لا بد أن هناك أماكن أرحب.<page>مكان ألطف؟ أدفأ؟ سأفقد صلابتي! وكيف يتوقع من المرء أن يبقي ذهنه متيقظا؟<hpage>إذن فأنتِ لا تختبئين هنا؟ يبدو أن القلعة في الأعلى لا ترحب بالأحرار ولا بالأقوياء الذين يختارون الانعزال.<page>...نعم. هذا سبب أيضا، وإن كنت أشعر ببعض الخجل منه.<page>تعلمت قلعتنا العظيمة جيدا من تدريبات بينستريس الماضي، ثم استخدمت تلك التعاليم ضدنا!<page>رغم تفوق مهاراتنا، ظلت أعدادنا قليلة، فطغت علينا قوتهم.<page>لم يبق من نظامنا الذي كان موقرا سوى اثنتين، مختبئتين في زوايا فارلوم المنسية. أما أختي في الدبوس، فقد كرست نفسها لمساع أكثر سلاما."
WORLD_EDGE_REPEAT: "<hpage>لا يمكنني مغادرة هذه الأرض بعد. لن يتوقف تعطش هذه المملكة إلي حتى أقضي على مصدره."
STEEL_SENTINEL_DECLINE: "أيتها الشاحبة... أترفضين الدور؟ ألستِ مروضة ومقيدة بسادتكِ؟... يفترض أنكِ تعرفين... أن الطاعة ضرورية.<page>تذكري مصير من يتحدونهم... حتى أنتِ، أيتها الأسمى... وأنتِ بالأخص...<page>...السحق... لقد عانيناه. ولا نتمناه لغيرنا أبدا."
PINSTRESS_INTERIOR_GROUND_DECLINED: "آه، أإبرتكِ خجولة إلى حد يمنعها من إظهار حدها؟ يا للخسارة."
PINSTRESS_INTERIOR_STAND_REPEAT: "حتى ترحيبي له حدود يا حشرة الإبرة.<page>اعتدت الوحدة كثيرا، وإطالة استضافتي لقوتكِ الغريبة أمر يثير قلقي."
PINSTRESS_INTERIOR_GROUND_REOFFER: "أتنوين البقاء هنا يا حشرة الإبرة؟<page>هل ترغبين في بعض التدريب؟ أتودين اختبار قوة بينستريس؟ لعل هذه المعلمة العجوز تعلمكِ أمرا أو اثنين."
PINSTRESS_FINAL_REOFFER: "أعدلتِ عن نزالنا يا حشرة الإبرة؟ هذا جيد! لن أكبح نصلي، وأنتظر منكِ المثل."
STEEL_SENTINEL_MEET: "...حشرة... أسمى... جاءت تبحث... عثر على زي... وأيقظت.<hpage>تحياتي يا طفلة الفولاذ. عرفت أمثالكِ في الماضي، ومن حضوركِ يتضح أن هذه الأرض وقعت هي الأخرى تحت نظر سادتكِ الطويل.<page>السادة... نعم... من أجلهم تراقب زي... مطيعة... دائما...<page>وأنتِ... مخلوقة من نصفين... شاحبة... وحشرية... قديمة... عنيدة... وحيدة... أنتِ أيضا تحت المراقبة."
STEEL_SENTINEL_OFFER_NO_MAP: "...مخلوقة... أسمى... لقاؤها بزي وإيقاظها لها... ليس مصادفة... أرسلها السادة الذين تخدمهم؟... لاستعادة تابعتها الضائعة؟<page>لكن لا... لا تستطيع الشاحبة... أولا، تلزم خريطة. يجب أن تحصل الشاحبة على واحدة. حينها فقط تستطيع زي وضع العلامات... موقع التابعة محسوس بقوة."
STEEL_SENTINEL_END_1: "<hpage>يا زي، رحلت تابعتكِ حية، وفرّت إلى ما وراء هذه الأراضي.<hpage>اخترت أن أسمح لها بالهرب، حتى لو لم تتحقق أمنيتكِ.<page>الأمنية؟ لا... أيتها الشاحبة... استشعرت زي لقاءكما بوضوح... والطقس... التابعة مدنسة. لقد لمست الظلام. سيطاردها السادة الآن مهما ابتعدت في فرارها.<hpage>لعل ذلك أفضل لتابعتكِ؟ إما أن تذبل هنا في الخدمة، وإما أن تهرب حرة. لقد اختارت، وأعلنت اختيارها بوضوح بفعلها الأسود.<hpage>قتل بطلها المظلم، لكن الحظ أو المكر قد يساعدانها على النجاة.<page>الأمل!... أيتها الشاحبة... تأملين الخير لتابعة تتحدى السادة؟... منحتِ زي فكرة معقدة...<page>النتيجة مختلفة... وعلى زي الآن أن تراقب وحدها... لكن لعل هذا هو الطريق الأفضل؟<page>ستقبل زي ما حدث... وستدعو أن يظل السادة يرونها مخلصة... وستشارك زي أيضا في الأمل... بأن تعيش تابعتها طويلا بلا قيود."
PINSTRESS_FINAL_DEFEATED_POST: "تقديرا لموهبتكِ يا حشرة الإبرة، في السلاح والقوة... وضبط النفس، خذي شعار نظامي هذا.<page>لم أتخيل قط أن تنضم أخرى إلى صفوفنا القليلة، لكنكِ تستحقين العضوية بقدر كل من سبقكِ."
WORLD_EDGE_ACT3_REPEAT: "<hpage>لن أهرب. لا يمكنني التخلي عن المملكة لتنهار بسبب ما فعلت."
STEEL_SENTINEL_REOFFER_NO_MAP: "أيتها المخلوقة الأسمى... عودي حين تحصلين على خريطة. الخريطة ضرورية وأساسية لخدمة السادة... ولمساعدة زي."
PINSTRESS_FINAL_DECLINE: "آه... يا للخسارة. أليست المعركة نهاية أفضل؟<page>إن لم تأت النهاية بنصل، فلن يكون أمامنا سوى قبول المصير الذي ستلقي به كارثة الزلازل الجديدة فوق رؤوسنا."
STEEL_SERVANT_RITUAL: "<hpage>أوقفي استدعاءكِ أيتها الحشرة الحمقاء!<hpage>قد تتوقين إلى الحرية، لكن المخلص الذي تأملين استدعاءه لن يجلب سوى الموت."
