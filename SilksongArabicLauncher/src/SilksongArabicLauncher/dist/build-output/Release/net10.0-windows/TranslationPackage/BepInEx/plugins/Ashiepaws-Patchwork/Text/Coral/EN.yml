STEEL_SENTINEL_END_2: "<page>هدية صغيرة لكِ أيتها الشاحبة... من أجل الفكرة المعقدة... حجر رمح الموطن... ومولد زي. لعلها تعينكِ فيما ستفعلينه في هذه الأرض."
PINSTRESS_INTERIOR_GROUND_REPEAT: "انصرفي الآن يا حشرة الإبرة! تحتاج بينستريس بموهبتي الكبيرة إلى تأمل عميق، ولا سيما بعد نزال ممتع كهذا.<hpage>وداعا يا بينستريس. ليظل نصلكِ حادا."
