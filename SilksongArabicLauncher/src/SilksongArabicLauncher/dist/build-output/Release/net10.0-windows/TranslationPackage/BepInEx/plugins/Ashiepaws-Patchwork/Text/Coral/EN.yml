STEEL_SERVANT_END_1: "لا. لا. لا... قتل بطلي!<page>لماذا تفعلين هذا أيتها السفاحة القاسية؟ لماذا يجب أن أبقى وأخدم كل هذا الزمن الطويل، الطويل، الطويل؟<hpage>يجب ألا تستدعي ذلك الفراغ أيتها الحشرة. أبدا. لا أحد يستطيع السيطرة عليه، رغم أن كثيرين حاولوا.<hpage>وسرعان ما ستكتشفين زيف أي قوة كنت تأملين أن يمنحكِ إياها.<hpage>اعتبري نفسكِ محظوظة لأنني وصلت في الوقت المناسب. صدفتكِ سالمة، بفضل رغبة رفيقتكِ الفولاذية وخوفا من عقاب سادتها."
WORLD_EDGE_ACT3: "<hpage>إن اخترت المضي إلى ما وراء هذه الأرض، فسأتخلى عن فارلوم لتنهار بسبب ما فعلت.<hpage>ما دمت حية وما زلت أملك قوة التحرك، فلن أسمح بوقوع تلك النهاية."
