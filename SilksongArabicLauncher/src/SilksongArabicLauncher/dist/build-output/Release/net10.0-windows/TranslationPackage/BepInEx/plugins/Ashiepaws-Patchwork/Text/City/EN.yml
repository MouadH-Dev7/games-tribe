GOURMAND_SERVANT_REPEAT: "اتركينا! يحتاج سيدي العظيم إلى وقت للتأمل، وعلي أن أبحث عن نكهات جديدة!"
COG_STATUE_ALL_TALK_B: "أيها الحاج الذي يريد حمل أغنيتنا داخل صَدَفته، ارتق إلى الأعالي.<page>قدم أكثر ما فيك إخلاصا إلى قلبنا المقدس."
LIBRARY_STATUE_SPEAK_1: "...أيها الحاج!... اطرح جانبا تلك الآمال الآثمة الكثيرة بالراحة ...والمكافأة... ابق طاهرا... بيننا... ولا تطلب شيئا! <page>انظر... إلى حجر القلعة البسيط، العاري من... الزينة. انظر كـ... ثيابنا متواضعة، وكم طعامنا... قليل. واعلم أن... الإسراف خطيئة!<page>ابق يقظا... دائما، فهؤلاء... الحجاج التعساء... الذين يجرؤون على الاستسلام... لرغباتهم الدنيئة... إن تركوا بلا عقاب... داخل جوقتنا الطاهرة... انتشرت خطيئتهم المغرية... كاللهب..."
SONG_KNIGHT_OUTRO_2: "اقبلي هـ... هدية من جماعة الحراس.<page>وبصفتنا صديقين... لنـ... نفترق."
LIBRARIAN_NO_RELICS_FULL: "<hpage>أود رؤية مجموعتك، يا حارس القبو.<page>لها أن تراها. مجموعة كاملة. حارس القبو هذا ثري بالمعارف. لو بقيت عقول رفاقه... لغاروا منه."
GOURMAND_SERVANT_ITEM_GIVE_MEAT: "آآآه. ما هذا؟ شريحة لحم ساع، مربوطة بإحكام! أرى دهنه لا يزال يقطر طازجا!"
GOURMAND_SERVANT_ITEM_GIVE_STEW: "هذا الحساء، كثفت فيه ثمار الطحلب. جيد. جيد! سيشكل الأساس بعد أن يوضع في القالب."
SLAB_PRISONER_REMEET: "آه... لقد جلبت الأغنية مجددا، مع أنها ربما تهدر على من هو غير جدير مثلي.<hpage>لا يلزمك إشباع فضولي إن كان ذلك يؤلمك يا سيدي، لكن علي أن أسأل: لأي جريمة أو خطيئة سجنتك القلعة؟<page>خطيئتي؟ ذنب جسيم تسبب في ألم كثيرين. لكن الحديث عن الخطيئة... دعوة إلى عودتها. لن أقول المزيد."
LIBRARIAN_RELIC_ASK_PROMPT: "إعطاء أسطوانة المزمور؟"
SONG_KNIGHT_OUTRO_1: "بفضل نقاء إرادتك... ووضـ... وضوح مقصدك... أنت بريئة من اللعنة الحريرية.<page>فشل هذا الحارس. وحـ... حكمك سيقبله.<hpage>أهذا فشل حقا أيها المذهب؟ أردت اختباري وقد فعلت. وهذا ما أتوقعه من حارس حقيقي.<hpage>حسم الأمر. لا داعي للموت. انهض، ولنفترق صديقين."
GOURMAND_SERVANT_ROACHEGG: "ابحث عن يرقة وحل مخللة، وهي طعام مقدس يبجله البعض وينفر منه آخرون لشدة مذاقه. كانت من تخصصات الطاهي لوغولي، الذي نفي منذ زمن بعيد لتدنيسه فن الطهو.<page>وتردد الشائعات أن الطاهي العظيم اعتزل في كهوف موطنه، في الأراضي الوسطى الرطبة أسفلنا..."
GOURMAND_SERVANT_QUEST_COMPLETE_1: "<hpage>بهذا أكون قد وفيت بوعدي يا سيدي. سلمتك جميع المكونات. وأثق الآن بأنك تستطيع إعداد الوجبة ومنحي الزيت لقاء جهودي؟<page>ستنالين زيتك أيتها الصغيرة! تعلمي الصبر أولا! يجب إعداد الطبق بإتقان يكفي لإيقاظ سيدي وإشباعه. <page>والآن! دعيني أمارس مهارتي، وستشهدين وجبة برائحتها ومذاقها كانت ستبهر فارلوم في أوج مجدها!"
GOURMAND_SERVANT_MEET_ACT3: "همم؟ آه، إنها مجرد الحشرة الحمراء الغاضبة. كنت أنتظر خبرا ممن في الأعلى يفسر كل هذا الاضطراب والاهتزاز.<page>إنهم يقصرون في واجباتهم المقدسة! يجب حماية سيدي من هذه المضايقات، وإلا اضطرب هضمه.<hpage>هناك مصائر أسوأ من عسر الهضم يا سيدي. أنت محظوظ لأنك لم تصب بأذى.<page>لا علاقة للحظ بذلك. أنا ببساطة من سلالة أصلب من أولئك الخدم الصغار الضعفاء في هذه الأزمنة البائسة!"
LIBRARIAN_FIRST_RELIC_ASK_REPEAT: "رككت! أعرف أنها تملكه. تحتفظ به. تحمله، ذلك النفيس، في ثوبها. بحث هذا عنه. أعطيه! أعطينا إياه!"
LIBRARIAN_MELODY_PLAY_POST: "موسيقى إلهية... روح فارلوم الخالدة مكشوفة أمامنا... أن ينال عصرنا الملعون بركة كهذه رغم كل شيء...<page>إذن، يا سليلة النساجين، صار لحننا لك الآن، محفوظا في ذهنك لتحمليه إلى ما وراء جدراننا. أكان تعلمه يستحق سرقته؟ <hpage>كان يستحق، يا حارس القبو. واعلم أن خدمتك لي مستمرة. احفظ الأسطوانة، ومعها أي أسطوانات أخرى قد أحضرها."
LIBRARY_STATUE_SPEAK_REPEAT: "...عزيزي... الحاج... يبدو الظلام الآن... دع هذه الكلما... تصبح دليلك...<page>اسمع صوتنا... ودعه... صوتك! قدم... من نفسك... من أجل فارلوم العظيمة، ومن أجل... الأبناء الأوائل الذين أورثوها لنا... ومن أجل خلاصنا... الآتي حتما!"
GOURMAND_SERVANT_NECTAR: "لأجل مذاق حلو ينضج على نار هادئة، جد لي بعض الرحيق المعتق. شراب نادر تعتز به الحشرات ذات الشم الدقيق التي تقدر الجودة.<page>لا يكاد يوجد أمل في بقاء محصول بهذا القدم. واحسرتاه! لكن عمق نكهته ضروري للطبق المقدس!"
LIBRARY_STATUE_WAKEUP: "أنصت!... أيها الحاج! أنت... تصعد... إلى عناقنا الأبدي... يا من تقف شامـ... عند عتبة... قلعتنا الصارمة المبنية من الحجر... اعلم... أن خدمتك الحقيقية قد تبدأ الآن.<page>انس... صَدَفتك المنهكة. تخل عن... رغبتك في التوقف... فارلوم تأمرك... قدم... أعظم هبة! انضم إلى جوقتنا... ارفع... صَدَفتك... وصوتك... وغن!"
GOURMAND_SERVANT_COURIERMEAT: "لأجل قلب الوجبة، ابحث عن ذلك اللحم الرائع... شريحة لحم ساع، من تلك الحشرات النشيطة التي كانت تصل يوما مع رنين كل جرس ثان.<page>رأيت كثيرا من السعاة يلتهمون هذه الوجبة الدسمة. أين ذهبوا جميعا؟ هل تخلوا عن كدحهم المقدس؟"
GOURMAND_SERVANT_REPEAT_ACT3: "يتمتع سيدي بقدرة هائلة على التحمل، لكن كل هذا الاضطراب والانهيار يجعلني أخشى على سلامته.<page>لا تخافي. سأبقى إلى جانبه حتى تتفتت صَدَفتي العتيقة."
BROOD_MOTHER_TINY_TALK: "بيضات، بيضات، هيه هيه! سآكل كثيرا وأصبح كبيرة وسمينة. ثم سأضع كثيرا من البيضات!<page>يحضرون لي طعاما وفيرا، فلا بد أنهم يريدون بيضات كثيرة.<page>وسينالون الكثير منها إن أحسنوا معاملتي! هيه هيه!"
SONG_KNIGHT_INTRO_2: "<hpage>ظننت أنني ألبي نداءك بصفتي صديقة، أو حليفة على الأقل، لكنني الآن، ونحن نقف معا في هذا المكان، أستشعر نيتك.<hpage>تنوي رفع نصالك في وجهي. أفأنا عدوتك إذن؟<page>الد... الدفاع عن القلعة المقدسة، وعن الأصوات التي تملؤها، واجب الحراس الأبدي.<page>والقضاء هو المـ... المصير المحتوم لكل من استعبدهم همس الحرير.<hpage>تظنني مطاردة، وعبدة للخيوط الشاحبة؟ أراك أشد فطنة من ذلك. حريري ملكي، وكذلك إرادتي.<page>هذا الحارس غير متأكد. تبدين مـ... مطاردة وبريئة معا. يؤسف هذا الحارس أن عليه اخـ... اختبار قوة إرادتك."
WARD_PIT_KEYHOLE_INSPECT: "آلية قفل مزخرفة، في وسطها ثقب مفتاح."
GOURMAND_SERVANT_ITEM_GIVE_NECTAR: "الرحيق! من المدهش أن مستخلصا بهذا القدم لا يزال موجودا! يا لها من مأساة بديعة ألا أستطيع تذوقه بنفسي. يجب أن ينال سيدي كل قطرة!"
LIBRARIAN_FIRST_RELIC_GOT: "نعم! نعم! أعطتنا إياه... إنه لنا! <hpage>سلمتك الأثر، يا حارس القبو. والآن أوف بوعدك وساعدني بمعرفتك.<page>حمقاء! تأمرين حارس القبو. تكفي وقاحتها لجلب الموت عليها... لولا أنها تحمل رائحة نسل النساجين.<hpage>إذن فأنت تعرف شيئا عن أسلافي، أيتها الحشرة العالمة. إن كان ذلك يكسبني حظوة هنا، فسأنتظر منك خدمتك كاملة.<page>بلغ! أموات! أموات هو ما يفترض أن يكون عليه جنسك الوحشي. وأحسب أن بقاءكم هكذا أفضل... <page>غككت. لكن هذا قد تعلم. سيطوي مخالبه. وسيمنح ما استخلصه من معرفة.<page>لا يخضع حارس القبو إلا لابن أول."
TROBBIO_BOSS_MEET: "أيتها الضئيلة الباهتة المرتجفة، يا من تخطين بخوف على المسرح العظيم، اختارك القدر!<page>اطرحي خوفك وانضمي إلي شريكة. قد تخبو شعلة فارلوم، لكننا معا سنشعلها نارا متأججة!<page>فلنحي هذه القلعة التي أضاعها الصمت! ولنوقظ روح هذه الأرض التي كانت عظيمة!"
LIBRARIAN_QUEST: "<hpage>يا حارس القبو، أبحث عن لحن محفوظ في أقبية الهمس، وهو جزء من مجموعة تفتح طريقا إلى الأعلى. أخبرني بما تعرف عنه.<page>أتطمع سليلة النساجين في لحننا المقدس؟! ما أشد قتامة العصر الذي بقينا لنشهده... إن انتقاله إلى غريبة تدنيس شنيع...<page>كان حبرنا الأعظم وحده، وقد عاش طويلا في أعماق قبونا، يحتفظ باللحن في غيرة وطمع... معرفة لا تليق إلا بأرفع حارس للقبو، به وحده.<page>قيل إنه وجد حقيقة... هناك في الظلام. شيئا داخل اللحن، أو الكلمات. شيئا أسكته... <hpage>لا أخشى ما سأسمعه، يا حارس القبو. إن كان حبركم ولحنه ينتظران في الأسفل، فسأجدهما."
LIBRARIAN_RELIC_GOT: "نعم! هدية طيبة، يا سليلة النساجين. سيستخلص حارس القبو هذا منها ما يستطيعه عقل عظيم من معرفة."
COG_STATUE_CONDUCTOR_TALK_B: "كما أنشدت، تدوم أغنيتنا.<page>ومن أجل فارلوم الخالدة، سنرشد."
LIBRARIAN_RELIC_ASK: "جرررك. ماذا أحضرت له؟ مزيد من الكنوز تنتظر بصيرة الحارس، نعم؟ أسطوانات قلعتنا المقدسة؟ مرريها. أعطيه إياها. الآن! يجب عليها ذلك!"
SONG_KNIGHT_INTRO_1: "<hpage>أنا هنا، أيها المذهب."
SONG_KNIGHT_MEET_2: "خالدة هي القلعة. خ-خ-خالدة هي عقيدة الحراس.<page>ما دامت صدفته ت-ت-تعمل، فسيظل هذا الحارس وفيا لواجبه."
COG_STATUE_ALL_TALK_FIRST: "يا حاجة فارلوم الخالدة، يا نادرة الاصطفاء التي صعدت إلى هذه العتبة الأخيرة، اسمعي أمنيتنا وحققيها، حتى تصعدي وترين حجك يبلغ نهايته."
LIBRARIAN_SIMPLE_MELODY: "أيتها الدخيلة! لحن حبرنا المقدس بحوزتك! عثرت عليه، وأخذته، ثم أخذت تتباطئين تائهة كالسوسة بين رفوفنا!<page>عودي إلى غرفة الاستماع في الأسفل! يمكن تشغيل الأسطوانة المقدسة، وسماع لحن أقبية الهمس أخيرا في هذا العصر الملعون الذي طال أمده."
GOURMAND_SERVANT_QUEST_COMPLETE_2: "المذاق، والرائحة، والقوام... اكتمل! وجبة تضاهي أطيب أطباق فارلوم.<page>يا سيدي العظيم، كم طال انتظارك لتطبق فكيك على طبق كامل كهذا! انضم إلينا وتناول طعامك!"
BROOD_MOTHER_TINY_MEET: "لذيذ، لذيذ... أوه! هل جئت لخدمتي؟<hpage>أنا مجرد زائرة، أيتها الصغيرة. أهذا المكان موطنك إذن؟<page>موطني؟ نعم! إنه جميل ودافئ. يجلب لي الكبار الطعام كلما جعت. وأنا جائعة الآن!"
GOURMAND_SERVANT_QUEST_REFUSE: "<hpage>لدي مهام أكثر إلحاحا يا سيدي. لعل سيدك يكتفي بوجبة أكثر تواضعا؟<page>تجديف! سينال سيدي المتعة المقدسة التي يستحقها، حتى لو اضطررت إلى غمر صدفتي بالزيت والصعود بنفسي إلى طبق!"
GOURMAND_SERVANT_CRUSTNUT: "لا يصلح لتتبيل وجبة كهذه إلا كراستنات. فيما مضى، كان يمكن جمع عشرات منها فوق تلك الكهوف المكسوة بقشور المرجان خلف البوابة الكبرى.<page>لا بد أن بعضها لا يزال ينمو في تلك الأرض التي عاثت فيها الرمال!"
COG_STATUE_LIBRARIAN_TALK_B: "كما جاء في النشيد، أغنيتنا تديمنا.<page>ولأجل فارلوم الخالدة، سنعلم."
COG_STATUE_LIBRARIAN_TALK_A: "نود سماع صوت الحراس في أقبية الهمس العظيمة.<page>أولئك الذين يصونون تاريخنا وصلواتنا وأسرارنا عبر العصور."
GOURMAND_SERVANT_ITEM_GIVE_EGG: "يرقة الوحل المخللة! إذن بقيت وصفات ذلك الطاهي المنفي بعد موته!<hpage>ليس الأمر كذلك يا سيدي. أخذت اليرقة من الطاهي نفسه. فقد واصل عمله الوحشي حتى بعد أن استولى الخيط الملعون على صدفته.<page>مذهل! حشرة متفانية إلى حد أنها واصلت الطهو بعد محو عقلها. لقد تسرعت القلعة كثيرا حين طردت عبقرية كهذه."
GOURMAND_SERVANT_QUEST_ACCEPTED: "<hpage>يمكنني تعقب أي مكون ترغب فيه مقابل ثمن. وقد يفيدني الزيت الذي تحتفظ به هنا.<hpage>اجعله مكافأتي، وسيحصل سيدك على وجبته.<page>همف! صفقة دنيئة لا تليق بخادم مقدس... لكن فليكن. أحضري المكونات، وسيكون ذلك التابل الشاحب لك!"
GOURMAND_SERVANT_MEET: "يا لها من قعقعة فظيعة! هلا تصرفت بقدر أكبر من الحذر؟<page>ولماذا تكسوك هذه الحمرة الفاقعة البشعة؟ أقسم إن أولئك في الأعلى يتسلون بإرسال أتعس الخدم الذين يعثرون عليهم إلي!<hpage>لست خادمة يا سيدي، بل ضيفة من نوع ما دعتني القلعة. أخبرني، أهذه القارورة المعروضة ملك لك؟<page>لا أملك شيئا هنا، أيتها السوسة الصغيرة الوقحة! هذه القاعة المقدسة وكل ما فيها من طعام ملك لسيدي الأسمى.<page>الذواق العظيم! أرفع خبير بالمذاق عاش على الإطلاق، ومن يسمو ذوقه فوق العصور!<page>لم يبق أحد يوقره كما يستحق، سوى الحشرة الوفية الوحيدة التي تقف أمامك.<page>ذلك الزيت ليس إلا لقيمة مالحة صغيرة تفتح شهيته للوجبة الكبرى القادمة. طبق مذهل تجمع مكوناته من أرجاء فارلوم، وأنا أخطط له منذ دهر.<page>لكن أولئك في الأعلى تخلوا عن سيدي المسكين! وقد صرت عجوزا جدا. لم يعد بوسعي أن آمل جمع المكونات اللازمة. تبا لتقاعسهم!"
LIBRARIAN_TINKED_RETURN: "ما أفظعها! أي أحمق يجرؤ على ضرب حارس مقدس لأقبية الهمس؟ إنه يملك المعرفة! والبصيرة! بقدر ما يمكن لأي عقل الاحتفاظ به في عصرنا المنهار.<page>أتهدر كل ذلك لمجرد إزهاق المزيد من الأرواح؟ إن فعلت، فهي ناسجة حتى النخاع!"
TORMENTED_TROBBIO_DEFEAT: "فليكن، أيتها القملة الوقحة! أنكري عذاب مملكتنا، وارفضي أن يمس صدفتك المتقلبة!<page>شقي طريقك البائس. تربصي واضربي وقاتلي، لكن اعلمي أن عدوتك هي الأقدار ذاتها، وقد نهضت هائجة!"
LIBRARIAN_ACT3_MEET: "الألم! الألم! هل تسمعين صرخاتها، يا نسل العناكب الملعون؟ تعاني فارلوم بسبب جهلنا البشري المثير للشفقة! نخذلها فتسقط! <page>نحتاج إلى المعرفة. المزيد والمزيد! يجب تكديسها والبحث عنها! إنها القوة اللازمة للفهم والتسكين والإخماد.<hpage>أما الآن، يا حارس أقبية الهمس، فلا بد من العمل، وسأتولاه أنا ومن بقي حيا ممن يريدون مساعدتي.<hpage>ابحث عن الحلول في نصوصك ومزاميرك كما تشاء، لكنها وحدها لن تكفي لشفاء ألم بهذا القدر."
LIBRARIAN_ALL_RELICS: "نعممم! انظري إليها كلها! مجموعته تتلألأ وقد اكتملت. يا لها من معارف مقدسة محفوظة بأمان.<page>أديت دورك يا نسل النساجين... انتهى الاتفاق. سلمت المعرفة والمسابح كلها بالعدل. لم يعد بيننا شيء.<page>دعي هذا الحارس لكنوزه وما تحويه من بصائر. لقد أدى خدمته. والآن يريد هذا الحارس بعض الوقت وحده!"
LIBRARIAN_NO_RELICS: "<hpage>أرني مجموعتك، يا حارس أقبية الهمس.<page>جررك، يا نسل النساجين! إنها مصدر إزعاج! آفة! فلتجلب مزيدا من الهدايا. لا تزال في المجموعة فجوات!"
SONG_KNIGHT_RESTING_MEET_ACT3: "<hpage>أيها المذهب، مزقت الخيوط السوداء ما بقي من القلعة. أما زلت متمسكا بواجبك؟<page>ما دامت الأصوات تملأ الق-ق-قاعات العظيمة... فستستمر مهمة الحراس المقدسة.<page>أن ندافع... أن ن-ن-نحمي."
GOURMAND_SERVANT_QUEST_REPEAT: "أما زلت تتباطئين؟ إن أردت نيل مكافأتك، فعليك مطاردة تلك المكونات! أم تحتاجين إلى إرشادات من حشرة خادمة ذات خبرة؟"
LIBRARIAN_MELODY_PLAY_PRE: "نسل النساجين، لقد عثرت عليها! أسطوانة حبرنا المقدسة، أخذتها من الظلام في الأسفل...<page>ممنوع! هكذا ينص قانوننا. لا يجوز أن يصل لحننا إلى حشرة ليست من الحراس! لكنك أيتها الناسجة الحمقاء تريدين تحطيم تلك المبادئ بتهور تام.<hpage>لقد رحل حبرك يا حارس أقبية الهمس. وسقط رفاقك، فصاروا قشورا أو أسرى للخيط. والقوانين التي حكمت هذه الأقبية يوما ماتت معهم.<page>أخك! حسنا، أيتها الملعونة. خذي الأغنية المقدسة، لكنك ستذوقين الألم إن حكم علينا كلينا بالعذاب الأبدي بسببها!"
LAST_CONDUCTOR_MEET_VAR: "<hpage>عدت يا حشرة لأطلب سماع لحنك ثانية، كي أثبته واضحا في ذاكرتي.<page>حسنا أيتها الحاجة الصالحة. يسعدني أن أمنح هذه الهدية لمن هي شديدة التفاني مثلك."
GOURMAND_SERVANT_QUEST_REWARD: "<hpage>يبدو سيدك راضيا يا سيدي. حان وقت إعطائي ما وعدت به.<page>نعم. نعم! تم الأمر! أعد الطبق وقدم، وهو يوافق رغبات سيدي الرفيعة.<page>التحلية الشاحبة لك. خذيها وغادري! يحتاج سيدي إلى وقت للتأمل، وعلي أن أفكر في نكهات جديدة!"
LIBRARIAN_RELIC_ASK_MELODY_REOFFER: "<hpage>يا حارس أقبية الهمس، أحضرت أسطوانة المزمور التي استعدتها من الغرف المظلمة في الأسفل. أريد تعلم لحنها.<page>كاك! مرريها إذن، يا نسل النساجين القذر! لا ينبغي لأسطوانة بهذه القداسة أن تبقى لحظة أخرى بين مخالبك الوسخة!"
LIBRARIAN_RELIC_DECLINED: "أستحتفظ بها؟ أتطمع فيها؟ ألا تستطيع التخلي عن جائزة صغيرة كهذه؟<page>فلتبقي عمياء يا حمقاء. سيحتفظ هذا الحارس بمعرفته لنفسه."
LIBRARIAN_SIMPLE_2_TALK: "أيتها الناسجة! أتأملين التجسس على سجلاتنا النفيسة؟<page>في مخزوننا الواسع، ثمة دائما المزيد مما ينبغي معرفته: طرائق الصلاة القديمة لهذه الأرض ولحكامها وللقوة الكامنة في قلبها."
LIBRARIAN_FIRST_RELIC_ASK: "تحمل أسطوانة ثمينة! يجب أن تعطيه إياها! أن تتقاسمها معه! من مخلب إلى مخلب!<page>مرريها! وسيمنح حارس أقبية الهمس هذا حكمته. مجرد نفحة صغيرة! قطرة! ومضة! من معارف قلعتنا المقدسة."
SONG_KNIGHT_MEET_1: "استيقظ هذا الحارس. صدفته ت-ت-تعمل.<page>لا يزال هذا الح-ح-حارس متفانيا، وينتظر أمرك.<hpage>أتتكلم، أيها المذهب؟ لا أمر لدي لك، لكن فضولي قد استيقظ.<hpage>تسمي نفسك حارسا. فما الذي كلفت بحمايته؟<page>الدفاع عن الق-ق-قلعة المقدسة والأصوات التي ت-ت-تملؤها هو واجبنا الأبدي.<hpage>توقعت ذلك. لكن انظر حولك، أيها المذهب. سقطت القلعة أثناء سباتك، وخمدت أصواتها. هذا المكان ميت، أو يكاد يكون.<hpage>قد يرى بعضهم أن حراسة جثة مملكة مهمة حمقاء فارغة من المعنى. لذا أتساءل: هل ستظل وفيا لتكليفك؟"
LIBRARIAN_SIMPLE_1_TALK: "لا ينبغي لأحد أن يتسكع بين هذه الرفوف المقدسة! هذا مكان مقدس. التبجيل! إنه واجب.<page>إن أرادت الحمقاء رؤية مجموعة هذا الحارس، فلتتجه إلى غرفة الاستماع في الأسفل."
SURFACE_EDGE_REPEAT: "<hpage>اتخذت قراري. لا يمكنني الرحيل. علي أن أهبط ثانية وأحرر فارلوم."
SONG_KNIGHT_RESTING_MEET: "<hpage>آثار المعركة واضحة هنا، أيها المذهب. فهل كلفت بمطاردة المسكونين حتى إن كانوا من طبقات القلعة الحاكمة؟<page>الدفاع عن الق-ق-قلعة المقدسة والأصوات التي تملؤها هو الواجب الأبدي للحراس.<page>إنهاء حياة كل من استعبدهم الحرير الهامس هو م-م-مصيرهم المحتوم."
SURFACE_EDGE: "<hpage>تمتد في الخارج أراض مقفرة لا نهاية لها... إن عبرتها الآن، ستسقط فارلوم في مصير أسود أكون أنا سببه.<hpage>اتخذت قراري. لن أتخلى عن حشراتها لتواجه تلك النهاية القاتمة. علي أن أهبط ثانية وأقطع قيودهم."
LIBRARIAN_CLOSED_FIRST: "<hpage>ابق آمنا، يا حارس أقبية الهمس. قد أحتاج إلى خدمتك مستقبلا، ولا أريدك أن تهلك قبل إتمام تلك المهمة.<page>غياك... هذا الحارس ليس أحمق. عاش طويلا وشاهد رفاقه يذبلون، لكنه لن يموت. ليس بعد، ولا ما دامت المعرفة تنتظر من يبحث عنها.<page>أبرم هذا العهد يا نسل النساجين: البصيرة لنا، لها وله.<page>في تاريخ هذه القلعة المقدسة، في مجدها وسقوطها، فجوات يعجز حتى علم الحارس والأقبية عن ملئها.<page>عليها أن تبحث عن الأسطوانات، تلك الأشياء المحملة بالبصائر الدقيقة. أحضري المزيد إلى هذا الحارس وحده، فلم يبق في هذه القلعة من يملك عقلا سليما حادا مثله."
COG_STATUE_ALL_TALK_A: "يا حاجة فارلوم الخالدة، أسمعينا أغنيتنا الثلاثية، حتى تصعدي وتعبدي أمام قلب مملكتنا الإلهي."
GOURMAND_SERVANT_OFFER: "أما زلت ماكثة هنا، أيتها الحشرة التي تسمي نفسها ضيفة؟ إن كانت مخالبك العاطلة بحاجة إلى عمل، فسخريها لخدمة ذواقنا العظيم المبجل!<page>يجب أن أبقى إلى جانب سيدي، ولذلك عليك مغادرة القلعة وجمع مكونات وجبته نيابة عني!"
LIBRARY_STATUE_INSPECT: "تمثال صدئ لحاج."
MELODY_PICKUP_HINT_MET: "<hpage>تعلم اللحن المسجل على هذه الأسطوانة يتطلب جهاز استماع يعمل. هذا الجهاز هنا توقف عن العمل منذ زمن بعيد.<hpage>ذلك الحارس الأخير الذي ما زال عاقلا، في الأقبية فوقنا... تضم غرفه آلة كهذه. لا علي سوى العودة."
LIBRARIAN_RELIC_ASK_MELODY: "<hpage>يا حارس أقبية الهمس، استعدت أسطوانة مزمور من الغرف المظلمة في الأسفل. أعتقد أنها تحمل اللحن الخاص بهذه الأقبية. أريدك أن تشغلها لي الآن.<page>كاكرت! زارت أعماق الحبر وسرقت الأغنية المقدسة! أين احترامك يا نسل النساجين؟ موتانا المبجلون يستحقون أفضل من تدنيس غرفهم بنهبك القذر!<hpage>ضاق صبري بوقاحتك الآن، يا حارس أقبية الهمس. إما أن تجهز الأسطوانة وتلتزم الصمت، وإما أن تستعد كي تعرف الندم."
BROOD_MOTHER_TINY_REPEAT: "بيض، بيض! أريد أن أضع الكثير من البيض الجميل! فقولي للكبار: أحضروا لي مزيدا من الطعام!"
LAST_CONDUCTOR_WEAVERS: "<hpage>غرفك فخمة بلا شك يا سيدي، لكن من الواضح أنك لست حاكما هنا.<page>أحالنا مكشوف إلى هذا الحد أيتها الحاجة؟... كنا نهتف يوما: «بإرادة قادة الجوقة»، فترتج القلعة لمرسومنا.<page>لكن كلماتنا... كم كان صداها أجوف. رداء الحكم الذي انتزعناه بطمع من أبناء فارلوم الأوائل الآفلين، أولئك النساجين الممتلئين مرارة... كان نيرا لا تاجا.<page>والآن، في صمت قلعتنا، نشاركهم حقيقتهم. لم تقبض مخالب سوى ملكة واحدة على هذه المملكة، رغم أننا رفعنا أصواتنا زاعمين غير ذلك.<page>أتريدين رؤيتها أيتها الحاجة؟ هناك، فوق تاج قلعتنا؟ ابلغي تلك الأعالي التي تمنينا إخفاءها، وانحني أمام حاكمة هذه الأرض الحقيقية.<hpage>قريبا يا سيدي، سأصعد بالفعل لمقابلة ملكتك..."
SONG_KNIGHT_RESTING_REPEAT: "طهر هذا المكان. أبدي هو و-و-واجب الحراس."
GOURMAND_SERVANT_ITEM_HAS: "<hpage>يا سيدي، أحضرت مكونات الطبق.<page>أخيرا! يكاد سيدي يذبل من الجوع! لنر ما جلبته من هدايا."
SLAB_PRISONER_TALK2: "<hpage>هل تخبرني عن حراس هذا البناء؟ إنهم خدم القلعة، أليس كذلك؟<page>خدم...؟ إنهم تائبون أيضا. في عصر مضى، ارتكبت طبقتهم تدنيسا خاصا بها ضد القلعة.<page>خطيئة نسيت منذ زمن بعيد، لكنها جسيمة إلى حد أن أبناءهم وأبناء أبنائهم لا يزالون يحملون وزرها. خدمتهم هنا هي أملهم الوحيد في الغفران."
COG_STATUE_ALL_TALK_A_REPEAT: "يا حاجة فارلوم الخالدة، أسمعينا أغنيتنا الثلاثية، حتى تصعدي وتعبدي أمام قلب مملكتنا الإلهي."
SLAB_PRISONER_TALK1: "<hpage>إن كان هذا المكان مقدسا يوما، فلم يبق ما يدل على ذلك. حتى بوصفه سجنا، فقد أهمل.<hpage>يمكنني تحريرك إن شئت. تستطيع النزول عبر الكهوف في الأسفل حتى تعثر على مستوطنة.<page>أنت... تطلبين مني مغادرة هذا المكان؟ م-ما أغرب هذه الفكرة وما أشد رعبها! خطيئة كهذه لن... لا.<page>بفضل القلعة، أنا هنا تائبا. هنا يمكنني الاختباء من عار ذنوبي حتى يذيبه الزمن.<page>أغادر هذا المكان...؟ أرجوك! اقتليني قبل أن تتفوهي بهذا التجديف ثانية!"
LAST_CONDUCTOR_REPEAT: "عباءة قائد الجوقة ثقيلة. لو عرفت ثمن ارتدائها مسبقا، أكنت سأقبل هذا الواجب؟"
SLAB_PRISONER_MEET: "أ... أغنية، أهذه؟ أحضرت أغنية؟ إذن أنت من القلعة؟ كم... كم عددكم؟<hpage>أنا وحدي يا سيدي. لا داعي للخوف، فلست من خدم القلعة. هل أنت سجين لديهم؟<page>س... سجين؟ لا أفهم كلامك. لا يوجد سجن هنا.<page>هذا مكان مقدس للغفران. أرجوك، تكلمي بتبجيل."
COG_STATUE_ARCHITECT_TALK_B: "كما جاء في النشيد، أغنيتنا تديمنا.<page>ولأجل فارلوم الخالدة، سنبني."
COG_STATUE_ARCHITECT_TALK_A: "نود سماع أغنية المعماريين في قلب قلعتنا.<page>أولئك الذين يصونون مملكتنا وجدرانها وأرضياتها وصوتها، حتى حين يخفت الآخرون."
GOURMAND_SERVANT_ITEM_GIVE_CORAL: "كراستنات! ستظنينها يابسة وباهتة، نعم؟ لكن حين تطحن إلى أنعم مسحوق، يظهر مذاقها اللاذع!"
MELODY_PICKUP_HINT_NOTMET: "<hpage>إن أردت تعلم اللحن المسجل على هذه الأسطوانة، فعلي أولا العثور على جهاز يعمل لتشغيلها. هذا الجهاز هنا توقف عن العمل منذ زمن بعيد.<hpage>لا بد أن تضم الأقبية فوقنا جهازا آخر كهذا. علي أن أبحث بدقة."
TORMENTED_TROBBIO_MEET: "أنت! سوسة أم نائحة! مختارة مشؤومة تركت حتى النهاية!<page>استسلمي! اخضعي! وقعت الضربة القاتلة. فارلوم الجميلة تندب نهايتها.<page>نحن القلة الباقية المنكوبة بالحزن، فلنجتمع هنا أخيرا ونظهر نيراننا الضارية.<page>لنتقاسم معا ألم مملكتنا، ونشعر به يحرق أصدافنا، ونعرف بوضوح معاناتها وحزنها!"
LAST_CONDUCTOR_GIVE: "أغنيتنا على خيط حريري... ما أجمل هذا الصوت الذي غاب طويلا عن قاعاتنا.<page>احفظي لحننا بأمان أيتها الحاجة الصالحة. ستكونين على الأرجح آخر من يتلقاه."
COG_STATUE_CONDUCTOR_TALK_A: "نود سماع لحن قادة الجوقة، عاليا في أبراجهم المتلألئة.<page>أولئك الذين يحملون أثقل عباءة، والذين يقودون أرضنا دوما نحو العظمة."
LAST_CONDUCTOR_MEET: "زائرة؟ هذا نادر حقا.<page>أعتذر لأنني لم أنهض لاستقبالك. فبعد دهر قضيته مريضا، لم أعد قادرا على النهوض من حجرة نومي.<page>آمل أيتها الحاجة الصالحة أن تكون قلعتنا قد عاملتك بما تستحقه حشرة متفانية من لطف.<hpage>احتملت ضيافتها بما يكفي، أيها المسن...<page>آه... يؤسفني حالك أيتها الحاجة... لقد انحدرنا كثيرا. والآن، إن جئت تطلبين عونا أو فهما، فأخشى أن أخيب ظنك أنا أيضا. <page>مهما كان سؤالك، لم يبق لدي إلا لحني أقدمه. إنه شيء بسيط وأصغر الهدايا، لكنه ربما صار أكثر تميزا الآن، إذ نادرا ما سمع في هذه الأزمنة التي خمدت فيها الأصوات."
SLAB_PRISONER_REPEAT: "إن أثقلتك ذنوبك، فيمكنك البقاء هنا معي تائبة يا أختي."
SLAB_PRISONER_NEEDOLIN: "آه... أ... أغنيتك. جلست في صمت زمنا طويلا. أخبريني... أكل الأغاني التي تعزف الآن بديعة هكذا؟ أم أن الزمن أفسد سمعي؟<hpage>هذا الفن جديد علي، ومهارتي محدودة، لكن تقديرك له لا يزعجني.<page>آه، ما أجمله. يكاد يؤلم حواسي المرهقة. لكن لعل هذا الألم مجرد جزء من توبتي. <page>واصلي العزف، من فضلك. أود الانضمام إلى لحنك. سامحيني فحسب إن صار صوتي خشنا."
LIBRARIAN_MELODY_NOPLAY: "ترفضين عزف لحننا المقدس! لماذا تتوقفين أيتها الناسجة؟ أتجبنين أمام الحقائق التي قد يكشفها؟ لا يمكن أن تكوني من الصنف الوضيع الذي ينحني للخوف، أليس كذلك؟<hpage>حين يحين الوقت يا حارس أقبية الهمس، سأستمع. أما الآن، فمهمتك أن تحفظ الأسطوانة بأمان. واعلم أن نصلي سيحاسبك إن أخفقت."
LIBRARIAN_RELIC_ASK_PROMPT_PLURAL: "تقديم أسطوانات المزامير؟"
GOURMAND_SERVANT_MOSSSTEW: "يحتاج أساس طبقنا إلى يخنة توت الطحلب الهلامية. وإعدادها فن من فنون كهنة الطبيعة، وسر يحرسونه بغيرة في الكهوف الموشاة بالطحلب عميقا تحتنا."
