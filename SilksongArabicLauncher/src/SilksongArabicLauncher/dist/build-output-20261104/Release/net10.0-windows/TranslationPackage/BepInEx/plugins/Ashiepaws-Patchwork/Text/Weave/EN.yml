CREST_UPGRADE_MEET_PT2: "<page>لا. لست عدوتهم، ولم يحبسوني بدافع الشر. أنا إيفا، كائن... يصعب وصفه. ابنة النساجين، لكنني لست تماما من قومهم...<hpage>ما أغرب هذا. وصفك يصلح لي بقدر ما يصلح لك.<page>ابنة النساجين؟... ولست منهم؟ أستشعر فيك سلالة النساجين، لكنك تختلفين عنهم وعني. أنت كائن متحول، ممتزج؟ ما أنت أيتها المخلوقة؟<page>اقتربي أيتها السيدة، كي تدرك حواسي طبيعتك على نحو أفضل."
CREST_UPGRADE_PRE_REPEAT_ADDITIONAL: "أيتها السيدة، ما زالت حواسي تتردد بصداك. تبدين أبعد بكثير من حدود الحشرات.<page>اسمحي لي أن أتأمل طبيعتك مجددا، لعلني أقدم لك تفسيرا واضحا."
CREST_UPGRADE_MEET_ACT3: "أيتها السيدة؟ ما زلت حية إذن. هذا جيد... شعرت ببدء الصراع، وبالقلوب الشاحبة تشتعل، ثم بذلك النبع المفاجئ من الظلام.<hpage>أنا آسفة يا إيفا. كنت آمل أن أقتل الملكة، وكدت أحقق ذلك، لكن الوضع صار... معقدا. والآن باتت فارلوم بأسرها مهددة بالسقوط.<page>لكنني أستشعر ذلك فيك أيتها السيدة. لم تستسلمي لليأس، فلا بد أن بعض الأمل ما زال باقيا؟<hpage>...أظنه أملا ضئيلا. لكن نعم، ربما ما زال هناك سبيل للخروج من هذه الكارثة. سألاحق ذلك الهدف بما بقي لي من قوة.<page>فاسمحي لي بمواصلة مساعدتك بقدر استطاعتي... قد تكون مساهمتي صغيرة، لكنني سأقدمها بكل حماس."
CREST_UPGRADE_POST_ADDITIONAL_AVAILABLE: "لا يصدق... تختلف طبيعتك كثيرا عن طبيعة حشرة فانية. إنها قابلة للتشكل وعابرة. رؤيتها أعجوبة تستحق العمر الطويل الذي عشته.<page>وبما أملكه من قوة، ربما ما زال بوسعي تقديم المزيد من العون لك."
CREST_UPGRADE_TALK_SNARE: "<hpage>إيفا، أبحث عن أداة قيل إنها موجودة في مكان ما داخل هذا البناء. إنها أداة شرك من صنع النساجين. هل تعرفينها؟<page>ربما أيتها السيدة. ابحثي انطلاقا من هنا، في الجانب الذي يلتقي فيه الطحلب بالعش. هناك كانت أمهاتي يصنعن أدواتهن من أفخاخ وقيود. أشياء صغيرة، لكنها اختبارات لأشكال أكبر.<page>ما زلت أذكر أفكارهن وهن يعملن، ويأسهن وجوعهن. كانت محاولة يائسة أخرى لانتزاع حريتهن. وانتهت كلها بالفشل بالطبع."
CARETAKER_SNARE_READY: "قطعت شوطا طويلا أيتها القارعة! تحققين الأمنيات وتنقذين الحشرات، بل ودفعت عائلتي العابسة إلى العمل!<page>نصب الشرك في الأعلى، وقوتنا مربوطة على امتداد خيطه. قد يبدو لعينيك بدائيا، لكنه يحمل قوة لا بأس بها... تكفي لإخضاع إلهة.<hpage>أحسنت أنت وعائلتك صنعا معي يا سيدي. وسأثبت أن ثقتكم كانت في محلها حين يحين اللقاء.<page>نعم. قدمي أفضل ما لديك أيتها القارعة. استدعي إلهتنا الشاحبة العظيمة. أضعفيها بضرباتك، ثم ادفعي الوحش إلى الأسفل فوق الشرك.<page>حين تلامسه ستشتعل قوة الشرك، لكن أغنية إبرتك وحدها ستوقظ التعويذة كاملة. وعندما تحين تلك اللحظة، ستدركين الأمر بوضوح."
CREST_UPGRADE_PRE_RETURNED: "<page>أرجوك أيتها السيدة. اسمحي لي أن أتأمل طبيعتك، لعلني أقدم لك تفسيرا واضحا..."
CREST_UPGRADE_POST: "لا يصدق... تختلف طبيعتك كثيرا عن طبيعة حشرة فانية. إنها قابلة للتشكل وعابرة. رؤيتها أعجوبة تستحق العمر الطويل الذي عشته.<page>إن استطعت تطوير طبيعتك أكثر خلال رحلاتك، فعودي إلي. ربما أستطيع بما أملكه من قوة أن أقدم لك المزيد من العون.<hpage>شكرا لك يا إيفا. إن اتسعت طبيعتي كما تقولين، فسأعود."
CARETAKER_SNARE_TALK1: "<hpage>عرفت أمثالك من قبل يا سيدي. قبيلتك تعمل بالقوة وتتاجر بها، وأنا على وشك إخماد مصدرها الأول.<hpage>حين يتم ذلك، هل ستجد حقا متعة في أرض حرمت منها؟<page>نعم، حسنا... علامات عائلتي تغطي ذلك الفخ. وقد قضينا زمنا شاقا نتجنب نظرات إلهتنا.<page>إن جلبناها علينا الآن، بعد معارضتنا العلنية هذه... فستكون تلك نهاية قاتمة لا يرغب فيها أحد منا.<page>والآن! انتهى عملي، وحان وقت مهمتك العظيمة! سنتمنى لك النصر أيتها القارعة، من أجلنا جميعا!"
CREST_UPGRADE_PRE: "<hpage>أترين طبيعة المرء يا إيفا؟ هذه مهارة تفوق قدرات الحشرات بكثير.<page>لكنها لا تخلو من ثمن. لا يدرك بصري الحشرة إلا من خلال الأثر المطبوع على روحها.<hpage>أتقصدين شعارها؟ ذلك الدال على جوهر الحشرة ونيرها الخفي الذي ينشأ طوال حياتها.<page>الشعار؟ نعم، ذلك هو مصطلح النساجين القديم. كلمة بسيطة تحاول وصف أمر عميق إلى هذا الحد.<page>لكن انتظري. طبيعتك أنت... أهي؟...<page>أيتها السيدة، اسمحي لي أن أتعمق أكثر، لعلني أقدم لك تفسيرا واضحا..."
CREST_UPGRADE_PROMPT: "السماح بالاستبصار؟"
CREST_UPGRADE_REPEAT_ACT3: "أيتها السيدة، وقت فارلوم ينفد. إن استطعت توسيع طبيعتك أكثر، فأرجوك عودي إلي.<page>سأهبك كل ما أملكه من قوة لمساعدتك.<hpage>لك شكري يا إيفا. إن اتسعت طبيعتي كما تقولين، فسأعود."
CREST_UPGRADE_ACCEPT_DIALOGUE: "ربط إيفا؟"
CREST_UPGRADE_MEET_CURSED: "ابتعدي أيتها العلقة المشوهة! حتى وأنت مستقرة داخل صدفة أخرى، تظهر طبيعتك النهمة بوضوح.<page>لن أسمح لك بتدنيس هذه الحجرة أو الاستيلاء على روحي. ارحلي!"
CREST_UPGRADE_FIRST_ALL: "أيتها السيدة... لا يصدق... تختلف طبيعتك كثيرا عن طبيعة الحشرات الفانية. إنها قابلة للتشكل وعابرة. رؤيتها أعجوبة تستحق العمر الطويل الذي عشته.<page>أيتها المتحررة من القيود، رغم قلة معرفتنا ببعضنا، اسمحي لي بطلب أناني.<hpage>قدمت موهبتك نفعا عظيما يا إيفا. ماذا تريدين مني؟<page>لا أريد سوى أن تربطي روحي وذكرياتي داخل صدفتك... كما فعلت مع أولئك الآخرين في أنحاء هذه الأراضي.<page>لن أتجسد كشعار داخلك، لكن قوتي الضئيلة قد تمنحك نعمة أخيرة.<hpage>أتطلبين أن أستوعبك في كياني؟ اعلمي أن عقلك سيزول ولن يبقى له أي وجود مستقل.<page>الاتحاد مع متحررة من القيود... ذلك هو الخلاص الذي صليت من أجله ذات يوم، لكن وطأة العصور كادت تنسيني إياه.<page>أيتها السيدة، هل تحققين لي هذا الطلب؟"
CREST_UPGRADE_ALL: "أيتها السيدة، أنت جموع داخل صدفة واحدة. كائن متحرر حقا من القيود. كانت مساعدتك على النمو مهمة عظيمة حتى على كائن محدود مثلي.<page>وفي آخر عمل لي، اسمحي لي بطلب أخير أناني.<hpage>قدمت مواهبك نفعا عظيما يا إيفا. ماذا تريدين مني؟<page>لا أريد سوى أن تربطي روحي وذكرياتي داخل صدفتك... كما فعلت مع أولئك الآخرين في أنحاء هذه الأراضي.<page>لن أتجسد كشعار داخلك، لكن قوتي الضئيلة قد تمنحك نعمة أخيرة.<hpage>أتطلبين أن أستوعبك في كياني؟ اعلمي أن عقلك سيزول ولن يبقى له أي وجود مستقل.<page>أعلم. ومع ذلك أسعى إليه بسرور. الاتحاد مع متحررة من القيود... ذلك هو الخلاص الذي صليت من أجله ذات يوم، لكن وطأة العصور كادت تنسيني إياه.<page>أيتها السيدة العزيزة، هل تحققين لي هذا الطلب؟"
CREST_UPGRADE_MEET: "من هناك؟ هل جاء أحد لتحريري؟ أم جئت لتنهي حياتي؟<hpage>أنا هورنيت أيتها السجينة. لست سوى مسافرة، ولم آت لقتلك.<hpage>ما الذي أدى إلى حبسك في أطلال النساجين القدامى هذه؟ أكنت عدوتهم؟"
CREST_UPGRADE_PRE_REPEAT: "أيتها السيدة، تتردد حواسي بصداك. لقد تجاوزت حدود الحشرات أكثر من ذي قبل.<page>اسمحي لي أن أتأمل طبيعتك مجددا، لعلني أقدم لك تفسيرا واضحا."
CREST_UPGRADE_TALK_PURPOSE: "<hpage>كيف انتهى بك المطاف محكمة الإغلاق هنا يا إيفا؟<page>أيتها السيدة، لقد أسأت الفهم. ما يبدو قفصا هو صدفتى بقدر ما هو الهيئة الكامنة داخله.<page>ولدت في هذا الحيز. خروجي منه يعني موتي، وهي نهاية تفتقر إلى الإلهام، رغم أنني تمنيت حلولها أحيانا.<page>أنا فريدة كما ترين. عانت أمهاتي لعنة قبيلتهن، فالإنجاب مهمة مؤلمة تكاد تكون مستحيلة.<hpage>أعرف اللعنة جيدا يا إيفا، فأنا أيضا ضحيتها، وذرية من تمكنت من تجاوز حدودها.<hpage>أأنت أيضا محاولة لتحدي ذلك القيد القاسي؟<page>محاولة معيبة. حياة نسجت من طلاسم وصدفة، ولا يبقيها حية سوى قفصها. قد تحاكي أفكاري أفكار النساجين، لكن حواسي تخصني وحدي.<page>ومع مرور الزمن، لم يجلب ذلك الاختلاف إلا البعد بيننا."
CREST_UPGRADE_ACCEPT: "بفضلك، تحررت أخيرا من قدري.<hpage>أقبل اتحادك بسرور يا إيفا. لن تعاني بعد الآن أبدية الوحدة."
CREST_UPGRADE_MEET_OVERBLUE: "لا تقتربي! أشعر بالدم المحرم يجري في عروقك، ذلك الذي ينمو ويعيد تشكيل العالم على صورته السوقية.<page>سواء شربته بإرادتك أم لا، فلن يسمح لأي مصابة به بدخول هذه الحجرة. ارحلي!"
CREST_UPGRADE_REPEAT: "أيتها السيدة، إن استطعت توسيع طبيعتك أكثر خلال رحلاتك، فعودي إلي. ربما أستطيع بما أملكه من قوة أن أقدم لك المزيد من العون.<hpage>إن اتسعت طبيعتي كما تقولين يا إيفا، فسأعود."
CREST_UPGRADE_REOFFER: "أيتها السيدة، هل تعيدين التفكير في طلبي الأخير؟ أن أربط داخل روحك المتلألئة؟<page>أفهم أن طلبي أناني، ولن أضمر لك ضغينة إن رفضته."
CREST_UPGRADE_DECLINE: "<hpage>أنا آسفة يا إيفا. لا أستطيع منحك ذلك، على الأقل ليس الآن.<hpage>عقلك قوي وغريب، وقد يكون ذلك الاتحاد خطرا على هويتي.<page>أتفهم ذلك أيتها السيدة. سأبقى هنا إن غيرت رأيك يوما."
