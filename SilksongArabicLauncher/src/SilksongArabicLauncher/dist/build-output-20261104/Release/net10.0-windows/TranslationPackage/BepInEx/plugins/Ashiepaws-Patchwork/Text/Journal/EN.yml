DESC_WRAITH: "شبح معذب من خيوط باقية. رغم طبيعته الزائلة، تستطيع الضربات القوية تبديده لبعض الوقت."
NOTE_GARMOND: "مصير مأساوي لحشرة كانت شريفة يوما. تلك الخيوط المشبعة بالفراغ... قوتها الجسدية لا تقارن بالفساد الذي تحدثه في الروح."
NAME_BONE_ROLLER: "ماولينغ"
NAME_SPLINTER_QUEEN: "الأخت شظية"
