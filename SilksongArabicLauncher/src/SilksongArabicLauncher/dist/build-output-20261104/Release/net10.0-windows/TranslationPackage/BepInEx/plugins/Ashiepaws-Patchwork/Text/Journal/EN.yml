NOTE_SONG_KNIGHT: "تفوق موهبة هذا الكائن المصنوع وذكاؤه كل ما شهدته من أمثاله. يبدو أنه لم يصنع أداة للخدمة، بل كان محاولة لصنع الحياة نفسها."
NOTE_SONG_SCHOLAR_ACOLYTE: "حين دخلت موطنها، أطلقت هذه الحشرات لتعيث في الأقبية الكبرى. إنها مصدر إزعاج، وليس لي أن ألوم سواي."
DESC_VAMPIRE_GNAT: "وحش عث مجنح، ربي حتى بلغ حجما كبيرا لاصطياد العمال الذين كانوا يحاولون الفرار من مهامهم."
NAME_SONG_AUTOMATON_01: "حشرة جوقة التروس"
NOTE_CORAL_CONCH_DRILLER: "في اندفاعها من الأرض وإليها ما يكاد يبدو مرحا. طريقة مسلية وفعالة لمباغتة الفريسة."
DESC_BLOOM_PUNCHER: "عدو زهري له لب يشبه القناع. يستطيع دفع هذا اللب إلى الأمام لضرب الحشرات الغافلة."
NAME_ROACHKEEPER_CHEF_TINY: "خادم الصراصير"
