DESC_CORAL_FLYER: "كشافة رشيقون مجنحون، كثيرا ما يرافقون نظراءهم الأثقل."
NAME_SONG_CREEPER: "متعهد الدفن"
NOTE_ROACHFEEDER_SHORT: "سلاحها القابل للرمي ملائم للكهوف الواسعة التي تسكنها. لا بد أن لهذه الحشرات الصغيرة الماكرة مخلبا ماهرا في الصياغة."
