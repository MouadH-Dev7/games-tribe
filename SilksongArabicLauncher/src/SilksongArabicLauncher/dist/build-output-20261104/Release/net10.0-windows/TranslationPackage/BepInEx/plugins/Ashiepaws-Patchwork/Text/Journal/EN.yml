DESC_SONG_GOLEM: "آلة حديدية ذاتية الحركة شاهقة، يحركها دوار وترس."
DESC_CORAL_CONCH_DRILLER: "حشرة صغيرة تصنع صدفة من مرجان مسنون. تدير صدفتها بسرعة هائلة لتشق القشور والعظام."
DESC_CORAL_SWIMMER_FAT: "هائم ممتلئ الجسم ووفير العدد، من زمن مرجاني مضى."
NAME_CORAL_GOOMBAS: "زاحف القشرة"
NOTE_CORAL_BRAWLER: "تغدو أشد بأسا بكثير حين تواجه داخل موطنها المكسو بالقشور. لا بد أنها عاشت حياتها كلها داخل برجها حتى أتقنت التحكم فيه هكذا."
