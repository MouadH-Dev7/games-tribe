BB_FIXER_ACT3_MEET: "آه يا آنسة! بالطبع كنت ممن ينجون من كل هذا، فأنت بارعة كما تبدين.<page>إنه أمر محزن، لكن لا أستطيع القول إن معظم أهلنا هنا حظوا بمثل هذا الحظ. أما مخيمنا الجميل في الأسفل فلم يعد آمنا لأي حشرة، بعدما سحقت هذه الكارثة السوداء كل شيء وابتلعته.<hpage>لا مكان آمن يا سيدي، لكنني سعيدة ببقائكم أنتم القلة. واعلم أنني سأبذل جهدي لإصلاح هذا.<page>تهدئة عالمنا الهائج؟ إنه هدف عظيم يا آنسة. لا أظن أن حشرة واحدة تستطيع إيقاف ما يحدث، لكن يبعث في القلب الأمل أن نارك ما زالت متقدة بما يكفي لتؤمني بغير ذلك.<page>استريحي معنا قدر ما تشائين. فالصحبة القليلة تكاد تكون أفضل ما نرجوه نحن الباقين الآن."
BB_FIXER_DELIVERY: "<hpage>يا سيدي، أحمل مؤنا من بلدة الأجراس في الأعلى لمساعدة مخيمكم وسكانه.<page>آه! سيكون هؤلاء ممتنين جدا. يصل معظمهم إلى هنا ولا يملكون سوى صدفتهم. ستجعل شحنتك حياتهم أسهل قليلا."
MOSSCREEP_MEET_ALT: "همم. ممم! من هناك؟ متطفلة! يا للفظاعة! تقاطع كاهنا متواضعا أثناء عمله!<hpage>لم أقصد التطفل أيها الكاهن. دفعني صوت ضحكتك إلى الاستطلاع.<page>ماذا؟ ضحك؟ لا أعرف عما تتحدثين. هذا هراء!"
BB_CARETAKER_BASEMENT_REPEAT: "أتمنى أن تجلب لك رحلاتك الحظ أيتها الصائدة، وأن تتعلم القلعة الخوف من حريتك في أرضنا."
BELLWAY_PILGRIM_MEET_2: "همم؟ أنت مجددا. أرجوك، لا مزيد من الحديث عن الأجراس أو السفر. أحاول أن أظل مختبئة.<hpage>لم أقصد التطفل يا سيدتي. هل تستجمعين رباطة جأشك هنا قبل أن تنطلقي في رحلتك؟<page>مثل الآخرين جميعا، إخوتي وأخواتي الذين مضوا مترنحين إلى موتهم؟ لا، أظن أنني سأبقى هنا مع أفكاري فترة أطول..."
BB_RESIDENT_GOT_SILKSPEAR: "لا بد أن الخارج وراء المستوطنة مرعب. لا شيء هناك سوى الوحوش والجنون الكامنين في الظلام.<page>لكنني سمعت عن مكان آمن. في الأعلى مباشرة، حيث يصبغ الطحلب الحجارة بالأخضر، توجد قرية قديمة. ويقال إنها مكان مقدس محمي جيدا.<hpage>زرت المستوطنة التي تتحدثين عنها. بنيت حول برج للدفن يحتضن جثمان ناسج قديم.<hpage>لكنها ليست آمنة على الإطلاق. أرضها خطرة، والمفترسات تجوب ساحاتها. أنصحك بتجنب ذلك المكان.<page>آه... فهمت. بالطبع، لا يخلو أي مكان من الخطر، أليس كذلك؟ هذا هو حالنا نحن الحجاج..."
FUNERAL_2: "فمع أننا، نحن الحجاج، نرفع أنظارنا إلى الأعالي ولا نحيد عن طريقنا، فإن فقد أخ أو أخت يجمد أطرافنا المرتجفة في مكانها."
BB_CARETAKER_REPEAT: "قلما رأيت غريبة مثلك أيتها الصائدة العزيزة. زوريني حين تشائين.<page>أتطلع إلى سماع كيف قد تهز خطواتك عالمنا. أوهو. نعم!"
MOSSCREEP_COMPLETED_ACT3: "آه، العالم يرتجف! لكننا نسمعه... ينبض بثبات... ينبض حرا..."
MOSSCREEP_REFUSE: "المانحة ترفض! أفهم ذلك. المانحة حقودة وشريرة وضالة! حين يصفو ذهنك، عودي إلى هنا. عودي وحققي أمنيتي!"
BELLWAY_PILGRIM_MEET_1: "آه... هل جئت لتختبئي هنا في الأسفل أيضا؟ إنه عالم مخيف في الخارج. إن حافظت على الهدوء، فلا أمانع انضمامك إلي.<hpage>اخترت مكانا غريبا للراحة يا سيدتي. حفرة الأجراس هذه والبناء المحيط بها... يوحيان بأنها محطة للسفر، لكنها مهجورة منذ زمن بعيد.<page>نعم. تقول الشائعات في المخيم إن هذه الأجراس تمتد في أنحاء البلاد كعروق عظيمة صاغها أسلافنا القدماء.<page>بل يقول بعضهم إن الحشرات كانت تسافر عبرها في عربات مذهبة أيضا!<page>لا بد أن مثل هذا السفر المترف خطيئة بحقنا نحن الحجاج. علينا أن نمشي ونتسلق ونزحف بمخالبنا الضعيفة وحدها... فبهذا وحده نثبت إخلاصنا."
BB_FIXER_Q1_UNACCEPTED: "هل نظرت إلى جدار الامنيات؟ ربما لاحظت أنني أضفت أمنية صغيرة جريئة لنفسي.<page>وهذا من حقي، فأنا من بنى الجدار. ويبدو لي أن على المملكة تحقيق أمنيتي قبل أمنيات الآخرين."
MOSSCREEP_DONT_GIVE: "أتحتفظين بالتوت لنفسك؟ كله لك؟ ممم. ناكثة الوعد! ناكثة الوعد!"
BB_RESIDENT_NAME: "لم أخبرك باسمي، أليس كذلك؟ يا لشدة تقصيري.<page>أنا بيلبي. سعدت بقضاء الوقت معك يا آنسة.<hpage>وأنا كذلك يا سيدي. مضى زمن منذ أتيحت لي فرصة واسعة كهذه لحديث ودي.<hpage>اسمي هورنيت. يسرني أن نتعارف كما ينبغي أخيرا.<page>هورنيت؟ اسم قوي، ويلائمك حقا يا آنسة. ها ها..."
MOSSCREEP_TRADE_INTRO: "توت الطحلب. أما زلت تبحثين عنه أيتها الصغيرة؟ تحققت أمنيتي، لكن من الواضح الآن أننا نحتاج إلى المزيد! المزيد!<page>أحضري مزيدا من توت الطحلب إلى هنا. ممم. نعم، سنتبادل. مَسابح ثمينة مقابل توت طازج!"
MOSSCREEP_CANCOMPLETE: "<hpage>كما وعدتك أيها الكاهن، أحضرت لك التوت. لماذا تحتاج إلى هذه الثمار العادية؟<page>عادية؟! لا، لا... إنها مميزة وعزيزة. لا يعرف ذلك إلا الكاهن! التوت اللامع! إنه لأمنيتي، أمنيتي الغالية!"
BB_SHOPKEEP_NOSTOCK_RETURN: "سأشق طريقي قريبا إلى القلعة العظيمة. ومع كل ما أملكه من مَسابح مقدسة، أنا واثق أن طريقي لن يكون شاقا..."
BB_FIXER_ACT3_DELIVERY_POST: "مهلا! لا يمكنك الرحيل من دون مكافأة على عملك. خذي هذه الخرزات لقاء جهدك.<page>لم تعد المَسابح تنفعنا كثيرا، لكن لعلها تفيدك في رحلاتك الطويلة."
MOSSCREEP_OFFER: "أنت هنا، في الداخل، فلماذا أرسلوك؟ همم؟ هل سمعت أمنيتي؟ أأنت محققة الامنيات؟<hpage>محققة الامنيات؟<page>الامنيات، نعم! أمنيتي! أحتاج إلى ثلاث ثمرات عزيزة من ثمار العالم. أحتاج إليها، ولهذا أتمنى! ألم ترسلك المملكة أيتها الصغيرة لتحققي رغبتي؟"
BB_RESIDENT_BELLHART: "أخذتك رحلاتك بعيدا، أليس كذلك؟ أما أنا فلم أبدأ رحلتي بعد. من المخجل حقا أن يمكث حاجّ هنا كل هذا الوقت.<hpage>لا أرى في ذلك عارا يا سيدي. حياتك ملكك، ولا ينبغي أن تهدرها استجابة لنداء القلعة الشبحي. سافر لأجل نفسك، وإلا فلا تسافر.<page>ها... من المؤكد أنك لست حاجّة. هذا تجديف، حتى إن قيل بنية ودية.<page>ومع ذلك... لا أنفر مما تقولين. لعلني لست حاجّا حقا أنا أيضا."
BB_SHOPKEEP_ITEM_ROSARY_MAGNET_DESC: "ما أجمل هذا الحجر، أليس كذلك؟ يقال إنه سيساعدك على جمع المَسابح في الطريق. ستعودين لتشاركيني بعضها، أليس كذلك؟"
FUNERAL_NAME_2: "شكرا لمشاركتنا يا أختي. سنغني تكريما لبيلبي النبيل الصامد."
MOSSCREEP_COMPLETED: "ممم. تسمعينه، أليس كذلك؟ أنصتي جيدا. إنه ضعيف، لكنه ثمين. نبضة، خفقة! خافتة... إنها نبضتنا نحن..."
BB_SHOPKEEP_ITEM_ROSARY_SET_DESC: "هل تمتلئ جيوبك بالمَسابح المفككة؟ يمكنني نظمها بإحكام كيلا تفقديها. قد يبدو فنا بسيطا، لكنه يتطلب بعض المهارة لتثبيتها كما ينبغي."
BB_RESIDENT_MEET_ALT: "همم؟ أعرفك. عدت إلى المخيم إذن؟ أأنت حاجّة أم مجرد جوالة؟<hpage>لست حاجّة يا سيدي، وإن سلكت طرق الحُجّاج.<page>لست حاجّة؟ لا فرق في ذلك على ما أظن. علينا جميعا أن نسلك الطرق صعودا، لكن معظمنا سيسقط قبل أن يرى البوابات الكبرى بزمن طويل.<page>إن كنت حكيمة، فتوقفي هنا واستريحي قليلا قبل أن تعودي إلى ذلك العالم الخطير..."
MOSSCREEP_TRADE_ACCEPT_2: "ممم، الثمرة الثمينة! نعم، عطرة ومستديرة. شديدة الاستدارة! ولك أنت يا من تجدين التوت، مكافأة طيبة من المَسابح!"
BB_SHOPKEEP_MEET: "أ... أهلا أيتها المسافرة! أنت متجهة إلى القلعة، أليس كذلك؟ قبل أن تنطلقي، ألا تتوقفين لتتاجري مع حاجّة عجوز؟<hpage>أود رؤية بضاعتك يا سيدتي، لكنني أخشى ألا أملك ما يستحق أن أقدمه مقابلها.<page>لا تقلقي! حتى إن لم تملكي سلعا نفيسة، ما زال بوسعنا المقايضة. ففي هذه الأرض المتدينة نتعامل بعملة الإيمان!<page>المَسابح! خرزات الصلاة المنحوتة بدقة! شاركيني بعضها فحسب، وسأعطيك مقابلا عادلا."
BB_SHOPKEEP_ITEM_TOKEN_FAITH_DESC: "يبدو مجرد مفتاح، لكن من يدري ماذا سيفتح؟ أظن أنه جاء من القلعة، فلا بد أنه يفتح الطريق إلى شيء مقدس!"
BB_SHOPKEEP_ITEM_TOOLMETAL_DESC: "هذا اكتشاف نادر. أشد بريقا من الإيمان وأصلب من جلد كراغلر. تستطيع حشرة ماهرة في الصياغة صنع شيء جميل منه إن كانت تملك المعرفة اللازمة."
BB_FIXER_DELIVERY_POST: "خذي بضع خرزات لقاء قطعك كل هذه المسافة. لقد استحققتها."
MOSSCREEP_INGREDIENT: "<hpage>أيها الكاهن، أحتاج إلى إبريق من يخنة توت الطحلب التي تعدها لإشباع ذواقة من القلعة. فهل تعطيني بعضا منها؟<page>مممم! حشرة ستلتهم شراب التوت الذي أعده؟ لا بد أنها قوية لتتحمل طعما بهذه الحدة!<page>إليك نكهة ناضجة جدا! حارقة! نكهة اللذة والألم! لعلها ترى الرؤى أيضا إن تذوقته مركزا. أتراها ستراها؟<page>سأمنحك اليخنة! لأجل حشرتك، مممم... كي تشاركنا الرؤى. نعم! سنعطيك إياها!"
MOSSCREEP_TRADE_FINAL_2: "آه! آآآه! الرائحة مجددا! أصبحت أقوى! لكنها ما زالت فتية! أنصتي إلى أخواتك أيتها الصغيرة، وانمِي! آه، انمِي!"
MOSSCREEP_TRADE_FINAL_3: "آه... ممم. هل تؤلمك الرؤى أنت أيضا؟ والرائحة النتنة؟ ثمار بغيضة مريعة. يا له من ألم!<page>كفانا من التوت. لا نحتاج إلى المزيد. أما أنت، يا صديقتي الوحيدة وحبيبتي، فلك مكافأة!<page>تميمتك. دعيني... أنقل إليها القوة. نعم. ستفيض دموع تميمتك بقوة أكبر!"
MOSSCREEP_TRADE_FINAL_1: "ممم، الثمرة الثمينة! ما أثمنها! وربما صار لدينا الآن ما يكفي. يكفي، يكفي! فعملنا يبدأ مرارا، لكنه لا ينتهي أبدا!"
BB_RESIDENT_PILGRIMSREST: "آه، مرحبا من جديد! ما أطيب رؤية وجه مألوف في هذا الصعود المحفوف بالمخاطر.<hpage>تحياتي يا سيدي. أرى أنك بدأت حَجّك، أو انطلقت لأجل نفسك. وفي الحالتين، يسعدني أن أراك هنا سالما.<page>لست سالما تماما... فقد نلت نصيبي من الخدوش والحروق. أظن أن هذه طبيعة الرحلة.<page>لكنني رأيت الكثير! منشآت معدنية عظيمة وحقولا شاسعة محترقة! جلالها يبعث على التواضع حقا، حتى لدى شخص مثلي كان متواضعا منذ البداية.<page>سأستريح هنا قليلا قبل أن أستأنف صعودي."
MOSSCREEP_QUESTCOMPLETE: "ممم! ممم! هذه هي الثمار الثمينة الموعودة!<page>ألقيها في القدر، ها هي ذي، والآن يمكننا أن نبدأ أخيرا!"
BB_SHOPKEEP_ITEM_MASK_SHARD_DESC: "ليست سوى قطعة من شيء أعظم، لكنها متقنة الصنع. خذيها معك أيتها المسافرة، لعلها تجلب لك الحظ."
FUNERAL_FINAL_NONAME: "وداعا أيتها الحاجّة الصغيرة. عسى أن تقسو صَدَفتك فتمهد الطريق للآخرين."
BB_FIXER_BENCHREPAIR_REPEAT_ALT: "في أوقات كهذه، لا يسعنا إلا أن ننكب على العمل ونحاول إعادة البناء."
MOSSCREEP_MEET_ACT3: "<page>مممم! أحان الوقت؟ أراضينا تهتز حزنا! من أجل الخفقة الجديدة، نعم؟ تطالب بها! من أجل إيقاع جديد...<hpage>هذه الزلازل التي تشعر بها ليست حزن أرضك، بل انهيارها، وهو واقع لا محالة إن تعذر إخماد مصدرها.<page>ماذا؟ لا، لا، لا... الخفقة... إنها الخفقة التي تريدها أرضنا! تناديها! تحتاج إلى خفقة جديدة!"
BB_CARETAKER_CURSED_REPEAT: "أسرعي إلى عرق الأجراس ذاك، وابحثي عن عمي المختبئ هناك. إن كان أحد يستطيع إرشادك إلى علاج لذلك الشيء الذي يلتوي داخل صَدَفتك، فهو عمي."
MOSSCREEP_INPROGRESS: "ممم! ممم. من أنت أيتها الصغيرة؟ لست محققة الامنيات، فليس معك ما يكفي من الثمار. نحتاج إلى ثلاث، وأنا أحتاج إلى ثلاث! اعثري عليها، اعثري عليها!"
BB_FIXER_BENCHREPAIR: "آه! ها هي ذي، سالمة في النهاية! خشيت أن تكون معركتك مع ذلك الوحش الهائل قد خلفتك مصابة إصابة بالغة.<page>أشعر بالخزي لأنني تركتك في خطر هناك يا آنسة، لكنني لست محاربا، وأدواتي لا تقوى على مخلوق كهذا.<hpage>من الجيد أنك حافظت على سلامتك. هذه المستوطنة تحتاج الآن إلى مصلح، لا إلى محارب.<page>ها، لعل ذلك صحيح. في أوقات كهذه، لا يسعنا إلا أن ننكب على العمل ونحاول إعادة البناء."
BB_FIXER_ACT3_REPEAT: "ابقي هنا معنا ما شئت. قد لا يتبقى لنا كثير من الوقت، لكننا نحن القلة لن نضطر على الأقل إلى مواجهة ذلك المصير وحدنا."
BB_FIXER_STATUE: "آه! يسرني أنني لحقت بك يا آنسة. قدمت خدمة جليلة لهذا المخيم، ومنحتنا أكثر مما يمنح معظم الناس.<page>فكرت في كل ما بذلته، وبدأت أصنع شيئا صغيرا لأرد لك الجميل.<page>إنه مجرد تذكار حقا! لكنني وضعت فيه كل ما لدي من موهبة، مهما كان قليلا! شيء يؤنسك في الطرق الموحشة بالأعلى.<page>احتفظي به في رحلاتك، وتذكري أنك مرحب بك دائما هنا بيننا."
BB_RESIDENT_CAMP: "<hpage>يبدو هذا المخيم في حال سيئة أيها الصديق. ومع ازدياد خطر الأراضي المحيطة، أخشى على سلامته.<page>نعم. لا شك أن هذه ليست أفضل أيامه، لكن هذا المكان يخدم الحشرات العابرة منذ أمد لا يذكر أحد بدايته.<page>إنه الإيمان! إيمان كل أولئك الحُجّاج، السابقين والحاليين. إخلاصنا هو ما يبقيه قائما. سيظل المخيم صامدا ويقدم العون مهما اشتدت المصاعب.<page>"
FUNERAL_1: "<hpage>ما الطقس الذي يجمعكم جميعا أيها الحاجّ؟<page>أخونا، هذا المسكين بين ذراعي، خطا آخر خطواته المؤلمة. نجتمع هنا لنغني له مودعين، ونحزن على خسارتنا الفادحة."
BB_CARETAKER_TALK_02: "إذا كانت الحشرات المحجبة مهتمة بك إلى حد المخاطرة بعبور القفار وراء حدودنا، فلا بد أنك مميزة جدا، أليس كذلك؟<hpage>ربما رآني بعضهم كذلك يوما في أرضي. أما هنا، وقد استنزفت قوتي، فلست سوى مسافرة أخرى.<page>أوه! مسافرة، لكنك أكثر من ذلك. أراه الآن. بالطبع! ذلك التركيز!<page>هل أدركت الحشرات المحجبة من أوقعت في شراكها؟ ربما ينبغي لها هي أن تقلق، أليس كذلك؟"
MOSSCREEP_REOFFER: "أمنيتي. آه، أمنيتي! أحتاج إلى ثلاث ثمرات عزيزة من ثمار العالم. أحتاج إليها! ألم ترسلك المملكة أيتها الصغيرة لتحققي رغبتي؟"
BB_CARETAKER_MEET_1: "آه، استيقظت أخيرا! حافظي على قوتك أيتها المسافرة. لا فائدة من إهدار طاقتك على عجوز لا شأن لها مثلي.<hpage>أدرك ذلك الآن يا سيدتي. لم يكن استقبال أرضك لي لطيفا، وكان لدي سبب يدعوني إلى الحذر."
BB_CARETAKER_PRE_MEET: "انهضي! هيا! لن أسمح لك بالموت على أرضي!"
BB_CARETAKER_MEET_3: "<hpage>لست حاجّة. أنا هورنيت، ولم آت إلى أرضكم باختياري.<hpage>جلبت إلى مملكتكم بالقوة، بعد أن أسرتني حشرات غريبة ترتدي الحجب.<page>أوه! ما أغرب هذا! إنها حشرات القلعة القائمة عند قمة أرضنا. تتحجب خدمة لإيمانها، أو لعلها مستعبدة لقوة أعظم...<hpage>إذن سأقصد قلعتهم. ما دامت الحشرات المحجبة قد تكبدت كل هذا العناء لإحضاري، فسأعرف السبب.<page>أوه! شرسة ومهيبة! روحك ليست روح حاجّة! تبدين كصيادة.<page>فمرحبا بك أيتها المسافرة الشرسة في فارلوم، أرضنا المقدسة المسكونة بالأشباح!<page>قبل أن ترحلي، اسمحي لحشرة عجوز أن تحذرك تحذيرا موجزا. من الأفضل أن تبقي سلاحك مشهرا.<page>قبضت لعنة على مملكتنا. تزداد طرقها وحشية وخطرا، ومع أن بعضهم ما زال يحاول الصعود إلى القلعة عند قمتها، فلا أحد يعود ليخبرنا بما رأى."
BB_CARETAKER_MEET_2: "أأنت حاجّة أخرى إذن؟ خرجت من الظلام لتصعدي الطريق العظيم وتنحني عند قمته المذهبة؟"
BB_FIXER_Q1_COMPLETE: "انظري إلى ذلك! تبرعت بكل شظايا الصَدَفة تلك، كما تمنيت تماما! لا أكاد أصدق!<page>تلك الشظايا قيمة حقا. فهي ممتازة للصنع والإصلاح ومتعددة الاستخدامات.<page>والأهم من ذلك... أن ما فعلته كان نبيلا، وهو نوع من اللطف قلما نراه في هذا المكان المنهك.<hpage>أكان هذا لطفا؟ علي أن أحرص على معرفة هذه الأرض وانتزاع كل منفعة أستطيع منها. وقد يحقق تلبية طلبات مثل طلبك تلك الغاية.<page>إذن هكذا تنظرين إلى الأمر؟ على أي حال، أقدر مساعدتك كثيرا يا آنسة. أتمنى لك التوفيق في رحلاتك، وأن تتحقق كل أمنياتك!"
BB_SHOPKEEP_POST_BOSS: "آه، يا للمصيبة... ما أشد الأحداث المخيفة التي تمتحننا نحن الحُجّاج المساكين! كيف امتلأ طريقنا إلى الفردوس بمثل هذه الوحوش؟<page>مواجهة عالم كهذا... يا إلهي. سأحتاج بالتأكيد إلى مزيد من المَسابح. أرجوك أيتها المسافرة، ألا تقايضينني؟"
MOSSCREEP_WISHWALL: "أنت محققة أمنيتي، أليس كذلك؟ أمنيتي! أحتاج إلى ثلاث ثمرات عزيزة من ثمار العالم. أحتاج إليها، ولهذا أتمنى!<page>لقد وعدت. إنه رباط أقوى من الخطيئة. أحضري لي حبات توت الطحلب الثلاث. الثمرة الثمينة! حققي أمنيتي، وعندئذ يبدأ العمل!"
BB_RESIDENT_PILGRIMSREST_REPEAT: "أمامي طريق طويل، وما زال هناك الكثير لأراه. أما الآن، فلنسترح قليلا، ما رأيك؟"
BB_FIXER_GENERIC: "الأوقات عصيبة، ولذلك نرحب دائما بالمؤن الجديدة! تصل الحشرات إلى هنا بلا شيء، وغالبا ما ترحل بما لا يزيد عنه كثيرا."
BB_SHOPKEEP_NOSTOCK: "حسنا! يبدو أنني بادلتك آخر مؤني، فلم يعد لدي عذر للبقاء هنا.<page>سأشق طريقي قريبا إلى القلعة العظيمة. ومع كل ما أملكه من مَسابح مقدسة، أنا واثق أن طريقي لن يكون شاقا..."
MOSSCREEP_TRADE_NOBERRY: "أحضري مزيدا من توت الطحلب إلى هنا. ممم. نعم، سنتبادل. مَسابح ثمينة مقابل توت طازج! ابحثي عنه حيثما رأيت الطحلب الأخضر ينمو!"
BB_CARETAKER_TALK_01: "تحملين نصلك بإتقان أيتها الصيادة، ولا شك في مهارتك، فلا أقصد إساءة حين أقول إنك ما زلت تبدين هزيلة بعض الشيء.<hpage>قضيت زمنا طويلا في الأسر، مقيدة بأختام غريبة عني. ضعفت قوتي، لكن يمكنني استعادتها.<hpage>حين أصل إلى تلك القلعة، سأكون مستعدة لمواجهة ما ينتظرني."
BB_CARETAKER_CURSED: "آه أيتها الصيادة، ما أسوأ حالك! أنت مكبلة بالكامل، وتبدين أسوأ مما كنت حين التقينا أول مرة!<hpage>صارت صَدَفتي مأوى لطفيلي قاس. تمنعه قوتي الطبيعية من التهامي بالكامل، لكن وجوده أضعفني كثيرا.<page>لا يمكن أن يستمر هذا! فارلوم واقعة أصلا في شراك لعنة مروعة، ولا يمكننا السماح لأخرى بأن تنازعها على امتصاص ما تبقى من الحياة.<page>من الأفضل أن تسرعي إلى بلدة الأجراس عند قلب مملكتنا. لي عم مختبئ في نواحيها، ناسك عجوز فظ الطباع.<page>من الصعب مصادقة ذلك الناسك، لكنه يعرف بعض أسرار علل هذه المملكة. إن كان أحد يستطيع إرشادك إلى علاج، فهو عمي."
MOSSCREEP_TRADE_ACCEPT_3: "ممم، الثمرة الثمينة! و... آه! يا لها من ثمرة! ناضجة تماما! عطرة تماما! مستديرة تماما! خذي ما كسبته، كومة كبيرة جدا من المَسابح!"
BB_SHOPKEEP_MEET_ALT: "أ... أهلا أيتها المسافرة! ألا تتوقفين لتتاجري مع حاجّة عجوز؟ لا بد أن شيئا هنا سيساعدك في رحلتك العظيمة!"
MOSSCREEP_TRADE_REFUSE: "أتحتفظين بالثمرة لنفسك؟ بدافع الجشع؟ اختيار غريب! لن تفعل سوى إثقالك..."
BB_FIXER_STATUE_REPEAT: "لا تظني أن الخوف يمنعني من بدء حَجّي! كل ما في الأمر أن هنا عملا كثيرا لم ينجز، وحشرات قليلة قادرة على إنجازه."
FUNERAL_4: "غنوا لأخينا الذي مات مخلصا لإيمانه! لقد ترك وراءه كل آلامه وعذاباته، كما ينفض المسافر الغبار عن شاله."
MOSSCREEP_ACCEPT: "اتفقنا إذن. إنه رباط أقوى من الخطيئة. أحضري لي حبات توت الطحلب الثلاث. الثمرة الثمينة! حققي أمنيتي، وعندئذ يبدأ العمل!"
MOSSCREEP_MEET: "مم. ممم! من هناك؟ متطفلة! يا للفظاعة! تقاطع كاهنا متواضعا أثناء عمله!<hpage>لم أقصد التطفل أيها الكاهن. دفعني صوت ضحكك إلى الاستطلاع.<hpage>بنيت هذه المستوطنة حول بناء قديم للنسّاجين. هل تعرفهم؟ وهل ما زالوا يسكنون هذه الأرض؟<page>مم؟ أي مستوطنة؟ وأي نسّاجين؟! كلامك بلا معنى!"
BB_CARETAKER_SNARE: "<hpage>سيدتي، عدت طلبا لقوة تعين على بناء فخ، بناء على طلب أحد أشقائك المقيم في أعلى القلعة.<page>نعم أيتها الصيادة. إذن استطعت إيقاظ ذلك الأحمق العجوز. كنت أعلم أن هذا سيحدث، وكنت أشعر به، وأنا سعيدة بذلك!<page>قضى سائر أفراد عائلتي وقتا أطول مما ينبغي منكمشين غارقين في الكآبة... أو موتى! أما أنا فلا! لطالما رأيت أن انتظار المصير بلا مقاومة إهدار للحياة، حين تستيقظ تلك التي في الأعلى.<page>من الأفضل أن نقاتل من أجل الحرية أو نهلك وسط اللهب، ها ها!"
MOSSCREEP_TRADE_ACCEPT_1: "ممم، الثمرة الثمينة! آه... لكن! هذه ليست طازجة جدا. فاسدة! تفوح منها رائحة الموت! لك مقدار ضئيل من المَسابح، بقدر ما تستحقين!"
FUNERAL_NAME_1: "<hpage>بيلبي. كان اسم هذا الحاجّ بيلبي."
BB_FIXER_REPEAT: "ما إن يكتمل جدار الامنيات هذا، حتى تتمكن الحشرات من طلب العون من كل صَدَفة قادرة. ويمكنك حتى أن تحاولي تحقيق أمنية أو اثنتين بنفسك يا آنسة!"
BB_RESIDENT_REPEAT: "ابقي هنا معي ما شئت. لست مستعدا للرحيل بعد، ووجود بعض الرفقة أمر طيب دائما."
BELLWAY_PILGRIM_REPEAT: "هنا في الأسفل، لا تسمعين صرخات الحُجّاج في الأعلى، بل رنين الأجراس الخافت فحسب. سأبقى وأتأمل مدة أطول قليلا قبل أن أبدأ حَجّي..."
FUNERAL_FINAL_NAME: "وداعا يا أخانا بيلبي. عسى أن تقسو صَدَفتك فتمهد الطريق للآخرين."
BELLWAY_PILGRIM_AFTER_TRAVEL: "وحش! و... و... وحش! وحش مريع!"
FUNERAL_3: "...همم. من هنا يعرف اسم هذا الحاجّ الصغير؟"
BB_FIXER_Q1_COMPLETE_R: "شظايا الصَدَفة مواد شائعة، لكنها عملية جدا. أستطيع استخدامها لترقيع أي شيء تقريبا، وهذا المخيم يحتاج دائما إلى بعض الإصلاح."
BB_FIXER_BENCHREPAIR_REPEAT: "ضاع حاجّ مسكين آخر، أليس كذلك؟ مجرد التفكير في ذلك يرهقني. من الأفضل أن أنكب على العمل حتى أنهيه..."
BB_RESIDENT_MEET: "همم؟ أأنت حاجّة مثلي؟ هل توشكين على بدء رحلتك العظيمة إلى القلعة المقدسة في الأعلى؟<hpage>لست حاجّة يا سيدي، وإن بدا أننا سنسلك طريقا متشابها.<page>لست حاجّة؟ لا فرق في ذلك على ما أظن. علينا جميعا أن نسلك الطرق صعودا، لكن معظمنا سيسقط قبل أن يرى البوابات الكبرى بزمن طويل.<page>إن كنت حكيمة، فتوقفي هنا واستريحي قليلا قبل أن تنطلقي إلى ذلك العالم الخطير..."
MOSSCREEP_QUESTCOMPLETE_D: "وللفراق هدية. تميمة من تمائمنا نحن كهنة الطبيعة. أم من تمائمي أنا؟ فلا أظن أن غيري بقي.<page>لعلها تخفف أحزانك يا محققة الأمنيات، وتبكي عنك حين تنفد دموعك!"
MOSSCREEP_TRADE_BERRY: "ممم! ممم! تحملين معك رائحة حلوة نفيسة. ثمرة! أتقايضينها مقابل مَسابح؟"
BB_RESIDENT_TALK: "<hpage>أتساءل أيها الحاج الصغير، ما الذي يدعوك ورفاقك إلى القلعة؟ ما دام الطريق خطرا، فلم تخوضون الرحلة أصلا؟<page>غريب أن تسألي حاجا هذا السؤال. أرضنا المقدسة تنادينا، والصعود إليها أعظم واجباتنا. فمن نكون حتى نرفض؟<page>نهتدي بالإيمان، فنعبر الحقول المشتعلة والبراري المتموجة، ونصعد الدرجات المذهبة العظيمة، وكل ذلك لنبلغ تلك القلعة الأبدية المتألقة.<page>حين أكون مستعدا حقا، سأبدأ الصعود بنفسي..."
MOSSCREEP_QUESTCOMPLETE_C: "ممم. ممم! الألم... رأسي يؤلمني. لماذا؟ التوت، تلك الثمار الخبيثة. يا لها من رؤى!<page>أنت يا واعدة الأمنيات، يا محققتها. أحضرت لي ما أحتاج إليه وبقيت إلى جانبي، ورافقتني خلال محنتي. لا أطلب أكثر من ذلك."
MOSSCREEP_QUESTCOMPLETE_B: "آه! آآآه! الرائحة صحيحة! مثل البقية! لكنه صغير جدا! يا صوت الغابات! يا رقصة الملكة! آه... آه! اخفق بقوة أكبر، دعنا نسمعك! آه! آآآآآه!"
FUNERAL_2b: "غنوا يا إخوتي وأخواتي! غنوا وبددوا هذا الحزن الثقيل! تغنوا باسم هذا الحاج المسكين، الذي لم تكد رحلته تبدأ!"
BELLWAY_PILGRIM_TALK_1: "هل سمعت ما يقال عما ينتظرنا خلف هذا المخيم مباشرة؟<page>كهوف هشة من العظام في أساس فارلوم نفسه، تعج بكل صنوف المخلوقات القاتلة والمخاطر الحادة.<page>ويقال إن حشرات قديمة اتخذت منها موطنا ذات يوم.<page>من يصدق ذلك؟ في مكان عدائي مضطرب كهذا! لم أقابل طوال حياتي حشرة بهذه الشجاعة."
BB_PILGRIM_HORNED: "أختاه، أختاه! ما ذلك السن الطويل اللامع الذي تحملينه؟ أهو سلاح؟<hpage>نعم، لكن لا داعي للخوف. لن أرفعه في وجهك. فنصله مخصص للمفترسات وغيرها من الأعداء.<hpage>وأنصحك بشدة أن تتسلح مثلي قبل أن تبدأ رحلتك.<page>للأسف يا أختاه... ما تدعين إليه خطيئة في حق الحاج.<page>نحن الحجاج نتسلح بالدعاء، ونتدثر بالإيمان، ونرجو أن يكفيانا لبلوغ مجد القلعة. تلك هي طريقتنا..."
BB_FIXER_Q1_INTRO: "عدت مجددا؟ اكتمل جدار الأمنيات! إنه جاهز لكل الأرواح المسكينة التي تركت هنا.<page>يقال إن فارلوم تحقق أمنيات المخلصين في إيمانهم. ولا ضير في أن تكون لنا نحن المنسيين أمنيات أيضا.<page>بل إنني أضفت أمنيتي الصغيرة إلى جدار الأمنيات! وهذا من حقي، فأنا من بناه. ويجدر بالمملكة أن تحقق أمنيتي قبل أمنيات الجميع."
BB_FIXER_MEET: "<hpage>ما الذي تبنيه يا سيدي؟ أهي لافتة من نوع ما؟<page>نعم، نعم. أنت حشرة فطنة! إنه جدار أمنيات. تأخر هذا المخيم القديم كثيرا في إقامة واحد، فتوليت الأمر بصفتي مصلح المكان.<page>جدران الأمنيات شائعة في فارلوم، وهي نافعة أيضا. فكم من دعاء بقي بلا جواب، وهذه الجدران تؤويه."
BB_PILGRIM_ROUND_REPEAT: "يجب أن أصغي بعناية... وأن أدعو بإخلاص دون انقطاع. عندها فقط سيقوى إيماني بما يكفي... ليحملني إلى أعلى..."
BB_CARETAKER_SNARE_REPEAT: "لا عجب أنك من يحشدنا للتحرك أيتها الصيادة. كان لديك بعد نظر، فأنت حشرة تحمل التغيير معها.<page>وبالطبع أنت أكثر من مجرد حشرة، بل أكثر من مجرد ناسج. يبدو أن أهلي احتاجوا إلى شخص مثلك حتى يجرؤوا على الأمل في النجاح.<page>اذهبي الآن وأثبتي أنك أهل لثقتنا. قضينا أعمارنا نتمنى سبيلا آخر، وبقليل من الحظ قد تحققينه لنا."
FUNERAL_NONAME: "ضاع اسم هذا الحاج، لكننا ما زلنا نغني."
BB_RESIDENT_GOT_SPRINT: "سمعت همسات مروعة في المخيم عن حجاج أفقدتهم مشقات الصعود عقولهم، فصاروا يصرخون ويهاجمون رفاقهم.<page>لقد كنت في الخارج. أخبريني، أهذا صحيح حقا؟<hpage>ما سمعته صحيح يا سيدي. يستولي خيط مسكون على الحجاج والوحوش في الطرقات ويدفعهم إلى العنف، ولم أكتشف مصدره بعد.<page>آه... كنت أخشى ذلك. لن أستطيع إذن أن أثق بأي وجه أراه على الطريق.<page>كان خطر الموت مخيفا بما يكفي، أما وحدة رحلة كهذه فتكاد تفوق الاحتمال... لا بأس. لعلها مجرد اختبار آخر لإخلاصنا."
BB_PILGRIM_HORNED_REPEAT: "نحن الحجاج نتسلح بالدعاء، ونتدثر بالإيمان، ونرجو أن يكفيانا لبلوغ مجد القلعة. تلك هي طريقتنا..."
BB_CARETAKER_TALK_03: "<hpage>أي واجب يقيدك بهذه الكنيسة القديمة يا سيدتي؟ فالبناء يكاد ينهار، ولا أرى أثرا لجماعة من المصلين.<page>نعم! رحلوا! رحلوا جميعا وفروا واختبأوا. أما أنا فلن أغادر قبل أن أصلح هذا المكان...<page>السبب هو تلك القلعة في الأعلى. حتى الآن، بعد انحدار فارلوم الطويل، تقف الحشرات البسيطة مبهورة أمامها بلا وعي. فهي أفخم وأعظم وأقوى مما ينبغي.<page>وحال هذا المبنى مثال محزن لما يصيب من يجرؤ على اقتراح سبيل آخر..."
BB_FIXER_ACT3_DELIVERY: "ماذا؟ أي حظ هذا؟ تحققت أمنيتنا حتى في هذه اللحظة الحالكة!<page>أثبت أنك منقذة عظيمة يا آنسة، واستحققت امتنان جماعتنا البائسة كلها.<hpage>لا شكر على واجب يا سيدي. آمل أن تنفعكم هذه المؤن على قلة عددكم."
BB_PILGRIM_ROUND: "يا صاحبة العباءة... امشي برفق، من فضلك. إنني أتأمل وأجمع إيماني... قبل بدء حجي.<hpage>خطواتي خفيفة بما يكفي يا سيدتي. إن كنت قد أزعجتك، فلم أقصد ذلك.<page>آه... حتى كلامك أعلى مما ينبغي. بالكاد أسمع أفكاري. ابتعدي من فضلك..."
BB_CARETAKER_BONEGRAVE: "أرى أنك فتحت بوابة العظام العظيمة في الخلف، من دون أن تطلبي إذني حتى! أثار فضولك، أليس كذلك؟<hpage>خلفها مدفن شاسع. ظننت أن معظم الحشرات تموت وهي تصعد الطريق، لكن يبدو أن كثيرين سقطوا قبل أن تبدأ رحلتهم فعليا.<page>نعم! منهم من قضت عليه الوحوش أو خانه الحظ، ومنهم من خلق أضعف من أن يحتمل.<page>على الأقل ترقد تلك الأرواح المسكينة معا. الموت ثم الموت ثم الموت، ذلك هو الوعد الأبدي لمملكتنا الأبدية. وفي النهاية ينال منا جميعا."
BB_CARETAKER_BASEMENT_TALK_01: "أيتها الصيادة! أظنك أنت من طهر قبوي؟<hpage>حين وصلت إلى هنا أول مرة، لم ترحب المخلوقات المعششة بمروري.<page>أوه. إنها حشرات سيئة المزاج حقا، وقد أحدثت فوضى مروعة هنا بفقسها وتكاثرها.<page>لك مني جزيل الشكر على طردها!"
